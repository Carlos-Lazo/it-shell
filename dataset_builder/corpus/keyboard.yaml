  intent: "This option indicates the amount, in pixels, by which  the  left and  image is offset to the right of the right image in the out- put. The effect of this option is to move the  entire  image  forward (positive  numbers) or backward (negative numbers).  With a zero offset, the main subject of the picture appears in the plane  of the picture (i.e. if the image is projected on a screen, the lo- cation of the screen).  The main subject is the subject  at  the location  where  the line of sight of the left camera intersects the line of sight of the right camera -- the  main  subject  ap- pears at the same location in both the left and right images. Default is zero. This  option was new in Netpbm 10.38 (March 2007).  Before that, use the third argument instead.  Also, before Netpbm  10.38  the default is +30 pixels."
