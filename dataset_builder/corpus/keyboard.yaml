- id: 438
  intent: "Specifies a line on the screen where the \"target\" line is to  be positioned.   The  target line is the line specified by any com- mand to search for a pattern, jump to a line number, jump  to  a file percentage or jump to a tag.  The screen line may be speci- fied by a number: the top line on the screen is 1, the  next  is 2, and so on.  The number may be negative to specify a line rel- ative to the bottom of the screen: the bottom line on the screen is  -1, the second to the bottom is -2, and so on.  Alternately, the screen line may be specified as a fraction of the height  of the  screen,  starting with a decimal point: .5 is in the middle of the screen, .3 is three tenths down from the first line,  and so  on.  If the line is specified as a fraction, the actual line number is recalculated if the terminal  window  is  resized,  so that  the  target  line remains at the specified fraction of the screen height.  If any form of the -j option is  used,  repeated forward searches (invoked with \"n\" or \"N\") begin at the line im- mediately after the target line, and repeated backward  searches begin at the target line, unless changed by -a or -A.  For exam- ple, if \"-j4\" is used, the target line is the fourth line on the screen,  so  forward  searches  begin  at  the fifth line on the screen.  However nonrepeated searches (invoked with \"/\" or  \"?\") always  begin  at the start or end of the current screen respec- tively."
  command: "less"
  example: "less -jn or --jump-target=n"
- id: 439
  intent: "Causes \"raw\" control characters to be displayed.  The default is to display control characters using the caret notation; for  ex- ample,  a  control-A (octal 001) is displayed as \"^A\".  Warning: when the -r option is used, less cannot keep track of the actual appearance  of  the screen (since this depends on how the screen responds to each type of control character).  Thus, various dis- play  problems may result, such as long lines being split in the wrong place. USE OF THE -r OPTION IS NOT RECOMMENDED."
  command: "less"
  example: "less -r or --raw-control-chars"
- id: 440
  intent: "Changes the filename quoting character.  This may  be  necessary if  you are trying to name a file which contains both spaces and quote characters.  Followed by a single character, this  changes the  quote  character to that character.  Filenames containing a space should then be surrounded by that character rather than by double  quotes.   Followed  by  two characters, changes the open quote to the first character, and the close quote to the  second character.  Filenames containing a space should then be preceded by the open quote character and  followed  by  the  close  quote character.   Note  that  even  after  the  quote  characters are changed, this option remains -\" (a dash  followed  by  a  double quote)."
