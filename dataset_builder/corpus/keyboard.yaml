  intent: "These options control whether the assembler should generate lfence after load instructions.  -mlfence-after-load=yes will generate lfence.  -mlfence-after-load=no will not generate lfence, which is the default."
  command: "as"
  example: "as -mlfence-after-load=yes"
- id: 49
  intent: "Optimize instruction encoding with smaller instruction size.  -O and -O1 encode 64-bit register load instructions with 64-bit immediate as 32-bit register load instructions with 31-bit or 32-bits immediates, encode 64-bit register clearing instructions with 32-bit register clearing instructions, encode 256-bit/512-bit VEX/EVEX vector register clearing instructions with 128-bit VEX vector register clearing instructions, encode 128-bit/256-bit EVEX vector register load/store instructions with VEX vector register load/store instructions, and encode 128-bit/256-bit EVEX packed integer logical instructions with 128-bit/256-bit VEX packed integer logical. -O2 includes -O1 optimization plus encodes 256-bit/512-bit EVEX vector register clearing instructions with 128-bit EVEX vector register clearing instructions.  In 64-bit mode VEX encoded instructions with commutative source operands will also have their source operands swapped if this allows using the 2-byte VEX prefix form instead of the 3-byte one.  Certain forms of AND as well as OR with the same (register) operand specified twice will also be changed to TEST. -Os includes -O2 optimization plus encodes 16-bit, 32-bit and 64-bit register tests with immediate as 8-bit register test with immediate.  -O0 turns off this optimization. The following options are available when as is configured for the Ubicom IP2K series."
  command: "as"
  example: "as -O0 | -O | -O1 | -O2 | -Os"
- id: 50
  intent: "Cause nops to be inserted if a dmult or dmultu instruction is followed by a load instruction."
  command: "as"
