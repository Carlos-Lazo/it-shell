- id: 92
  intent: "Specify the HTTP/SOCKS4/SOCKS5 proxy server to use for requests. This overrides any environment variables or settings picked  via the options dialog.  An individual proxy server is specified us- ing the format: [<proxy-scheme>://]<proxy-host>[:<proxy-port>] Where <proxy-scheme> is the protocol of the proxy server, and is one of: \"http\", \"socks\", \"socks4\", \"socks5\". If  the  <proxy-scheme>  is omitted, it defaults to \"http\". Also note that \"socks\" is equivalent to \"socks5\". Examples: --proxy-server=\"foopy:99\" Use the HTTP proxy \"foopy:99\" to load all URLs. --proxy-server=\"socks://foobar:1080\" Use the SOCKS v5 proxy \"foobar:1080\" to load all URLs. --proxy-server=\"socks4://foobar:1080\" Use the SOCKS v4 proxy \"foobar:1080\" to load all URLs. --proxy-server=\"socks5://foobar:66\" Use the SOCKS v5 proxy \"foobar:66\" to load all URLs. It is also possible to specify a separate proxy server for  dif- ferent URL types, by prefixing the proxy server specifier with a URL specifier: Example: --proxy-server=\"https=proxy1:80;http=socks4://baz:1080\" Load https://* URLs using the HTTP proxy \"proxy1:80\".  And load http://* URLs using the SOCKS v4 proxy \"baz:1080\"."
  command: "chromium"
  example: "chromium --proxy-server=host:port"
