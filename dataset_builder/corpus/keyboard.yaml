  intent: "Takes one of \"refuse\", \"allow\", \"require\", \"force\" or \"create\". Controls how to operate on block devices that are entirely empty, i.e. carry no partition table/disk label yet. If this switch is not specified the implied default is \"refuse\". If \"refuse\" systemd-repart requires that the block device it shall operate on already carries a partition table and refuses operation if none is found. If \"allow\" the command will extend an existing partition table or create a new one if none exists. If \"require\" the command will create a new partition table if none exists so far, and refuse operation if one already exists. If \"force\" it will create a fresh partition table unconditionally, erasing the disk fully in effect. If \"force\" no existing partitions will be taken into account or survive the operation. Hence: use with care, this is a great way to lose all your data. If \"create\" a new loopback file is create under the path passed via the device node parameter, of the size indicated with --size=, see below."
  command: "systemd-repart"
  example: "systemd-repart --empty="
- id: 1036
  intent: "Takes boolean. If this switch is not specified --factory=reset=no is the implied default. Controls whether to operate in \"factory reset\" mode, see above. If set to true this will remove all existing partitions marked with FactoryReset= set to yes early while executing the re-partitioning algorithm. Use with care, this is a great way to lose all your data. Note that partition files need to explicitly turn FactoryReset= on, as the option defaults to off. If no partitions are marked for factory reset this switch has no effect. Note that there are two other methods to request factory reset operation: via the kernel command line and via an EFI variable, see above."
  command: "systemd-repart"
  example: "systemd-repart --factory-reset="
