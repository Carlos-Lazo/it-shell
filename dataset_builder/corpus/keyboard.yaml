- id: 45
  intent: "Controls how the assembler handles multibyte characters in the input.  The default (which can be restored by using the allow argument) is to allow such characters without complaint.  Using the warn argument will make the assembler generate a warning message whenever any multibyte character is encountered.  Using the warn- sym-only argument will only cause a warning to be generated when a symbol is defined with a name that contains multibyte characters. (References to undefined symbols will not generate a warning)."
  command: "as"
  example: "as --multibyte-handling=warn_sym_only"
