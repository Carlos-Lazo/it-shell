- id: 994
  intent: "Prints the program's version number. USING WITH xkbcomp If  you have an Xserver and a client shell running on different comput- ers and some XKB configuration files on those machines  are  different, you  can  get  problems specifying a keyboard map by model, layout, and options names.  This is because setxkbmap  converts  its  arguments  to names  of  XKB  configuration  files according to files that are on the client-side computer, then sends these file names to the  server  where xkbcomp  has  to  compose a complete keyboard map using files which the server has.  Thus if the sets of files differ in some  way,  the  names that  setxkbmap  generates can be unacceptable on the server side.  You can solve this problem by running the xkbcomp on the client  side  too. With  the  -print option setxkbmap just prints the file names in an ap- propriate format to its stdout and this output can be piped directly to the xkbcomp input.  For example, the command setxkbmap us -print | xkbcomp - $DISPLAY makes  both steps run on the same (client) machine and loads a keyboard map into the server."
  command: "setxkbmap"
  example: "setxkbmap -version"
