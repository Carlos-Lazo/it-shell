  intent: "This  instructs  dumpkeys to interpret character code values ac- cording to the specified character set. This  affects  only  the translation  of  character  code values to symbolic names. Valid values for charset currently are iso-8859-X, Where X is a  digit in 1-9.  If no charset is specified, iso-8859-1 is used as a de- fault.   This  option   produces   an   output   line   `charset \"iso-8859-X\"',  telling  loadkeys  how  to interpret the keymap. (For example, \"division\" is  0xf7  in  iso-8859-1  but  0xba  in iso-8859-8.)"
  command: "dumpkeys"
  example: "dumpkeys -ccharset  --charset=charset"
