  intent: "Do not pipe output into a pager. The generated output shows the current device database entry in a terse format. Each line shown is prefixed with one of the following characters: Table 1. udevadm info output prefixes +-------+----------------------------+ |Prefix | Meaning                    | +-------+----------------------------+ |\"P:\"   | Device path in /sys/       | +-------+----------------------------+ |\"M:\"   | Device name in /sys/ (i.e. | |       | the last component of      | |       | \"P:\")                      | +-------+----------------------------+ |\"R:\"   | Device number in /sys/     | |       | (i.e. the numeric suffix   | |       | of the last component of   | |       | \"P:\")                      | +-------+----------------------------+ |\"U:\"   | Kernel subsystem           | +-------+----------------------------+ |\"T:\"   | Kernel device type within  | |       | subsystem                  | +-------+----------------------------+ |\"D:\"   | Kernel device node         | |       | major/minor                | +-------+----------------------------+ |\"I:\"   | Network interface index    | +-------+----------------------------+ |\"N:\"   | Kernel device node name    | +-------+----------------------------+ |\"L:\"   | Device node symlink        | |       | priority                   | +-------+----------------------------+ |\"S:\"   | Device node symlink        | +-------+----------------------------+ |\"Q:\"   | Block device sequence      | |       | number (DISKSEQ)           | +-------+----------------------------+ |\"V:\"   | Attached driver            | +-------+----------------------------+ |\"E:\"   | Device property            | +-------+----------------------------+ udevadm trigger [options] [devpath|file|unit] Request device events from the kernel. Primarily used to replay events at system coldplug time. Takes device specifications as positional arguments. See the description of info above."
  command: "udevadm"
  example: "udevadm --no-pager"
