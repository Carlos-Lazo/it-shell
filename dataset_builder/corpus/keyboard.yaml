  intent: "These options set the position of the image in some field (e.g. on  a  screen) in columns to the right of the left edge and rows below the top edge.  The PCX format contains image position  in- formation.   Don't  confuse this with the position of an area of interest within the image.  For example, using pnmpad to  add  a 10  pixel left border to an image and then converting that image to PCX with xpos = 0 is not the same as converting the  original image to PCX and setting xpos = 10. The values may be from -32767 to 32768. The default for each is zero."
