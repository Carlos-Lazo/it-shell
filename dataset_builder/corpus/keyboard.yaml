  intent: "If this option is given, dvisvgm doesn't create SVG font elements but uses paths instead. The resulting SVG files tend to be larger but are concurrently more compatible with most applications that don't support SVG fonts. The optional argument variant selects the method how to substitute fonts by paths. Variant 0 creates path and use elements in order to avoid lengthy duplicates. Variant 1 creates path elements only. Option --no-fonts implies --no-styles."
