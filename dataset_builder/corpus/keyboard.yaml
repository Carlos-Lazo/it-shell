  intent: "information showing tic's progress. The optional parameter n is a number from 1 to 9, inclusive, indi- cating the desired level of detail of information. o   If  ncurses is built without tracing support, the optional pa- rameter is ignored. o   If n is omitted, the default level is 1. o   If n is specified and greater than 1, the level of  detail  is increased,  and  the  output is written (with tracing informa- tion) to the \"trace\" file. The debug flag levels are as follows: 1   Names of files created and linked 2   Information related to the \"use\" facility 3   Statistics from the hashing algorithm 4   Details of extended capabilities 5   (unused) 6   (unused) 7   Entries into the string-table 8   List of tokens encountered by scanner 9   All values computed in construction of the hash table"
  command: "tic"
  example: "tic -vn  specifies that (verbose) output be written to standard error trace"
