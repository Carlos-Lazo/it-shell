  intent: "Displays the entries in symbol table section of the file, if it has one.  If a symbol has version information associated with it then this is displayed as well.  The version string is displayed as a suffix to the symbol name, preceded by an @ character.  For example foo@VER_1.  If the version is the default version to be used when resolving unversioned references to the symbol then it is displayed as a suffix preceded by two @ characters.  For example foo@@VER_2."
  command: "x86_64-linux-gnu-readelf"
  example: "x86_64-linux-gnu-readelf --syms"
- id: 1264
  intent: "Controls the display of non-ASCII characters in identifier names. The default (--unicode=locale or --unicode=default) is to treat them as multibyte characters and display them in the current locale.  All other versions of this option treat the bytes as UTF-8 encoded values and attempt to interpret them.  If they cannot be interpreted or if the --unicode=invalid option is used then they are displayed as a sequence of hex bytes, encloses in curly parethesis characters. Using the --unicode=escape option will display the characters as as unicode escape sequences (\\uxxxx).  Using the --unicode=hex will display the characters as hex byte sequences enclosed between angle brackets. Using the --unicode=highlight will display the characters as unicode escape sequences but it will also highlighted them in red, assuming that colouring is supported by the output device.  The colouring is intended to draw attention to the presence of unicode sequences when they might not be expected."
  command: "x86_64-linux-gnu-readelf"
  example: "x86_64-linux-gnu-readelf --unicode=[default|invalid|locale|escape|hex|highlight]"
- id: 1265
  intent: "When displaying symbols, this option makes readelf use the symbol hash tables in the file's dynamic section, rather than the symbol table sections. When displaying relocations, this option makes readelf display the dynamic relocations rather than the static relocations."
  command: "x86_64-linux-gnu-readelf"
  example: "x86_64-linux-gnu-readelf --use-dynamic"
- id: 1266
  intent: "Using one of these options, you can control whether the size of each section is given in decimal (-d, or --radix=10); octal (-o, or --radix=8); or hexadecimal (-x, or --radix=16).  In --radix=number, only the three values (8, 10, 16) are supported.  The total size is always given in two radices; decimal and hexadecimal for -d or -x output, or octal and hexadecimal if you're using -o."
  command: "x86_64-linux-gnu-size"
  example: "x86_64-linux-gnu-size --radix=number"
- id: 1267
  intent: "Controls the display of UTF-8 encoded multibyte characters in strings.  The default (--unicode=default) is to give them no special treatment, and instead rely upon the setting of the --encoding option.  The other values for this option automatically enable --encoding=S. The --unicode=invalid option treats them as non-graphic characters and hence not part of a valid string.  All the remaining options treat them as valid string characters. The --unicode=locale option displays them in the current locale, which may or may not support UTF-8 encoding.  The --unicode=hex option displays them as hex byte sequences enclosed between <> characters.  The --unicode=escape option displays them as escape sequences (\\uxxxx) and the --unicode=highlight option displays them as escape sequences highlighted in red (if supported by the output device).  The colouring is intended to draw attention to the presence of unicode sequences where they might not be expected."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --unicode=[default|invalid|locale|escape|hex|highlight]"
- id: 1268
  intent: "Input items are terminated  by  the  specified  character.   The specified delimiter may be a single character, a C-style charac- ter escape such as \\n, or an octal or hexadecimal  escape  code. Octal  and  hexadecimal  escape  codes are understood as for the printf command.   Multibyte characters are not supported.   When processing  the input, quotes and backslash are not special; ev- ery character in the input is taken literally.   The  -d  option disables any end-of-file string, which is treated like any other argument.  You can use this option when the  input  consists  of simply  newline-separated  items,  although  it is almost always better to design your program to use --null where this is possi- ble."
  command: "xargs"
  example: "xargs --delimiter=delim, -d delim"
