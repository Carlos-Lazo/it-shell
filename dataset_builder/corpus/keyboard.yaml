- id: 203
  intent: "This option forces dvisvgm to vectorize not only the glyphs actually required to render the SVG file correctly - which is the default -, but processes all glyphs of all fonts referenced in the DVI file. Because dvisvgm stores the tracing results in a font cache, all following conversions of these fonts will speed up significantly. The boolean option retrace determines how to handle glyphs already stored in the cache. By default, these glyphs are skipped. Setting argument retrace to yes or true forces dvisvgm to retrace the corresponding bitmaps again. Note This option only takes effect if font caching is active. Therefore, --trace-all cannot be combined with option --cache=none."
  command: "dvisvgm"
  example: "dvisvgm -a, --trace-all=[retrace]"
