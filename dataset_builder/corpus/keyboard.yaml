- id: 1
  intent: "set compression Method -mmt[N] set number of CPU threads -mx[N] set compression level: -mx1 (fastest) ... -mx9 (ultra) -mcp=[codepage number] [Extra options for Zip format]: Use codepage number for internal file  name  encoding  in the  archive  file.   When  7-Zip  detects legacy (MS-DOS etc.) Zip format,  7-Zip  automatically  choose  suitable legacy  encoding  codepage  number for internal file name encoding by your current locale, and  converts  to  UTF-8 for  external  file name encoding.  If automatic codepage chooser fails, use this option to manually  set  codepage number. (example): Use \"-mcp=437\" for CP437"
