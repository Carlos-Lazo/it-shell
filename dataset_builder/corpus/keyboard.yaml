- id: 1418
  intent: "Determine what zip should do with Unicode file names.   zip 3.0, in  addition  to  the standard file path, now includes the UTF-8 translation of the path if the entry path is not entirely  7-bit ASCII.   When  an entry is missing the Unicode path, zip reverts back to the standard file path.   The  problem  with  using  the standard  path is this path is in the local character set of the zip that created the entry, which may  contain  characters  that are  not  valid  in  the  character set being used by the unzip. When zip is reading an archive, if an entry also has  a  Unicode path, zip now defaults to using the Unicode path to recreate the standard path using the current local character set. This option can be used to determine what  zip  should  do  with this  path  if  there  is a mismatch between the stored standard path and the stored UTF-8 path (which can happen if the standard path  was  updated).  In all cases, if there is a mismatch it is assumed that the standard path is  more  current  and  zip  uses that.  Values for v are q - quit if paths do not match w - warn, continue with standard path i - ignore, continue with standard path n - no Unicode, do not use Unicode paths The default is to warn and continue. Characters  that  are not valid in the current character set are escaped as #Uxxxx and #Lxxxxxx, where x is  an  ASCII  character for a hex digit.  The first is used if a 16-bit character number is sufficient to represent the Unicode character and the  second if  the character needs more than 16 bits to represent it's Uni- code character code.  Setting -UN to e - escape as in zip archive -sU -UN=e forces zip to escape all characters that are not printable 7-bit ASCII. Normally zip stores UTF-8 directly in the standard path field on systems where UTF-8 is the current character set and stores  the UTF-8 in the new extra fields otherwise.  The option u - UTF-8 as in zip archive dir -r -UN=UTF8 forces  zip  to store UTF-8 as native in the archive.  Note that storing UTF-8 directly is the default on Unix systems that  sup- port  it.   This option could be useful on Windows systems where the escaped path is too large to be a valid path and  the  UTF-8 version of the path is smaller, but native UTF-8 is not backward compatible on Windows systems."
  command: "zip"
  example: "zip --unicode v"
