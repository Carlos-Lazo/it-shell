- id: 664
  intent: "TYPE is made up of one or more of these specifications: a      named character, ignoring high-order bit c      printable character or backslash escape d[SIZE] signed decimal, SIZE bytes per integer f[SIZE] floating point, SIZE bytes per float o[SIZE] octal, SIZE bytes per integer u[SIZE] unsigned decimal, SIZE bytes per integer x[SIZE] hexadecimal, SIZE bytes per integer SIZE is a number.   For  TYPE  in  [doux],  SIZE  may  also  be  C  for sizeof(char),   S  for  sizeof(short),  I  for  sizeof(int)  or  L  for sizeof(long).  If TYPE is f, SIZE may also be F  for  sizeof(float),  D for sizeof(double) or L for sizeof(long double). Adding  a z suffix to any type displays printable characters at the end of each output line. BYTES is hex with 0x or 0X prefix, and may have a multiplier suffix: b      512 KB     1000 K      1024 MB     1000*1000 M      1024*1024 and so on for G, T, P, E, Z, Y.  Binary  prefixes  can  be  used,  too: KiB=K, MiB=M, and so on."
  command: "od"
  example: "od -x     same as -t x2, select hexadecimal 2-byte units"
