  intent: "The output image consists of pixels, which are, from the point of view of a scanline renderer, solid squares.  This option specifies how the four vertices of  the  quadrilateral  corre- spond to the pixels of the output image.  Valid values for spec are: lattice The upper left vertex corresponds to the upper left corner of the  upper left pixel and The lower right vertex corresponds to the lower right corner of the lower right pixel. pixel The upper left vertex corresponds to the center of the upper left pixel and The lower right  vertex  corresponds  to  the center of the lower right pixel. The default value is lattice.  Point-and-click front ends should use pixel."
