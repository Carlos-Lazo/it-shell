  intent: "Displays the entries in symbol table section of the file, if it has one.  If a symbol has version information associated with it then this is displayed as well.  The version string is displayed as a suffix to the symbol name, preceded by an @ character.  For example foo@VER_1.  If the version is the default version to be used when resolving unversioned references to the symbol then it is displayed as a suffix preceded by two @ characters.  For example foo@@VER_2."
  command: "readelf"
  example: "readelf --syms"
- id: 912
  intent: "Displays the entries in dynamic symbol table section of the file, if it has one.  The output format is the same as the format used by the --syms option."
  command: "readelf"
  example: "readelf --dyn-syms"
- id: 913
  intent: "Controls the display of non-ASCII characters in identifier names. The default (--unicode=locale or --unicode=default) is to treat them as multibyte characters and display them in the current locale.  All other versions of this option treat the bytes as UTF-8 encoded values and attempt to interpret them.  If they cannot be interpreted or if the --unicode=invalid option is used then they are displayed as a sequence of hex bytes, encloses in curly parethesis characters. Using the --unicode=escape option will display the characters as as unicode escape sequences (\\uxxxx).  Using the --unicode=hex will display the characters as hex byte sequences enclosed between angle brackets. Using the --unicode=highlight will display the characters as unicode escape sequences but it will also highlighted them in red, assuming that colouring is supported by the output device.  The colouring is intended to draw attention to the presence of unicode sequences when they might not be expected."
  command: "readelf"
  example: "readelf --unicode=[default|invalid|locale|escape|hex|highlight]"
- id: 914
  intent: "When displaying symbols, this option makes readelf use the symbol hash tables in the file's dynamic section, rather than the symbol table sections. When displaying relocations, this option makes readelf display the dynamic relocations rather than the static relocations."
  command: "readelf"
  example: "readelf --use-dynamic"
