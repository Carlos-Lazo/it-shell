- id: 669
  intent: "Replace  a  currently running orca process.  By default, if orca detects an existing orca process for the same session,  it  will not start a new orca process.  This option will kill and cleanup after any existing orca process and then start a new orca in its place. KEYBOARD SETTINGS Orca  provides  two  keyboard modes, Desktop and Laptop keyboard layout. The Orca_Modifier key is Insert in desktop keyboard lay- out and Caps_Lock in laptop keyboard layout. Orca uses default GNOME keyboard shortcuts to navigate the desk- top and interact with various applications. The flat review com- mands  provide  an  alternative method of interaction in certain inaccessible applications. It should not be confused  with  flat review functionality provided by other screen readers. Desktop Mode Flat review commands Numpad-7 move the flat review cursor to the previous line and read it. Numpad-8 read the current line. Numpad-9 move the flat review cursor to the next line and read it. Numpad-4 move the flat review cursor to the previous word and read it. Numpad-5 read the current word. Numpad-6 move the flat review cursor to the next word and read it. Numpad-1 move the flat review cursor to the previous character and read it. Numpad-2 read the current character. Numpad-3 move the flat review cursor to the next character and read it. Numpad-slash perform a left mouse click at the location of the flat re- view cursor. Numpad-star perform a right mouse click at the location of the flat re- view cursor. Bookmark commands Alt+Insert+[1-6] assign a bookmark to a numbered slot.  If  a  bookmark already exists in the slot it will be replaced with the new one. Insert+[1-6]  go  to  the  position pointed to by the bookmark bound to this numbered slot. Insert+B and Insert+Shift+B move between the given  bookmarks  for  the given application or page. Alt+Insert+B  save the defined bookmarks for the current application or page. Miscellaneous functions Numpad+Plus 'say all' command; reads from the current position of the caret to the end of the document. Numpad+Enter 'Where am I' command; speaks information such as the title of the cur- rent application window, as well as the name of the control  that  cur- rently has focus. Insert+H enter into orca's 'learn mode'; press Escape to exit. Insert+Shift+Backslash toggle live regions monitoring on and off. Insert+F  speak  font and attribute information for the current charac- ter. Insert+Space Launch the orca Configuration dialog. Insert+Ctrl+Space reload user settings  and  reinitialize  services  as necessary.  Also launches the orca Configuration dialog for the current application. Insert+S toggle speech on and off. Insert+F11 toggle the reading of tables, either by single cell or whole row. Laptop Mode Flat review commands Caps_Lock+U  move  the flat review cursor to the previous line and read it. Double-click to move flat review to the top of the current window. Caps_Lock+I read the current line. Double-click  to  read  the  current line along with formatting and capitalization details. Caps_Lock+O  move  the flat review cursor to the next line and read it. Double- click to move flat review to the bottom of the current window. Caps_Lock+J move the flat review cursor to the previous word  and  read it.  Double-click  to  move  flat  review to the word above the current word. Caps_Lock+K read the current word.  Double-click  to  spell  the  word. Triple-click to hear the word spelled phonetically. Caps_Lock+L  move  the flat review cursor to the next word and read it. Double- click to move flat review to the word below the current word. Caps_Lock+M move the flat review cursor to the previous  character  and read  it.  Double-click  to  move flat review to the end of the current line. Caps_Lock+Comma read the current character. Double-click  to  pronounce the character phonetically if it is a letter. Caps_Lock+Period  move the flat review cursor to the next character and read it. Caps_Lock+7 perform a left mouse click at the location of the flat  re- view cursor. Caps_Lock+8 perform a right mouse click at the location of the flat re- view cursor. Bookmark commands Alt+Caps_Lock+[1-6] add a bookmark to the numbered slot. If a bookmark already  exists  for the slot it will be replaced with the new one. Caps_Lock+[1-6]  go to the position pointed to by the bookmark bound to this numbered slot. Caps_Lock+Band Caps_Lock+Shift+B move between the given  bookmarks  for the given application or page. Alt+Caps_Lock+B  save the defined bookmarks for the current application or page. Miscellaneous functions Caps_Lock+Semicolon 'Say all' command; reads from the current position of the caret to the end of the document.  Caps_Lock+Enter 'Where am I' command; speaks information such as the title of the cur- rent application window, as well as the name of the control  that  cur- rently has focus. Caps_Lock+H enter learn mode (press Escape to exit). Caps_Lock+Shift+Backslash toggle live regions monitoring on and off. Caps_Lock+F  speak font and attribute information for the current char- acter. Caps_Lock+Space launch the orca Configuration dialog. Caps_Lock+Ctrl+Space reload user settings and reinitialize services  as necessary;  also launches the orca Configuration dialog for the current application. Caps_Lock+S toggle speech on and off. Caps_Lock+F11 toggle the reading of tables, either by  single  cell  or whole row."
  command: "orca"
  example: "orca --replace"
