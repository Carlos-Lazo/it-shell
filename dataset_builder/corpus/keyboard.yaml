  intent: "The  -fp  and fp- options remove elements from the current font path.  They must be followed by a comma-separated list  of  en- tries. +fp or fp+ This  +fp  and  fp+  options prepend and append elements to the current font path, respectively.  They must be  followed  by  a comma-separated list of entries. led     The  led  option controls the keyboard LEDs.  This controls the turning on or off of one or all of the LEDs.  It accepts an op- tional integer, a preceding dash(-) or an 'on/off' flag.  If no parameter or the 'on' flag is given, all LEDs  are  turned  on. If  a  preceding  dash or the flag 'off' is given, all LEDs are turned off.  If a value between 1 and 32  is  given,  that  LED will  be  turned on or off depending on the existence of a pre- ceding dash.  ``xset led 3'' would turn led #3 on.  ``xset -led 3''  would turn it off.  The particular LED values may refer to different LEDs on different hardware.  If the X server supports the  XKEYBOARD  (XKB)  extension, leds may be referenced by the XKB indicator name by specifying the `named'  keyword  and  the indicator name.   For example, to turn on the Scroll Lock LED: xset led named \"Scroll Lock\" mouse   The  m option controls the mouse parameters; it may be abbrevi- ated to 'm'. Of course, it applies to  most  pointing  devices, not  just mice. The parameters for the pointing device are `ac- celeration' and `threshold'. The acceleration can be  specified as  an  integer,  or as a simple fraction. Threshold is just an integer. The setting is applied to all connected  pointing  de- vices.  xinput(1)  should  be  used if you need device-specific settings. By default the pointer (the on-screen representation  of  the  pointing device)  will  go  `acceleration' times as fast when the device travels more than `threshold' mickeys (i.e. would-be pixels) in 10 ms,  includ- ing a small transition range. This way, the pointing device can be used for precise alignment when it is moved slowly, yet it  can  be  set  to travel  across the screen in a flick of the wrist when desired.  One or both parameters for the m option can be omitted, but  if  only  one  is given, it will be interpreted as the acceleration.  If no parameters or the flag 'default' is used, the system defaults will be set. If the `threshold' parameter is provided and 0, the `acceleration'  pa- rameter  will  be used in the exponent of a more natural and continuous formula, giving precise control for slow motion but big reach for  fast motion,  and  a  progressive transition for motions in between.  Recom- mended `acceleration' value in this case is 3/2 to 3, but  not  limited to that range. In  the X.org X Server 1.6 and above, the behaviour described so far is linked to the default profile. There are other profiles (i.e. functions determining  pointer  acceleration from device velocity) and additional settings, so the above description may not apply to non-default  cases. In the X.org Server 1.7, these are available as input device properties (see xinput). p       The p option controls pixel color values.  The  parameters  are the  color  map entry number in decimal, and a color specifica- tion.  The root  background  colors  may  be  changed  on  some servers  by altering the entries for BlackPixel and WhitePixel. Although these are often 0 and 1, they need not  be.   Also,  a server  may choose to allocate those colors privately, in which case an error will be generated.  The map entry must not  be  a read-only color, or an error will result. r       The  r  option controls the autorepeat.  Invoking with \"-r\", or \"r off\", will disable autorepeat, whereas \"r\", or  \"r on\"  will enable  autorepeat.   Following  the \"-r\" or \"r\" option with an integer keycode between 0 and 255 will disable  or  enable  au- torepeat  on  that key respectively, but only if it makes sense for the particular keycode.  Keycodes below 8 are not typically valid for this command.  Example: \"xset -r 10\" will disable au- torepeat for the \"1\" key on the top row of an IBM PC keyboard. If the server supports the XFree86-Misc extension, or  the  XKB extension, then a parameter of 'rate' is accepted and should be followed by zero, one or two numeric values. The  first  speci- fies  the  delay before autorepeat starts and the second speci- fies the repeat rate.  In the case that the server supports the XKB  extension,  the delay is the number of milliseconds before autorepeat starts, and the rate is the number  of  repeats  per second.   If  the rate or delay is not given, it will be set to the default value. s       The s option lets you set the screen  saver  parameters.   This option    accepts   up   to   two   numerical   parameters,   a 'blank/noblank' flag, an 'expose/noexpose'  flag,  an  'on/off' flag,  an  'activate/reset' flag, or the 'default' flag.  If no parameters or the 'default' flag is used, the  system  will  be set  to its default screen saver characteristics.  The 'on/off' flags simply turn the screen saver functions on  or  off.   The 'activate'  flag  forces activation of screen saver even if the screen saver had been turned off.  The 'reset' flag forces  de- activation  of  screen saver if it is active.  The 'blank' flag sets the preference to blank the video (if the hardware can  do so)  rather  than display a background pattern, while 'noblank' sets the preference to display a pattern rather than blank  the video.   The  'expose' flag sets the preference to allow window exposures (the server  can  freely  discard  window  contents), while  'noexpose'  sets  the preference to disable screen saver unless the server can regenerate the  screens  without  causing exposure  events.   The  length  and  period parameters for the screen saver function determines how long the  server  must  be inactive  for  screen  saving  to  activate,  and the period to change the background pattern to avoid burn in.  The  arguments are  specified  in seconds.  If only one numerical parameter is given, it will be used for the length. q       The q option gives you information on the current settings."
  command: "xset"
  example: "xset -fp or fp-"
