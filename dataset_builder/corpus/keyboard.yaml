- id: 415
  intent: "When creating a dynamically linked executable, using the -E option or the --export-dynamic option causes the linker to add all symbols to the dynamic symbol table.  The dynamic symbol table is the set of symbols which are visible from dynamic objects at run time. If you do not use either of these options (or use the --no-export-dynamic option to restore the default behavior), the dynamic symbol table will normally contain only those symbols which are referenced by some dynamic object mentioned in the link. If you use \"dlopen\" to load a dynamic object which needs to refer back to the symbols defined by the program, rather than some other dynamic object, then you will probably need to use this option when linking the program itself. You can also use the dynamic list to control what symbols should be added to the dynamic symbol table if the output format supports it. See the description of --dynamic-list. Note that this option is specific to ELF targeted ports.  PE targets support a similar function to export all symbols from a DLL or EXE; see the description of --export-all-symbols below."
  command: "ld"
  example: "ld --no-export-dynamic"
- id: 416
  intent: "Adjust the method used to share types between translation units in CTF. share-unconflicted Put all types that do not have ambiguous definitions into the shared dictionary, where debuggers can easily access them, even if they only occur in one translation unit.  This is the default. share-duplicated Put only types that occur in multiple translation units into the shared dictionary: types with only one definition go into per-translation-unit dictionaries.  Types with ambiguous definitions in multiple translation units always go into per- translation-unit dictionaries.  This tends to make the CTF larger, but may reduce the amount of CTF in the shared dictionary.  For very large projects this may speed up opening the CTF and save memory in the CTF consumer at runtime."
  command: "ld"
  example: "ld --ctf-share-types=method"
