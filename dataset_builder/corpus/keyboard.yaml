- id: 183
  intent: "This  makes  dumpkeys  skip  all  the short-hand heuristics (see keymaps(5)) and output the key bindings in the  canonical  form. First  a  keymaps line describing the currently defined modifier combinations is printed. Then for each key a row with  a  column for  each  modifier  combination is printed. For example, if the current keymap in use uses seven modifiers, every row will  have seven action code columns. This format can be useful for example to programs that post-process the output of dumpkeys."
  command: "dumpkeys"
  example: "dumpkeys -f --full-table"
