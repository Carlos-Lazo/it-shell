  intent: "Print verbose messages.  NUM specifies the level of verbosity in the range 0-5, with higher numbers being more verbose.  If NUM is not given, then each -v option increases the level of verbosity by 1.  With any level greater than 0, most other options are ignored and normal console output is suppressed unless specific tags are extracted.  Using -v0 causes the console output buffer to be flushed after each line (which may be useful to avoid delays when piping exiftool output), and prints the name of each processed file when writing and the new file name when renaming, moving or copying.  Verbose levels above -v0 do not flush after each line. Also see the -progress option."
