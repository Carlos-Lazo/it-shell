- id: 1254
  intent: "Controls the display of UTF-8 encoded multibyte characters in strings.  The default (--unicode=default) is to give them no special treatment.  The --unicode=locale option displays the sequence in the current locale, which may or may not support them. The options --unicode=hex and --unicode=invalid display them as hex byte sequences enclosed by either angle brackets or curly braces. The --unicode=escape option displays them as escape sequences (\\uxxxx) and the --unicode=highlight option displays them as escape sequences highlighted in red (if supported by the output device). The colouring is intended to draw attention to the presence of unicode sequences where they might not be expected."
  command: "x86_64-linux-gnu-nm"
