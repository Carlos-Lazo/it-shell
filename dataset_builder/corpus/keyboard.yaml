  intent: "Set the print format for GPS coordinates.  FMT uses the same syntax as a \"printf\" format string.  The specifiers correspond to degrees, minutes and seconds in that order, but minutes and seconds are optional.  For example, the following table gives the output for the same coordinate using various formats: FMT                  Output -------------------    ------------------ \"%d deg %d' %.2f\"\\\"    54 deg 59' 22.80\"  (default for reading) \"%d %d %.8f\"           54 59 22.80000000  (default for copying) \"%d deg %.4f min\"      54 deg 59.3800 min \"%.6f degrees\"         54.989667 degrees Notes: 1) To avoid loss of precision, the default coordinate format is different when copying tags using the -tagsFromFile option. 2) If the hemisphere is known, a reference direction (N, S, E or W) is appended to each printed coordinate, but adding a \"+\" to the format specifier (eg. \"%+.6f\") prints a signed coordinate instead. 3) This print formatting may be disabled with the -n option to extract coordinates as signed decimal degrees."
  command: "exiftool"
  example: "exiftool -c FMT (-coordFormat)"
- id: 215
  intent: "Escape characters in output tag values for HTML (-E), XML (-ex) or C (-ec).  For HTML, all characters with Unicode code points above U+007F are escaped as well as the following 5 characters: & (&amp;) ' (&#39;) \" (&quot;) > (&gt;) and < (&lt;).  For XML, only these 5 characters are escaped.  The -E option is implied with -h, and -ex is implied with -X.  For C, all control characters and the backslash are escaped.  The inverse conversion is applied when writing tags."
  command: "exiftool"
  example: "exiftool -E, -ex, -ec (-escapeHTML, -escapeXML, -escapeC)"
