  intent: "Most Autocad display drivers can be configured to use any avail- able  color as the screen background.  Some users prefer a black screen background, others white, while splinter groups  advocate burnt  ocher,  tawny puce, and shocking gray.  Discarding pixels whose closest Autocad color representation is equal to the back- ground  color  can  substantially reduce the size of the Autocad database or slide file needed to represent  a  bitmap.   If  you don't  specify  -background,  ppmtoacad assumes the screen back- ground color to be black.  You may  specify  any  Autocad  color number as the screen background; ppmtoacad assumes color numbers to specify the hues defined in the standard  Autocad  256  color palette."
