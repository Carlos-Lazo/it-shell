  intent: "Force pkfix-helper to associate a specific font with a given font name appearing the document.  name is a (usually) two-character dvips font name such as \"Fa\".  fontspec is a font specification that comprises a font name and an optional scale: \"font [\"@\" scale]\".  Some examples of fontspecs are \"cmmi8\" and \"cmsy10 @ 1.1X\". An asterisk used in the name of the font (e.g., \"cmti*\") will be replaced by all integers from 5 to 17 (\"cmti5\", \"cmti6\", ..., \"cmti17\").  The scale can be written as a multiple of the design size (\"X\") or as an absolute size in either TeX points (\"pt\") or PostScript \"big\" points (\"bp\").  Hence, \"cmsy8 @ 1.5X\", \"cmsy8 @ 12pt\", and \"cmsy8 @ 11.96bp\" all represent the Computer Modern Math Symbols 8 Point font scaled to 12 TeX points/11.96 PostScript points.  Instead of specifying an explicit scale, an asterisk can be used (as in \"cmsy8 @ *\") to request that pkfix- helper find the scale that best matches the original font's metrics. The --force option can be specified repeatedly on the command line."
  command: "pkfix-helper"
  example: "pkfix-helper -f name=fontspec, --force=name=fontspec"
- id: 802
  intent: "Create a Plain TeX file called filename.tex that shows the dvips name and a font sample of every font that pkfix-helper used in the output document."
  command: "pkfix-helper"
  example: "pkfix-helper -t filename.tex, --tex=filename.tex"
- id: 803
  intent: "Do not substitute a vector font for bitmapped font fontspec (\"Fa\", \"Fb\", etc.).  This is useful when converting documents that use obscure bitmapped fonts for which there is no vector equivalent. For example, it was somewhat common in the past to include graphics such as university or corporate logos into a document by converting the bitmapped image into a single-character font and using that font in LaTeX.  --keep prevents such fonts from being replaced. The --keep option can be specified repeatedly on the command line."
  command: "pkfix-helper"
  example: "pkfix-helper -k fontspec, --keep=fontspec"
- id: 804
  intent: "Add fontspec to the list of font specifications against which pkfix-helper compares every document font.  (In contrast, --force designates a font specification to use only for a specific document font.)  The --include option can be specified repeatedly on the command line."
  command: "pkfix-helper"
  example: "pkfix-helper -i fontspec, --include=fontspec"
