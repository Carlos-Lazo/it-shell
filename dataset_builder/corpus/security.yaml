- id: 1209
  intent: "Audits the volume : all the global security data on  volume  are scanned  and  errors are displayed. If option -r is present, all files and directories are also scanned and  their  relations  to global  security  data  are  checked.  This can produce a lot of data. This option is not effective on volumes formatted for  old  NTFS versions  (pre  NTFS  3.0). Such volumes have no global security data. When errors are signalled, it is advisable to repair the  volume with an appropriate tool (such as chkdsk on Windows.) [-v] volume file Displays the security parameters of file : its interpreted Linux mode (rwx flags in octal) and Posix ACL[1], its security key  if any, and its security descriptor if verbose output."
  command: "ntfssecaudit"
  example: "ntfssecaudit -a[rv] volume"
- id: 1210
  intent: "Sets  the  NTFS ACLS as indicated in backup-file or standard in- put. The input data must have been created on Linux. With option -e, also sets extra parameters (currently Windows attrib). volume perms file Sets  the  security  parameters  of  file to perms. Perms is the Linux requested mode (rwx flags, expressed in octal form  as  in chmod)  or  a  Posix ACL[1] (expressed like in setfacl -m). This sets a new ACL which is effective for Linux and Windows."
  command: "ntfssecaudit"
  example: "ntfssecaudit -s[ev] volume [backup-file]"
