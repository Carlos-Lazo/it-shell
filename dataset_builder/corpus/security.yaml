- id: 1545
  intent: "Instead  of  computing the palette from the colors in the image, use the palette from the file palettefile.  If the palette  con- tains a color that is not in that palette, ppmtopcx fails. The palette file must be a PPM image that contains one pixel for each color in the palette.  It doesn't matter  what  the  aspect ratio  of  the palette image is.  The order of the colors in the PCX palette is the order of the pixels in the PPM image in stan- dard  western  reading order (left to right, top to bottom).  If there is a duplicate color in the palette, ppmtopcx chooses  be- tween them arbitrarily in building the PCX raster. You  would  need  this  only if you have a PCX reader that can't read the palette that is in the PCX  file  and  instead  assumes some particular palette.  See also the -stdpalette option. If  your  input  image  might contain colors other than those in your palette, you can convert the input image to one  that  con- tains only those colors in your palette with pnmremap. You cannot specify this along with -stdpalette. This option was new in Netpbhm 10.25 (October 2004)."
  command: "ppmtopcx"
  example: "ppmtopcx -palette=palettefile"
- id: 1546
  intent: "Generate  a  PCX file with planes planes, even though the number of colors in the image could  be  represented  in  fewer.   This makes  the file larger, but some PCX interpreters are capable of processing only certain numbers of planes. This is meaningful only when ppmtopcx generates an image in  the 16  color  palette  format without packed pixels.  Consequently, you cannot specify this option together with -24bit or -8bit  or -packed. The  valid  values  for  planes are 1, 2, 3, and 4.  By default, ppmtopcx chooses the smallest number of planes that  can  repre- sent  the colors in the image.  E.g. if there are 5 colors, ppm- topcx chooses 3 planes. This option was new in Netpbm 10.21 (March 2004)."
  command: "ppmtopcx"
  example: "ppmtopcx -planes=planes"
