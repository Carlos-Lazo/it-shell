- id: 1853
  intent: "That is, if you supply a capability name which tic does not recog- nize,  it will infer its type (boolean, number or string) from the syntax and make an extended table entry  for  that.   User-defined capability strings whose name begins with \"k\" are treated as func- tion keys. PARAMETERS file   contains one or more terminfo terminal  descriptions  in  source format  [see  terminfo(5)].   Each  description  in the file de- scribes the capabilities of a particular terminal. If file is \"-\", then the data is read from the  standard  input. The file parameter may also be the path of a character-device. PROCESSING All  but  one  of  the capabilities recognized by tic are documented in terminfo(5).  The exception is the use capability. When a use=entry-name field is discovered in a terminal entry currently being  compiled, tic reads in the binary from /etc/terminfo to complete the entry.  (Entries created from file will be used first.  tic  dupli- cates  the  capabilities  in entry-name for the current entry, with the exception of those capabilities that explicitly are defined in the cur- rent entry. When  an  entry, e.g., entry_name_1, contains a use=entry_name_2 field, any canceled capabilities in  entry_name_2  must  also  appear  in  en- try_name_1  before  use=  for  these capabilities to be canceled in en- try_name_1. Total compiled entries cannot exceed 4096 bytes.  The name field cannot exceed  512  bytes.   Terminal names exceeding the maximum alias length (32 characters on systems with long filenames, 14 characters otherwise) will  be  truncated  to  the maximum alias length and a warning message will be printed."
  command: "tic"
  example: "tic -x   Treat  unknown  capabilities  as  user-defined (see user_caps(5))."
