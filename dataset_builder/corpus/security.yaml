- id: 1493
  intent: "Use the image in the file named filename instead  of  the  input image  to determine where the borders of the input image are and the background color. Without this option, pnmcrop examines the input image  and  fig- ures out what part of the image is border and what part is fore- ground (not border), as well as the background color.  With this option,  pnmcrop  finds  the borders in one image, then uses the those four border sizes (left, right, top, bottom) in cropping a different  image.   Furthermore,  if you use -margin to add bor- ders, the color of those borders is the background color pnmcrop detects in the border file. The  point  of this is that you may want to help pnmcrop to come to a different conclusion as to where the borders are  and  what the  background  color is by preprocessing the input image.  For example, consider an image that has speckles  of  noise  in  its borders.   pnmcrop  isn't  smart  enough  to  recognize these as noise; it sees them as foreground image.  So  pnmcrop  considers most of your borders to be foreground and does not crop them off as you want.  To fix this, run the image  through  a  despeckler such  as pbmclean and tell pnmcrop to use the despeckled version of the image as the -borderfile image, but the original speckled version as the input image.  That way, you crop the borders, but retain the true foreground image, speckles and all. The border file must have the same number of images in it as the input  file;  the  background color determination for image N of the input is based on the image N of the border file. This option was new in Netpbm 10.29 (August 2005). Before Netpbm 10.46 (March 2009), the original image and not the border  file  determines the background color.  pnmcrop fails if there is no apparent background  color  in  the  original  image (i.e. the corners of the image don't have a common color)."
  command: "pnmcrop"
  example: "pnmcrop -borderfile=filename"
