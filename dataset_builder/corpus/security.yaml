- id: 1272
  intent: "Use the colors found in the file mapfile to create the  colormap in the GIF file, instead of the colors from netpbmfile.  mapfile can be any PPM file; all that matters is the colors in  it.   If the colors in netpbmfile do not match those in mapfile, pamtogif matches them to a \"best match.\" You can obtain a much better re- sult  by  using  pnmremap  to  change the colors in the input to those in the map file. The mapfile file is not a palette file, just an image whose col- ors  you  want  to  use.  The order of colors in the GIF palette have nothing to do with where they appear in the mapfile  image, and duplication of colors in the image is irrelevant. The  map  file's depth must match the number of color components in the input (which is not necessarily the same as  the  input's depth -- the input might have a transparency plane in addition). If your map file does not, or  it  might  not,  run  your  input through pnmremap using the same map file so that it does. You  can  use  -mapfile to speed up conversion of an image where you already have a map file because  of  earlier  processing  of your  image.   For  example, it is common to start with an image that has more than 256 colors and remap its colors to a  set  of 256 colors so that pamgtogif can convert it (a GIF can have only 256 colors; pamtogif without -mapfile fails on  any  image  that has  more  than that) with pnmquant.  When you do this, pnmquant generates a palette to do the color quantization, then  pamtogif generates  an  identical  palette from the quantized image.  You can save computation by generating the palette once: $ pnmcolormap 256 myimage.ppm >/tmp/colormap.ppm $ pamtogif myimage.ppm -mapfile=/tmp/colormap.ppm >output.gif"
  command: "pamtogif"
  example: "pamtogif -mapfile=mapfile"
