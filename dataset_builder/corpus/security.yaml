  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --pop-state"
- id: 2068
  intent: "Generate relocatable output---i.e., generate an output file that can in turn serve as input to ld.  This is often called partial linking.  As a side effect, in environments that support standard Unix magic numbers, this option also sets the output file's magic number to \"OMAGIC\".  If this option is not specified, an absolute file is produced.  When linking C++ programs, this option will not resolve references to constructors; to do that, use -Ur. When an input file does not have the same format as the output file, partial linking is only supported if that input file does not contain any relocations.  Different output formats can have further restrictions; for example some \"a.out\"-based formats do not support partial linking with input files in other formats at all. This option does the same thing as -i."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --relocatable"
- id: 2069
  intent: "Omit debugger symbol information (but not all symbols) from the output file."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --strip-debug"
- id: 2070
  intent: "Retain only the symbols listed in the file filename, discarding all others.  filename is simply a flat file, with one symbol name per line.  This option is especially useful in environments (such as VxWorks) where a large global symbol table is accumulated gradually, to conserve run-time memory. --retain-symbols-file does not discard undefined symbols, or symbols needed for relocations. You may only specify --retain-symbols-file once in the command line.  It overrides -s and -S."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --retain-symbols-file=filename"
- id: 2071
  intent: "Use a wrapper function for symbol.  Any undefined reference to symbol will be resolved to \"__wrap_symbol\".  Any undefined reference to \"__real_symbol\" will be resolved to symbol. This can be used to provide a wrapper for a system function.  The wrapper function should be called \"__wrap_symbol\".  If it wishes to call the system function, it should call \"__real_symbol\". Here is a trivial example: void * __wrap_malloc (size_t c) { printf (\"malloc called with %zu\\n\", c); return __real_malloc (c); } If you link other code with this file using --wrap malloc, then all calls to \"malloc\" will call the function \"__wrap_malloc\" instead. The call to \"__real_malloc\" in \"__wrap_malloc\" will call the real \"malloc\" function. You may wish to provide a \"__real_malloc\" function as well, so that links without the --wrap option will succeed.  If you do this, you should not put the definition of \"__real_malloc\" in the same file as \"__wrap_malloc\"; if you do, the assembler may resolve the call before the linker has a chance to wrap it to \"malloc\". Only undefined references are replaced by the linker.  So, translation unit internal references to symbol are not resolved to \"__wrap_symbol\".  In the next example, the call to \"f\" in \"g\" is not resolved to \"__wrap_f\". int f (void) { return 123; } int g (void) { return f(); }"
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --wrap=symbol"
- id: 2072
  intent: "Use file as the name of a file in which to save the base addresses of all the relocations needed for generating DLLs with dlltool. [This is an i386 PE specific option]"
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --base-file file"
- id: 2073
  intent: "Specify the file alignment.  Sections in the file will always begin at file offsets which are multiples of this number.  This defaults to 512.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --file-alignment"
- id: 2074
  intent: "The linker will create the file file which will contain a DEF file corresponding to the DLL the linker is generating.  This DEF file (which should be called \"*.def\") may be used to create an import library with \"dlltool\" or may be used as a reference to automatically or implicitly exported symbols.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --output-def file"
