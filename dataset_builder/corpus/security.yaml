  intent: "and 'Z' field output  character  support  are  inhibited  when SELinux  is  disabled in the running Linux kernel.  See OUTPUT FOR OTHER PROGRAMS for more information on the 'Z' field  out- put character. Without  a following argument - e.g., NO Z - the option speci- fies that security contexts are to  be  listed  in  the  SECU- RITY-CONTEXT output column. The  -Z  option may be followed by a wildcard security context name, Z.  That causes lsof to list only open  files  for  pro- cesses in that security context.  Multiple -Z Z option and ar- gument pairs may be specified to form a list of security  con- texts.   Any  open  file of any process in any of the security contexts will be listed, subject to other conditions specified by  other  options and arguments.  Note that Z can be A:B:C or *:B:C or A:B:* or *:*:C to match against the A:B:C context."
