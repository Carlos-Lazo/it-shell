  intent: "If the display on which the slide  file  was  created  had  non- square  pixels,  when  you  process  the slide with sldtoppm and don't specify -adjust, sldtoppm issues the following warning; Warning - pixels on source screen were non-square. Specifying -adjust will correct the image width to compensate.   Speci- fying  the -adjust option causes sldtoppm to scale the width of the im- age so that pixels in the resulting PPM image  are  square  (and  hence circles  appear  as  true  circles, not ellipses).  The scaling is per- formed in the vector domain, before scan converting the  objects.   The results  are,  therefore,  superior  in appearance to what you'd obtain were you to perform the equivalent scaling with pamscale after the bit- map had been created."
