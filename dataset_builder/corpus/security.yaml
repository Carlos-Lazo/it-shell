  intent: "(HTTP) Specify to which file you want curl to write all  cookies after  a  completed  operation. Curl writes all cookies from its in-memory cookie storage to the given file at the end of  opera- tions.  If  no  cookies  are known, no data will be written. The file will be written using the Netscape cookie file  format.  If you set the file name to a single dash, \"-\", the cookies will be written to stdout. This command line option will activate the  cookie  engine  that makes curl record and use cookies. Another way to activate it is to use the -b, --cookie option. If the cookie jar cannot be created or  written  to,  the  whole curl  operation  will  not fail or even report an error clearly. Using -v, --verbose will get a warning displayed,  but  that  is the  only  visible  feedback  you get about this possibly lethal situation. If -c, --cookie-jar is provided  several  times,  the  last  set value will be used. Examples: curl -c store-here.txt https://example.com curl -c store-here.txt -b read-these https://example.com See also -b, --cookie."
  command: "curl"
  example: "curl -c, --cookie-jar <filename>"
- id: 269
  intent: "(HTTP) Pass the data to the HTTP server in the Cookie header. It is supposedly the data previously received from the server in  a \"Set-Cookie:\"   line.   The   data   should  be  in  the  format \"NAME1=VALUE1; NAME2=VALUE2\". This makes  curl  use  the  cookie header  with this content explicitly in all outgoing request(s). If multiple requests are done due  to  authentication,  followed redirects or similar, they will all get this cookie passed on. If  no '=' symbol is used in the argument, it is instead treated as a filename to read previously stored cookie from. This option also activates the cookie engine which will make curl record in- coming cookies, which may be handy if you are using this in com- bination  with  the  -L,  --location  option  or do multiple URL transfers on the same invoke. If the file name is exactly a  mi- nus (\"-\"), curl will instead read the contents from stdin. The file format of the file to read cookies from should be plain HTTP headers (Set-Cookie style) or the  Netscape/Mozilla  cookie file format. The  file  specified with -b, --cookie is only used as input. No cookies will be written to the file. To store cookies,  use  the -c, --cookie-jar option. If  you  use the Set-Cookie file format and do not specify a do- main then the cookie is not sent since  the  domain  will  never match.  To  address this, set a domain in Set-Cookie line (doing that will include sub-domains) or preferably: use  the  Netscape format. Users  often want to both read cookies from a file and write up- dated cookies back to a file, so using both -b, --cookie and -c, --cookie-jar in the same command line is common. -b, --cookie can be used several times in a command line Examples: curl -b cookiefile https://example.com curl -b cookiefile -c cookiefile https://example.com See also -c, --cookie-jar and -j, --junk-session-cookies."
  command: "curl"
  example: "curl -b, --cookie <data|filename>"
- id: 270
  intent: "(HTTP  FTP) Write the received protocol headers to the specified file. If no headers are received, the use of  this  option  will create an empty file. When  used  in FTP, the FTP server response lines are considered being \"headers\" and thus are saved there. Having multiple transfers in one set  of  operations  (i.e.  the URLs  in  one  -:,  --next clause), will append them to the same file, separated by a blank line. If -D, --dump-header is provided several  times,  the  last  set value will be used. Example: curl --dump-header store.txt https://example.com See also -o, --output."
  command: "curl"
  example: "curl -D, --dump-header <filename>"
- id: 271
  intent: "(HTTP) When curl is told to read cookies from a given file, this option will make it discard all \"session cookies\". This will ba- sically have the same effect as if a  new  session  is  started. Typical  browsers  always  discard session cookies when they are closed down. Providing -j, --junk-session-cookies multiple times has no extra effect.  Disable it again with --no-junk-session-cookies. Example: curl --junk-session-cookies -b cookies.txt https://example.com See also -b, --cookie and -c, --cookie-jar."
  command: "curl"
  example: "curl -j, --junk-session-cookies"
- id: 272
  intent: "Same as --cacert but used in HTTPS proxy context. If --proxy-cacert is provided several times, the last set  value will be used. Example: curl --proxy-cacert CA-file.txt -x https://proxy https://example.com See  also  --proxy-capath,  --cacert,  --capath and -x, --proxy. Added in 7.52.0."
  command: "curl"
  example: "curl --proxy-cacert <file>"
- id: 273
  intent: "Same as --crlfile but used in HTTPS proxy context. If --proxy-crlfile is provided several times, the last set value will be used. Example: curl --proxy-crlfile rejects.txt -x https://proxy https://example.com See also --crlfile and -x, --proxy. Added in 7.52.0."
  command: "curl"
  example: "curl --proxy-crlfile <file>"
- id: 274
  intent: "(HTTP) Extra header to include in the request when sending  HTTP to a proxy. You may specify any number of extra headers. This is the equivalent option to -H, --header but is for proxy  communi- cation  only  like  in CONNECT requests when you want a separate header sent to the proxy to what is sent to  the  actual  remote host. curl  will  make  sure  that each header you add/replace is sent with the proper end-of-line marker, you should thus not add that as a part of the header content: do not add newlines or carriage returns, they will only mess things up for you. Headers specified with this option will not be included  in  re- quests that curl knows will not be sent to a proxy. Starting  in  7.55.0, this option can take an argument in @file- name style, which then adds a header for each line in the  input file. Using @- will make curl read the header file from stdin. This  option  can  be  used multiple times to add/replace/remove multiple headers. --proxy-header can be used several times in a command line Examples: curl --proxy-header \"X-First-Name: Joe\" -x http://proxy https://example.com curl --proxy-header \"User-Agent: surprise\" -x http://proxy https://example.com curl --proxy-header \"Host:\" -x http://proxy https://example.com See also -x, --proxy. Added in 7.37.0."
  command: "curl"
  example: "curl --proxy-header <header/@file>"
- id: 275
  intent: "Same as -k, --insecure but used in HTTPS proxy context. Providing --proxy-insecure multiple times has no  extra  effect. Disable it again with --no-proxy-insecure. Example: curl --proxy-insecure -x https://proxy https://example.com See also -x, --proxy and -k, --insecure. Added in 7.52.0."
  command: "curl"
  example: "curl --proxy-insecure"
- id: 276
  intent: "(TLS) Tells curl to  use  the  specified  public  key  file  (or hashes)  to verify the proxy. This can be a path to a file which contains a single public key in PEM or DER format, or any number of base64 encoded sha256 hashes preceded by 'sha256//' and sepa- rated by ';'. When negotiating a TLS or SSL connection,  the  server  sends  a certificate  indicating  its identity. A public key is extracted from this certificate and if it does not exactly match the  pub- lic  key provided to this option, curl will abort the connection before sending or receiving any data. If --proxy-pinnedpubkey is provided several times, the last  set value will be used. Examples: curl --proxy-pinnedpubkey keyfile https://example.com curl --proxy-pinnedpubkey 'sha256//ce118b51897f4452dc' https://example.com See also --pinnedpubkey and -x, --proxy. Added in 7.59.0."
  command: "curl"
  example: "curl --proxy-pinnedpubkey <hashes>"
- id: 277
  intent: "Same as --ssl-allow-beast but used in HTTPS proxy context. Providing  --proxy-ssl-allow-beast  multiple  times has no extra effect.  Disable it again with --no-proxy-ssl-allow-beast. Example: curl --proxy-ssl-allow-beast -x https://proxy https://example.com See also --ssl-allow-beast and -x, --proxy. Added in 7.52.0."
  command: "curl"
  example: "curl --proxy-ssl-allow-beast"
- id: 278
  intent: "Same as -1, --tlsv1 but used in HTTPS proxy context. Providing --proxy-tlsv1 multiple times has no extra effect. Example: curl --proxy-tlsv1 -x https://proxy https://example.com See also -x, --proxy. Added in 7.52.0."
  command: "curl"
  example: "curl --proxy-tlsv1"
- id: 279
  intent: "Use  the  specified  HTTP  1.0  proxy. If the port number is not specified, it is assumed at port 1080. The only difference between this and the HTTP proxy  option  -x, --proxy,  is that attempts to use CONNECT through the proxy will specify an HTTP 1.0 protocol instead of the default HTTP 1.1. Providing --proxy1.0 multiple times has no extra effect. Example: curl --proxy1.0 -x http://proxy https://example.com See also -x, --proxy, --socks5 and --preproxy."
  command: "curl"
  example: "curl --proxy1.0 <host[:port]>"
- id: 280
  intent: "When an HTTP proxy is used -x, --proxy, this  option  will  make curl  tunnel through the proxy. The tunnel approach is made with the HTTP proxy CONNECT request and requires that the  proxy  al- lows direct connect to the remote port number curl wants to tun- nel through to. To suppress proxy CONNECT response headers when curl is  set  to output headers use --suppress-connect-headers. Providing  -p, --proxytunnel multiple times has no extra effect. Disable it again with --no-proxytunnel. Example: curl --proxytunnel -x http://proxy https://example.com See also -x, --proxy."
  command: "curl"
  example: "curl -p, --proxytunnel"
- id: 281
  intent: "Example: curl --quote \"DELE file\" ftp://example.com/foo See also -X, --request."
  command: "curl"
  example: "curl -Q, --quote can be used several times in a command line"
- id: 282
  intent: "This option tells curl to not work around a security flaw in the SSL3 and TLS1.0 protocols known as BEAST.  If this option is not used, the SSL layer may use workarounds known to cause  interop- erability problems with some older SSL implementations. WARNING: this option loosens the SSL security, and by using this flag you ask for exactly that. Providing --ssl-allow-beast multiple times has no extra  effect. Disable it again with --no-ssl-allow-beast. Example: curl --ssl-allow-beast https://example.com See also --proxy-ssl-allow-beast and -k, --insecure."
  command: "curl"
  example: "curl --ssl-allow-beast"
- id: 283
  intent: "(Schannel) This option tells curl to disable certificate revoca- tion checks.  WARNING: this option loosens the SSL security, and by using this flag you ask for exactly that. Providing --ssl-no-revoke multiple times has  no  extra  effect. Disable it again with --no-ssl-no-revoke. Example: curl --ssl-no-revoke https://example.com See also --crlfile. Added in 7.44.0."
  command: "curl"
  example: "curl --ssl-no-revoke"
