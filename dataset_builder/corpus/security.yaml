  intent: "Tells pnmmontage to write a C header file of  the  locations  of the  original images within the packed image.  Each original im- age generates four #defines within the packed file: xxxX,  xxxY, xxxSZX, and xxxSZY, where xxx is the name of the file, converted to all uppercase.  The output also  includes  #defines  OVERALLX and  OVERALLY, which specifies the total size of the montage im- age. Here is an example: #define OVERALLX 227 #define OVERALLY 298 #define X 0 #define Y 0 #define SZX 227 #define SZY 149 #define X 0 #define Y 149 #define SZX 227 #define SZY 149"
  command: "pnmmontage"
  example: "pnmmontage -header=filename"
