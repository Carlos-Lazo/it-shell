  intent: "This  option  names  the  file in which the color dictionary you want to use resides.  By default, ppmtoxpm uses the system color dictionary <libppm.html#dictionary> , and if it cannot open that file, uses hexadecimal color specifiers. This option in meaningless when you specify -hexonly. Before Netpbm 10.15 (April 2003), ppmtoxpm did  not  default  to the  system  color dictionary.  If you didn't specify -rgb, ppm- toxpbm would use only hexadecimal color specifiers."
  command: "ppmtoxpm"
  example: "ppmtoxpm -rgb=rgb-textfile"
- id: 1551
  intent: "This option names a PGM file to use as a  transparency  (alpha) mask.  The file must contain an image the same dimensions as the input image.  ppmtoxpm marks as transparent any pixel whose  po- sition in the transparency mask image is at most half white. If  you  don't  specify -alphamask, ppmtoxpm makes all pixels in the output opaque. ppmcolormask is one way to generate a  transparency  mask  file. You  might  also generate it by extracting transparency informa- tion from an XPM file with the -alphaout option to xpmtoppm. There are similar options on other Netpbm converters  that  con- vert from formats that include transparency information too."
  command: "ppmtoxpm"
  example: "ppmtoxpm -alphamask=pgmfile"
