  intent: "These options control whether the assembler should generate lfence before ret.  -mlfence-before-ret=or will generate generate or instruction with lfence.  -mlfence-before-ret=shl/yes will generate shl instruction with lfence. -mlfence-before-ret=not will generate not instruction with lfence. -mlfence-before-ret=none will not generate lfence, which is the default."
