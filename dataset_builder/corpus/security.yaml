- id: 1681
  intent: "(+|-)cap... Set the inheritable capabilities, ambient capabilities or the capability bounding set. See capabilities(7). The argument is a comma-separated list of +cap and -cap entries, which add or remove an entry respectively. cap can either be a human-readable name as seen in capabilities(7) without the cap_ prefix or of the format cap_N, where N is the internal capability index used by Linux. +all and -all can be used to add or remove all caps. The set of capabilities starts out as the current inheritable set for --inh-caps, the current ambient set for --ambient-caps and the current bounding set for --bounding-set. Note the following restrictions (detailed in capabilities(7)) regarding modifications to these capability sets: o   A capability can be added to the inheritable set only if it is currently present in the bounding set. o   A capability can be added to the ambient set only if it is currently present in both the permitted and inheritable sets. o   Notwithstanding the syntax offered by setpriv, the kernel does not permit capabilities to be added to the bounding set. If you drop a capability from the bounding set without also dropping it from the inheritable set, you are likely to become confused. Do not do that."
  command: "setpriv"
  example: "setpriv --inh-caps (+|-)cap..., --ambient-caps (+|-)cap..., --bounding-set"
- id: 1682
