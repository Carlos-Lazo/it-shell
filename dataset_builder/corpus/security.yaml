  intent: "Do not create entries in the zip archive for  directories.   Di- rectory  entries are created by default so that their attributes can be saved in  the  zip  archive.   The  environment  variable ZIPOPT  can  be  used to change the default options. For example under Unix with sh: ZIPOPT=\"-D\"; export ZIPOPT (The variable ZIPOPT can be used for any  option,  including  -i and -x using a new option format detailed below, and can include several options.) The option -D is a shorthand for -x  \"*/\"  but the  latter previously could not be set as default in the ZIPOPT environment variable as the contents  of  ZIPOPT  gets  inserted near  the beginning of the command line and the file list had to end at the end of the line. This version of zip does allow -x and -i options  in  ZIPOPT  if the form -x file file ... @ is used, where the @ (an argument that is just @) terminates the list."
  command: "zip"
  example: "zip --no-dir-entries"
