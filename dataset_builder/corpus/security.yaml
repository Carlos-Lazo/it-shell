- id: 1112
  intent: "Create  a  file  system with the given features (file system op- tions), overriding the default file system  options.   The  fea- tures that are enabled by default are specified by the base_fea- tures  relation,  either  in  the  [defaults]  section  in   the /etc/mke2fs.conf  configuration  file, or in the [fs_types] sub- sections for the usage types as specified by the -T option, fur- ther  modified  by the features relation found in the [fs_types] subsections for the  file  system  and  usage  types.   See  the mke2fs.conf(5)  manual  page  for more details.  The file system type-specific configuration setting found in the [fs_types] sec- tion will override the global default found in [defaults]. The  file system feature set will be further edited using either the feature set specified by this option, or if this  option  is not  given, by the default_features relation for the file system type being created, or in the [defaults] section of the configu- ration file. The  file system feature set is comprised of a list of features, separated by commas, that are to be enabled.  To disable a  fea- ture,  simply prefix the feature name with a caret ('^') charac- ter.  Features with dependencies will not  be  removed  success- fully.   The  pseudo-file  system  feature \"none\" will clear all file system features. For more information about the features which can be set, please see the manual page ext4(5)."
  command: "mke2fs"
  example: "mke2fs -O [^]feature[,...]"
