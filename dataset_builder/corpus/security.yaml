- id: 1726
  intent: "Show internal tipc socket information. -K, --kill Attempts to forcibly close sockets. This option  displays sockets  that  are successfully closed and silently skips sockets that the kernel does not support closing. It sup- ports IPv4 and IPv6 sockets only. -s, --summary Print  summary  statistics.  This  option  does not parse socket lists obtaining summary from various  sources.  It is  useful when amount of sockets is so huge that parsing /proc/net/tcp is painful. -E, --events Continually display sockets as they are destroyed -Z, --context As the -p option but also shows process security context. If the -T option is used, also shows thread security con- text. For netlink(7) sockets the initiating process context  is displayed as follows: 1.  If valid pid show the process context. 2.  If destination is kernel (pid = 0) show kernel initial context. 3.  If a unique identifier has been  allocated  by the  kernel  or  netlink user, show context as \"unavailable\". This  will  generally  indicate that  a  process  has  more  than  one netlink socket active. -z, --contexts As the -Z option but also shows the socket  context.  The socket  context is taken from the associated inode and is not the actual socket context held by the kernel. Sockets are  typically  labeled  with the context of the creating process, however the context shown will reflect any  pol- icy role, type and/or range transition rules applied, and is therefore a useful reference. -N NSNAME, --net=NSNAME Switch to the specified network namespace name. -b, --bpf Show socket classic BPF filters (only administrators  are allowed to get these information). -4, --ipv4 Display only IP version 4 sockets (alias for -f inet). -6, --ipv6 Display only IP version 6 sockets (alias for -f inet6). -0, --packet Display PACKET sockets (alias for -f link). -t, --tcp Display TCP sockets. -u, --udp Display UDP sockets. -d, --dccp Display DCCP sockets. -w, --raw Display RAW sockets. -x, --unix Display Unix domain sockets (alias for -f unix). -S, --sctp Display SCTP sockets. --tipc Display tipc sockets (alias for -f tipc). --vsock Display vsock sockets (alias for -f vsock). --xdp  Display XDP sockets (alias for -f xdp). -M, --mptcp Display MPTCP sockets. --inet-sockopt Display inet socket options. -f FAMILY, --family=FAMILY Display  sockets of type FAMILY.  Currently the following families are supported: unix, inet, inet6, link, netlink, vsock, tipc, xdp. -A QUERY, --query=QUERY, --socket=QUERY List  of  socket tables to dump, separated by commas. The following identifiers are  understood:  all,  inet,  tcp, udp, raw, unix, packet, netlink, unix_dgram, unix_stream, unix_seqpacket,  packet_raw,  packet_dgram,  dccp,  sctp, tipc,  vsock_stream, vsock_dgram, xdp, mptcp. Any item in the list may optionally be  prefixed  by  an  exclamation mark (!)  to exclude that socket table from being dumped. -D FILE, --diag=FILE Do  not display anything, just dump raw information about TCP sockets to FILE after applying filters. If FILE is  - stdout is used. -F FILE, --filter=FILE Read  filter information from FILE.  Each line of FILE is interpreted like single command line option. If FILE is - stdin is used. FILTER := [ state STATE-FILTER ] [ EXPRESSION ] Please  take a look at the official documentation for de- tails regarding filters."
  command: "ss"
  example: "ss --tipcinfo"
