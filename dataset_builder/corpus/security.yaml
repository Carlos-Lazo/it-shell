  intent: "Examine  the  actions described in the logfile backward from the latest one to the earliest one without applying any update. This may  encompass  records  generated  during several sessions, and when Windows is restarted, it often  does  not  restart  writing where it ended the previous session, so this leads to errors and bad sequencing when examining the full log file."
  command: "ntfsrecover"
  example: "ntfsrecover -b, --backward"
- id: 1204
  intent: "Examine the actions described in the logfile  forward  from  the first  one  to  the last one without applying any update. As the log file is reused circularly, the first one  is  generally  not the  earliest. Moreover when Windows is restarted, it often does not restart writing where it ended the  previous  sessions,  and this  leads to errors when examining a log file generated during several sessions."
  command: "ntfsrecover"
  example: "ntfsrecover -f, --forward NUM"
- id: 1205
  intent: "Examine  the actions described in the logfile forward restricted to the requested log file block range without applying  any  up- date. The first four log blocks have a special role and they are always examined."
  command: "ntfsrecover"
