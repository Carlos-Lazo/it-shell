- id: 1156
  intent: "A space filling curve halftoning method using the Hilbert curve is also available (-hilbert). Floyd-Steinberg  or  Atkinson  will almost always give the best looking results; however, looking good is not always what you  want.   For  in- stance,  you can use thresholding in a pipeline with the pnmconvol, for tasks such as edge and peak  detection.   And  clustered-dot  dithering gives a newspaper-ish look, a useful special effect. Floyd-Steinberg is by far the more traditional, but some                                                             claim <http://www.tinrocket.com/projects/programming/graphics/00158/>  Atkin- son works better. The Hilbert curve method is useful for processing images before display on devices that do not render individual pixels distinctly (like  laser printers).   This  dithering  method  can  give better results than the dithering usually done by the laser printers  themselves.   The  -clump option  alters  the number of pixels in a clump.  Typically a PGM image will have to be scaled to fit on a laser printer page (2400 x 3000 pix- els  for  an  A4 300 dpi page), and then dithered to a PBM image before being converted to a postscript file.  A printing pipeline  might  look something like: pamscale -xysize 2400 3000 image.pgm | pamditherbw -hilbert |  \\ pamtopnm | pnmtops -scale 0.25 > image.ps Other Options"
  command: "pamditherbw"
  example: "pamditherbw -cluster4, -cluster8)."
- id: 1157
  intent: "Apply all the transforms listed, in order.  The valid values for the transforms are as follows and have the same meanings as  the identically named options above. o      leftright o      topbottom o      transpose This option was new in Netpbm 10.13 (December 2002). Memory Management The  following options help pamflip use memory efficiently.  Some flip- ping operations on very large images can cause pamflip to have  a  very large  working  set,  which means if you don't have enough real memory, the program can page thrash, which means it takes a  ridiculous  amount time  to run.  If your entire image fits in real memory, you don't have a problem.  If you're just flipping top for bottom or left  for  right, you  don't have a problem.  Otherwise, pay attention.  If you're inter- ested in the details of the  thrashing  problem  and  how  pamflip  ap- proaches  it, you're invited to read a complete explanation in comments in the source code."
  command: "pamflip"
  example: "pamflip -xform=xform1,xform2..."
- id: 1158
  intent: "mebibytes is the size in mebibytes  (aka  megabytes)  of  memory available  for  pamflip.  It is the lesser of the amount of real or virtual memory available. pamflip does nothing special to allocate real memory or  control it's  allocation -- it gets whatever it gets just by referencing virtual memory normally.  The real memory figure in question  is the  maximum  amount that pamflip can be expected to end up with by doing that.  This is just about impossible for you  to  know, of  course, but you can estimate.  The total real memory in your system should be a major factor in your estimate. If pamflip cannot fit the entire image in the amount  of  memory you  specify, it does the transformation in chunks, using tempo- rary files for intermediate results. In strict horizontal transformations (left  for  right)  or  the null  transformation,  pamflip  never keeps more than one row in memory, so the memory size is irrelevant and pamflip doesn't use temporary files. In  strict  vertical transformations (top for bottom), even when you allow pamflip enough memory to keep the entire image in vir- tual  memory,  it  accesses  it in a single pass, which does not cause any thrashing; the chunks in temporary  files  thus  don't help. The  real  memory is important when you do a column for row type of transformation (e.g. -rotate90).  In that case, even if  pam- flip  can  fit the entire image in virtual memory at once, if it does not also fit in real memory, the program will  thrash  like crazy because of the order in which pamflip accesses the pixels, and that means it will take a ridiculously long time to run.   A proper -memsize drastically reduces the paging. If  you  specify  -memsize too large, pamflip may attempt to get more virtual memory than the system allows it and fail.   If  it can  get  the  virtual  memory,  but -memsize is larger than the amount of real memory the system allows it and  the  transforma- tion is row for column, it will page thrash and run very slowly. A value even slightly too high is the same as infinity. If you specify -memsize too small, the program will run slightly more  slowly because of extra overhead in manipulating temporary files.  Also, if your environment isn't set up to make temporary files possible, pamflip will fail. Doing the entire transformation \"in memory\" doesn't speed things up as much as you might think, because even with  the  temporary files, the data is just as likely to be in memory.  Virtual mem- ory gets paged to disk and disk files get cached in memory.   In fact, the pixels fit much more compactly into memory when stored in a temporary file than when stored \"in memory\" because pamflip uses  a  more  efficient  format.  So you're likely to have less disk I/O when you allow pamflip less memory. If you do not specify -memsize, pamflip assumes infinity. This option did not exist before Netpbm 10.7 (August 2002). Before Netpbm 10.42 (March 2008), this option  applied  only  to real memory.  pamflip would always keep the entire image in vir- tual memory and if it could not get enough  virtual  memory,  it failed.   pamflip  accessed  the  pixels in an order designed to keep real memory use within the specified amount."
  command: "pamflip"
  example: "pamflip -memsize=mebibytes"
- id: 1159
  intent: "bytes is the size in bytes of a paging unit  --  the  amount  of memory  that  gets  paged in or out as an indivisible unit -- in your system.  The default is 4KiB. This option has no effect. Before Netpbm 10.42 (March 2008), pamflip used it to control its use of real memory. This option did not exist before Netpbm 10.7 (August 2002). Miscellaneous"
  command: "pamflip"
  example: "pamflip -pagesize=bytes"
