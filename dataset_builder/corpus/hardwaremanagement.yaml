  command: "x86_64-linux-gnu-ar"
  example: "x86_64-linux-gnu-ar --help"
- id: 1717
  intent: "Generate DWARF2 debugging information for each assembler line. This may help debugging assembler code, if the debugger can handle it.  Note---this option is only supported by some targets, not all of them."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as --gdwarf-2"
- id: 1718
  intent: "This option is the same as the --gdwarf-2 option, except that it allows for the possibility of the generation of extra debug information as per version 3 of the DWARF specification.  Note - enabling this option does not guarantee the generation of any extra information, the choice to do so is on a per target basis."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as --gdwarf-3"
- id: 1719
  intent: "This option is the same as the --gdwarf-2 option, except that it allows for the possibility of the generation of extra debug information as per version 4 of the DWARF specification.  Note - enabling this option does not guarantee the generation of any extra information, the choice to do so is on a per target basis."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as --gdwarf-4"
- id: 1720
  intent: "This option is the same as the --gdwarf-2 option, except that it allows for the possibility of the generation of extra debug information as per version 5 of the DWARF specification.  Note - enabling this option does not guarantee the generation of any extra information, the choice to do so is on a per target basis."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as --gdwarf-5"
- id: 1721
  intent: "Set the maximum width of an input source line, as displayed in a listing, to number bytes."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as --listing-rhs-width=number"
- id: 1722
  intent: "This option specifies the target architecture.  The assembler will issue an error message if an attempt is made to assemble an instruction which will not execute on the target architecture.  The following architecture names are recognized: \"armv8-a\", \"armv8.1-a\", \"armv8.2-a\", \"armv8.3-a\", \"armv8.4-a\" \"armv8.5-a\", \"armv8.6-a\", \"armv8.7-a\", \"armv8.8-a\", \"armv8-r\", \"armv9-a\", \"armv9.1-a\", \"armv9.2-a\", and \"armv9.3-a\". If both -mcpu and -march are specified, the assembler will use the setting for -mcpu.  If neither are specified, the assembler will default to -mcpu=all. The architecture option can be extended with the same instruction set extension options as the -mcpu option.  Unlike -mcpu, extensions are not always enabled by default,"
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march=architecture[+extension...]"
- id: 1723
  intent: "This option selects the core processor variant."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mcpu=cpu"
- id: 1724
  intent: "Enable Code Density extension instructions. The following options are available when as is configured for the ARM processor family."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mcode-density"
- id: 1725
  intent: "Specify which ARM architecture variant is used by the target."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march=architecture[+extension...]"
- id: 1726
  intent: "The following options are available when as is configured for the Blackfin processor family."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -k  Specify that PIC code has been generated."
- id: 1727
  intent: "Enable vector DSP instructions. The following options are available when as is configured for an Epiphany processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mvdsp"
- id: 1728
  intent: "Select the word size, either 32 bits or 64 bits.  --32 implies Intel i386 architecture, while --x32 and --64 imply AMD x86-64 architecture with 32-bit or 64-bit word-size respectively. These options are only available with the ELF object file format, and require that the necessary BFD support has been included (on a 32-bit platform you have to add --enable-64-bit-bfd to configure enable 64-bit usage and use x86-64 as target platform)."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as --32 | --x32 | --64"
- id: 1729
  intent: "This option specifies a processor to optimize for. When used in conjunction with the -march option, only instructions of the processor specified by the -march option will be generated. Valid CPU values are identical to the processor list of -march=CPU."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mtune=CPU"
- id: 1730
  intent: "These options control whether the assembler should generate relax relocations, R_386_GOT32X, in 32-bit mode, or R_X86_64_GOTPCRELX and R_X86_64_REX_GOTPCRELX, in 64-bit mode. -mrelax-relocations=yes will generate relax relocations. -mrelax-relocations=no will not generate relax relocations.  The default can be controlled by a configure option --enable-x86-relax-relocations."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mrelax-relocations=yes"
- id: 1731
  intent: "These options control whether the assembler should generate lfence before indirect near branch instructions. -mlfence-before-indirect-branch=all will generate lfence before indirect near branch via register and issue a warning before indirect near branch via memory.  It also implicitly sets -mlfence-before-ret=shl when there's no explicit -mlfence-before-ret=.  -mlfence-before-indirect-branch=register will generate lfence before indirect near branch via register. -mlfence-before-indirect-branch=memory will issue a warning before indirect near branch via memory. -mlfence-before-indirect-branch=none will not generate lfence nor issue warning, which is the default.  Note that lfence won't be generated before indirect near branch via register with -mlfence-after-load=yes since lfence will be generated after loading branch target register."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mlfence-before-indirect-branch=memory"
- id: 1732
  intent: "Restores the default behaviour, which restricts the permitted instructions to just the basic IP2022 ones. The following options are available when as is configured for the Renesas M32C and M16C processors."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mip2022"
- id: 1733
  intent: "Support H'00 style hex constants in addition to 0x00 style. The following options are available when as is configured for the Renesas M32R (formerly Mitsubishi M32R) series."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -h-tick-hex"
- id: 1734
  intent: "The target machine does (or does not) have a memory-management unit coprocessor.  The default is to assume an MMU for 68020 and up. The following options are available when as is configured for an Altera Nios II processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -m68851 | -mno-68851"
- id: 1735
  intent: "Replace branch instructions not determinable to be in range and all call instructions with \"jmp\" and \"callr\" sequences (respectively). This option generates absolute relocations against the target symbols and is not appropriate for position-independent code."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -relax-all"
- id: 1736
  intent: "This option specifies the target architecture.  The assembler issues an error message if an attempt is made to assemble an instruction which will not execute on the target architecture.  The following architecture names are recognized: \"r1\", \"r2\".  The default is \"r1\". The following options are available when as is configured for a PRU processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march=architecture"
- id: 1737
  intent: "Generate code for a particular MIPS CPU."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march=cpu"
- id: 1738
  intent: "Schedule and tune for a particular MIPS CPU."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mtune=cpu"
- id: 1739
  intent: "Generate code for the Loongson Content Address Memory (CAM) instructions.  This tells the assembler to accept Loongson CAM instructions.  -mno-loongson-cam turns off this option."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mno-loongson-cam"
- id: 1740
  intent: "Generate code for processors with Hardware Transactional Memory instructions."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mhtm"
- id: 1741
  intent: "Select the base isa, as specified by ISA.  For example -march=rv32ima.  If this option and the architecture attributes aren't set, then assembler will check the default configure setting --with-arch=ISA."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march=ISA"
- id: 1742
  intent: "Select the default isa spec version.  If the version of ISA isn't set by -march, then assembler helps to set the version according to the default chosen spec.  If this option isn't set, then assembler will check the default configure setting --with-isa-spec=ISAspec."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -misa-spec=ISAspec"
- id: 1743
  intent: "Generate the default contents for the riscv elf attribute section if the .attribute directives are not set.  This section is used to record the information that a linker or runtime loader needs to check compatibility.  This information includes ISA string, stack alignment requirement, unaligned memory accesses, and the major, minor and revision version of privileged specification."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march-attr"
- id: 1744
  intent: "Select the architecture mode, either the Enterprise System Architecture (esa) or the z/Architecture mode (zarch)."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mzarch"
- id: 1745
  intent: "Warn whenever the operand for a base or index register has been specified but evaluates to zero. The following options are available when as is configured for a TMS320C6000 processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mwarn-areg-zero"
- id: 1746
  intent: "Generate code for the specified endianness.  The default is little- endian. The following options are available when as is configured for a TILE-Gx processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mlittle-endian"
- id: 1747
  intent: "Select the endianness, either big-endian (-EB) or little-endian (-EL). The following option is available when as is configured for a Visium processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -EB | -EL"
- id: 1748
  intent: "This option specifies the target processor. The assembler will issue an error message if an attempt is made to assemble an instruction which will not execute on the target processor. The following processor names are recognized: \"z80\", \"z180\", \"ez80\", \"gbz80\", \"z80n\", \"r800\".  In addition to the basic instruction set, the assembler can be told to accept some extention mnemonics. For example, \"-march=z180+sli+infc\" extends z180 with SLI instructions and IN F,(C). The following extentions are currently supported: \"full\" (all known instructions), \"adl\" (ADL CPU mode by default, eZ80 only), \"sli\" (instruction known as SLI, SLL or SL1), \"xyhl\" (instructions with halves of index registers: IXL, IXH, IYL, IYH), \"xdcb\" (instructions like RotOp (II+d),R and BitOp n,(II+d),R), \"infc\" (instruction IN F,(C) or IN (C)), \"outc0\" (instruction OUT (C),0).  Note that rather than extending a basic instruction set, the extention mnemonics starting with \"-\" revoke the respective functionality: \"-march=z80-full+xyhl\" first removes all default extentions and adds support for index registers halves only. If this option is not specified then \"-march=z80+xyhl+infc\" is assumed."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -march=CPU[-EXT...][+EXT...]"
- id: 1749
  intent: "Read a list of dynamic symbols"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --dynamic-list FILE"
- id: 1750
  intent: "Use less memory and more disk I/O (included only for compatibil- ity with GNU ld)"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --no-keep-memory"
- id: 1751
  intent: "List removed unused sections on stderr"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --print-gc-sections"
- id: 1752
  intent: "Do not list removed unused sections (default)"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --no-print-gc-sections"
- id: 1753
  intent: "List folded identical sections on stderr"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --print-icf-sections"
- id: 1754
  intent: "Do not list folded identical sections (default)"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --no-print-icf-sections"
- id: 1755
  intent: "Strip all symbols"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold -s, --strip-all"
- id: 1756
  intent: "Emit only debug line number information"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold --strip-debug-non-line"
- id: 1757
  intent: "Make symbols in DSO available for subsequently loaded objects"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold -z global"
- id: 1758
  intent: "Mark DSO not available to dlopen"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold -z nodlopen"
- id: 1759
  intent: "Mark DSO not available to dldump"
  command: "x86_64-linux-gnu-gold"
  example: "x86_64-linux-gnu-gold -z nodump"
- id: 1760
  intent: "show the source code for item; the tag is used to  differentiate in  case of multiple occurences with the same name; the combina- tion of \"all -1\" selects all the functions in  the  object;  the default is \"-source all -1\"."
  command: "x86_64-linux-gnu-gp-display-src"
  example: "x86_64-linux-gnu-gp-display-src -source item tag"
- id: 1761
  intent: "Specifies a list of archive libraries from which symbols should not be automatically exported.  The library names may be delimited by commas or colons.  Specifying \"--exclude-libs ALL\" excludes symbols in all archive libraries from automatic export.  This option is available only for the i386 PE targeted port of the linker and for ELF targeted ports.  For i386 PE, symbols explicitly listed in a .def file are still exported, regardless of this option.  For ELF targeted ports, symbols affected by this option will be treated as hidden."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --exclude-libs lib,lib,..."
- id: 1762
  intent: "Emulate the emulation linker.  You can list the available emulations with the --verbose or -V options. If the -m option is not used, the emulation is taken from the \"LDEMULATION\" environment variable, if that is defined. Otherwise, the default emulation depends upon how the linker was configured."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld -m emulation"
- id: 1763
  intent: "Omit all symbol information from the output file."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --strip-all"
- id: 1764
  intent: "Delete all local symbols."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --discard-all"
- id: 1765
  intent: "Specify the name of a dynamic list file to the linker.  This is typically used when creating shared libraries to specify a list of global symbols whose references shouldn't be bound to the definition within the shared library, or creating dynamically linked executables to specify a list of symbols which should be added to the symbol table in the executable.  This option is only meaningful on ELF platforms which support shared libraries. The format of the dynamic list is the same as the version node without scope and node name.  See VERSION for more information."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --dynamic-list=dynamic-list-file"
- id: 1766
  intent: "Include all global data symbols to the dynamic list."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --dynamic-list-data"
- id: 1767
  intent: "Provide the builtin dynamic list for C++ operator new and delete. It is mainly useful for building shared libstdc++."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --dynamic-list-cpp-new"
- id: 1768
  intent: "Provide the builtin dynamic list for C++ runtime type identification."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --dynamic-list-cpp-typeinfo"
- id: 1769
  intent: "List all sections removed by garbage collection.  The listing is printed on stderr.  This option is only effective if garbage collection has been enabled via the --gc-sections) option.  The default behaviour (of not listing the sections that are removed) can be restored by specifying --no-print-gc-sections on the command line."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --no-print-gc-sections"
- id: 1770
  intent: "Print used size, total size and used size of memory regions created with the MEMORY command.  This is useful on embedded targets to have a quick view of amount of free memory.  The format of the output has one headline and one line per region.  It is both human readable and easily parsable by tools.  Here is an example of an output: Memory region         Used Size  Region Size  %age Used ROM:        256 KB         1 MB     25.00% RAM:          32 B         2 GB      0.00%"
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --print-memory-usage"
- id: 1771
  intent: "ld normally optimizes for speed over memory usage by caching the symbol tables of input files in memory.  This option tells ld to instead optimize for memory usage, by rereading the symbol tables as necessary.  This may be required if ld runs out of memory space while linking a large executable."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --no-keep-memory"
- id: 1772
  intent: "This option enables linker branch relaxation by inserting branch stub sections when needed to extend the range of branches.  This option is usually not required since C-SKY supports branch and call instructions that can access the full memory range and branch relaxation is normally handled by the compiler or assembler."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --branch-stub"
- id: 1773
  intent: "This option indicates to the linker the name of the memory region in the MEMORY specification that describes the memory bank window. The definition of such region is then used by the linker to compute paging and addresses within the memory window. The following options are supported to control handling of GOT generation when linking for 68K targets."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --bank-window name"
- id: 1774
  intent: "Specifies a list of archive libraries from which symbols should not be automatically exported.  The library names may be delimited by commas or colons.  Specifying \"--exclude-libs ALL\" excludes symbols in all archive libraries from automatic export.  This option is available only for the i386 PE targeted port of the linker and for ELF targeted ports.  For i386 PE, symbols explicitly listed in a .def file are still exported, regardless of this option.  For ELF targeted ports, symbols affected by this option will be treated as hidden."
  command: "x86_64-linux-gnu-ld.bfd"
  example: "x86_64-linux-gnu-ld.bfd --exclude-libs lib,lib,..."
