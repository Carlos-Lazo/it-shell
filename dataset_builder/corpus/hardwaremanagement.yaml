  command: "wget"
  example: "wget --follow-tags=list"
- id: 1678
  intent: "This is the opposite of the --follow-tags option.  To skip certain HTML tags when recursively looking for documents to download, specify them in a comma-separated list. In the past, this option was the best bet for downloading a single page and its requisites, using a command-line like: wget --ignore-tags=a,area -H -k -K -r http://<site>/<document> However, the author of this option came across a page with tags like \"<LINK REL=\"home\" HREF=\"/\">\" and came to the realization that specifying tags to ignore was not enough.  One can't just tell Wget to ignore \"<LINK>\", because then stylesheets will not be downloaded.  Now the best bet for downloading a single page and its requisites is the dedicated --page-requisites option."
  command: "wget"
  example: "wget --ignore-tags=list"
- id: 1679
