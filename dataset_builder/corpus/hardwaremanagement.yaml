- id: 696
  intent: "Supplies warnings to enable  or  disable,  separated  by  comma. Precede a key by a hyphen (-) to disable the specified warning. Supported values for key are: o all: Enables all warnings. o auxiliaryclass:  Warns  about an auxiliary class that's hidden in a source file, and is used from other files. o cast: Warns about the use of unnecessary casts. o classfile: Warns about the issues related  to  classfile  con- tents. o deprecation: Warns about the use of deprecated items. o dep-ann: Warns about the items marked as deprecated in javadoc but without the @Deprecated annotation. o divzero: Warns about the division by the constant integer 0. o empty: Warns about an empty statement after if. o exports: Warns about the issues regarding module exports. o fallthrough: Warns about the falling through from one case  of a switch statement to the next. o finally:  Warns  about  finally  clauses that do not terminate normally. o module: Warns about the module system-related issues. o opens: Warns about the issues related to module opens. o options: Warns about the issues relating  to  use  of  command line options. o overloads: Warns about the issues related to method overloads. o overrides: Warns about the issues related to method overrides. o path:  Warns  about the invalid path elements on the command l ine. o processing: Warns about the issues related to annotation  pro- cessing. o rawtypes: Warns about the use of raw types. o removal:  Warns  about  the use of an API that has been marked for removal. o requires-automatic: Warns developers about the use of automat- ic modules in requires clauses. o requires-transitive-automatic:  Warns  about automatic modules in requires transitive. o serial: Warns about the serializable classes that do not  pro- vide a serial version ID.  Also warns about access to non-pub- lic members from a serializable element. o static: Warns about the accessing a static member using an in- stance. o try:  Warns about the issues relating to the use of try blocks ( that is, try-with-resources). o unchecked: Warns about the unchecked operations. o varargs: Warns about the potentially unsafe vararg methods. o none: Disables all warnings. See Examples of Using -Xlint keys."
  command: "javac"
  example: "javac -Xlint:[-]key(,[-]key)*"
