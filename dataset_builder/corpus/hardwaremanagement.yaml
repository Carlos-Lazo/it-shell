- id: 1166
  intent: "This  option is mainly of historical interest -- it involves use of a patent that is now expired. This option causes the GIF output, and thus pamtogif, not to use LZW  (Lempel-Ziv)  compression.   As a result, the image file is larger and, before the patent expired,  no  royalties  would  be owed  to  the  holder of the patent on LZW.  See the section LI- CENSE below. LZW is a method for combining the information from multiple pix- els  into  a  single GIF code.  With the -nolzw option, pamtogif creates one GIF code per pixel, so it is not doing any  compres- sion  and  not  using LZW.  However, any GIF decoder, whether it uses an LZW decompressor or not, will correctly decode this  un- compressed format.  An LZW decompressor would see this as a par- ticular case of LZW compression. Note that if someone uses an LZW decompressor such as the one in giftopnm  or pretty much any graphics display program to process the output of pamtogif -nolzw , he is then using the LZW patent. But  the  patent holder expressed far less interest in enforcing the patent on decoding than on encoding."
  command: "pamtogif"
  example: "pamtogif -nolzw"
- id: 1167
  intent: "pamtojpeg2k [-imgareatlx=column] [-imgareatly=row] [-tilegrdtlx=column] [-tilegrdtly=row] [-tilewidth=columns] [-tileheight=rows] [-prcwidth=columns] [-prcheight=rows] [-cblkwidth=columns] [-cblkheight=rows] [-mode={integer|int|real}] [-compression=ratio] [-ilyrrates=ratestring] [-numrlvls=number] [-progres- sion={lrcp|rlcp|rpcl|pcrl|cprl}] [-numgbits=number] [-nomct] [-sop] [-eph] [-lazy] [-termall] [-segsym] [-vcausal] [-pterm] [-resetprob] [-verbose] [-debuglevel=number] filename Minimum unique abbreviation of option is acceptable. You may use dou- ble hyphens instead of single hyphen to denote options. You may use white space in place of the equals sign to separate an option name from its value."
