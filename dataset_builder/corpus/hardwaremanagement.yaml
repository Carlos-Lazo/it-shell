- id: 74
  intent: "Generate DWARF2 debugging information for each assembler line. This may help debugging assembler code, if the debugger can handle it.  Note---this option is only supported by some targets, not all of them."
  command: "as"
  example: "as --gdwarf-2"
- id: 75
  intent: "This option is the same as the --gdwarf-2 option, except that it allows for the possibility of the generation of extra debug information as per version 3 of the DWARF specification.  Note - enabling this option does not guarantee the generation of any extra information, the choice to do so is on a per target basis."
  command: "as"
  example: "as --gdwarf-3"
- id: 76
  intent: "This option is the same as the --gdwarf-2 option, except that it allows for the possibility of the generation of extra debug information as per version 4 of the DWARF specification.  Note - enabling this option does not guarantee the generation of any extra information, the choice to do so is on a per target basis."
  command: "as"
  example: "as --gdwarf-4"
- id: 77
  intent: "This option is the same as the --gdwarf-2 option, except that it allows for the possibility of the generation of extra debug information as per version 5 of the DWARF specification.  Note - enabling this option does not guarantee the generation of any extra information, the choice to do so is on a per target basis."
  command: "as"
  example: "as --gdwarf-5"
- id: 78
  intent: "Set the maximum width, in words, of the output data column for an assembler listing to number."
  command: "as"
  example: "as --listing-lhs-width=number"
- id: 79
  intent: "Set the maximum width of an input source line, as displayed in a listing, to number bytes."
  command: "as"
  example: "as --listing-rhs-width=number"
- id: 80
  intent: "Stop the assembler for padding the ends of output sections to the alignment of that section.  The default is to pad the sections, but this can waste space which might be needed on targets which have tight memory constraints."
  command: "as"
  example: "as --no-pad-sections"
- id: 81
  intent: "Ignored.  Supported for compatibility with tools that apss the same option to both the assembler and the linker."
  command: "as"
  example: "as --reduce-memory-overheads"
- id: 82
  intent: "This option specifies the target architecture.  The assembler will issue an error message if an attempt is made to assemble an instruction which will not execute on the target architecture.  The following architecture names are recognized: \"armv8-a\", \"armv8.1-a\", \"armv8.2-a\", \"armv8.3-a\", \"armv8.4-a\" \"armv8.5-a\", \"armv8.6-a\", \"armv8.7-a\", \"armv8.8-a\", \"armv8-r\", \"armv9-a\", \"armv9.1-a\", \"armv9.2-a\", and \"armv9.3-a\". If both -mcpu and -march are specified, the assembler will use the setting for -mcpu.  If neither are specified, the assembler will default to -mcpu=all. The architecture option can be extended with the same instruction set extension options as the -mcpu option.  Unlike -mcpu, extensions are not always enabled by default,"
  command: "as"
  example: "as -march=architecture[+extension...]"
- id: 83
  intent: "These options are ignored for backward compatibility. The following options are available when as is configured for an ARC processor."
  command: "as"
  example: "as -32addr"
- id: 84
  intent: "This option selects the core processor variant."
  command: "as"
  example: "as -mcpu=cpu"
- id: 85
  intent: "Enable Code Density extension instructions. The following options are available when as is configured for the ARM processor family."
  command: "as"
  example: "as -mcode-density"
- id: 86
  intent: "Specify which ARM architecture variant is used by the target."
  command: "as"
  example: "as -march=architecture[+extension...]"
- id: 87
  intent: "Select which Floating Point architecture is the target."
  command: "as"
  example: "as -mfpu=floating-point-format"
- id: 88
  intent: "Turns on CodeComposer Studio assembly syntax compatibility mode."
  command: "as"
  example: "as -mccs"
- id: 89
  intent: "The following options are available when as is configured for the Blackfin processor family."
  command: "as"
  example: "as -k  Specify that PIC code has been generated."
- id: 90
  intent: "Disable -mfdpic. The following options are available when as is configured for the Linux kernel BPF processor family. @chapter BPF Dependent Features Options"
  command: "as"
  example: "as -mnopic"
- id: 91
  intent: "Enable vector DSP instructions. The following options are available when as is configured for an Epiphany processor."
  command: "as"
  example: "as -mvdsp"
- id: 92
  intent: "Select the word size, either 32 bits or 64 bits.  --32 implies Intel i386 architecture, while --x32 and --64 imply AMD x86-64 architecture with 32-bit or 64-bit word-size respectively. These options are only available with the ELF object file format, and require that the necessary BFD support has been included (on a 32-bit platform you have to add --enable-64-bit-bfd to configure enable 64-bit usage and use x86-64 as target platform)."
  command: "as"
  example: "as --32 | --x32 | --64"
- id: 93
  intent: "This option specifies a processor to optimize for. When used in conjunction with the -march option, only instructions of the processor specified by the -march option will be generated. Valid CPU values are identical to the processor list of -march=CPU."
  command: "as"
  example: "as -mtune=CPU"
- id: 94
  intent: "This option specifies instruction syntax when processing instructions.  The \".att_syntax\" and \".intel_syntax\" directives will take precedent."
  command: "as"
  example: "as -msyntax=intel"
- id: 95
  intent: "These options control whether the assembler should generate relax relocations, R_386_GOT32X, in 32-bit mode, or R_X86_64_GOTPCRELX and R_X86_64_REX_GOTPCRELX, in 64-bit mode. -mrelax-relocations=yes will generate relax relocations. -mrelax-relocations=no will not generate relax relocations.  The default can be controlled by a configure option --enable-x86-relax-relocations."
  command: "as"
  example: "as -mrelax-relocations=yes"
- id: 96
  intent: "These options control whether the assembler should generate lfence before indirect near branch instructions. -mlfence-before-indirect-branch=all will generate lfence before indirect near branch via register and issue a warning before indirect near branch via memory.  It also implicitly sets -mlfence-before-ret=shl when there's no explicit -mlfence-before-ret=.  -mlfence-before-indirect-branch=register will generate lfence before indirect near branch via register. -mlfence-before-indirect-branch=memory will issue a warning before indirect near branch via memory. -mlfence-before-indirect-branch=none will not generate lfence nor issue warning, which is the default.  Note that lfence won't be generated before indirect near branch via register with -mlfence-after-load=yes since lfence will be generated after loading branch target register."
  command: "as"
  example: "as -mlfence-before-indirect-branch=memory"
- id: 97
  intent: "Restores the default behaviour, which restricts the permitted instructions to just the basic IP2022 ones. The following options are available when as is configured for the Renesas M32C and M16C processors."
  command: "as"
  example: "as -mip2022"
- id: 98
  intent: "Support H'00 style hex constants in addition to 0x00 style. The following options are available when as is configured for the Renesas M32R (formerly Mitsubishi M32R) series."
  command: "as"
  example: "as -h-tick-hex"
- id: 99
  intent: "The target machine does (or does not) have a memory-management unit coprocessor.  The default is to assume an MMU for 68020 and up. The following options are available when as is configured for an Altera Nios II processor."
  command: "as"
  example: "as -m68851 | -mno-68851"
- id: 100
  intent: "Replace branch instructions not determinable to be in range and all call instructions with \"jmp\" and \"callr\" sequences (respectively). This option generates absolute relocations against the target symbols and is not appropriate for position-independent code."
  command: "as"
  example: "as -relax-all"
- id: 101
  intent: "This option specifies the target architecture.  The assembler issues an error message if an attempt is made to assemble an instruction which will not execute on the target architecture.  The following architecture names are recognized: \"r1\", \"r2\".  The default is \"r1\". The following options are available when as is configured for a PRU processor."
  command: "as"
  example: "as -march=architecture"
- id: 102
  intent: "Generate code for a particular MIPS CPU."
