- id: 596
  intent: "Set the list of personal compression preferences to string.  Use gpg  --version  to  get  a list of available algorithms, and use none to set no preference at  all.   This  allows  the  user  to safely  override the algorithm chosen by the recipient key pref- erences, as GPG will only select an algorithm that is usable  by all recipients.  The most highly ranked compression algorithm in this list is also used when there are no recipient keys to  con- sider (e.g. --symmetric)."
  command: "gpg"
  example: "gpg --personal-compress-preferences string"
