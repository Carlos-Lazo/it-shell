- id: 1170
  intent: "widths you allow.  pamtotiff chooses the smallest width you allow  that allows it to index the entire color table.  If you don't allow any such width, pamtotiff fails.  Normally, the only useful value for  this  op- tion  is  1,2,4,8, because a program either understands the 8 bit width (default) or understands them all. In a Baseline TIFF image, according to the 1992 TIFF 6.0 specification, 4  and 8 are the only valid widths.  There are no formal standards that allow any other values. This option was added in June 2002.  Before that, only  8  bit  indices were possible. Extra Tags There are lots of tag types in the TIFF format that don't correspond to any information in the PNM format or  to  anything  in  the  conversion process.   For  example, a TIFF_ARTIST tag names the artist who created the image. You can tell pamtotiff explicitly to include tags such as this  in  its output with the -tag option.  You identify a list of tag types and val- ues and pamtotiff includes a tag in the output for each  item  in  your list. The value of -tag is the list of tags, like this example: -tag=subfiletype=reducedimage,documentname=Fred,xposition=25 As  you  see,  it  is a list of tag specifications separated by commas. Each tag specification is a name and a  value  separated  by  an  equal sign.   The  name  is the name of the tag type, except in arbitrary up- per/lower case.  One place to see the names of TIFF tag types is in the TIFF  library's  tiff.h  file,  where there is a macro defined for each consisting of \"TIFF_\" plus the name.   E.g.  for  the  SUBFILETYPE  tag type, there is a macro TIFF_SUBFILETYPE. The  format of the value specification for a tag (stuff after the equal sign) depends upon what kind of value the tag type has: o      Integer: a decimal number o      Floating point number: a decimal number o      String: a string o      Enumerated (For example, a 'subfiletype' tag takes an enumerated value.   Its possible values are REDUCEDIMAGE, PAGE, and MASK.): The name of the value.  You can see the possible value names  in the  TIFF  library's tiff.h file, where there is a macro defined for each consisting of a qualifier plus the  value  name.   E.g. for  the  REDUCEDIMAGE  value  of a SUBFILETYPE tag, you see the macro FILETYPE_REDUCEDIMAGE. The TIFF format assigns a unique number to each enumerated value and  you can specify that number, in decimal, as an alternative. This is useful if you are using an extension of TIFF that pamto- tiff doesn't know about. If you specify a tag type with -tag that is not independent of the con- tent of your PNM source image and pamtotiff's conversion process  (i.e. a tag type in which pamtotiff is interested), pamtotiff fails.  For ex- ample, you cannot specify an IMAGEWIDTH tag with -tag,  because  pamto- tiff generates an IMAGEWIDTH tag that gives the actual width of the im- age."
  command: "pamtotiff"
  example: "pamtotiff -indexbits  option.   The  value  is  a comma-separated list of the bit"
