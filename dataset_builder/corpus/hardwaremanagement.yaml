- id: 492
  intent: "Set list of entries to show. Entries are specified according to the following syntax. section_entries contains a list of section entries separated by \":\". Each section entry is composed by a section name (or unique name), optionally followed by a list of entries local to that section, separated by \",\". If section name is specified but is followed by no \"=\", all entries are printed to output, together with all the contained sections. Otherwise only the entries specified in the local section entries list are printed. In particular, if \"=\" is specified but the list of local entries is empty, then no entries will be shown for that section. Note that the order of specification of the local section entries is not honored in the output, and the usual display order will be retained. The formal syntax is given by: <LOCAL_SECTION_ENTRIES> ::= <SECTION_ENTRY_NAME>[,<LOCAL_SECTION_ENTRIES>] <SECTION_ENTRY>         ::= <SECTION_NAME>[=[<LOCAL_SECTION_ENTRIES>]] <SECTION_ENTRIES>       ::= <SECTION_ENTRY>[:<SECTION_ENTRIES>] For example, to show only the index and type of each stream, and the PTS time, duration time, and stream index of the packets, you can specify the argument: packet=pts_time,duration_time,stream_index : stream=index,codec_type To show all the entries in the section \"format\", but only the codec type in the section \"stream\", specify the argument: format : stream=codec_type To show all the tags in the stream and format sections: stream_tags : format_tags To show only the \"title\" tag (if available) in the stream sections: stream_tags=title"
  command: "ffprobe"
  example: "ffprobe -show_entries section_entries"
- id: 493
  intent: "Show logging information from the decoder about each frame according to the value set in loglevel, (see \"-loglevel\"). This option requires \"-show_frames\". The information for each log message is printed within a dedicated section with name \"LOG\"."
  command: "ffprobe"
