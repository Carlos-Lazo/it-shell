  intent: "Print the list of devices which will be triggered."
  command: "udevadm"
  example: "udevadm -v, --verbose"
- id: 1589
  intent: "Trigger a specific type of devices. Valid types are \"all\", \"devices\", and \"subsystems\". The default value is \"devices\"."
  command: "udevadm"
  example: "udevadm -t, --type=TYPE"
- id: 1590
  intent: "Takes a comma separated list of subsystems. When triggering events for devices, the devices from the specified subsystems and their parents are triggered first. For example, if --prioritized-subsystem=block,net, then firstly all block devices and their parents are triggered, in the next all network devices and their parents are triggered, and lastly the other devices are triggered. This option can be specified multiple times, and in that case the lists of the subsystems will be merged. That is, --prioritized-subsystem=block --prioritized-subsystem=net is equivalent to --prioritized-subsystem=block,net."
  command: "udevadm"
  example: "udevadm --prioritized-subsystem=SUBSYSTEM[,SUBSYSTEM...]"
- id: 1591
  intent: "Trigger events for devices which belong to a matching subsystem. This option supports shell style pattern matching. When this option is specified more than once, then each matching result is ORed, that is, all the devices in each subsystem are triggered."
  command: "udevadm"
  example: "udevadm -s, --subsystem-match=SUBSYSTEM"
- id: 1592
  intent: "Do not trigger events for devices which belong to a matching subsystem. This option supports shell style pattern matching. When this option is specified more than once, then each matching result is ANDed, that is, devices which do not match all specified subsystems are triggered."
  command: "udevadm"
  example: "udevadm -S, --subsystem-nomatch=SUBSYSTEM"
- id: 1593
  intent: "Trigger events for devices with a matching sysfs attribute. If a value is specified along with the attribute name, the content of the attribute is matched against the given value using shell style pattern matching. If no value is specified, the existence of the sysfs attribute is checked. When this option is specified multiple times, then each matching result is ANDed, that is, only devices which have all specified attributes are triggered."
  command: "udevadm"
  example: "udevadm -a, --attr-match=ATTRIBUTE=VALUE"
- id: 1594
  intent: "Trigger events for devices with a matching property value. This option supports shell style pattern matching. When this option is specified more than once, then each matching result is ORed, that is, devices which have one of the specified properties are triggered."
  command: "udevadm"
  example: "udevadm -p, --property-match=PROPERTY=VALUE"
- id: 1595
  intent: "Trigger events for devices with a matching tag. When this option is specified multiple times, then each matching result is ANDed, that is, devices which have all specified tags are triggered."
  command: "udevadm"
  example: "udevadm -g, --tag-match=TAG"
- id: 1596
  intent: "Trigger events for devices for which the last component (i.e. the filename) of the /sys/ path matches the specified PATH. This option supports shell style pattern matching. When this option is specified more than once, then each matching result is ORed, that is, all devices which have any of the specified NAME are triggered."
  command: "udevadm"
  example: "udevadm -y, --sysname-match=NAME"
- id: 1597
  intent: "Trigger events for devices with a matching device path. When this option is specified more than once, then each matching result is ORed, that is, all specified devices are triggered."
  command: "udevadm"
  example: "udevadm --name-match=NAME"
- id: 1598
  intent: "When --initialized-match is specified, trigger events for devices that are already initialized by systemd-udevd, and skip devices that are not initialized yet. When --initialized-nomatch is specified, trigger events for devices that are not initialized by systemd-udevd yet, and skip devices that are already initialized. Typically, it is essential that applications which intend to use such a match, make sure a suitable udev rule is installed that sets at least one property on devices that shall be matched. See also Initialized Devices section below for more details. WARNING: --initialized-nomatch can potentially save a significant amount of time compared to re-triggering all devices in the system and e.g. can be used to optimize boot time. However, this is not safe to be used in a boot sequence in general. Especially, when udev rules for a device depend on its parent devices (e.g.  \"ATTRS\" or \"IMPORT{parent}\" keys, see udev(7) for more details), the final state of the device becomes easily unstable with this option."
  command: "udevadm"
  example: "udevadm --initialized-match, --initialized-nomatch"
- id: 1599
  intent: "Apart from triggering events, also waits for those events to finish. Note that this is different from calling udevadm settle. udevadm settle waits for all events to finish. This option only waits for events triggered by the same command to finish."
  command: "udevadm"
  example: "udevadm -w, --settle"
- id: 1600
  intent: "Print the udev event after the rule processing."
  command: "udevadm"
  example: "udevadm -u, --udev"
- id: 1601
  intent: "Filter udev events by tag. Only udev events with a given tag attached will pass. When this option is specified more than once, then each matching result is ORed, that is, devices which have one of the specified tags are monitored."
  command: "udevadm"
  example: "udevadm -t, --tag-match=string"
- id: 1602
  intent: "Print a short help text and exit. udevadm wait [options] [device|syspath] ... Wait for devices or device symlinks being created and initialized by systemd-udevd. Each device path must start with \"/dev/\" or \"/sys/\", e.g.  \"/dev/sda\", \"/dev/disk/by-path/pci-0000:3c:00.0-nvme-1-part1\", \"/sys/devices/pci0000:00/0000:00:1f.6/net/eth0\", or \"/sys/class/net/eth0\". This can take multiple devices. This may be useful for waiting for devices being processed by systemd-udevd after e.g. partitioning or formatting the devices."
  command: "udevadm"
  example: "udevadm -h, --help"
- id: 1603
  intent: "Check if systemd-udevd initialized devices. Defaults to true. When false, the command only checks if the specified devices exist. Set false to this setting if there is no udev rules for the specified devices, as the devices will never be considered as initialized in that case. See Initialized Devices section below for more details."
  command: "udevadm"
  example: "udevadm --initialized=BOOL"
- id: 1604
  intent: "When specified, the command wait for devices being removed instead of created or initialized. If this is specified, --initialized= will be ignored."
  command: "udevadm"
  example: "udevadm --removed"
- id: 1605
  intent: "Print a short help text and exit. udevadm lock [options] [command] ... udevadm lock takes an (advisory) exclusive lock on a block device (or all specified devices), as per Locking Block Device Access[1] and invokes a program with the locks taken. When the invoked program exits the locks are automatically released and its return value is propagated as exit code of udevadm lock. This tool is in particular useful to ensure that systemd- udevd.service(8) does not probe a block device while changes are made to it, for example partitions created or file systems formatted. Note that many tools that interface with block devices natively support taking relevant locks, see for example sfdisk(8)'s --lock switch. The command expects at least one block device specified via --device= or --backing=, and a command line to execute as arguments."
  command: "udevadm"
  example: "udevadm -h, --help"
- id: 1606
  intent: "Instead of locking the specified devices and executing a command, just print the device paths that would be locked, and execute no command. This command is useful to determine the \"whole\" block device in case a partition block device is specified. The devices will be sorted by their device node major number as primary ordering key and the minor number as secondary ordering key (i.e. they are shown in the order they'd be locked). Note that the number of lines printed here can be less than the the number of --device= and --backing= switches specified in case these resolve to the same \"whole\" devices."
  command: "udevadm"
  example: "udevadm --print, -p"
- id: 1607
  intent: "All of the filesystems described in /proc/self/mountinfo (or in deprecated /etc/mtab) are unmounted, except the proc, devfs, devpts, sysfs, rpc_pipefs and nfsd filesystems. This list of the filesystems may be replaced by --types umount option."
