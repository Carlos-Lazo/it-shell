  command: "alsabat"
  example: "alsabat"
- id: 25
  intent: "Recognized sample formats are: U8 S16_LE S24_3LE S32_LE Some of these may not be available on selected hardware The available format shortcuts are: -f cd (16 bit little endian, 44100, stereo) [-f S16_LE -c2 -r44100] -f dat (16 bit little endian, 48000, stereo) [-f S16_LE -c2 -r48000] If no format is given S16_LE is used."
  command: "alsabat"
  example: "alsabat -f     Sample format"
- id: 26
  intent: "Add support for standalone mode where ALSABAT will run on a dif- ferent machine to the one being tested.  In standalone mode, the sound data can be generated, playback and captured just like  in normal  mode, but will not be analyzed.  The ALSABAT being built without libfftw3 support is  always  in  standalone  mode.   The ALSABAT  in  normal mode can also bypass data analysis using op- tion \"--standalone\"."
  command: "alsabat"
  example: "alsabat --standalone"
