- id: 1520
  intent: "Enroll a TPM2 security chip. Expects a device node path referring to the TPM2 chip (e.g.  /dev/tpmrm0). Alternatively the special value \"auto\" may be specified, in order to automatically determine the device node of a currently discovered TPM2 device (of which there must be exactly one). The special value \"list\" may be used to enumerate all suitable TPM2 devices currently discovered. In order to unlock a LUKS2 volume with an enrolled TPM2 security chip, specify the tpm2-device= option in the respective /etc/crypttab line: myvolume /dev/sda1 - tpm2-device=auto See crypttab(5) for a more comprehensive example of a systemd-cryptenroll invocation and its matching /etc/crypttab line. Use --tpm2-pcrs= (see below) to configure which TPM2 PCR indexes to bind the enrollment to."
  command: "systemd-cryptenroll"
  example: "systemd-cryptenroll --tpm2-device=PATH"
- id: 1521
  intent: "Configures the TPM2 PCRs (Platform Configuration Registers) to bind the enrollment requested via --tpm2-device= to. Takes a \"+\" separated list of numeric PCR indexes in the range 0...23. If not used, defaults to PCR 7 only. If an empty string is specified, binds the enrollment to no PCRs at all. PCRs allow binding the enrollment to specific software versions and system state, so that the enrolled unlocking key is only accessible (may be \"unsealed\") if specific trusted software and/or configuration is used. Table 1. Well-known PCR Definitions +----+----------------------------+ |PCR | Explanation                | +----+----------------------------+ |0   | Core system firmware       | |    | executable code; changes   | |    | on firmware updates        | +----+----------------------------+ |1   | Core system firmware       | |    | data/host platform         | |    | configuration; typically   | |    | contains serial and model  | |    | numbers, changes on basic  | |    | hardware/CPU/RAM           | |    | replacements               | +----+----------------------------+ |2   | Extended or pluggable      | |    | executable code; includes  | |    | option ROMs on pluggable   | |    | hardware                   | +----+----------------------------+ |3   | Extended or pluggable      | |    | firmware data; includes    | |    | information about          | |    | pluggable hardware         | +----+----------------------------+ |4   | Boot loader and additional | |    | drivers; changes on boot   | |    | loader updates. The shim   | |    | project will measure the   | |    | PE binary it chain loads   | |    | into this PCR. If the      | |    | Linux kernel is invoked as | |    | UEFI PE binary, it is      | |    | measured here, too. sd-    | |    | stub(7) measures system    | |    | extension images read from | |    | the ESP here too (see      | |    | systemd-sysext(8)).        | +----+----------------------------+ |5   | GPT/Partition table;       | |    | changes when the           | |    | partitions are added,      | |    | modified or removed        | +----+----------------------------+ |6   | Power state events;        | |    | changes on system          | |    | suspend/sleep              | +----+----------------------------+ |7   | Secure boot state; changes | |    | when UEFI SecureBoot mode  | |    | is enabled/disabled, or    | |    | firmware certificates (PK, | |    | KEK, db, dbx, ...)         | |    | changes. The shim project  | |    | will measure most of its   | |    | (non-MOK) certificates and | |    | SBAT data into this PCR.   | +----+----------------------------+ |9   | The Linux kernel measures  | |    | all initrds it receives    | |    | into this PCR.             | +----+----------------------------+ |10  | The IMA project measures   | |    | its runtime state into     | |    | this PCR.                  | +----+----------------------------+ |11  | systemd-stub(7) measures   | |    | the ELF kernel image,      | |    | embedded initrd and other  | |    | payload of the PE image it | |    | is placed in into this     | |    | PCR. Unlike PCR 4 (where   | |    | the same data should be    | |    | measured into), this PCR   | |    | value should be easy to    | |    | pre-calculate, as this     | |    | only contains static parts | |    | of the PE binary. Use this | |    | PCR to bind TPM policies   | |    | to a specific kernel       | |    | image, possibly with an    | |    | embedded initrd. systemd-  | |    | pcrphase.service(8)        | |    | measures boot phase        | |    | strings into this PCR at   | |    | various milestones of the  | |    | boot process.              | +----+----------------------------+ |12  | systemd-boot(7) measures   | |    | any specified kernel       | |    | command line into this     | |    | PCR. systemd-stub(7)       | |    | measures any manually      | |    | specified kernel command   | |    | line (i.e. a kernel        | |    | command line that          | |    | overrides the one embedded | |    | in the unified PE image)   | |    | and loaded credentials     | |    | into this PCR. (Note that  | |    | if systemd-boot and        | |    | systemd-stub are used in   | |    | combination the command    | |    | line might be measured     | |    | twice!)                    | +----+----------------------------+ |13  | systemd-stub(7) measures   | |    | any systemd-sysext(8)      | |    | images it loads and passed | |    | to the booted kernel into  | |    | this PCR.                  | +----+----------------------------+ |14  | The shim project measures  | |    | its \"MOK\" certificates and | |    | hashes into this PCR.      | +----+----------------------------+ For most applications it should be sufficient to bind against PCR 7 (and possibly PCR 14, if shim/MOK is desired), as this includes measurements of the trusted certificates (and possibly hashes) that are used to validate all components of the boot process up to and including the OS kernel. In order to simplify firmware and OS version updates it's typically not advisable to include PCRs such as 0 and 2 in the binding of the enrollment, since the program code they cover should already be protected indirectly through the certificates measured into PCR 7. Validation through these certificates is typically preferable over validation through direct measurements as it is less brittle in context of OS/firmware updates: the measurements will change on every update, but code signatures likely will validate against pre-existing certificates."
  command: "systemd-cryptenroll"
  example: "systemd-cryptenroll --tpm2-pcrs= [PCR...]"
