  intent: "By default, when data is read from a pipe, buffers are allocated automatically as needed.  If a large amount of data is read from the pipe, this can cause a large amount of memory  to  be  allo- cated.  The -B option disables this automatic allocation of buf- fers for pipes, so that only 64 KB (or the amount of space spec- ified  by  the -b option) is used for the pipe.  Warning: use of -B can result in erroneous display, since only the most recently viewed  part  of  the  piped data is kept in memory; any earlier data is lost."
  command: "pager"
  example: "pager -B or --auto-buffers"
- id: 1146
  intent: "The -t option, followed immediately by a TAG, will edit the file containing  that tag.  For this to work, tag information must be available; for example, there may be a file in the  current  di- rectory called \"tags\", which was previously built by ctags(1) or an equivalent command.  If the environment variable LESSGLOBALT- AGS  is  set, it is taken to be the name of a command compatible with global(1), and that command is executed to  find  the  tag. (See  http://www.gnu.org/software/global/global.html).   The  -t option may also be specified from within less (using the -  com- mand)  as  a  way  of examining a new file.  The command \":t\" is equivalent to specifying -t from within less."
  command: "pager"
  example: "pager -ttag or --tag=tag"
