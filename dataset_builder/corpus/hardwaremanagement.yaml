- id: 1615
  intent: "Select  a compression preset level.  The default is -6.  If mul- tiple preset levels are specified, the last  one  takes  effect. If  a  custom filter chain was already specified, setting a com- pression preset level clears the custom filter chain. The differences between the presets are  more  significant  than with  gzip(1)  and  bzip2(1).  The selected compression settings determine the memory requirements of the decompressor, thus  us- ing  a too high preset level might make it painful to decompress the file on an old system with little RAM.   Specifically,  it's not  a  good idea to blindly use -9 for everything like it often is with gzip(1) and bzip2(1). -0 ... -3 These are somewhat fast presets.  -0 is sometimes  faster than  gzip  -9 while compressing much better.  The higher ones often have speed comparable to bzip2(1) with  compa- rable  or  better compression ratio, although the results depend a lot on the type of data being compressed. -4 ... -6 Good to very good compression while keeping  decompressor memory  usage reasonable even for old systems.  -6 is the default, which is usually a good choice for  distributing files that need to be decompressible even on systems with only 16 MiB RAM.  (-5e or -6e may  be  worth  considering too.  See --extreme.) -7 ... -9 These  are  like -6 but with higher compressor and decom- pressor memory requirements.  These are useful only  when compressing  files bigger than 8 MiB, 16 MiB, and 32 MiB, respectively. On the same hardware, the decompression speed is approximately a constant  number  of  bytes  of  compressed data per second.  In other words, the better the compression, the faster  the  decom- pression  will  usually  be.  This also means that the amount of uncompressed output produced per second can vary a lot. The following table summarises the features of the presets: Preset   DictSize   CompCPU   CompMem   DecMem -0     256 KiB       0        3 MiB    1 MiB -1       1 MiB       1        9 MiB    2 MiB -2       2 MiB       2       17 MiB    3 MiB -3       4 MiB       3       32 MiB    5 MiB -4       4 MiB       4       48 MiB    5 MiB -5       8 MiB       5       94 MiB    9 MiB -6       8 MiB       6       94 MiB    9 MiB -7      16 MiB       6      186 MiB   17 MiB -8      32 MiB       6      370 MiB   33 MiB -9      64 MiB       6      674 MiB   65 MiB Column descriptions: o  DictSize is the LZMA2 dictionary size.  It is waste of memory to  use a dictionary bigger than the size of the uncompressed file.  This is why it is good to avoid using the  presets  -7 ...  -9 when there's no real need for them.  At -6 and lower, the amount of memory wasted is usually low enough to not mat- ter. o  CompCPU  is a simplified representation of the LZMA2 settings that affect compression speed.  The dictionary  size  affects speed too, so while CompCPU is the same for levels -6 ... -9, higher levels still tend to be a little slower.  To get  even slower and thus possibly better compression, see --extreme. o  CompMem  contains  the  compressor memory requirements in the single-threaded mode.  It may vary slightly between  xz  ver- sions.   Memory  requirements  of  some  of the future multi- threaded modes may be dramatically higher than  that  of  the single-threaded mode. o  DecMem  contains  the decompressor memory requirements.  That is, the compression settings determine  the  memory  require- ments of the decompressor.  The exact decompressor memory us- age is slightly more than the LZMA2 dictionary size, but  the values  in  the  table  have been rounded up to the next full MiB."
  command: "unlzma"
  example: "unlzma -0 ... -9"
