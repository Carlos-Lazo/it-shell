- id: 401
  intent: "Print a list of all valid tag names (-list), all writable tag names (-listw), all supported file extensions (-listf), all recognized file extensions (-listr), all writable file extensions (-listwf), all tag groups [in a specified family] (-listg[NUM]), all deletable tag groups (-listd), or an XML database of tag details including language translations (-listx).  The -list, -listw and -listx options may be followed by an additional argument of the form \"-GROUP:All\" to list only tags in a specific group, where \"GROUP\" is one or more family 0-2 group names (excepting EXIF IFD groups) separated by colons.  With -listg, NUM may be given to specify the group family, otherwise family 0 is assumed.  The -l option may be combined with -listf, -listr or -listwf to add file descriptions to the list.  The -lang option may be combined with -listx to output descriptions in a single language.  Here are some examples: -list               # list all tag names -list -EXIF:All     # list all EXIF tags -list -xmp:time:all # list all XMP tags relating to time -listw -XMP-dc:All  # list all writable XMP-dc tags -listf              # list all supported file extensions -listr              # list all recognized file extensions -listwf             # list all writable file extensions -listg1             # list all groups in family 1 -listd              # list all deletable groups -listx -EXIF:All    # list database of EXIF tags in XML format -listx -XMP:All -s  # list short XML database of XMP tags When combined with -listx, the -s option shortens the output by omitting the descriptions and values (as in the last example above), and -f adds 'flags' and 'struct' attributes if applicable. The flags are formatted as a comma-separated list of the following possible values: Avoid, Binary, List, Mandatory, Permanent, Protected, Unknown and Unsafe (see the Tag Name documentation). For XMP List tags, the list type (Alt, Bag or Seq) is added to the flags, and flattened structure tags are indicated by a Flattened flag with 'struct' giving the ID of the parent structure. Note that none of the -list options require an input FILE."
  command: "exiftool"
  example: "exiftool -list, -listw, -listf, -listr, -listwf, -listg[NUM], -listd, -listx"
