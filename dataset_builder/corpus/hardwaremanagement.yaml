  intent: "Use the specified reporter. Defaults to 'base' when  colors  are in use, or 'tap' when colors are disabled. In addition to the built-in reporters provided by the treport  and tap-mocha-reporter modules, the reporter option can also specify a command-line program or a module to load via  re- quire(). Command-line programs receive the raw TAP output on their stdin. Modules loaded via require() must export either a writable  stream  class or a React.Component subclass.  Writable streams are instantiated and piped into.  React  components  are rendered using Ink, with tap={tap} as their only property. Available built-in reporters: classic doc dot dump json jsonstream  landing  list markdown min nyan progress silent spec tap xunit"
