  intent: "For list-type tags, this causes only the item with the specified index to be extracted.  INDEX is 0 for the first item in the list. Negative indices may also be used to reference items from the end of the list.  Has no effect on single-valued tags.  Also applies to tag values when copying from a tag, and in -if conditions."
  command: "exiftool"
  example: "exiftool -listItem INDEX"
- id: 398
  intent: "Specify separator string for items in list-type tags.  When reading, the default is to join list items with \", \".  When writing, this option causes values assigned to list-type tags to be split into individual items at each substring matching STR (otherwise they are not split by default).  Space characters in STR match zero or more whitespace characters in the value. Note that an empty separator (\"\") is allowed, and will join items with no separator when reading, or split the value into individual characters when writing. For pure binary output (-b used without -j, -php or -X), the first -sep option specifies a list-item separator, and a second -sep option specifies a terminator for the end of the list (or after each value if not a list).  In these strings, \"\\n\", \"\\r\" and \"\\t\" may be used to represent a newline, carriage return and tab respectively.  By default, binary list items are separated by a newline, and no terminator is added."
  command: "exiftool"
  example: "exiftool -sep STR (-separator)"
- id: 399
  intent: "Output a tab-delimited list of description/values (useful for database import).  May be combined with -s to print tag names instead of descriptions, or -S to print tag values only, tab- delimited on a single line.  The -t option may be combined with -j, -php or -X to add tag table information (\"table\", tag \"id\", and \"index\" for cases where multiple conditional tags exist with the same ID)."
  command: "exiftool"
  example: "exiftool -t (-tab)"
- id: 400
  intent: "Extract values of unknown tags.  Add another -u to also extract unknown information from binary data blocks.  This option applies to tags with numerical tag ID's, and causes tag names like \"Exif_0xc5d9\" to be generated for unknown information.  It has no effect on information types which have human-readable tag ID's (such as XMP), since unknown tags are extracted automatically from these formats."
  command: "exiftool"
