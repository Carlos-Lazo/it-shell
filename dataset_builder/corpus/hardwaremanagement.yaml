- id: 1168
  intent: "This option specifies how red, green, and blue component  values of a pixel specify a particular color, by telling the chromatic- ities of those 3 primary illuminants and  of  white  (i.e.  full strength of all three). The  chroma_list  value  is a blank-separated list of 8 floating point decimal numbers.  The CIE-1931 X and Y chromaticities  (in that  order) of each of white, red, green, and blue, in that or- der. This information goes into the PNG's cHRM chunk. In a shell command, make sure you use quotation  marks  so  that the blanks in chroma_list don't make the shell see multiple com- mand arguments."
  command: "pamtopng"
  example: "pamtopng -chroma=chroma_list"
