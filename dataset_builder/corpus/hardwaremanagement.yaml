  intent: "This  is  a  space  or comma delimited string that gives options used when listing keys and  signatures  (that  is,  --list-keys, --check-signatures,  --list-public-keys, --list-secret-keys, and the --edit-key functions).  Options can be prepended with a  no- (after  the  two  dashes) to give the opposite meaning.  The op- tions are: show-photos Causes  --list-keys,  --check-signatures,  --list-public- keys, and --list-secret-keys to display any photo IDs at- tached to the key.  Defaults to  no.  See  also  --photo- viewer.   Does  not work with --with-colons: see --attri- bute-fd for the appropriate way to  get  photo  data  for scripts and other frontends. show-usage Show  usage information for keys and subkeys in the stan- dard key listing.  This is a list of  letters  indicating the  allowed  usage  for  a key (E=encryption, S=signing, C=certification, A=authentication).  Defaults to yes. show-policy-urls Show policy URLs  in  the   --check-signatures  listings. Defaults to no. show-notations show-std-notations show-user-notations Show  all, IETF standard, or user-defined signature nota- tions in the --check-signatures listings. Defaults to no. show-keyserver-urls Show any preferred keyserver URL  in  the  --check-signa- tures listings. Defaults to no. show-uid-validity Display  the  calculated  validity of user IDs during key listings.  Defaults to yes. show-unusable-uids Show revoked and expired user IDs in  key  listings.  De- faults to no. show-unusable-subkeys Show  revoked  and  expired  subkeys in key listings. De- faults to no. show-keyring Display the keyring name at the head of key  listings  to show  which  keyring  a given key resides on. Defaults to no. show-sig-expire Show signature expiration dates (if any) during  --check- signatures listings. Defaults to no. show-sig-subpackets Include signature subpackets in the key listing. This op- tion can take an optional argument list of the subpackets to  list.  If no argument is passed, list all subpackets. Defaults to no. This option is only meaningful when using --with-colons along with --check-signatures. show-only-fpr-mbox For  each  user-id  which  has a valid mail address print only the fingerprint followed by the mail address."
  command: "gpg"
  example: "gpg --list-options parameters"
- id: 590
  intent: "Set compression level to n for the ZIP and ZLIB compression  al- gorithms. The default is to use the default compression level of zlib (normally 6). --bzip2-compress-level sets  the  compression level  for  the  BZIP2 compression algorithm (defaulting to 6 as well). This is a different option  from  --compress-level  since BZIP2  uses  a  significant amount of memory for each additional compression level.  -z sets both. A value of 0  for  n  disables compression."
  command: "gpg"
  example: "gpg --bzip2-compress-level n"
