- id: 233
  intent: "(TLS) Tells curl to verify the status of the server  certificate by using the Certificate Status Request (aka. OCSP stapling) TLS extension. If this option is enabled and the server sends an invalid  (e.g. expired) response, if the response suggests that the server cer- tificate has been revoked, or no response at  all  is  received, the verification fails. This  is  currently  only implemented in the OpenSSL, GnuTLS and NSS backends. Providing --cert-status multiple  times  has  no  extra  effect. Disable it again with --no-cert-status. Example: curl --cert-status https://example.com See also --pinnedpubkey. Added in 7.41.0."
  command: "curl"
  example: "curl --cert-status"
- id: 234
  intent: "(TLS) Specifies which ciphers to use in the connection. The list of  ciphers  must  specify  valid ciphers. Read up on SSL cipher list details on this URL: https://curl.se/docs/ssl-ciphers.html If --ciphers is provided several times, the last set value  will be used. Example: curl --ciphers ECDHE-ECDSA-AES256-CCM8 https://example.com See also --tlsv1.3."
  command: "curl"
  example: "curl --ciphers <list of ciphers>"
- id: 235
  intent: "(TLS)  Tells  curl  to request specific curves to use during SSL session establishment according to RFC 8422, 5.1.  Multiple  al- gorithms  can  be  provided  by  separating  them with \":\" (e.g. \"X25519:P-521\").  The parameter is available identically in  the \"openssl s_client/s_server\" utilities. --curves  allows  a OpenSSL powered curl to make SSL-connections with exactly the (EC) curve requested by  the  client,  avoiding nontransparent client/server negotiations. If  this  option  is  set,  the  default  curves list built into openssl will be ignored. If --curves is provided several times, the last set  value  will be used. Example: curl --curves X25519 https://example.com See also --ciphers. Added in 7.73.0."
  command: "curl"
  example: "curl --curves <algorithm list>"
- id: 236
  intent: "(FTP)  Sets the CCC mode. The passive mode will not initiate the shutdown, but instead wait for the server to do it, and will not reply to the shutdown from the server. The active mode initiates the shutdown and waits for a reply from the server. Providing --ftp-ssl-ccc-mode multiple times has no extra effect. Disable it again with --no-ftp-ssl-ccc-mode. Example: curl --ftp-ssl-ccc-mode active --ftp-ssl-ccc ftps://example.com/ See also --ftp-ssl-ccc."
  command: "curl"
  example: "curl --ftp-ssl-ccc-mode <active/passive>"
- id: 237
  intent: "Usage  help.  This  lists all commands of the <category>.  If no arg was provided, curl will display the most  important  command line  arguments.   If the argument \"all\" was provided, curl will display all options available.  If the argument  \"category\"  was provided, curl will display all categories and their meanings. Example: curl --help all See also -v, --verbose."
  command: "curl"
  example: "curl -h, --help <category>"
- id: 238
  intent: "Comma-separated  list  of hosts for which not to use a proxy, if one is specified. The only wildcard is  a  single  *  character, which  matches  all  hosts,  and effectively disables the proxy. Each name in this list is matched as either a domain which  con- tains  the  hostname,  or  the hostname itself. For example, lo- cal.com would match local.com, local.com:80, and  www.local.com, but not www.notlocal.com. Since  7.53.0,  This  option overrides the environment variables that disable the proxy ('no_proxy' and 'NO_PROXY').  If  there's an  environment  variable disabling a proxy, you can set the no- proxy list to \"\" to override it. Since 7.86.0, IP addresses specified to this option can be  pro- vided  using  CIDR notation: an appended slash and number speci- fies the number of \"network bits\" out of the address to  use  in the comparison. For example \"192.168.0.0/16\" would match all ad- dresses starting with \"192.168\". If --noproxy is provided several times, the last set value  will be used. Example: curl --noproxy \"www.example\" https://example.com See also -x, --proxy."
  command: "curl"
  example: "curl --noproxy <no-proxy-list>"
- id: 239
  intent: "Same as --ssl-auto-client-cert but used in HTTPS proxy context. Providing --proxy-ssl-auto-client-cert multiple times has no ex- tra  effect.   Disable it again with --no-proxy-ssl-auto-client- cert. Example: curl --proxy-ssl-auto-client-cert -x https://proxy https://example.com See  also  --ssl-auto-client-cert  and  -x,  --proxy.  Added  in 7.77.0."
  command: "curl"
  example: "curl --proxy-ssl-auto-client-cert"
- id: 240
  intent: "Tell  libcurl  to automatically locate and use a client certifi- cate for authentication, when requested by the server. This  op- tion  is only supported for Schannel (the native Windows SSL li- brary). Prior to 7.77.0 this was the default behavior in libcurl with Schannel. Since the server can request any certificate that supports client authentication in the OS  certificate  store  it could be a privacy violation and unexpected. Providing --ssl-auto-client-cert multiple times has no extra ef- fect.  Disable it again with --no-ssl-auto-client-cert. Example: curl --ssl-auto-client-cert https://example.com See also --proxy-ssl-auto-client-cert. Added in 7.77.0."
  command: "curl"
  example: "curl --ssl-auto-client-cert"
