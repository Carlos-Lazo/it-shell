  intent: "Set  the list of personal cipher preferences to string.  Use gpg --version to get a list of available algorithms, and use none to set  no preference at all.  This allows the user to safely over- ride the algorithm chosen by the recipient key  preferences,  as GPG  will only select an algorithm that is usable by all recipi- ents.  The most highly ranked cipher in this list is  also  used for the --symmetric encryption command."
  command: "gpg"
