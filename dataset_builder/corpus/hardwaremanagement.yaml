- id: 1259
  intent: "This option determines the density (aka resolution)  information recorded  in  the  JFIF  output  image.   It does not affect the raster in any way; it just tells whoever reads the JFIF  how  to interpret the raster. The  density  value  takes  the form xxy followed by an optional unit specifier of dpi or dpcm.  Examples: 1x1, 3x2,  300x300dpi, 100x200dpcm.   The  first  number is the horizontal density; the 2nd number is the vertical density.  Each  may  be  any  integer from 1 to 65535.  The unit specifier is dpi for dots per inch or dpcm for dots per centimeter.  If you don't specify  the  units, the  density  information  goes into the JFIF explicitly stating \"density unspecified\" (also interpreted as \"unknown\").  This may seem pointless, but note that even without specifying the units, the density numbers tell the aspect ratio of the  pixels.   E.g. 1x1  tells  you the pixels are square.  3x2 tells you the pixels are vertical rectangles. Note that if you specify different horizontal and vertical  den- sities, the resulting JFIF image is not a true representation of the input PNM  image,  because  pnmtojpeg  converts  the  raster pixel-for-pixel  and the pixels of a PNM image are defined to be square.  Thus, if you start with a square PNM image and  specify -density=3x2,   the  resulting  JFIF  image  is  a  horizontally squashed version of the original.  However, it is common to  use an  input  image  which is a slight variation on PNM rather than true PNM such that the pixels are not square.  In that case, the appropriate  -density  option  yields a faithful reproduction of the input pseudo-PNM image. The default is 1x1 in unspecified units. Before Netpbm 10.15 (April 2003), this option did not exist  and the pnmtojpeg always created a JFIF with a density of 1x1 in un- specified units."
  command: "pnmtojpeg"
  example: "pnmtojpeg -density=density"
- id: 1260
  intent: "This  option specifies how red, green, and blue component values of a pixel specify a particular color, by telling the chromatic- ities  of  those  3  primary illuminants and of white (i.e. full strength of all three). The chroma_list value is a blank-separated list  of  8  floating point  decimal numbers.  The CIE-1931 X and Y chromaticities (in that order) of each of white, red, green, and blue, in that  or- der. This information goes into the PNG's cHRM chunk. In  a  shell  command, make sure you use quotation marks so that the blanks in chroma_list don't make the shell see multiple com- mand arguments. This  option  was  new  in  Netpbm 10.30 (October 2005).  Before that, the option -chroma does the same thing, but with  slightly different syntax."
  command: "pnmtopng"
  example: "pnmtopng -rgb=chroma_list"
- id: 1261
  intent: "This option sets the memory usage level of the zlib compression. Select  a  level  from  1  for minimum memory usage (and minimum speed) to 9 for maximum memory usage (and speed). The default is the default of the zlib library. This option was new in Netpbm 10.30 (October 2005)."
  command: "pnmtopng"
  example: "pnmtopng -comp_mem_level=n"
- id: 1262
  intent: "that pnmtops uses.  By default, pnmtops uses Level 2.  Some fea- tures of pnmtops are available only in higher Postscript levels, so if you specify too low a level for your image  and  your  op- tions,  pnmtops  fails.   For example, pnmtops cannot do a color image in Level 1. This option was new in Netpbm 10.27 (March 2005).  Before  that, pnmtops always used Level 2."
  command: "pnmtops"
  example: "pnmtops -level This  option determines the level (version number) of Postscript"
