- id: 440
  intent: "Use hardware acceleration to decode the matching stream(s). The allowed values of hwaccel are: none Do not use any hardware acceleration (the default). auto Automatically select the hardware acceleration method. vdpau Use VDPAU (Video Decode and Presentation API for Unix) hardware acceleration. dxva2 Use DXVA2 (DirectX Video Acceleration) hardware acceleration. d3d11va Use D3D11VA (DirectX Video Acceleration) hardware acceleration. vaapi Use VAAPI (Video Acceleration API) hardware acceleration. qsv Use the Intel QuickSync Video acceleration for video transcoding. Unlike most other values, this option does not enable accelerated decoding (that is used automatically whenever a qsv decoder is selected), but accelerated transcoding, without copying the frames into the system memory. For it to work, both the decoder and the encoder must support QSV acceleration and no filters must be used. This option has no effect if the selected hwaccel is not available or not supported by the chosen decoder. Note that most acceleration methods are intended for playback and will not be faster than software decoding on modern CPUs. Additionally, ffmpeg will usually need to copy the decoded frames from the GPU memory into the system memory, resulting in further performance loss. This option is thus mainly useful for testing."
  command: "ffmpeg"
  example: "ffmpeg -hwaccel[:stream_specifier] hwaccel (input,per-stream)"
