- id: 403
  intent: "List directories themselves instead of their contents.  This option effectively causes directories to be treated as normal files when reading and writing.  For example, with this option the output of the \"ls -la\" command on Mac/Linux may be approximated by this exiftool command: exiftool -list_dir -T -ls-l -api systemtags -fast5 .* * (The -T option formats the output in tab-separated columns, -ls-l is a shortcut tag, the API SystemTags option is required to extract some necessary tags, and the -fast5 option is added for speed since only system tags are being extracted.)"
  command: "exiftool"
  example: "exiftool -list_dir"
