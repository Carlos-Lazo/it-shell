  intent: "Specifies the build type from a comma-separated list of components. The allowed values are: any Generate build information including unqualified build dependencies (Build-Depends) and architecture specific build dependencies (Build-Depends-Arch). all Generate build information including unqualified build dependencies (Build-Depends) and architecture independent build dependencies (Build-Depends-Indep). source Effectively ignored; generate build information with just the unqualified build dependencies (Build-Depends). binary Generate build information with all three types of build dependencies.  This is an alias for any,all. full Generate build information with all three types of build dependencies.  This is an alias for any,all,source, and the same as the default case when no build option is specified."
