- id: 33
  intent: "do not open first card found Available commands: open NAME open card NAME. valid   names   are   sound   card   names   as   listed   in /usr/share/alsa/ucm. reset  reset sound card to default state. reload reload configuration. listcards list available cards. list IDENTIFIER list  command,  for  items  returning two entries (value+com- ment). the value of the IDENTIFIER argument can can be: o _verbs - get verb list (in pair verb+comment) o _devices[/{verb}] - get list of supported devices (in  pair device+comment) o _modifiers[/{verb}]  -  get list of supported modifiers (in pair modifier+comment) The forms without the trailing /{verb} are valid only after a specific verb has been set. list1 IDENTIFIER list command, for lists returning one item per entry. the  value  of  the IDENTIFIER argument can vary depending on the context, it can be: o TQ[/{verb}] - get list of Tone Quality identifiers o _enadevs - get list of enabled devices o _enamods - get list of enabled modifiers o _supporteddevs/{modifier}|{device}[/{verb}] - list of  sup- ported devices o _conflictingdevs/{modifier}|{device}[/{verb}]   -  list  of conflicting devices get IDENTIFIER get string value. the value of the IDENTIFIER argument can can be: o _verb - return current verb o [=]{NAME}[/[{modifier}|{/device}][/{verb}]]   (For    valid NAMEs look at the ALSA Use Case Interface) geti IDENTIFIER get integer value. the value of the IDENTIFIER argument can can be: o _devstatus/{device} o _modstatus/{device} set IDENTIFIER VALUE set string value The value of the IDENTIFIER argument can can be: o _verb - set the verb to VALUE o _enadev - enable the device specified by VALUE o _disdev - disable the device specified by VALUE o _swdev/{old_device} - switche device: o disable  old_device  and then enable the device specified by VALUE o if no device was enabled just return o _enamod - enable the modifier specified by VALUE o _dismod - disable the modifier specified by VALUE o _swmod/{old_modifier} - switch modifier: o disable old_modifier and then enable the modifier  speci- fied by VALUE o if no modifier was enabled just return Note  that the identifiers referring to devices and modifiers are valid only after setting a verb. h, help help q, quit quit"
  command: "alsaucm"
  example: "alsaucm -n, --no-open"
