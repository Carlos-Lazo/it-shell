- id: 1163
  intent: "pampaintspill [--bgcolor=color] [--wrap] [--all] [--downsample=number] [--near=number] [--power=number] [filename] [-randomseed=integer] Minimum unique abbreviations of option are acceptable. You may use double hyphens instead of single hyphen to denote options. You may use white space in place of the equals sign to separate an option name from its value."
