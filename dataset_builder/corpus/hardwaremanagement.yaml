  intent: "Defines the level of verification done: If \"none\" is specified, no verification whatsoever is done. If \"main\" is given and a working GnuPG (\"gpg\") binary is available, all repositories are checked, but only the main repository is required to be signed. If \"all\" is given, then all repositories need to be signed.  See \"CRYPTOGRAPHIC VERIFICATION\" below for details. The standard options for TeX Live programs are also accepted: \"--help/-h/-?\", \"--version\", \"-q\" (no informational messages), \"-v\" (debugging messages, can be repeated).  For the details about these, see the \"TeXLive::TLUtils\" documentation. The \"--version\" option shows version information about the TeX Live release and about the \"tlmgr\" script itself.  If \"-v\" is also given, revision number for the loaded TeX Live Perl modules are shown, too."
