- id: 113
  intent: "This option specifies the target processor. The assembler will issue an error message if an attempt is made to assemble an instruction which will not execute on the target processor. The following processor names are recognized: \"z80\", \"z180\", \"ez80\", \"gbz80\", \"z80n\", \"r800\".  In addition to the basic instruction set, the assembler can be told to accept some extention mnemonics. For example, \"-march=z180+sli+infc\" extends z180 with SLI instructions and IN F,(C). The following extentions are currently supported: \"full\" (all known instructions), \"adl\" (ADL CPU mode by default, eZ80 only), \"sli\" (instruction known as SLI, SLL or SL1), \"xyhl\" (instructions with halves of index registers: IXL, IXH, IYL, IYH), \"xdcb\" (instructions like RotOp (II+d),R and BitOp n,(II+d),R), \"infc\" (instruction IN F,(C) or IN (C)), \"outc0\" (instruction OUT (C),0).  Note that rather than extending a basic instruction set, the extention mnemonics starting with \"-\" revoke the respective functionality: \"-march=z80-full+xyhl\" first removes all default extentions and adds support for index registers halves only. If this option is not specified then \"-march=z80+xyhl+infc\" is assumed."
  command: "as"
  example: "as -march=CPU[-EXT...][+EXT...]"
