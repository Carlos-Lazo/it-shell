  intent: "Ignore all but number non-background-colored pixels. When a large number of pixels in the input image differ in color from the background, pampaintspill runs very slowly. The --downsample option randomly selects  a  given  number  of colored pixels  to  use as paint sources for the gradients and ig- nores the rest, thereby trading off image quality for speed of execution."
  command: "pampaintspill"
