  intent: "Specifies the build type from a comma-separated list of components (since dpkg 1.18.5).  All the specified components get combined to select the single build type to use, which implies a single build run with a single .changes file generated.  Passed to dpkg- genchanges. The allowed values are: source Builds the source package. Note: When using this value standalone and if what you want is simply to (re-)build the source package from a clean source tree, using dpkg-source directly is always a better option as it does not require any build dependencies to be installed which are otherwise needed to be able to call the clean target. any Builds the architecture specific binary packages. all Builds the architecture independent binary packages. binary Builds the architecture specific and independent binary packages.  This is an alias for any,all. full Builds everything.  This is an alias for source,any,all, and the same as the default case when no build option is specified."
