- id: 8
  intent: "When this option is specified, the Xorg server loads all  video driver  modules,  probes for available hardware, and writes out an initial xorg.conf(5) file based on what was detected.   This option  currently  has  some problems on some platforms, but in most cases it is a good  way  to  bootstrap  the  configuration process.   This option is only available when the server is run as root (i.e, with real-uid 0)."
  command: "Xorg"
  example: "Xorg -configure"
- id: 9
  intent: "Restrict  device  resets  to  the device at bus-id.  The bus-id string  has   the   form   bustype:bus:device:function   (e.g., 'PCI:1:0:0').   At  present,  only  isolation of PCI devices is supported; i.e., this option is ignored if bustype is  anything other than 'PCI'."
  command: "Xorg"
  example: "Xorg -isolateDevice bus-id"
- id: 10
  intent: "Set  the  module  search  path  to searchpath.  searchpath is a comma separated list of directories to search for  Xorg  server modules.   This option is only available when the server is run as root (i.e, with real-uid 0)."
  command: "Xorg"
  example: "Xorg -modulepath searchpath"
