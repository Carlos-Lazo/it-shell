- id: 94
  intent: "If this system has access to  other  operating  systems'  manual page  descriptions,  they can be searched using this option.  To search NewOS's manual  page  descriptions,  use  the  option  -m NewOS. The system specified can be a combination of comma-delimited op- erating system names.  To include a search of the native operat- ing system's whatis descriptions, include the system name man in the argument string.  This option will override the $SYSTEM  en- vironment variable."
  command: "apropos"
  example: "apropos -m system[,...], --systems=system[,...]"
- id: 95
  intent: "apropos will normally determine your current locale by a call to the  C function setlocale(3) which interrogates various environ- ment variables, possibly including $LC_MESSAGES and  $LANG.   To temporarily  override  the  determined value, use this option to supply a locale string directly to apropos.  Note that  it  will not  take  effect  until  the  search for pages actually begins. Output such as the help message will always be displayed in  the initially determined locale."
  command: "apropos"
  example: "apropos -L locale, --locale=locale"
