  example: "x86_64-linux-gnu-ranlib"
- id: 3157
  intent: "header will show zero for the UID, GID, and timestamp.  When this option is used, multiple runs will produce identical output files. If binutils was configured with --enable-deterministic-archives, then this mode is on by default.  It can be disabled with the -U option, described below."
  command: "x86_64-linux-gnu-ranlib"
  example: "x86_64-linux-gnu-ranlib -D  Operate in deterministic mode.  The symbol map archive member's"
