  intent: "(.wwwBrowser) Defines the web browser used for handling external URLs. The value of this option or resource has the  same  syntax as the BROWSER environment variable; see the explanation of that variable in the section `ENVIRONMENT' below for a  detailed  de- scription.   If neither the option nor the X resource wwwBrowser is specified, the environment variables BROWSER  and  WWWBROWSER (in  that  order)  are used to determine the browser command. If these are not set either, the following default value  is  used: xdg-open %s:htmlview %s:firefox -remote -remote \"openURL(%s,new- window)\":mozilla    -remote    \"openURL(%s,new-window)\":netscape -raise -remote \"openURL(%s,new-window)\":xterm -e w3m %s:xterm -e lynx %s:xterm -e wget %s"
  command: "xdvi"
  example: "xdvi -browser browser"
- id: 3195
  intent: "This  option  triggers  a search for string in the DVI file men- tioned on the command-line, similar to forward search  (see  the description  of  the sourceposition option): If there is already another instance of xdvi running  on  the  displaying  that  DVI file, it will cause that instance to perform the search instead. The search starts at the top of the  current  page  of  the  DVI file."
  command: "xdvi"
  example: "xdvi -findstring string"
- id: 3196
  intent: "(.highlight) Determines the color of the  page  border,  of  the ruler  in  `ruler mode', and of the highlighting markers in for- ward search and string search.  The default  is  the  foreground color."
  command: "xdvi"
  example: "xdvi -hl color"
- id: 3197
  intent: "(.mfMode) Specifies a mode-def string,  which  can  be  used  in searching  for  fonts (see ENVIRONMENT, below).  Generally, when changing the mode-def, it is also necessary to change  the  font size  to  the  appropriate value for that mode.  This is done by adding a colon and the value in dots per inch; for example, -mf- mode  ljfour:600.   This method overrides any value given by the pixelsPerInch resource or the  -p  command-line  argument.   The metafont  mode  is also passed to metafont during automatic cre- ation of fonts.  By default, it is unspecified."
  command: "xdvi"
  example: "xdvi -mfmode mode-def"
- id: 3198
  intent: "(.mouseMode) Specifies the default mode of xdvi at startup: Mag- nifier (0), Text Selection Mode (1) or Ruler Mode (2).  See  the section MODES, below, for more information."
  command: "xdvi"
  example: "xdvi -mousemode [0|1|2]"
- id: 3199
  intent: "(.matchInverted) Don't highlight string search  matches  in  in- verted  color; instead, draw a rectangle in highlight color (see the -hl option) around the match. This option is activated auto- matically  if  the  display  isn't running in TrueColor.  (Note: -nomatchinverted corresponds to  matchInverted:off;  +nomatchin- verted to matchInverted:on.)"
  command: "xdvi"
  example: "xdvi -nomatchinverted"
- id: 3200
  intent: "(.type1) This will disable the use of the  FreeType  library  to display PostScript<tm> Type 1 fonts.  Use this option as a work- around when you encounter problems with the display  of  Type  1 fonts  (but  please  don't  forget  to send a bug report in this case, to the URL mentioned in the section AUTHORS below). (Note: -notype1fonts corresponds to type1:off; +notype1fonts  to type1:on.)"
  command: "xdvi"
  example: "xdvi -notype1fonts"
- id: 3201
