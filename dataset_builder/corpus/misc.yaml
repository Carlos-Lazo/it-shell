  intent: "Try to determine the width of the screen and the bold and underline sequences for the terminal from termcap, and use that information in formatting the output.  Output will be wrapped at two columns less than the width of your terminal device.  Using this option requires that your system have a termcap file somewhere where Term::Cap can find it and requires that your system support termios.  With this option, the output of pod2text will contain terminal control sequences for your current terminal type."
