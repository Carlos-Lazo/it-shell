  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mabi=abi"
- id: 2983
  intent: "This option specifies the target processor.  The assembler will issue an error message if an attempt is made to assemble an instruction which will not execute on the target processor.  The following processor names are recognized: \"cortex-a34\", \"cortex-a35\", \"cortex-a53\", \"cortex-a55\", \"cortex-a57\", \"cortex-a65\", \"cortex-a65ae\", \"cortex-a72\", \"cortex-a73\", \"cortex-a75\", \"cortex-a76\", \"cortex-a76ae\", \"cortex-a77\", \"cortex-a78\", \"cortex-a78ae\", \"cortex-a78c\", \"cortex-a510\", \"cortex-a710\", \"ares\", \"exynos-m1\", \"falkor\", \"neoverse-n1\", \"neoverse-n2\", \"neoverse-e1\", \"neoverse-v1\", \"qdf24xx\", \"saphira\", \"thunderx\", \"vulcan\", \"xgene1\" \"xgene2\", \"cortex-r82\", \"cortex-x1\", and \"cortex-x2\".  The special name \"all\" may be used to allow the assembler to accept instructions valid for any supported processor, including all optional extensions. In addition to the basic instruction set, the assembler can be told to accept, or restrict, various extension mnemonics that extend the processor. If some implementations of a particular processor can have an extension, then then those extensions are automatically enabled. Consequently, you will not normally have to specify any additional extensions."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mcpu=processor[+extension...]"
- id: 2984
  intent: "This option enables verbose error messages for AArch64 gas.  This option is enabled by default."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mverbose-error"
- id: 2985
  intent: "This option disables verbose error messages in AArch64 gas. The following options are available when as is configured for an Alpha processor."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mno-verbose-error"
- id: 2986
  intent: "This option specifies the target processor.  If an attempt is made to assemble an instruction which will not execute on the target processor, the assembler may either expand the instruction as a macro or issue an error message.  This option is equivalent to the \".arch\" directive. The following processor names are recognized: 21064, \"21064a\", 21066, 21068, 21164, \"21164a\", \"21164pc\", 21264, \"21264a\", \"21264b\", \"ev4\", \"ev5\", \"lca45\", \"ev5\", \"ev56\", \"pca56\", \"ev6\", \"ev67\", \"ev68\".  The special name \"all\" may be used to allow the assembler to accept instructions valid for any Alpha processor. In order to support existing practice in OSF/1 with respect to \".arch\", and existing practice within MILO (the Linux ARC bootloader), the numbered processor names (e.g. 21064) enable the processor-specific PALcode instructions, while the \"electro-vlasic\" names (e.g. \"ev4\") do not."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mcpu"
- id: 2987
  intent: "When gcc is using mips-tfile to generate debug information for ECOFF, local labels must be passed through to the object file. Otherwise this option has no effect."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -g  This option is used when the compiler generates debug information."
- id: 2988
  intent: "eBPF. Note that if no endianness option is specified in the command line, the host endianness is used.  See the info pages for documentation of the CRIS-specific options. The following options are available when as is configured for the C-SKY processor family."
