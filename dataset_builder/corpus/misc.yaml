- id: 2550
  intent: "Enable \"list mode\".  In this mode, sudoreplay will list available sessions in a format similar to the sudo log file format, sorted by file name (or sequence number).  Any control characters present in the log data are formatted in octal with a leading '#' character.  For example, a horizontal tab is displayed as '#011' and an embedded carriage return is displayed as '#015'.  Space characters in the command name and arguments are also formatted in octal. If a search expression is specified, it will be used to restrict the IDs that are displayed.  An expression is composed of the following predicates: command pattern Evaluates to true if the command run matches the POSIX extended regular expression pattern. cwd directory Evaluates to true if the command was run with the speci- fied current working directory. fromdate date Evaluates to true if the command was run on or after date.  See Date and time format for a description of sup- ported date and time formats. group runas_group Evaluates to true if the command was run with the speci- fied runas_group.  Unless a runas_group was explicitly specified when sudo was run this field will be empty in the log. host hostname Evaluates to true if the command was run on the specified hostname. runas runas_user Evaluates to true if the command was run as the specified runas_user.  By default, sudo runs commands as the root user. todate date Evaluates to true if the command was run on or prior to date.  See Date and time format for a description of sup- ported date and time formats. tty tty name Evaluates to true if the command was run on the specified terminal device.  The tty name should be specified with- out the /dev/ prefix, e.g., tty01 instead of /dev/tty01. user user name Evaluates to true if the ID matches a command run by user name. Predicates may be abbreviated to the shortest unique string. Predicates may be combined using and, or, and ! operators as well as '(' and ')' grouping (parentheses must generally be escaped from the shell).  The and operator is optional, adjacent predi- cates have an implied and unless separated by an or."
  command: "sudoreplay"
  example: "sudoreplay -l, --list [search expression]"
- id: 2551
