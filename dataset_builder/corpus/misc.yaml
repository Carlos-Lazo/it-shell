- id: 2994
  intent: "Generate code for a particular MIPS Instruction Set Architecture level.  -mips1 is an alias for -march=r3000, -mips2 is an alias for -march=r6000, -mips3 is an alias for -march=r4000 and -mips4 is an alias for -march=r8000.  -mips5, -mips32, -mips32r2, -mips32r3, -mips32r5, -mips32r6, -mips64, -mips64r2, -mips64r3, -mips64r5, and -mips64r6 correspond to generic MIPS V, MIPS32, MIPS32 Release 2, MIPS32 Release 3, MIPS32 Release 5, MIPS32 Release 6, MIPS64, MIPS64 Release 2, MIPS64 Release 3, MIPS64 Release 5, and MIPS64 Release 6 ISA processors, respectively."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mips64r6"
- id: 2995
  intent: "Selects the ABI, which is either \"ilp32\" or \"lp64\", optionally followed by \"f\", \"d\", or \"q\" to indicate single-precision, double- precision, or quad-precision floating-point calling convention, or none to indicate the soft-float calling convention.  Also, \"ilp32\" can optionally be followed by \"e\" to indicate the RVE ABI, which is always soft-float."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mabi=ABI"
- id: 2996
  intent: "Generate code for a big endian machine. See the info pages for documentation of the RX-specific options. The following options are available when as is configured for the s390 processor family."
  command: "x86_64-linux-gnu-as"
  example: "x86_64-linux-gnu-as -mbig-endian"
- id: 2997
  intent: "Choose ABI tag written to the \".xtensa.info\" section.  ABI tag indicates ABI of the assembly code.  A warning is issued by the linker on an attempt to link object files with inconsistent ABI tags.  Default ABI is chosen by the Xtensa core configuration. The following options are available when as is configured for an Z80 processor. @chapter Z80 Dependent Features Command-line Options"
