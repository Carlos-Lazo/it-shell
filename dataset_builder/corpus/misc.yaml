  command: "x86_64-linux-gnu-readelf"
  example: "x86_64-linux-gnu-readelf --hex-dump=<number or name>"
- id: 3162
  intent: "Displays the contents of the indicated section as a hexadecimal bytes.  A number identifies a particular section by index in the section table; any other string identifies all sections with that name in the object file.  The contents of the section will be relocated before they are displayed."
  command: "x86_64-linux-gnu-readelf"
  example: "x86_64-linux-gnu-readelf --relocated-dump=<number or name>"
