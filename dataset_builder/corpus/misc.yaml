  command: "giftopnm"
  example: "giftopnm -comments"
- id: 689
  intent: "This  option  makes  giftopnm try to salvage what it can from an invalid GIF input. In particular, when giftopnm detects that the GIF input  is  in- valid  so that it is impossible to determine what the pixels are intended to be, it produces a single  arbitrary  color  for  all further  pixels in the image.  giftopnm processes the image from top to bottom, left to right, so this means the bottommost  pix- els will be this padding. giftopnm  issues  warning  messages when it salvages an image in this way. Without this option, giftopnm fails when it detects invalid  GIF input.   Any  output  it produces is arbitrary, and typically is not a valid PNM image. It is fairly common for an image to be corrupted  such  that  is started off as a valid GIF, but had the end of the file cut off. An interrupted network transfer tends to do this.  In this case, giftopnm's  salvage  operation will produce a valid PNM image of the proper dimensions, but with a single arbitrary color for the pixels that were left out of the file. This  option  was  new in Netpbm 10.38 (March 2007).  From 10.32 through 10.37, giftopnm always fails if it detects  invalid  GIF input.  Before 10.32, it succeeds in the case of a truncated im- age, and replaces the missing pixels with arbitrary colors,  not necessarily all the same (The pre-10.32 behavior wasn't actually intended by the design)."
  command: "giftopnm"
  example: "giftopnm -repair"
