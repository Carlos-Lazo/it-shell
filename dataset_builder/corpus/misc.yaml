- id: 372
  intent: "as -H odc."
  command: "cpio"
  example: "cpio -c     Use  the  old portable (ASCII) archive format.  This is the same"
- id: 373
  intent: "Use given archive FORMAT.  Valid  formats  are  (the  number  in parentheses gives maximum size for individual archive member): bin    The obsolete binary format.  (2147483647 bytes) odc    The old (POSIX.1) portable format. (8589934591 bytes) newc   The  new (SVR4) portable format, which supports file sys- tems having more than 65536 i-nodes. (4294967295 bytes) crc    The new (SVR4) portable format with a checksum added. tar    The old tar format. (8589934591 bytes) ustar  The POSIX.1 tar format.   Also  recognizes  GNU  tar  ar- chives,  which are similar but not identical. (8589934591 bytes) hpbin  The obsolete binary format used  by  HPUX's  cpio  (which stores device files differently). hpodc  The portable format used by HPUX's cpio (which stores de- vice files differently)."
  command: "cpio"
  example: "cpio -H, --format=FORMAT"
- id: 374
  intent: "Append to an existing archive."
  command: "cpio"
  example: "cpio -A, --append"
- id: 375
  intent: "Create reproducible  archives.   This  is  equivalent  to  --ig- nore-devno --renumber-inodes."
  command: "cpio"
  example: "cpio --device-independent, --reproducible"
- id: 376
  intent: "Use ARCHIVE-NAME instead of standard output. Optional  USER  and HOST  specify  the  user  and host names in case of a remote ar- chive. The output archive name can be specified wither using  this  op- tion, or using -F (--file), but not both."
  command: "cpio"
  example: "cpio -O [[USER@]HOST:]ARCHIVE-NAME"
- id: 377
  intent: "Renumber inodes when storing them in the archive. Operation modifiers valid only in copy-pass mode"
  command: "cpio"
  example: "cpio --renumber-inodes"
- id: 378
  intent: "Use  ARCHIVE-NAME  instead  of standard input. Optional USER and HOST specify the user and host names in case  of  a  remote  ar- chive. The  input  archive  name can be specified wither using this op- tion, or using -F (--file), but not both."
  command: "cpio"
  example: "cpio -I [[USER@]HOST:]ARCHIVE-NAME"
- id: 379
