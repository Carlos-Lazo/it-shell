  intent: "1,12,20,44 Margins A few terminals provide the capability for  changing  their  left/right margins.  The tabs program has an option to use this feature: +m margin The effect depends on whether the terminal has the margin capabil- ities: o   If the terminal provides the capability for setting  the  left margin,  tabs  uses  this, and adjusts the available width for tab-stops. o   If the terminal does not provide the margin capabilities, tabs imitates  the effect, putting the tab stops at the appropriate place on each line.  The terminal's left-margin is  not  modi- fied. If the margin parameter is omitted, the default is 10.  Use +m0 to reset the left margin, i.e., to the left edge  of  the  terminal's display.   Before setting a left-margin, tabs resets the margin to reduce problems which might arise on moving the cursor before  the current left-margin. When  setting  or  resetting the left-margin, tabs may reset the right- margin."
