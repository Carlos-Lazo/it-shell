  intent: "Specify  an  image  to  use  as the texture for a mapped-texture stereogram.  The idea is that the depth-map image  provides  the depth  values  of  the  3-D object/scene while the texture image provides the true-color values.  Consequently, the texture image should align with the depth-map image.  (Note that it's required to have the same dimensions.)  The  texture  image's  background color is ignored when blending colors. This option was new in Netpbm 10.53 (December 2010)."
