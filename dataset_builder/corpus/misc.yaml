- id: 1495
  intent: "This  option is normally issued as the very first option and re- sets man's behaviour to its default.  Its use is to reset  those options  that  may  have  been set in $MANOPT.  Any options that follow -D will have their usual effect."
  command: "man"
  example: "man -D, --default"
- id: 1496
  intent: "man will normally determine your current locale by a call to the C  function  setlocale(3) which interrogates various environment variables, possibly including $LC_MESSAGES and $LANG.  To tempo- rarily  override the determined value, use this option to supply a locale string directly to man.  Note that it will not take ef- fect until the search for pages actually begins.  Output such as the help message will always be displayed in the  initially  de- termined locale."
  command: "man"
  example: "man -L locale, --locale=locale"
- id: 1497
  intent: "If  this  system  has  access to other operating systems' manual pages, they can be accessed using this option.  To search for  a manual  page from NewOS's manual page collection, use the option -m NewOS. The system specified can be a combination of comma delimited op- erating system names.  To include a search of the native operat- ing system's manual pages, include the system name  man  in  the argument string.  This option will override the $SYSTEM environ- ment variable."
  command: "man"
  example: "man -m system[,...], --systems=system[,...]"
- id: 1498
  intent: "Specify an alternate manpath to use.  By default, man uses  man- path  derived code to determine the path to search.  This option overrides the $MANPATH environment variable and causes option -m to be ignored. A  path specified as a manpath must be the root of a manual page hierarchy structured into sections as described  in  the  man-db manual  (under  \"The manual page system\").  To view manual pages outside such hierarchies, see the -l option."
  command: "man"
  example: "man -M path, --manpath=path"
- id: 1499
  intent: "Some systems incorporate large packages of manual pages, such as those that accompany the Tcl package, into the main manual  page hierarchy.  To get around the problem of having two manual pages with the same name such as exit(3), the Tcl pages  were  usually all  assigned  to  section l.  As this is unfortunate, it is now possible to put the pages in the correct section, and to  assign a specific \"extension\" to them, in this case, exit(3tcl).  Under normal operation, man will  display  exit(3)  in  preference  to exit(3tcl).   To negotiate this situation and to avoid having to know which section the page you require resides in,  it  is  now possible  to  give  man  a sub-extension string indicating which package the page must belong to.  Using the above example,  sup- plying  the  option  -e tcl  to  man will restrict the search to pages having an extension of *tcl."
  command: "man"
  example: "man -e sub-extension, --extension=sub-extension"
- id: 1500
  intent: "Search for manual pages case-sensitively."
  command: "man"
  example: "man -I, --match-case"
- id: 1501
  intent: "By  default,  man  will  exit after displaying the most suitable manual page it finds.  Using this option forces man  to  display all the manual pages with names that match the search criteria."
  command: "man"
  example: "man -a, --all"
- id: 1502
  intent: "This  option  causes  man  to  update its database caches of in- stalled manual pages.  This is only needed in  rare  situations, and it is normally better to run mandb(8) instead."
  command: "man"
  example: "man -u, --update"
- id: 1503
  intent: "By default, man will try to interpret pairs of manual page names given on the command line as equivalent to a single manual  page name  containing  a  hyphen or an underscore.  This supports the common pattern of programs that implement a  number  of  subcom- mands,  allowing  them to provide manual pages for each that can be accessed using similar syntax as would be used to invoke  the subcommands themselves.  For example: $ man -aw git diff /usr/share/man/man1/git-diff.1.gz To disable this behaviour, use the --no-subpages option. $ man -aw --no-subpages git diff /usr/share/man/man1/git.1.gz /usr/share/man/man3/Git.3pm.gz /usr/share/man/man1/diff.1.gz Controlling formatted output"
  command: "man"
  example: "man --no-subpages"
- id: 1504
  intent: "If  a  recent version of less is used as the pager, man will at- tempt to set its prompt and some sensible options.  The  default prompt looks like Manual page name(sec) line x where name denotes the manual page name, sec denotes the section it was found under and x  the  current  line  number.   This  is achieved by using the $LESS environment variable. Supplying  -r  with  a  string  will override this default.  The string may contain the text $MAN_PN which will  be  expanded  to the  name  of  the current manual page and its section name sur- rounded by \"(\" and \")\".  The string used to produce the  default could be expressed as \\ Manual\\ page\\ \\$MAN_PN\\ ?ltline\\ %lt?L/%L.: byte\\ %bB?s/%s..?\\ (END):?pB\\ %pB\\\\%.. (press h for help or q to quit) It  is  broken into three lines here for the sake of readability only.  For its meaning see the less(1) manual page.  The  prompt string  is  first  evaluated  by  the shell.  All double quotes, back-quotes and backslashes in the prompt must be escaped  by  a preceding  backslash.  The prompt string may end in an escaped $ which may be followed by further options for less.   By  default man sets the -ix8 options. The $MANLESS environment variable described below may be used to set a default prompt string if none is supplied on  the  command line."
  command: "man"
  example: "man -r prompt, --prompt=prompt"
- id: 1505
  intent: "Normally, nroff will automatically justify text to both margins. This  option disables full justification, leaving justified only to the left margin, sometimes called \"ragged-right\" text. If you are writing a manual page  and  simply  want  to  prevent nroff  from  justifying  certain paragraphs, do not use this op- tion, but consult the nroff documentation instead; for instance, you  can use the \".na\", \".nf\", \".fi\", and \".ad\" requests to tem- porarily disable adjusting and filling."
  command: "man"
  example: "man --no-justification, --nj"
- id: 1506
  intent: "Specify the sequence of preprocessors to  run  before  nroff  or troff/groff.  Not all installations will have a full set of pre- processors.  Some of the preprocessors and the letters  used  to designate  them are: eqn (e), grap (g), pic (p), tbl (t), vgrind (v), refer (r).  This option overrides the $MANROFFSEQ  environ- ment  variable.   zsoelim  is  always run as the very first pre- processor."
  command: "man"
  example: "man -p string, --preprocessor=string"
- id: 1507
  intent: "groff  will run troff and then use an appropriate post-processor to produce output suitable for  the  chosen  device.   If  groff -mandoc  is  groff, this option is passed to groff and will sup- press the use of a post-processor.  It implies -t. Getting help"
  command: "man"
  example: "man -Z, --ditroff"
