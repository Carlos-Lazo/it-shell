  intent: "requests that scanimage prints the program and package name, the version  number  of  the SANE distribution that it came with and the version of the backend that it loads.  If  more  information about the version numbers of the backends are necessary, the DE- BUG variable for the dll layer can be  used.  Example:  SANE_DE- BUG_DLL=3 scanimage -L . As  you  might  imagine,  much of the power of scanimage comes from the fact that it can control any SANE backend.  Thus, the exact set of com- mand-line  options  depends on the capabilities of the selected device. To see the options for a device named dev, invoke scanimage via a  com- mand-line of the form: scanimage --help --device-name dev The  documentation for the device-specific options printed by --help is best explained with a few examples:"
