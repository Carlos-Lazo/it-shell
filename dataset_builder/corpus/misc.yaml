  intent: "Control debug information output.  Note that Clang debug  infor- mation  works  best  at -O0.  When more than one option starting with -g is specified, the last one wins: -g Generate debug information. -gline-tables-only Generate only line  table  debug  informa- tion.  This  allows for symbolicated backtraces with inlining information, but does not include any information about vari- ables, their locations or types. -gmodules  Generate  debug information that contains external references to types defined in Clang modules  or  precompiled headers  instead of emitting redundant debug type information into every object file.  This option  transparently  switches the  Clang  module format to object file containers that hold the Clang module together with the debug  information.   When compiling  a  program  that uses Clang modules or precompiled headers, this option produces complete debug information with faster compile times and much smaller object files. This option should not be used when building static libraries for distribution to other machines  because  the  debug  info will  contain  references  to the module cache on the machine the object files in the library were built on."
  command: "clang"
  example: "clang -g, -gline-tables-only, -gmodules"
