  intent: "is -rec709, which chooses ITU-R  Recommendation  BT.709,  gamma- corrected.   This  is  the  only color system for which ppmcie's output is a  true  PPM  image.   See  explanation  above.   -ebu chooses  the  primaries  used  in the PAL and SECAM broadcasting standards.  -ntsc chooses the primaries specified  by  the  NTSC broadcasting  system  (few  modern  monitors actually cover this range).  -smpte selects the primaries recommended by the Society of  Motion Picture and Television Engineers (SMPTE) in standards RP-37 and RP-145, and -hdtv uses the  much  broader  HDTV  ideal primaries.   -cie  chooses  a  color system that has the largest possible gamut within the spectrum of the chart.   This  is  the same  color  system  as  you  get  with  the -cie option to John Walker's cietoppm program."
