- id: 2091
  intent: "Use  floating-point  DCT  method.   The  float  method  is  very slightly  more  accurate than the int method, but is much slower unless your machine has very fast floating-point hardware.  Also note that results of the floating-point method may vary slightly across machines, while the integer methods should give the  same results  everywhere.  The fast integer method is much less accu- rate than the other two."
  command: "pnmtojpeg"
  example: "pnmtojpeg -dct=float"
- id: 2092
  intent: "Use arithmetic coding.  Default is Huffman encoding.  Arithmetic coding tends to get you a smaller result. You  may  need patent licenses to use this option.  According to the JPEG FAQ <http://www.faqs.org/faqs/jpeg-faq> ,  This  method is covered by patents owned by IBM, AT&T, and Mitsubishi. The author of the FAQ recommends against using arithmetic coding (and therefore this option) because the  space  savings  is  not great enough to justify the legal hassles. Most  JPEG  libraries, including any distributed by the Indepen- dent JPEG Group since about 1998 are not capable  of  arithmetic encoding.   pnmtojpeg  uses  a  JPEG library (either bound to it when the pnmtojpeg executable was built or accessed on your sys- tem  at  run time) to do the JPEG encoding.  If pnmtojpeg termi- nates with the message, \"Sorry, there are legal restrictions  on arithmetic  coding\" or \"Sorry, arithmetic coding not supported,\" this is the problem."
  command: "pnmtojpeg"
  example: "pnmtojpeg -arithmetic"
- id: 2093
  intent: "Set JPEG sampling factors for each color component."
  command: "pnmtojpeg"
  example: "pnmtojpeg -sample=HxV[,...]"
