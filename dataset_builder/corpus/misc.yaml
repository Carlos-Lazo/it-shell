- id: 1225
  intent: "The -d option suppresses the error message normally displayed if the  terminal is dumb; that is, lacks some important capability, such as the ability to clear the screen or scroll backward.  The -d  option  does  not otherwise change the behavior of less on a dumb terminal."
  command: "less"
  example: "less -d or --dumb"
- id: 1226
  intent: "Changes the color of different parts of the displayed  text.   x is a single character which selects the type of text whose color is being set: B      Binary characters. C      Control characters. E      Errors and informational messages. M      Mark letters in the status column. N      Line numbers enabled via the -N option. P      Prompts. R      The rscroll character. S      Search results. W      The highlight enabled via the -w option. d      Bold text. k      Blinking text. s      Standout text. u      Underlined text. The uppercase letters can be used only when the --use-color  op- tion is enabled.  When text color is specified by both an upper- case letter and a lowercase letter, the uppercase  letter  takes precedence.   For example, error messages are normally displayed as standout text.  So if both \"s\" and \"E\" are given a color, the \"E\"  color  applies to error messages, and the \"s\" color applies to other standout text.  The \"d\" and \"u\" letters refer  to  bold and  underline  text formed by overstriking with backspaces (see the -u option), not to text using ANSI escape sequences with the -R option. A  lowercase letter may be followed by a + to indicate that both the normal format change and the specified color should both  be used.  For example, -Dug displays underlined text as green with- out underlining; the green color has replaced the  usual  under- line  formatting.   But  -Du+g  displays underlined text as both green and in underlined format. color is either a 4-bit color string or an 8-bit color string: A 4-bit color string is zero, one or two characters,  where  the first  character  specifies  the foreground color and the second specifies the background color as follows: b      Blue c      Cyan g      Green k      Black m      Magenta r      Red w      White y      Yellow The corresponding upper-case letter denotes a brighter shade  of the  color.   For example, -DNGk displays line numbers as bright green text on a black background, and -DEbR displays error  mes- sages  as blue text on a bright red background.  If either char- acter is a \"-\" or is omitted, the corresponding color is set  to that of normal text. An  8-bit  color string is one or two decimal integers separated by a dot, where the first integer specifies the foreground color and  the second specifies the background color.  Each integer is a value between 0 and 255 inclusive which selects a  \"CSI  38;5\" color value (see https://en.wikipedia.org/wiki/ANSI_escape_code#SGR_parameters) If either integer is a \"-\" or is omitted, the corresponding col- or  is  set to that of normal text.  On MS-DOS versions of less, 8-bit color is not supported; instead, decimal values are inter- preted as 4-bit CHAR_INFO.Attributes values (see https://docs.microsoft.com/en-us/windows/console/char-info-str)."
  command: "less"
  example: "less -Dxcolor or --color=xcolor"
- id: 1227
  intent: "Causes moderately \"quiet\" operation: the terminal  bell  is  not rung if an attempt is made to scroll past the end of the file or before the beginning of the file.  If the terminal has a \"visual bell\",  it  is  used  instead.  The bell will be rung on certain other errors, such as typing an invalid character.  The  default is to ring the terminal bell in all such cases."
  command: "less"
  example: "less -q or --quiet or --silent"
- id: 1228
  intent: "Causes  totally  \"quiet\"  operation:  the terminal bell is never rung.  If the terminal has a \"visual bell\", it is  used  in  all cases where the terminal bell would have been rung."
  command: "less"
  example: "less -Q or --QUIET or --SILENT"
- id: 1229
  intent: "Causes backspaces and carriage returns to be treated  as  print- able  characters;  that  is,  they are sent to the terminal when they appear in the input."
  command: "less"
  example: "less -u or --underline-special"
- id: 1230
  intent: "Causes backspaces, tabs, carriage returns and \"formatting  char- acters\" (as defined by Unicode) to be treated as control charac- ters; that is, they are handled as specified by the -r option. By default, if neither -u nor -U is given, backspaces which  ap- pear  adjacent to an underscore character are treated specially: the underlined text is displayed using the  terminal's  hardware underlining  capability.   Also, backspaces which appear between two identical characters are treated specially:  the  overstruck text is printed using the terminal's hardware boldface capabili- ty.  Other backspaces are  deleted,  along  with  the  preceding character.   Carriage  returns immediately followed by a newline are deleted.  Other carriage returns are handled as specified by the  -r option.  Unicode formatting characters, such as the Byte Order Mark, are sent to the terminal.  Text which is  overstruck or underlined can be searched for if neither -u nor -U is in ef- fect."
  command: "less"
  example: "less -U or --UNDERLINE-SPECIAL"
- id: 1231
  intent: "This  option  changes the behavior so that if a search string or file name is typed in, and the same string  is  already  in  the history list, the existing copy is removed from the history list before the new one is added.  Thus, a given string  will  appear only  once  in  the history list.  Normally, a string may appear multiple times."
  command: "less"
