- id: 616
  intent: "Initialise a new hardware device of type type called name, using the given device parameters.  If no name is specified it will receive a default name of the form \"type%d\". The meaning of device and the following arguments depends on the device type: cuda device is the number of the CUDA device. The following options are recognized: primary_ctx If set to 1, uses the primary device context instead of creating a new one. Examples: -init_hw_device cuda:1 Choose the second device on the system. -init_hw_device cuda:0,primary_ctx=1 Choose the first device and use the primary device context. dxva2 device is the number of the Direct3D 9 display adapter. d3d11va device is the number of the Direct3D 11 display adapter. vaapi device is either an X11 display name or a DRM render node.  If not specified, it will attempt to open the default X11 display ($DISPLAY) and then the first DRM render node (/dev/dri/renderD128). vdpau device is an X11 display name.  If not specified, it will attempt to open the default X11 display ($DISPLAY). qsv device selects a value in MFX_IMPL_*. Allowed values are: auto sw hw auto_any hw_any hw2 hw3 hw4 If not specified, auto_any is used.  (Note that it may be easier to achieve the desired result for QSV by creating the platform-appropriate subdevice (dxva2 or d3d11va or vaapi) and then deriving a QSV device from that.) Alternatively, child_device_type helps to choose platform- appropriate subdevice type.  On Windows d3d11va is used as default subdevice type. Examples: -init_hw_device qsv:hw,child_device_type=d3d11va Choose the GPU subdevice with type d3d11va and create QSV device with MFX_IMPL_HARDWARE. -init_hw_device qsv:hw,child_device_type=dxva2 Choose the GPU subdevice with type dxva2 and create QSV device with MFX_IMPL_HARDWARE. opencl device selects the platform and device as platform_index.device_index. The set of devices can also be filtered using the key-value pairs to find only devices matching particular platform or device strings. The strings usable as filters are: platform_profile platform_version platform_name platform_vendor platform_extensions device_name device_vendor driver_version device_version device_profile device_extensions device_type The indices and filters must together uniquely select a device. Examples: -init_hw_device opencl:0.1 Choose the second device on the first platform. -init_hw_device opencl:,device_name=Foo9000 Choose the device with a name containing the string Foo9000. -init_hw_device opencl:1,device_type=gpu,device_extensions=cl_khr_fp16 Choose the GPU device on the second platform supporting the cl_khr_fp16 extension. vulkan If device is an integer, it selects the device by its index in a system-dependent list of devices.  If device is any other string, it selects the first device with a name containing that string as a substring. The following options are recognized: debug If set to 1, enables the validation layer, if installed. linear_images If set to 1, images allocated by the hwcontext will be linear and locally mappable. instance_extensions A plus separated list of additional instance extensions to enable. device_extensions A plus separated list of additional device extensions to enable. Examples: -init_hw_device vulkan:1 Choose the second device on the system. -init_hw_device vulkan:RADV Choose the first device with a name containing the string RADV. -init_hw_device vulkan:0,instance_extensions=VK_KHR_wayland_surface+VK_KHR_xcb_surface Choose the first device and enable the Wayland and XCB instance extensions."
  command: "ffmpeg"
  example: "ffmpeg -init_hw_device type[=name][:device[,key=value...]]"
