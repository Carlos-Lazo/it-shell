- id: 2719
  intent: "the extended \"E3\" capability. Commands A few commands (init, reset and longname) are special; they are defined by the tput program.  The others are the names of capabilities from the terminal  database (see terminfo(5) for a list).  Although init and re- set resemble capability names, tput uses several capabilities  to  per- form these special functions. capname indicates the capability from the terminal database. If  the  capability is a string that takes parameters, the argu- ments following the capability will be used  as  parameters  for the string. Most  parameters  are numbers.  Only a few terminal capabilities require string parameters; tput uses a table to decide which  to pass  as  strings.   Normally tput uses tparm(3X) to perform the substitution.  If no parameters are given  for  the  capability, tput writes the string without performing the substitution. init   If  the terminal database is present and an entry for the user's terminal exists (see -Ttype, above), the following will occur: (1)  first, tput retrieves the current  terminal  mode  settings for your terminal.  It does this by successively testing o   the standard error, o   standard output, o   standard input and o   ultimately \"/dev/tty\" to  obtain  terminal settings.  Having retrieved these set- tings, tput remembers which file descriptor to use when up- dating settings. (2)  if  the  window  size cannot be obtained from the operating system, but the terminal description (or environment, e.g., LINES and COLUMNS variables specify this), update the oper- ating system's notion of the window size. (3)  the terminal modes will be updated: o   any delays (e.g., newline) specified in the entry  will be set in the tty driver, o   tabs  expansion  will  be turned on or off according to the specification in the entry, and o   if tabs are not expanded, standard  tabs  will  be  set (every 8 spaces). (4)  if  present,  the terminal's initialization strings will be output as detailed in the terminfo(5) section on  Tabs  and Initialization, (5)  output is flushed. If  an  entry does not contain the information needed for any of these activities, that activity will silently be skipped. reset  This is similar to init, with two differences: (1)  before any other initialization, the terminal modes will be reset to a \"sane\" state: o   set cooked and echo modes, o   turn off cbreak and raw modes, o   turn on newline translation and o   reset  any  unset  special  characters to their default values (2)  Instead of putting out initialization strings,  the  termi- nal's  reset  strings  will be output if present (rs1, rs2, rs3, rf).  If the reset strings are not present,  but  ini- tialization strings are, the initialization strings will be output. Otherwise, reset acts identically to init. longname If the terminal database is present and an entry for the  user's terminal  exists  (see  -Ttype above), then the long name of the terminal will be put out.  The long name is the last name in the first  line  of the terminal's description in the terminfo data- base [see term(5)]. Aliases tput handles the clear, init and reset commands  specially:  it  allows for the possibility that it is invoked by a link with those names. If  tput  is invoked by a link named reset, this has the same effect as tput reset.  The tset(1) utility also treats a link  named  reset  spe- cially. Before ncurses 6.1, the two utilities were different from each other: o   tset  utility  reset the terminal modes and special characters (not done with tput). o   On the other hand, tset's repertoire of terminal  capabilities  for resetting  the terminal was more limited, i.e., only reset_1string, reset_2string and reset_file in contrast to the tab-stops and  mar- gins which are set by this utility. o   The  reset  program  is  usually an alias for tset, because of this difference with resetting terminal modes and special characters. With the changes made for ncurses 6.1, the reset  feature  of  the  two programs is (mostly) the same.  A few differences remain: o   The  tset  program waits one second when resetting, in case it hap- pens to be a hardware terminal. o   The two programs write the terminal initialization strings to  dif- ferent  streams (i.e., the standard error for tset and the standard output for tput). Note: although these programs write to different streams, redirect- ing their output to a file will capture only part of their actions. The changes to the terminal modes are not affected  by  redirecting the output. If  tput  is  invoked by a link named init, this has the same effect as tput init.  Again, you are less likely to use that link because another program named init has a more well-established use. Terminal Size Besides  the  special  commands (e.g., clear), tput treats certain ter- minfo capabilities specially: lines and cols.  tput calls setupterm(3X) to obtain the terminal size: o   first, it gets the size from the terminal database (which generally is not provided for terminal emulators which do not  have  a  fixed window size) o   then  it  asks  the operating system for the terminal's size (which generally works, unless connecting via a serial line which does not support NAWS: negotiations about window size). o   finally,  it  inspects  the environment variables LINES and COLUMNS which may override the terminal size. If the -T option is given tput ignores  the  environment  variables  by calling  use_tioctl(TRUE),  relying  upon  the operating system (or fi- nally, the terminal database)."
  command: "tput"
  example: "tput -x     do not attempt to clear the terminal's scrollback  buffer  using"
