  intent: "Set the left-hand footer string for the \".TH\" macro to string.  By default, the modification date of the input file will be used, or the current date if input comes from \"STDIN\", and will be based on UTC (so that the output will be reproducible regardless of local time zone)."
  command: "pod2man"
  example: "pod2man -d string, --date=string"
- id: 2108
  intent: "Set the error handling style.  \"die\" says to throw an exception on any POD formatting error.  \"stderr\" says to report errors on standard error, but not to throw an exception.  \"pod\" says to include a POD ERRORS section in the resulting documentation summarizing the errors.  \"none\" ignores POD errors entirely, as much as possible. The default is \"die\"."
  command: "pod2man"
  example: "pod2man --errors=style"
- id: 2109
  intent: "Set the name of the manual page for the \".TH\" macro to name. Without this option, the manual name is set to the uppercased base name of the file being converted unless the manual section is 3, in which case the path is parsed to see if it is a Perl module path. If it is, a path like \".../lib/Pod/Man.pm\" is converted into a name like \"Pod::Man\".  This option, if given, overrides any automatic determination of the name. Although one does not have to follow this convention, be aware that the convention for UNIX man pages for commands is for the man page title to be in all-uppercase, even if the command isn't. This option is probably not useful when converting multiple POD files at once. When converting POD source from standard input, the name will be set to \"STDIN\" if this option is not provided.  Providing this option is strongly recommended to set a meaningful manual page name."
  command: "pod2man"
  example: "pod2man -n name, --name=name"
- id: 2110
  intent: "Set the centered footer for the \".TH\" macro to version.  By default, this is set to the version of Perl you run pod2man under. Setting this to the empty string will cause some *roff implementations to use the system default value. Note that some system \"an\" macro sets assume that the centered footer will be a modification date and will prepend something like \"Last modified: \".  If this is the case for your target system, you may want to set --release to the last modified date and --date to the version number."
  command: "pod2man"
  example: "pod2man -r version, --release=version"
- id: 2111
  intent: "Set the section for the \".TH\" macro.  The standard section numbering convention is to use 1 for user commands, 2 for system calls, 3 for functions, 4 for devices, 5 for file formats, 6 for games, 7 for miscellaneous information, and 8 for administrator commands.  There is a lot of variation here, however; some systems (like Solaris) use 4 for file formats, 5 for miscellaneous information, and 7 for devices.  Still others use 1m instead of 8, or some mix of both.  About the only section numbers that are reliably consistent are 1, 2, and 3. By default, section 1 will be used unless the file ends in \".pm\", in which case section 3 will be selected."
  command: "pod2man"
  example: "pod2man -s string, --section=string"
- id: 2112
  intent: "Set the error handling style.  \"die\" says to throw an exception on any POD formatting error.  \"stderr\" says to report errors on standard error, but not to throw an exception.  \"pod\" says to include a POD ERRORS section in the resulting documentation summarizing the errors.  \"none\" ignores POD errors entirely, as much as possible. The default is \"die\"."
  command: "pod2text"
  example: "pod2text --errors=style"
