  intent: "Set the track number (TRCK). Any  text or URL frame (those beginning with T or W) can be modified or added by prefixing the name of the frame with \"--\". For example, --TIT3 \"Monkey!\" will set the TIT3 (subtitle) frame to Monkey!. The  TXXX frame has the format <DESCRIPTION:TEXT>; many TXXX frames may be set in the file as long as they have different  keys.  To  set  this key,  just  separate  the  text with a colon, e.g. --TXXX \"ALBUMARTIST- SORT:Examples, The\". The description can be omitted in  which  case  it defaults to an empty string. The  WXXX frame has the same format as TXXX but since URLs usually con- tain a \":\" you have provide a  description  or  enable  escaping  (-e):"
  command: "mid3v2"
  example: "mid3v2 -T,--track=<NUM/NUM>"
