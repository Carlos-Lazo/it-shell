- id: 843
  intent: "This is a space or comma delimited string that gives options for the keyserver. Options can be prefixed with a `no-' to give  the opposite  meaning. Valid import-options or export-options may be used here as well to apply to importing (--recv-key) or  export- ing  (--send-key)  a key from a keyserver. While not all options are available for all keyserver types, some common options are: include-revoked When searching for a key with --search-keys, include keys that  are  marked  on the keyserver as revoked. Note that not all keyservers differentiate between revoked and  un- revoked  keys,  and  for  such  keyservers this option is meaningless. Note also that most keyservers do  not  have cryptographic  verification  of  key  revocations, and so turning this option off may result in skipping keys  that are incorrectly marked as revoked. include-disabled When searching for a key with --search-keys, include keys that are marked on the keyserver as disabled.  Note  that this option is not used with HKP keyservers. auto-key-retrieve This  is  an  obsolete  alias for the option auto-key-re- trieve.  Please do not use it; it will be removed in  fu- ture versions.. honor-keyserver-url When  using  --refresh-keys, if the key in question has a preferred keyserver URL, then  use  that  preferred  key- server to refresh the key from. In addition, if auto-key- retrieve is set, and the signature being verified  has  a preferred  keyserver  URL,  then  use that preferred key- server to fetch the key from. Note that this  option  in- troduces a \"web bug\": The creator of the key can see when the keys is refreshed.  Thus this option is  not  enabled by default. honor-pka-record If  --auto-key-retrieve  is used, and the signature being verified has a PKA record, then use the  PKA  information to fetch the key. Defaults to \"yes\". include-subkeys When  receiving  a key, include subkeys as potential tar- gets. Note that this option is not  used  with  HKP  key- servers, as they do not support retrieving keys by subkey id. timeout http-proxy=value verbose debug check-cert ca-cert-file These options have no more function since GnuPG 2.1.  Use the dirmngr configuration options instead. The  default  list of options is: \"self-sigs-only, repair-keys, repair- pks-subkey-bug, export-attributes, honor-pka-record\". However,  if  the actual used source is an LDAP server \"no-self-sigs-only\" is assumed un- less \"self-sigs-only\" has been explictly configured."
  command: "gpg"
  example: "gpg --keyserver-options {name=value}"
- id: 844
  intent: "Allow the user to do certain nonsensical or \"silly\" things  like signing an expired or revoked key, or certain potentially incom- patible things like generating unusual key types. This also dis- ables  certain  warning  messages about potentially incompatible actions. As the name implies, this option is for  experts  only. If you don't fully understand the implications of what it allows you to do, leave this off. --no-expert disables this option. Key related options"
  command: "gpg"
  example: "gpg --no-expert"
- id: 845
  intent: "gpg can track the origin of a key. Certain origins  are  implic- itly  known  (e.g. keyserver, web key directory) and set.  For a standard import the origin of the keys imported can be set  with this option.  To list the possible values use \"help\" for string. Some origins can store an optional url argument.  That  URL  can appended to string after a comma."
  command: "gpg"
  example: "gpg --key-origin string[,url]"
- id: 846
  intent: "These options define an import/export filter which  are  applied to  the  imported/exported  keyblock  right  before  it  will be stored/written.  name defines the type of filter  to  use,  expr the  expression  to  evaluate.   The  option can be used several times which then appends more expression to the same name. The available filter types are: keep-uid This filter will keep a user id packet and its  dependent packets  in  the  keyblock if the expression evaluates to true. drop-subkey This filter drops the selected subkeys.   Currently  only implemented for --export-filter. drop-sig This  filter  drops  the  selected key signatures on user ids.  Self-signatures are not considered.  Currently only implemented for --import-filter. For  the syntax of the expression see the chapter \"FILTER EXPRESSIONS\". The property names for the expressions depend on the actual filter type and are indicated in the following table. The available properties are: uid    A string with the user id.  (keep-uid) mbox   The addr-spec part of a user id with mailbox or the empty string.  (keep-uid) key_algo A number with the public key algorithm of a key or subkey packet.  (drop-subkey) key_created key_created_d The  first is the timestamp a public key or subkey packet was created.  The second is the same but given as an  ISO string, e.g. \"2016-08-17\". (drop-subkey) fpr    The hexified fingerprint of the current subkey or primary key.  (drop-subkey) primary Boolean indicating whether the user  id  is  the  primary one.  (keep-uid) expired Boolean  indicating  whether  a user id (keep-uid), a key (drop-subkey), or a signature (drop-sig) expired. revoked Boolean indicating whether a user id (keep-uid) or a  key (drop-subkey) has been revoked. disabled Boolean  indicating  whether  a  primary key is disabled. (not used) secret Boolean indicating whether a key or subkey  is  a  secret one.  (drop-subkey) usage  A  string indicating the usage flags for the subkey, from the sequence ``ecsa?''.  For example, a subkey capable of just  signing  and authentication would be an exact match for ``sa''. (drop-subkey) sig_created sig_created_d The first is the timestamp a signature  packet  was  cre- ated.   The  second  is the same but given as an ISO date string, e.g. \"2016-08-17\". (drop-sig) sig_algo A number with the public key  algorithm  of  a  signature packet. (drop-sig) sig_digest_algo A number with the digest algorithm of a signature packet. (drop-sig)"
  command: "gpg"
  example: "gpg --export-filter {name=expr}"
- id: 847
