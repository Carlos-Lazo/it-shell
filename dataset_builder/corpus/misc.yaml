  intent: "Do not perform the final upload. The package is validated and the resulting messages are printed. <package> This parameter is the name of a package configuration (see section CONFIGURATION) contained in a file.  If not set otherwise the package configuration defaults to the name of the current directory with \".pkg\" appended."
  command: "ctan-o-mat"
  example: "ctan-o-mat --noaction"
- id: 381
  intent: "ctanbib <options> [package name]"
  command: "ctanbib"
  example: "ctanbib"
- id: 382
  intent: "ctanify [--pkgname=string] [--[no]auto] [--tdsonly=filespec ...] [--[no]unixify] [--[no]skip] [--tdsdir=dirname ...] [--tex=macro_pkg] [--[no]miscify] [--[no]tds] filespec[=dirname] ... ctanify [--help] ctanify [--version]"
  command: "ctanify"
  example: "ctanify"
- id: 383
  intent: "Specify explicitly a package name.  Normally, ctanify uses the base name of the first .ins or .sty file listed as the package name.  The package name forms the base name of the tarball that ctanify produces."
  command: "ctanify"
  example: "ctanify -p string, --pkgname=string"
- id: 384
  intent: "Use AWS V4 signature authentication in the transfer. The  provider argument is a string that is used by the algorithm when creating outgoing authentication headers. The region argument is a string that points to a geographic area of  a resources collection (region-code) when the region name is omitted from the endpoint. The service argument is a string that points to a function  pro- vided by a cloud (service-code) when the service name is omitted from the endpoint. If --aws-sigv4 is provided several times,  the  last  set  value will be used. Example: curl --aws-sigv4 \"aws:amz:east-2:es\" --user \"key:secret\" https://example.com See also --basic and -u, --user. Added in 7.75.0."
  command: "curl"
  example: "curl --aws-sigv4 <provider1[:provider2[:region[:service]]]>"
- id: 385
  intent: "(HTTP) Tells curl to pass on names of multipart form fields  and files using backslash-escaping instead of percent-encoding. If  --form-escape  is provided several times, the last set value will be used. Example: curl --form-escape -F 'field\\name=curl' -F 'file=@load\"this' https://example.com See also -F, --form. Added in 7.81.0."
  command: "curl"
  example: "curl --form-escape"
- id: 386
  intent: "(HTTP SMTP IMAP) Similar to -F, --form  except  that  the  value string  for  the  named parameter is used literally. Leading '@' and '<' characters, and the ';type=' string in the value have no special meaning. Use this in preference to -F, --form if there's any possibility that the string value may  accidentally  trigger the '@' or '<' features of -F, --form. --form-string can be used several times in a command line Example: curl --form-string \"data\" https://example.com See also -F, --form."
  command: "curl"
  example: "curl --form-string <name=string>"
- id: 387
  intent: "When  used,  this  option  will make all data specified with -d, --data, --data-binary or --data-urlencode to be used in an  HTTP GET  request instead of the POST request that otherwise would be used. The data will be appended to the URL with a '?' separator. If used in combination with -I, --head, the POST data  will  in- stead be appended to the URL with a HEAD request. Providing -G, --get multiple times has no extra effect.  Disable it again with --no-get. Examples: curl --get https://example.com curl --get -d \"tool=curl\" -d \"age=old\" https://example.com curl --get -I -d \"tool=curl\" https://example.com See also -d, --data and -X, --request."
  command: "curl"
  example: "curl -G, --get"
- id: 388
  intent: "Include the HTTP response headers in the output.  The  HTTP  re- sponse  headers  can  include  things like server name, cookies, date of the document, HTTP version and more... To view the request headers, consider the -v, --verbose option. Providing -i, --include multiple  times  has  no  extra  effect. Disable it again with --no-include. Example: curl -i https://example.com See also -v, --verbose."
  command: "curl"
  example: "curl -i, --include"
- id: 389
  intent: "(HTTP) If the server reports that the requested page  has  moved to a different location (indicated with a Location: header and a 3XX response code), this option will make curl redo the  request on  the  new  place.  If used together with -i, --include or -I, --head, headers from all requested pages will be shown. When au- thentication  is  used,  curl  only sends its credentials to the initial host. If a redirect takes curl to a different  host,  it will  not be able to intercept the user+password. See also --lo- cation-trusted on how to change this. You can limit  the  amount of redirects to follow by using the --max-redirs option. When  curl  follows  a redirect and if the request is a POST, it will send the following request with a GET if the HTTP  response was  301,  302,  or  303. If the response code was any other 3xx code, curl will re-send the following request using the same un- modified method. You can tell curl to not change POST requests to GET after a 30x response by using the dedicated  options  for  that:  --post301, --post302 and --post303. The  method  set  with  -X,  --request overrides the method curl would otherwise select to use. Providing -L, --location multiple times  has  no  extra  effect. Disable it again with --no-location. Example: curl -L https://example.com See also --resolve and --alt-svc."
  command: "curl"
  example: "curl -L, --location"
- id: 390
  intent: "Tells curl to use a separate operation for the following URL and associated  options.  This  allows  you  to send several URL re- quests, each with their own specific options, for example,  such as different user names or custom requests for each. -:,  --next  will  reset  all local options and only global ones will have their values survive over to the  operation  following the  -:,  --next  instruction. Global options include -v, --ver- bose, --trace, --trace-ascii and --fail-early. For example, you can do both a GET and a POST in a  single  com- mand line: curl www1.example.com --next -d postthis www2.example.com -:, --next can be used several times in a command line Examples: curl https://example.com --next -d postthis www2.example.com curl -I https://example.com --next https://example.net/ See also -Z, --parallel and -K, --config. Added in 7.36.0."
  command: "curl"
  example: "curl -:, --next"
- id: 391
  intent: "When  used  in  conjunction with the -o, --output, -J, --remote- header-name, -O, --remote-name,  or  --remote-name-all  options, curl avoids overwriting files that already exist. Instead, a dot and a number gets appended to the name of the file that would be created,  up  to filename.100 after which it will not create any file. Note that this is the negated option name documented.   You  can thus  use --clobber to enforce the clobbering, even if -J, --re- mote-header-name is specified. Providing --no-clobber multiple times has no extra effect.  Dis- able it again with --clobber. Example: curl --no-clobber --output local/dir/file https://example.com See also -o, --output and -O, --remote-name. Added in 7.83.0."
  command: "curl"
  example: "curl --no-clobber"
- id: 392
  intent: "Disables  the  use  of keepalive messages on the TCP connection. curl otherwise enables them by default. Note that this is the negated option name  documented.  You  can thus use --keepalive to enforce keepalive. Providing  --no-keepalive  multiple  times  has no extra effect. Disable it again with --keepalive. Example: curl --no-keepalive https://example.com See also --keepalive-time."
  command: "curl"
  example: "curl --no-keepalive"
- id: 393
  intent: "Option to switch off the progress meter output without muting or otherwise affecting warning and informational messages like  -s, --silent does. Note  that  this  is the negated option name documented. You can thus use --progress-meter to enable the progress meter again. Providing --no-progress-meter multiple times has  no  extra  ef- fect.  Disable it again with --progress-meter. Example: curl --no-progress-meter -o store https://example.com See also -v, --verbose and -s, --silent. Added in 7.67.0."
  command: "curl"
  example: "curl --no-progress-meter"
- id: 394
  intent: "(TLS)  Disable  curl's use of SSL session-ID caching. By default all transfers are done using the cache. Note that while  nothing should  ever  get  hurt  by attempting to reuse SSL session-IDs, there seem to be broken SSL implementations in the wild that may require you to disable this in order for you to succeed. Note  that  this  is the negated option name documented. You can thus use --sessionid to enforce session-ID caching. Providing --no-sessionid multiple times  has  no  extra  effect. Disable it again with --sessionid. Example: curl --no-sessionid https://example.com See also -k, --insecure."
  command: "curl"
  example: "curl --no-sessionid"
- id: 395
  intent: "(HTTP) Tells curl to respect RFC 7231/6.4.2 and not convert POST requests into GET requests when following a 301 redirection. The non-RFC behavior is ubiquitous in web browsers, so curl does the conversion by default to maintain consistency. However, a server may require a POST to remain a POST after  such  a  redirection. This option is meaningful only when using -L, --location. Providing --post301 multiple times has no extra effect.  Disable it again with --no-post301. Example: curl --post301 --location -d \"data\" https://example.com See also --post302, --post303 and -L, --location."
  command: "curl"
  example: "curl --post301"
- id: 396
  intent: "(HTTP) Tells curl to respect RFC 7231/6.4.3 and not convert POST requests into GET requests when following a 302 redirection. The non-RFC behavior is ubiquitous in web browsers, so curl does the conversion by default to maintain consistency. However, a server may require a POST to remain a POST after  such  a  redirection. This option is meaningful only when using -L, --location. Providing --post302 multiple times has no extra effect.  Disable it again with --no-post302. Example: curl --post302 --location -d \"data\" https://example.com See also --post301, --post303 and -L, --location."
  command: "curl"
  example: "curl --post302"
- id: 397
  intent: "(HTTP) Tells curl to violate RFC 7231/6.4.4 and not convert POST requests  into  GET  requests when following 303 redirections. A server may require a POST to remain a POST after a 303 redirect- ion. This option is meaningful only when using -L, --location. Providing --post303 multiple times has no extra effect.  Disable it again with --no-post303. Example: curl --post303 --location -d \"data\" https://example.com See also --post302, --post301 and -L, --location."
  command: "curl"
  example: "curl --post303"
- id: 398
  intent: "This  option allows you to change the service name for proxy ne- gotiation. If --proxy-service-name is provided several times, the last  set value will be used. Example: curl --proxy-service-name \"shrubbery\" -x proxy https://example.com See also --service-name and -x, --proxy. Added in 7.43.0."
  command: "curl"
  example: "curl --proxy-service-name <name>"
- id: 399
  intent: "This option changes the default action for all given URLs to  be dealt with as if -O, --remote-name were used for each one. So if you want to disable that for a specific URL after --remote-name- all has been used, you must use \"-o -\" or --no-remote-name. Providing  --remote-name-all multiple times has no extra effect. Disable it again with --no-remote-name-all. Example: curl --remote-name-all ftp://example.com/file1 ftp://example.com/file2 See also -O, --remote-name."
  command: "curl"
  example: "curl --remote-name-all"
- id: 400
  intent: "(HTTP) Specifies a custom request method to use when communicat- ing  with  the HTTP server. The specified request method will be used instead of the method otherwise  used  (which  defaults  to GET).  Read  the HTTP 1.1 specification for details and explana- tions. Common additional HTTP requests include PUT  and  DELETE, but related technologies like WebDAV offers PROPFIND, COPY, MOVE and more. Normally you do not need this option. All sorts  of  GET,  HEAD, POST and PUT requests are rather invoked by using dedicated com- mand line options. This option only changes the actual word used in  the  HTTP  re- quest, it does not alter the way curl behaves. So for example if you want to make a proper HEAD request, using -X HEAD  will  not suffice. You need to use the -I, --head option. The  method  string  you set with -X, --request will be used for all requests, which if you for example use  -L,  --location  may cause  unintended side-effects when curl does not change request method according to the HTTP 30x response codes - and similar. (FTP) Specifies a custom FTP command to use instead of LIST when doing file lists with FTP. (POP3) Specifies a custom POP3 command to use instead of LIST or RETR. (IMAP) Specifies a custom IMAP command to use instead  of  LIST. (Added in 7.30.0) (SMTP) Specifies a custom SMTP command to use instead of HELP or VRFY. (Added in 7.34.0) If -X, --request is provided several times, the last  set  value will be used. Examples: curl -X \"DELETE\" https://example.com curl -X NLST ftp://example.com/ See also --request-target."
  command: "curl"
  example: "curl -X, --request <method>"
- id: 401
  intent: "Use this authorization identity (authzid), during SASL PLAIN au- thentication,  in addition to the authentication identity (auth- cid) as specified by -u, --user. If the option is not specified, the server will derive  the  au- thzid  from  the authcid, but if specified, and depending on the server implementation, it may be used to access  another  user's inbox,  that  the  user  has been granted access to, or a shared mailbox for example. If --sasl-authzid is provided several times, the last set  value will be used. Example: curl --sasl-authzid zid imap://example.com/ See also --login-options. Added in 7.66.0."
  command: "curl"
  example: "curl --sasl-authzid <identity>"
- id: 402
  intent: "This option allows you to change the service name for SPNEGO. Examples:   --negotiate   --service-name   sockd    would    use sockd/server-name. If  --service-name is provided several times, the last set value will be used. Example: curl --service-name sockd/server https://example.com See also --negotiate and --proxy-service-name. Added in 7.43.0."
  command: "curl"
  example: "curl --service-name <name>"
- id: 403
  intent: "Silent  or  quiet mode. Do not show progress meter or error mes- sages. Makes Curl mute. It will still output the  data  you  ask for, potentially even to the terminal/stdout unless you redirect it. Use -S, --show-error in  addition  to  this  option  to  disable progress meter but still show error messages. Providing -s, --silent multiple times has no extra effect.  Dis- able it again with --no-silent. Example: curl -s https://example.com See also -v, --verbose, --stderr and --no-progress-meter."
  command: "curl"
  example: "curl -s, --silent"
- id: 404
  intent: "The default service name for a socks server is rcmd/server-fqdn. This option allows you to change it. Examples:  --socks5  proxy-name  --socks5-gssapi-service   sockd would  use sockd/proxy-name --socks5 proxy-name --socks5-gssapi- service sockd/real-name  would  use  sockd/real-name  for  cases where the proxy-name does not match the principal name. If  --socks5-gssapi-service  is provided several times, the last set value will be used. Example: curl --socks5-gssapi-service sockd --socks5 hostname:4096 https://example.com See also --socks5."
  command: "curl"
  example: "curl --socks5-gssapi-service <name>"
- id: 405
  intent: "Pass options to the telnet protocol. Supported options are: TTYPE=<term> Sets the terminal type. XDISPLOC=<X display> Sets the X display location. NEW_ENV=<var,val> Sets an environment variable. -t, --telnet-option can be used several times in a command line Example: curl -t TTYPE=vt100 telnet://example.com/ See also -K, --config."
  command: "curl"
  example: "curl -t, --telnet-option <opt=val>"
- id: 406
  intent: "Set password for use with the TLS authentication  method  speci- fied with --tlsauthtype. Requires that --tlsuser also be set. This option does not work with TLS 1.3. If  --tlspassword  is provided several times, the last set value will be used. Example: curl --tlspassword pwd --tlsuser user https://example.com See also --tlsuser."
  command: "curl"
  example: "curl --tlspassword <string>"
- id: 407
  intent: "Set username for use with the TLS authentication  method  speci- fied  with  --tlsauthtype.  Requires  that --tlspassword also is set. This option does not work with TLS 1.3. If --tlsuser is provided several times, the last set value  will be used. Example: curl --tlspassword pwd --tlsuser user https://example.com See also --tlspassword."
  command: "curl"
  example: "curl --tlsuser <name>"
- id: 408
