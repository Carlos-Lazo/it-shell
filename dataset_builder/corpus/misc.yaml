- id: 3382
  intent: "zip [-aABcdDeEfFghjklLmoqrRSTuvVwXyz!@$] [--longoption ...] [-b path] [-n suffixes] [-t date] [-tt date] [zipfile [file ...]] [-xi list] zipcloak (see separate man page) zipnote (see separate man page) zipsplit (see separate man page) Note: Command line processing in zip has been changed to support long options and handle all options and arguments more consistently. Some old command lines that depend on command line inconsistencies may no longer work."
  command: "zip"
  example: "zip"
- id: 3383
  intent: "Fix the zip archive. The -F option can be used if some  portions of  the  archive  are  missing, but requires a reasonably intact central directory.  The input archive is scanned as  usual,  but zip  will ignore some problems.  The resulting archive should be valid, but any inconsistent entries will be left out. When doubled as in -FF, the archive is scanned from  the  begin- ning and zip scans for special signatures to identify the limits between the archive members. The single -F is more  reliable  if the archive is not too much damaged, so try this option first. If the archive is too damaged or the end has been truncated, you must use -FF.  This is a change from zip 2.32, where the -F  op- tion  is  able  to  read a truncated archive.  The -F option now more reliably fixes archives with minor damage and the  -FF  op- tion  is  needed to fix archives where -F might have been suffi- cient before. Neither option will recover archives that have been  incorrectly transferred  in  ascii mode instead of binary. After the repair, the -t option of unzip may show that some files have a bad  CRC. Such files cannot be recovered; you can remove them from the ar- chive using the -d option of zip. Note that -FF may have trouble fixing archives that  include  an embedded  zip  archive  that was stored (without compression) in the archive and, depending on the damage, it may  find  the  en- tries  in  the  embedded archive rather than the archive itself. Try -F first as it does not have this problem. The format of the fix commands have changed.   For  example,  to fix the damaged archive foo.zip, zip -F foo --out foofix tries  to read the entries normally, copying good entries to the new archive foofix.zip.  If this doesn't work, as when  the  ar- chive  is  truncated, or if some entries you know are in the ar- chive are missed, then try zip -FF foo --out foofixfix and compare the resulting archive to the archive created by  -F. The -FF option may create an inconsistent archive.  Depending on what is damaged, you can then use the -F option to fix that  ar- chive. A  split  archive with missing split files can be fixed using -F if you have the last split of the archive (the .zip  file).   If this file is missing, you must use -FF to fix the archive, which will prompt you for the splits you have. Currently the fix options can't recover entries that have a  bad checksum or are otherwise damaged."
  command: "zip"
  example: "zip --fixfix"
- id: 3384
  intent: "Grow  (append to) the specified zip archive, instead of creating a new one. If this operation fails, zip attempts to restore  the archive to its original state. If the restoration fails, the ar- chive might  become  corrupted.  This  option  is  ignored  when there's  no existing archive or when at least one archive member must be updated or deleted."
  command: "zip"
  example: "zip --grow"
- id: 3385
  intent: "Strip any prepended data (e.g. a SFX stub) from the archive."
  command: "zip"
  example: "zip --junk-sfx"
- id: 3386
  intent: "Include information messages, such as file names  being  zipped, in  the  log.   The default is to only include the command line, any warnings and errors, and the final status."
  command: "zip"
  example: "zip --log-info"
- id: 3387
  intent: "Process the archive changes as usual, but  instead  of  updating the  existing  archive,  output  the new archive to output-file. Useful for updating an archive without changing the existing ar- chive  and  the  input archive must be a different file than the output archive. This option can be used to create updated  split  archives.   It can  also  be  used with -U to copy entries from an existing ar- chive to a new archive.  See the EXAMPLES section below. Another use is converting zip files from one split size  to  an- other.   For  instance,  to  convert  an  archive with 700 MB CD splits to one with 2 GB DVD splits, can use: zip -s 2g cd-split.zip --out dvd-split.zip which uses copy mode.  See -U below.  Also: zip -s 0 split.zip --out unsplit.zip will convert a split archive to a single-file archive. Copy mode will convert stream entries  (using  data  descriptors and  which  should be compatible with most unzips) to normal en- tries (which should be compatible with all  unzips),  except  if standard  encryption  was used.  For archives with encrypted en- tries, zipcloak will decrypt the entries  and  convert  them  to normal entries."
  command: "zip"
  example: "zip --output-file output-file"
- id: 3388
  intent: "Quiet  mode;  eliminate  informational  messages   and   comment prompts.   (Useful, for example, in shell scripts and background tasks)."
  command: "zip"
  example: "zip --quiet"
- id: 3389
  intent: "Enable creating a split archive and set the split size.  A split archive is an archive that could be split over many  files.   As the  archive  is created, if the size of the archive reaches the specified split size, that split is closed and  the  next  split opened.   In  general  all splits but the last will be the split size and the last will be whatever is left.  If the  entire  ar- chive  is  smaller  than the split size a single-file archive is created. Split archives are stored in numbered files.   For  example,  if the  output  archive  is  named archive and three splits are re- quired, the resulting archive will be in  the  three  files  ar- chive.z01, archive.z02, and archive.zip.  Do not change the num- bering of these files or the archive will  not  be  readable  as these are used to determine the order the splits are read. Split  size  is  a  number  optionally followed by a multiplier. Currently the number must be an  integer.   The  multiplier  can currently be one of k (kilobytes), m (megabytes), g (gigabytes), or t (terabytes).  As 64k is the  minimum  split  size,  numbers without  multipliers default to megabytes.  For example, to cre- ate a split archive called foo with the contents of the bar  di- rectory  with  splits of 670 MB that might be useful for burning on CDs, the command: zip -s 670m -r foo bar could be used. Currently the old splits of a split  archive  are  not  excluded from  a  new archive, but they can be specifically excluded.  If possible, keep the input and output archives out of the path be- ing zipped when creating split archives. Using  -s  without -sp as above creates all the splits where foo is being written, in this  case  the  current  directory.   This split  mode  updates the splits as the archive is being created, requiring all splits to remain writable, but creates  split  ar- chives  that  are  readable by any unzip that supports split ar- chives.  See -sp below for enabling split pause mode  which  al- lows splits to be written directly to removable media. The  option -sv can be used to enable verbose splitting and pro- vide details of how the splitting is being done.  The -sb option can  be used to ring the bell when zip pauses for the next split destination. Split archives cannot be updated, but see the -O (--out)  option for  how a split archive can be updated as it is copied to a new archive.  A split archive can also be converted into  a  single- file archive using a split size of 0 or negating the -s option: zip -s 0 split.zip --out single.zip Also see -U (--copy) for more on using copy mode."
  command: "zip"
  example: "zip --split-size splitsize"
- id: 3390
  intent: "If  splitting and using split pause mode, ring the bell when zip pauses for each split destination."
  command: "zip"
  example: "zip --split-bell"
- id: 3391
  intent: "If  splitting is enabled with -s, enable split pause mode.  This creates split archives as -s does, but stream writing is used so each  split  can be closed as soon as it is written and zip will pause between each split to allow changing split destination  or media. Though  this split mode allows writing splits directly to remov- able media, it uses stream archive format that may not be  read- able by some unzips.  Before relying on splits created with -sp, test a split archive with the unzip you will be using. To convert a stream split archive (created with -sp) to a  stan- dard archive see the --out option."
  command: "zip"
  example: "zip --split-pause"
- id: 3392
  intent: "Enable various verbose messages while splitting, showing how the splitting is being done."
  command: "zip"
  example: "zip --split-verbose"
- id: 3393
  intent: "Do not operate on files modified prior to  the  specified  date, where  mm  is  the  month  (00-12),  dd  is the day of the month (01-31), and  yyyy  is  the  year.   The  ISO 8601  date  format yyyy-mm-dd is also accepted.  For example: zip -rt 12071991 infamy foo zip -rt 1991-12-07 infamy foo will  add  all the files in foo and its subdirectories that were last modified on or after 7 December 1991, to  the  zip  archive infamy.zip."
  command: "zip"
  example: "zip --from-date mmddyyyy"
- id: 3394
  intent: "Do not operate on files modified after or at the specified date, where mm is the month (00-12),  dd  is  the  day  of  the  month (01-31),  and  yyyy  is  the  year.   The  ISO 8601  date format yyyy-mm-dd is also accepted.  For example: zip -rtt 11301995 infamy foo zip -rtt 1995-11-30 infamy foo will add all the files in foo and its subdirectories  that  were last  modified  before  30 November 1995, to the zip archive in- famy.zip."
  command: "zip"
  example: "zip --before-date mmddyyyy"
- id: 3395
  intent: "Use command cmd instead of 'unzip -tqq' to test an archive  when the  -T  option is used.  On Unix, to use a copy of unzip in the current directory instead of the standard  system  unzip,  could use: zip archive file1 file2 -T -TT \"./unzip -tqq\" In  cmd,  {}  is  replaced by the name of the temporary archive, otherwise the name of the archive is appended to the end of  the command.  The return code is checked for success (0 on Unix)."
  command: "zip"
  example: "zip --unzip-command cmd"
- id: 3396
  intent: "Verbose mode or print diagnostic version info. Normally, when applied to real operations, this  option  enables the  display of a progress indicator during compression (see -dd for more on dots) and requests  verbose  diagnostic  info  about zipfile structure oddities. However,  when -v is the only command line argument a diagnostic screen is printed instead.  This should now work even if  stdout is redirected to a file, allowing easy saving of the information for sending with bug reports to Info-ZIP.   The  version  screen provides  the help screen header with program name, version, and release date, some pointers to the Info-ZIP home  and  distribu- tion  sites,  and shows information about the target environment (compiler type and version, OS version, compilation date and the enabled optional features used to create the zip executable)."
  command: "zip"
  example: "zip --verbose"
- id: 3397
  intent: "Set  the default compression method.  Currently the main methods supported by zip are store and deflate.  Compression method  can be set to: store  -  Setting  the compression method to store forces zip to store entries with no compression.   This  is  generally  faster than compressing entries, but results in no space savings.  This is the same as using -0 (compression level zero). deflate - This is the default method for zip.  If zip determines that  storing is better than deflation, the entry will be stored instead. bzip2 - If bzip2 support is compiled in, this compression method also  becomes available.  Only some modern unzips currently sup- port the bzip2 compression method, so test the unzip you will be using  before relying on archives using this method (compression method 12). For example, to add bar.c to archive foo  using  bzip2  compres- sion: zip -Z bzip2 foo bar.c The compression method can be abbreviated: zip -Zb foo bar.c"
  command: "zip"
  example: "zip --compression-method cm"
