- id: 102
  intent: "APT package handling utility -- command-line interface"
  command: "apt-get"
  example: "apt-get"
- id: 103
  intent: "apt-get [-asqdyfmubV] [-o=config_string] [-c=config_file] [-t=target_release] [-a=architecture] {update | upgrade | dselect-upgrade | dist-upgrade | install pkg [{=pkg_version_number | /target_release}]... | remove pkg... | purge pkg... | source pkg [{=pkg_version_number | /target_release}]... | build-dep pkg [{=pkg_version_number | /target_release}]... | download pkg [{=pkg_version_number | /target_release}]... | check | clean | autoclean | autoremove | {-v | --version} | {-h | --help}}"
  command: "apt-get"
  example: "apt-get"
- id: 104
  intent: "Do not consider recommended packages as a dependency for installing. Configuration Item: APT::Install-Recommends."
  command: "apt-get"
  example: "apt-get --no-install-recommends"
- id: 105
  intent: "Consider suggested packages as a dependency for installing. Configuration Item: APT::Install-Suggests."
  command: "apt-get"
  example: "apt-get --install-suggests"
- id: 106
  intent: "Download only; package files are only retrieved, not unpacked or installed. Configuration Item: APT::Get::Download-Only."
  command: "apt-get"
  example: "apt-get -d, --download-only"
- id: 107
  intent: "Fix; attempt to correct a system with broken dependencies in place. This option, when used with install/remove, can omit any packages to permit APT to deduce a likely solution. If packages are specified, these have to completely correct the problem. The option is sometimes necessary when running APT for the first time; APT itself does not allow broken package dependencies to exist on a system. It is possible that a system's dependency structure can be so corrupt as to require manual intervention (which usually means using dpkg --remove to eliminate some of the offending packages). Use of this option together with -m may produce an error in some situations. Configuration Item: APT::Get::Fix-Broken."
  command: "apt-get"
  example: "apt-get -f, --fix-broken"
- id: 108
  intent: "Ignore missing packages; if packages cannot be retrieved or fail the integrity check after retrieval (corrupted package files), hold back those packages and handle the result. Use of this option together with -f may produce an error in some situations. If a package is selected for installation (particularly if it is mentioned on the command line) and it could not be downloaded then it will be silently held back. Configuration Item: APT::Get::Fix-Missing."
  command: "apt-get"
  example: "apt-get -m, --ignore-missing, --fix-missing"
- id: 109
  intent: "Disables downloading of packages. This is best used with --ignore-missing to force APT to use only the .debs it has already downloaded. Configuration Item: APT::Get::Download."
  command: "apt-get"
  example: "apt-get --no-download"
- id: 110
  intent: "Quiet; produces output suitable for logging, omitting progress indicators. More q's will produce more quiet up to a maximum of 2. You can also use -q=# to set the quiet level, overriding the configuration file. Note that quiet level 2 implies -y; you should never use -qq without a no-action modifier such as -d, --print-uris or -s as APT may decide to do something you did not expect. Configuration Item: quiet."
  command: "apt-get"
  example: "apt-get -q, --quiet"
- id: 111
  intent: "No action; perform a simulation of events that would occur based on the current system state but do not actually change the system. Locking will be disabled (Debug::NoLocking) so the system state could change while apt-get is running. Simulations can also be executed by non-root users which might not have read access to all apt configuration distorting the simulation. A notice expressing this warning is also shown by default for non-root users (APT::Get::Show-User-Simulation-Note). Configuration Item: APT::Get::Simulate. Simulated runs print out a series of lines, each representing a dpkg operation: configure (Conf), remove (Remv) or unpack (Inst). Square brackets indicate broken packages, and empty square brackets indicate breaks that are of no consequence (rare)."
  command: "apt-get"
  example: "apt-get -s, --simulate, --just-print, --dry-run, --recon, --no-act"
- id: 112
  intent: "Automatic yes to prompts; assume \"yes\" as answer to all prompts and run non-interactively. If an undesirable situation, such as changing a held package, trying to install an unauthenticated package or removing an essential package occurs then apt-get will abort. Configuration Item: APT::Get::Assume-Yes."
  command: "apt-get"
  example: "apt-get -y, --yes, --assume-yes"
- id: 113
  intent: "Automatic \"no\" to all prompts. Configuration Item: APT::Get::Assume-No."
  command: "apt-get"
  example: "apt-get --assume-no"
- id: 114
  intent: "Show full versions for upgraded and installed packages. Configuration Item: APT::Get::Show-Versions."
  command: "apt-get"
  example: "apt-get -V, --verbose-versions"
- id: 115
  intent: "This option controls the architecture packages are built for by apt-get source --compile and how cross-builddependencies are satisfied. By default is it not set which means that the host architecture is the same as the build architecture (which is defined by APT::Architecture). Configuration Item: APT::Get::Host-Architecture."
  command: "apt-get"
  example: "apt-get -a, --host-architecture"
- id: 116
  intent: "Compile source packages after downloading them. Configuration Item: APT::Get::Compile."
  command: "apt-get"
  example: "apt-get -b, --compile, --build"
- id: 117
  intent: "Ignore package holds; this causes apt-get to ignore a hold placed on a package. This may be useful in conjunction with dist-upgrade to override a large number of undesired holds. Configuration Item: APT::Ignore-Hold."
  command: "apt-get"
  example: "apt-get --ignore-hold"
- id: 118
  intent: "Do not upgrade packages; when used in conjunction with install, no-upgrade will prevent packages on the command line from being upgraded if they are already installed. Configuration Item: APT::Get::Upgrade."
  command: "apt-get"
  example: "apt-get --no-upgrade"
- id: 119
  intent: "Do not install new packages; when used in conjunction with install, only-upgrade will install upgrades for already installed packages only and ignore requests to install new packages. Configuration Item: APT::Get::Only-Upgrade."
  command: "apt-get"
  example: "apt-get --only-upgrade"
- id: 120
  intent: "This is a dangerous option that will cause apt to continue without prompting if it is doing downgrades. It should not be used except in very special situations. Using it can potentially destroy your system! Configuration Item: APT::Get::allow-downgrades. Introduced in APT 1.1."
  command: "apt-get"
  example: "apt-get --allow-downgrades"
