- id: 2400
  intent: "Determines whether a builtin or a custom gamma-table  should  be used. The  description  above shows that option --custom-gamma expects either no option value, a \"yes\" string, or a \"no\" string.  Spec- ifying  the  option  with  no  value is equivalent to specifying \"yes\".  The value in square-brackets indicates that  the  option is  not currently active.  That is, attempting to set the option would result in an error message.  The set of available  options typically  depends  on the settings of other options.  For exam- ple, the --custom-gamma  table  might  be  active  only  when  a grayscale or color scan-mode has been requested. Note  that  the  --help option is processed only after all other options have been processed.  This makes it possible to see  the option  settings  for a particular mode by specifying the appro- priate mode-options along with the --help option.  For  example, the command-line: scanimage --help --mode color would  print  the  option  settings  that are in effect when the color-mode is selected."
  command: "scanimage"
  example: "scanimage --custom-gamma[=(yes|no)] [inactive]"
