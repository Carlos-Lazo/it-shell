  intent: "Set ExifTool API option.  OPT is an API option name.  The option value is set to 1 if =VAL is omitted.  If VAL is omitted, the option value is set to undef if \"=\" is used, or an empty string with \"^=\".  See Image::ExifTool Options for a list of available API options.  This overrides API options set via the config file."
  command: "exiftool"
