- id: 2527
  intent: "Display help Examples Create a zip file bt reading daa from stdin $ echo Lorem ipsum dolor sit | perl ./bin/streamzip >abcd.zip Check the contents of \"abcd,zip\" with the standard \"unzip\" utility Archive:  abcd.zip Length      Date    Time    Name ---------  ---------- -----   ---- 22  2021-01-08 19:45   - ---------                     ------- 22                     1 file Notice how the \"Name\" is set to \"-\".  That is the default for a few zip utilities whwre the member name is not given. If you want to explicitly name the file, use the \"-member-name\" option as follows $ echo Lorem ipsum dolor sit | perl ./bin/streamzip -member-name latin >abcd.zip $ unzip -l abcd.zip Archive:  abcd.zip Length      Date    Time    Name ---------  ---------- -----   ---- 22  2021-01-08 19:47   latin ---------                     ------- 22                     1 file When to write a Streamed Zip File A Streamed Zip File is useful in situations where you cannot seek backwards/forwards in the file. A good examples is when you are serving dynamic content from a Web Server straight into a socket without needing to create a temporary zip file in the filesystsm. Similarly if your workfow uses a Linux pipelined commands."
