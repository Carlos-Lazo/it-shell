- id: 144
  intent: "Select which frontend to use to display information to the user. Current frontends include: pager Uses sensible-pager(1) command to display output. The command uses PAGER environment variable to choose your favourite pager. The \"pager\" option may be specified in the configuration file to select a specific pager for use with apt-listchanges. browser Displays an HTML-formatted changelog with hyperlinks for bugs and email addresses using the sensible-browser(1) command that examines BROWSER environment variable to choose your favourite browser. The \"browser\" option may be specified in the configuration file to select a specific browser for use with apt-listchanges. xterm-pager Uses your favorite pager to display output, but does so in an xterm (using the x-terminal-emulator alternative) in the background. This allows you to go on with the upgrade if you like, and continue to browse the changelogs. You can override the terminal emulator to be used with the \"xterm\" configuration option. xterm-browser The logical combination of xterm-pager and browser. Only appropriate for text-mode browsers. text Dumps output to stdout, with no pauses. syslog Dumps output to syslog. Disabling the titled option is recommended. log Appends output to a log file, with an optional filter process. Disabling the titled option is recommended. mail Sends mail to the address specified with --email-address, and does not display changelogs. gtk Spawns a gtk window to display the changelogs. Needs python3-gi to be installed. none Does nothing. Can be used to prevent apt-listchanges from running when configured to run automatically from apt. Please note that apt-listchanges will try to switch to an unprivileged user before spawning commands in \"browser\", \"xterm-browser\", and \"xterm-pager\" frontends. However this currently does not apply to the \"pager\" frontend. See also \"ENVIRONMENT VARIABLES\" below."
  command: "apt-listchanges"
  example: "apt-listchanges -f, --frontend"
- id: 145
  intent: "These options will cause apt-listchanges to insert a header before each package's changelog showing the name of the package, and the names of the binary packages which are being upgraded (if there is more than one, or it differs from the source package name)."
