- id: 3130
  intent: "Consider the source file's object format to be bfdname, rather than attempting to deduce it."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --input-target=bfdname"
- id: 3131
  intent: "Write the output file using the object format bfdname."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --output-target=bfdname"
- id: 3132
  intent: "In an ELF object, mark all symbols that have hidden or internal visibility as local.  This option applies on top of symbol-specific localization options such as -L."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --localize-hidden"
- id: 3133
  intent: "Do not operate in deterministic mode.  This is the inverse of the -D option, above: when copying archive members and writing the archive index, use their actual UID, GID, timestamp, and file mode values. This is the default unless binutils was configured with --enable-deterministic-archives."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --disable-deterministic-archives"
- id: 3134
  intent: "Set the start address (also known as the entry address) of the new file to val.  Not all object file formats support setting the start address."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --set-start val"
- id: 3135
  intent: "Change the start address (also known as the entry address) by adding incr.  Not all object file formats support setting the start address."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --adjust-start incr"
- id: 3136
  intent: "Controls the handling of long section names when processing \"COFF\" and \"PE-COFF\" object formats.  The default behaviour, keep, is to preserve long section names if any are present in the input file. The enable and disable options forcibly enable or disable the use of long section names in the output object; when disable is in effect, any long section names in the input object will be truncated.  The enable option will only emit long section names if any are present in the inputs; this is mostly the same as keep, but it is left undefined whether the enable option might force the creation of an empty string table in the output file."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --long-section-names {enable,disable,keep}"
- id: 3137
  intent: "Some object file formats use special characters at the start of symbols.  The most common such character is underscore, which compilers often add before every symbol.  This option tells objcopy to change the leading character of every symbol when it converts between object file formats.  If the object file formats use the same leading character, this option has no effect.  Otherwise, it will add a character, or remove a character, or change a character, as appropriate."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --change-leading-char"
- id: 3138
  intent: "Change all global symbols in the file to be weak.  This can be useful when building an object which will be linked against other objects using the -R option to the linker.  This option is only effective when using an object file format which supports weak symbols."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --weaken"
- id: 3139
  intent: "Mark the output text as writable.  This option isn't meaningful for all object file formats."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --writable-text"
- id: 3140
  intent: "Make the output text write protected.  This option isn't meaningful for all object file formats."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --readonly-text"
- id: 3141
  intent: "Prefix all symbols in the output file with string."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --prefix-symbols=string"
- id: 3142
  intent: "Prefix all section names in the output file with string."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --prefix-sections=string"
- id: 3143
  intent: "Prefix all the names of all allocated sections in the output file with string."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --prefix-alloc-sections=string"
- id: 3144
  intent: "When stripping a file, perhaps with --strip-debug or --strip-unneeded, retain any symbols specifying section names, which would otherwise get stripped."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --keep-section-symbils"
- id: 3145
  intent: "Verbose output: list all object files modified.  In the case of archives, objcopy -V lists all members of the archive."
  command: "x86_64-linux-gnu-objcopy"
  example: "x86_64-linux-gnu-objcopy --verbose"
- id: 3146
  intent: "display information from object files"
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump"
