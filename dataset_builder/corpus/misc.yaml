- id: 550
  intent: "This option is only available if the Ghostscript library is not directly linked to dvisvgm and if PostScript support was not completely disabled during compilation. In this case, dvisvgm tries to load the shared GS library dynamically during runtime. By default, it expects the library's name to be libgs.so.X (on Unix-like systems, where X is the ABI version of the library) or gsdll32.dll/gsdll64.dll (Windows). If dvisvgm doesn't find the library, option --libgs can be used to specify the correct path and filename, e.g.  --libgs=/usr/local/lib/libgs.so.9 or --libgs=\\gs\\gs9.25\\bin\\gsdll64.dll. Alternatively, it's also possible to assign the path to environment variable LIBGS, e.g.  export LIBGS=/usr/local/lib/libgs.so.9 or set LIBGS=\\gs\\gs9.25\\bin\\gsdll63.dll.  LIBGS has less precedence than the command-line option, i.e. dvisvgm ignores variable LIBGS if --libgs is given."
  command: "dvisvgm"
  example: "dvisvgm --libgs=path"
- id: 551
  intent: "Selects the method how to mark hyperlinked areas. The style argument can take one of the values none, box, and line, where box is the default, i.e. a rectangle is drawn around the linked region if option --linkmark is omitted. Style argument line just draws the lower edge of the bounding rectangle, and none tells dvisvgm not to add any visible objects to hyperlinks. The lines and boxes get the current text color selected. In order to apply a different, constant color, a colon followed by a color specifier can be appended to the style string. A color specifier is either a hexadecimal RGB value of the form #RRGGBB, or a dvips color name (https://en.wikibooks.org/wiki/LaTeX/Colors#The_68_standard_colors_known_to_dvips). Moreover, argument style can take a single color specifier to highlight the linked region by a frameless box filled with that color. An optional second color specifier separated by a colon selects the frame color. Examples: box:red or box:#ff0000 draws red boxes around the linked areas.  yellow:blue creates yellow filled rectangles with blue frames."
  command: "dvisvgm"
  example: "dvisvgm -L, --linkmark=style"
- id: 552
  intent: "If this option is given, dvisvgm computes hash values of all pages to be processed. As long as the page contents don't change, the hash value of that page stays the same. This property can be used to determine whether a DVI page must be converted again or can be skipped in consecutive runs of dvisvgm. This is done by propagating the hash value to variable %hd which can be accessed in the output pattern (see option --output). By default, dvisvgm changes the output pattern to %f-%hd if option --page-hashes is given. As a result, all SVG file names contain the hash value instead of the page number. When calling dvisvgm again with option --page-hashes with the same output pattern, it checks the existence of the SVG file to be created and skips the conversion if it's already present. This also applies for consecutive calls of dvisvgm with different command-line parameters. If you want to force another conversion of a DVI file that hasn't changed, you must remove the corresponding SVG files beforehand or add the parameter replace (see below). If you manually set the output pattern to not contain a hash value, the conversion won't be skipped. Alternatively, the output pattern may contain the variables %ho and %hc.  %ho expands to a 32-bit hash representing the given command-line options that affect the generated SVG output, like --no-fonts and --precision. Different combinations of options and parameters lead to different hashes. Thus pattern %f-%hd-%ho creates filenames that change depending on the DVI data and the given command-line options. Variable %hc provides a combined hash computed from the DVI data and the command-line options. It has the same length as %hd. Since the page number isn't part of the file name by default, different DVI pages with identical contents get the same file name. Therefore, only the first one is converted while the others are skipped. To create separate files for each page, you can add the page number to the output pattern, e.g.  --output=\"%f-%p-%hc\". By default, dvisvgm uses the fast XXH64 hash algorithm to compute the values provided through %hd and %hc. 64-bit hashes should be sufficient for most documents with an average size of pages. Alternatively, XXH32 and MD5 can be used as well. The desired algorithm is specified by argument params of option --page-hashes. It takes one of the strings MD5, XXH32, and XXH64, where the names can be given in lower case too, like --page-hashes=md5. Since version 0.7.1, xxHash provides an experimental 128-bit hash function whose algorithm has been stabilized as of version 0.8. When using a version prior to 0.8, the 128-bit hash values can vary depending on the used xxHash version. If the corresponding API is available, dvisvgm supports the new hash function, and option --page-hashes additionally accepts the algorithm specifier XXH128. Finally, option --page-hashes can take a second argument that must be separated by a comma. Currently, only the two parameters list and replace are evaluated, e.g.  --page-hashes=md5,list or --page-hashes=replace. When list is present, dvisvgm doesn't perform any conversion but just lists the hash values %hd and %hc of the pages specified by option --page. Parameter replace forces dvisvgm to convert a DVI page even if a file with the target name already exists."
  command: "dvisvgm"
  example: "dvisvgm -H, --page-hashes[=params]"
