  intent: "FILE exists and the user has execute (or search) access Except for -h and  -L,  all  FILE-related  tests  dereference  symbolic links.   Beware  that  parentheses  need  to be escaped (e.g., by back- slashes) for shells.  INTEGER may also be -l STRING, which evaluates to the length of STRING. NOTE:  Binary  -a  and -o are inherently ambiguous.  Use 'test EXPR1 && test EXPR2' or 'test EXPR1 || test EXPR2' instead. NOTE: [ honors the --help and --version options,  but  test  does  not. test treats each of those as it treats any other nonempty STRING. NOTE:  your shell may have its own version of test and/or [, which usu- ally supersedes the version  described  here.   Please  refer  to  your shell's documentation for details about the options it supports."
