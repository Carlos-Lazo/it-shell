  intent: "Set  the  name of the native character set. This is used to con- vert some informational strings like  user  IDs  to  the  proper UTF-8 encoding.  Note that this has nothing to do with the char- acter set of data to be encrypted or signed; GnuPG does not  re- code user-supplied data. If this option is not used, the default character set is determined from the current locale. A verbosity level of 3 shows the chosen set.  This option should not be used on Windows.  Valid values for name are: iso-8859-1 This is the Latin 1 set. iso-8859-2 The Latin 2 set. iso-8859-15 This is currently an alias for the Latin 1 set. koi8-r The usual Russian set (RFC-1489). utf-8  Bypass all translations and assume that the OS  uses  na- tive UTF-8 encoding."
  command: "gpg"
  example: "gpg --display-charset name"
