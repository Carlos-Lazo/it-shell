- id: 851
  intent: "Use string as a comment string in cleartext signatures and ASCII armored  messages or keys (see --armor). The default behavior is not to use a comment string. --comment may be repeated  multiple times to get multiple comment strings. --no-comments removes all comments.  It is a good idea to keep the length of a single com- ment  below  60  characters to avoid problems with mail programs wrapping such lines.  Note that comment lines,  like  all  other header lines, are not protected by the signature."
  command: "gpg"
  example: "gpg --no-comments"
- id: 852
  intent: "Force  inclusion  of the version string in ASCII armored output. If given once only the name of the program and the major  number is  emitted, given twice the minor is also emitted, given thrice the micro is added, and given four  times  an  operating  system identification  is  also  emitted.   --no-emit-version (default) disables the version line."
  command: "gpg"
  example: "gpg --no-emit-version"
- id: 853
  intent: "Put the name value pair into the  signature  as  notation  data. name  must  consist  only of printable characters or spaces, and must contain a '@' character in  the  form  keyname@domain.exam- ple.com  (substituting  the appropriate keyname and domain name, of course).  This is to help prevent pollution of the  IETF  re- served  notation  namespace. The --expert flag overrides the '@' check. value may be any printable string; it will be encoded  in UTF-8,  so  you  should check that your --display-charset is set correctly. If you prefix name with an exclamation mark (!),  the notation  data  will  be flagged as critical (rfc4880:5.2.3.16). --sig-notation sets a notation for data signatures. --cert-nota- tion sets a notation for key signatures (certifications). --set- notation sets both. There are special codes that may be used in notation names. \"%k\" will  be  expanded into the key ID of the key being signed, \"%K\" into the long key ID of the key being signed, \"%f\" into the fin- gerprint  of  the  key being signed, \"%s\" into the key ID of the key making the signature, \"%S\" into the long key ID of  the  key making  the signature, \"%g\" into the fingerprint of the key mak- ing the signature (which might be a subkey), \"%p\" into the  fin- gerprint  of  the  primary  key of the key making the signature, \"%c\" into the signature count from the  OpenPGP  smartcard,  and \"%%\" results in a single \"%\". %k, %K, and %f are only meaningful when making a key signature  (certification),  and  %c  is  only meaningful when using the OpenPGP smartcard."
  command: "gpg"
  example: "gpg -N, --set-notation {name=value}"
- id: 854
