  intent: "If any of the objfile files are archives, display the archive header information (in a format similar to ls -l).  Besides the information you could list with ar tv, objdump -a shows the object file format of each archive member."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --archive-header"
- id: 3149
  intent: "Specify that the object-code format for the object files is bfdname.  This option may not be necessary; objdump can automatically recognize many formats. For example, objdump -b oasys -m vax -h fu.o displays summary information from the section headers (-h) of fu.o, which is explicitly identified (-m) as a VAX object file in the format produced by Oasys compilers.  You can list the formats available with the -i option."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --target=bfdname"
- id: 3150
  intent: "Display information only for section name."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --section=name"
- id: 3151
  intent: "Print information that is specific to the object file format.  The exact information printed depends upon the object file format.  For some object file formats, no additional information is printed."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --private-headers"
- id: 3152
  intent: "Print information that is specific to the object file format.  The argument options is a comma separated list that depends on the format (the lists of options is displayed with the help). For XCOFF, the available options are: \"header\" \"aout\" \"sections\" \"syms\" \"relocs\" \"lineno,\" \"loader\" \"except\" \"typchk\" \"traceback\" \"toc\" \"ldinfo\" Not all object formats support this option.  In particular the ELF format does not use it."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --private=options"
- id: 3153
  intent: "Display the contents of the specified CTF section.  CTF sections themselves contain many subsections, all of which are displayed in order. By default, display the name of the section named .ctf, which is the name emitted by ld."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --ctf[=section]"
- id: 3154
  intent: "Display the contents of the specified SFrame section. By default, display the name of the section named .sframe, which is the name emitted by ld."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --sframe[=section]"
- id: 3155
  intent: "Print the dynamic symbol table entries of the file.  This is only meaningful for dynamic objects, such as certain types of shared libraries.  This is similar to the information provided by the nm program when given the -D (--dynamic) option. The output format is similar to that produced by the --syms option, except that an extra field is inserted before the symbol's name, giving the version information associated with the symbol.  If the version is the default version to be used when resolving unversioned references to the symbol then it's displayed as is, otherwise it's put into parentheses."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --dynamic-syms"
