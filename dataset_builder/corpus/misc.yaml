  example: "x86_64-linux-gnu-as --abi-windowed | --abi-call0"
- id: 2998
  intent: "On some systems, both the C and C++ compilers put an underscore in front of every name.  For example, the C name \"foo\" gets the low- level name \"_foo\".  This option removes the initial underscore. Whether c++filt removes the underscore by default is target dependent."
