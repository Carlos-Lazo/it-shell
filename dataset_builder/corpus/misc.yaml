- id: 1108
  intent: "ld may be configured to support more than one kind of object file. If your ld is configured this way, you can use the -b option to specify the binary format for input object files that follow this option on the command line.  Even when ld is configured to support alternative object formats, you don't usually need to specify this, as ld should be configured to expect as a default input format the most usual format on each machine.  input-format is a text string, the name of a particular format supported by the BFD libraries. (You can list the available binary formats with objdump -i.) You may want to use this option if you are linking files with an unusual binary format.  You can also use -b to switch formats explicitly (when linking object files of different formats), by including -b input-format before each group of object files in a particular format. The default format is taken from the environment variable \"GNUTARGET\". You can also define the input format from a script, using the command \"TARGET\";"
  command: "ld"
  example: "ld --format=input-format"
- id: 1109
  intent: "When creating an ELF shared object, set the internal DT_AUXILIARY field to the specified name.  This tells the dynamic linker that the symbol table of the shared object should be used as an auxiliary filter on the symbol table of the shared object name. If you later link a program against this filter object, then, when you run the program, the dynamic linker will see the DT_AUXILIARY field.  If the dynamic linker resolves any symbols from the filter object, it will first check whether there is a definition in the shared object name.  If there is one, it will be used instead of the definition in the filter object.  The shared object name need not exist.  Thus the shared object name may be used to provide an alternative implementation of certain functions, perhaps for debugging or for machine-specific performance. This option may be specified more than once.  The DT_AUXILIARY entries will be created in the order in which they appear on the command line."
  command: "ld"
  example: "ld --auxiliary=name"
- id: 1110
  intent: "When creating an ELF shared object, set the internal DT_FILTER field to the specified name.  This tells the dynamic linker that the symbol table of the shared object which is being created should be used as a filter on the symbol table of the shared object name. If you later link a program against this filter object, then, when you run the program, the dynamic linker will see the DT_FILTER field.  The dynamic linker will resolve symbols according to the symbol table of the filter object as usual, but it will actually link to the definitions found in the shared object name.  Thus the filter object can be used to select a subset of the symbols provided by the object name. Some older linkers used the -F option throughout a compilation toolchain for specifying object-file format for both input and output object files.  The GNU linker uses other mechanisms for this purpose: the -b, --format, --oformat options, the \"TARGET\" command in linker scripts, and the \"GNUTARGET\" environment variable.  The GNU linker will ignore the -F option when not creating an ELF shared object."
  command: "ld"
  example: "ld --filter=name"
- id: 1111
  intent: "When creating an ELF executable or shared object, call NAME when the executable or shared object is unloaded, by setting DT_FINI to the address of the function.  By default, the linker uses \"_fini\" as the function to call."
  command: "ld"
  example: "ld -fini=name"
- id: 1112
  intent: "Set the maximum size of objects to be optimized using the GP register to size.  This is only meaningful for object file formats such as MIPS ELF that support putting large and small objects into different sections.  This is ignored for other object file formats."
  command: "ld"
  example: "ld --gpsize=value"
- id: 1113
  intent: "When creating an ELF shared object, set the internal DT_SONAME field to the specified name.  When an executable is linked with a shared object which has a DT_SONAME field, then when the executable is run the dynamic linker will attempt to load the shared object specified by the DT_SONAME field rather than using the file name given to the linker."
  command: "ld"
  example: "ld -soname=name"
- id: 1114
  intent: "When creating an ELF executable or shared object, call NAME when the executable or shared object is loaded, by setting DT_INIT to the address of the function.  By default, the linker uses \"_init\" as the function to call."
  command: "ld"
  example: "ld -init=name"
- id: 1115
  intent: "Add the archive or object file specified by namespec to the list of files to link.  This option may be used any number of times.  If namespec is of the form :filename, ld will search the library path for a file called filename, otherwise it will search the library path for a file called libnamespec.a. On systems which support shared libraries, ld may also search for files other than libnamespec.a.  Specifically, on ELF and SunOS systems, ld will search a directory for a library called libnamespec.so before searching for one called libnamespec.a.  (By convention, a \".so\" extension indicates a shared library.)  Note that this behavior does not apply to :filename, which always specifies a file called filename. The linker will search an archive only once, at the location where it is specified on the command line.  If the archive defines a symbol which was undefined in some object which appeared before the archive on the command line, the linker will include the appropriate file(s) from the archive.  However, an undefined symbol in an object appearing later on the command line will not cause the linker to search the archive again. See the -( option for a way to force the linker to search archives multiple times. You may list the same archive multiple times on the command line. This type of archive searching is standard for Unix linkers. However, if you are using ld on AIX, note that it is different from the behaviour of the AIX linker."
  command: "ld"
  example: "ld --library=namespec"
- id: 1116
  intent: "The recognized keywords are: call-nop=prefix-addr call-nop=suffix-nop call-nop=prefix-byte call-nop=suffix-byte Specify the 1-byte \"NOP\" padding when transforming indirect call to a locally defined function, foo, via its GOT slot. call-nop=prefix-addr generates \"0x67 call foo\". call-nop=suffix-nop generates \"call foo 0x90\". call-nop=prefix-byte generates \"byte call foo\". call-nop=suffix-byte generates \"call foo byte\".  Supported for i386 and x86_64. cet-report=none cet-report=warning cet-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_IBT and GNU_PROPERTY_X86_FEATURE_1_SHSTK properties in input .note.gnu.property section.  cet-report=none, which is the default, will make the linker not report missing properties in input files.  cet-report=warning will make the linker issue a warning for missing properties in input files. cet-report=error will make the linker issue an error for missing properties in input files.  Note that ibt will turn off the missing GNU_PROPERTY_X86_FEATURE_1_IBT property report and shstk will turn off the missing GNU_PROPERTY_X86_FEATURE_1_SHSTK property report.  Supported for Linux/i386 and Linux/x86_64. combreloc nocombreloc Combine multiple dynamic relocation sections and sort to improve dynamic symbol lookup caching.  Do not do this if nocombreloc. common nocommon Generate common symbols with STT_COMMON type during a relocatable link.  Use STT_OBJECT type if nocommon. common-page-size=value Set the page size most commonly used to value.  Memory image layout will be optimized to minimize memory pages if the system is using pages of this size. defs Report unresolved symbol references from regular object files. This is done even if the linker is creating a non-symbolic shared library.  This option is the inverse of -z undefs. dynamic-undefined-weak nodynamic-undefined-weak Make undefined weak symbols dynamic when building a dynamic object, if they are referenced from a regular object file and not forced local by symbol visibility or versioning.  Do not make them dynamic if nodynamic-undefined-weak.  If neither option is given, a target may default to either option being in force, or make some other selection of undefined weak symbols dynamic.  Not all targets support these options. execstack Marks the object as requiring executable stack. global This option is only meaningful when building a shared object. It makes the symbols defined by this shared object available for symbol resolution of subsequently loaded libraries. globalaudit This option is only meaningful when building a dynamic executable.  This option marks the executable as requiring global auditing by setting the \"DF_1_GLOBAUDIT\" bit in the \"DT_FLAGS_1\" dynamic tag.  Global auditing requires that any auditing library defined via the --depaudit or -P command-line options be run for all dynamic objects loaded by the application. ibtplt Generate Intel Indirect Branch Tracking (IBT) enabled PLT entries.  Supported for Linux/i386 and Linux/x86_64. ibt Generate GNU_PROPERTY_X86_FEATURE_1_IBT in .note.gnu.property section to indicate compatibility with IBT.  This also implies ibtplt.  Supported for Linux/i386 and Linux/x86_64. indirect-extern-access noindirect-extern-access Generate GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS in .note.gnu.property section to indicate that object file requires canonical function pointers and cannot be used with copy relocation.  This option also implies noextern-protected- data and nocopyreloc.  Supported for i386 and x86-64. noindirect-extern-access removes GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS from .note.gnu.property section. initfirst This option is only meaningful when building a shared object. It marks the object so that its runtime initialization will occur before the runtime initialization of any other objects brought into the process at the same time.  Similarly the runtime finalization of the object will occur after the runtime finalization of any other objects. interpose Specify that the dynamic loader should modify its symbol search order so that symbols in this shared library interpose all other shared libraries not so marked. unique nounique When generating a shared library or other dynamically loadable ELF object mark it as one that should (by default) only ever be loaded once, and only in the main namespace (when using \"dlmopen\"). This is primarily used to mark fundamental libraries such as libc, libpthread et al which do not usually function correctly unless they are the sole instances of themselves. This behaviour can be overridden by the \"dlmopen\" caller and does not apply to certain loading mechanisms (such as audit libraries). lam-u48 Generate GNU_PROPERTY_X86_FEATURE_1_LAM_U48 in .note.gnu.property section to indicate compatibility with Intel LAM_U48.  Supported for Linux/x86_64. lam-u57 Generate GNU_PROPERTY_X86_FEATURE_1_LAM_U57 in .note.gnu.property section to indicate compatibility with Intel LAM_U57.  Supported for Linux/x86_64. lam-u48-report=none lam-u48-report=warning lam-u48-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_LAM_U48 property in input .note.gnu.property section.  lam-u48-report=none, which is the default, will make the linker not report missing properties in input files.  lam-u48-report=warning will make the linker issue a warning for missing properties in input files. lam-u48-report=error will make the linker issue an error for missing properties in input files.  Supported for Linux/x86_64. lam-u57-report=none lam-u57-report=warning lam-u57-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_LAM_U57 property in input .note.gnu.property section.  lam-u57-report=none, which is the default, will make the linker not report missing properties in input files.  lam-u57-report=warning will make the linker issue a warning for missing properties in input files. lam-u57-report=error will make the linker issue an error for missing properties in input files.  Supported for Linux/x86_64. lam-report=none lam-report=warning lam-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_LAM_U48 and GNU_PROPERTY_X86_FEATURE_1_LAM_U57 properties in input .note.gnu.property section.  lam-report=none, which is the default, will make the linker not report missing properties in input files.  lam-report=warning will make the linker issue a warning for missing properties in input files. lam-report=error will make the linker issue an error for missing properties in input files.  Supported for Linux/x86_64. lazy When generating an executable or shared library, mark it to tell the dynamic linker to defer function call resolution to the point when the function is called (lazy binding), rather than at load time.  Lazy binding is the default. loadfltr Specify that the object's filters be processed immediately at runtime. max-page-size=value Set the maximum memory page size supported to value. muldefs Allow multiple definitions. nocopyreloc Disable linker generated .dynbss variables used in place of variables defined in shared libraries.  May result in dynamic text relocations. nodefaultlib Specify that the dynamic loader search for dependencies of this object should ignore any default library search paths. nodelete Specify that the object shouldn't be unloaded at runtime. nodlopen Specify that the object is not available to \"dlopen\". nodump Specify that the object can not be dumped by \"dldump\". noexecstack Marks the object as not requiring executable stack. noextern-protected-data Don't treat protected data symbols as external when building a shared library.  This option overrides the linker backend default.  It can be used to work around incorrect relocations against protected data symbols generated by compiler.  Updates on protected data symbols by another module aren't visible to the resulting shared library.  Supported for i386 and x86-64. noreloc-overflow Disable relocation overflow check.  This can be used to disable relocation overflow check if there will be no dynamic relocation overflow at run-time.  Supported for x86_64. now When generating an executable or shared library, mark it to tell the dynamic linker to resolve all symbols when the program is started, or when the shared library is loaded by dlopen, instead of deferring function call resolution to the point when the function is first called. origin Specify that the object requires $ORIGIN handling in paths. pack-relative-relocs nopack-relative-relocs Generate compact relative relocation in position-independent executable and shared library.  It adds \"DT_RELR\", \"DT_RELRSZ\" and \"DT_RELRENT\" entries to the dynamic section.  It is ignored when building position-dependent executable and relocatable output.  nopack-relative-relocs is the default, which disables compact relative relocation.  When linked against the GNU C Library, a GLIBC_ABI_DT_RELR symbol version dependency on the shared C Library is added to the output.  Supported for i386 and x86-64. relro norelro Create an ELF \"PT_GNU_RELRO\" segment header in the object. This specifies a memory segment that should be made read-only after relocation, if supported.  Specifying common-page-size smaller than the system page size will render this protection ineffective.  Don't create an ELF \"PT_GNU_RELRO\" segment if norelro. report-relative-reloc Report dynamic relative relocations generated by linker. Supported for Linux/i386 and Linux/x86_64. separate-code noseparate-code Create separate code \"PT_LOAD\" segment header in the object. This specifies a memory segment that should contain only instructions and must be in wholly disjoint pages from any other data.  Don't create separate code \"PT_LOAD\" segment if noseparate-code is used. shstk Generate GNU_PROPERTY_X86_FEATURE_1_SHSTK in .note.gnu.property section to indicate compatibility with Intel Shadow Stack. Supported for Linux/i386 and Linux/x86_64. stack-size=value Specify a stack size for an ELF \"PT_GNU_STACK\" segment. Specifying zero will override any default non-zero sized \"PT_GNU_STACK\" segment creation. start-stop-gc nostart-stop-gc When --gc-sections is in effect, a reference from a retained section to \"__start_SECNAME\" or \"__stop_SECNAME\" causes all input sections named \"SECNAME\" to also be retained, if \"SECNAME\" is representable as a C identifier and either \"__start_SECNAME\" or \"__stop_SECNAME\" is synthesized by the linker.  -z start-stop-gc disables this effect, allowing sections to be garbage collected as if the special synthesized symbols were not defined.  -z start-stop-gc has no effect on a definition of \"__start_SECNAME\" or \"__stop_SECNAME\" in an object file or linker script.  Such a definition will prevent the linker providing a synthesized \"__start_SECNAME\" or \"__stop_SECNAME\" respectively, and therefore the special treatment by garbage collection for those references. start-stop-visibility=value Specify the ELF symbol visibility for synthesized \"__start_SECNAME\" and \"__stop_SECNAME\" symbols.  value must be exactly default, internal, hidden, or protected.  If no -z start-stop-visibility option is given, protected is used for compatibility with historical practice.  However, it's highly recommended to use -z start-stop-visibility=hidden in new programs and shared libraries so that these symbols are not exported between shared objects, which is not usually what's intended. text notext textoff Report an error if DT_TEXTREL is set, i.e., if the position- independent or shared object has dynamic relocations in read- only sections.  Don't report an error if notext or textoff. undefs Do not report unresolved symbol references from regular object files, either when creating an executable, or when creating a shared library.  This option is the inverse of -z defs. unique-symbol nounique-symbol Avoid duplicated local symbol names in the symbol string table. Append \".\"number\"\" to duplicated local symbol names if unique- symbol is used.  nounique-symbol is the default. x86-64-baseline x86-64-v2 x86-64-v3 x86-64-v4 Specify the x86-64 ISA level needed in .note.gnu.property section.  x86-64-baseline generates \"GNU_PROPERTY_X86_ISA_1_BASELINE\".  x86-64-v2 generates \"GNU_PROPERTY_X86_ISA_1_V2\".  x86-64-v3 generates \"GNU_PROPERTY_X86_ISA_1_V3\".  x86-64-v4 generates \"GNU_PROPERTY_X86_ISA_1_V4\".  Supported for Linux/i386 and Linux/x86_64. Other keywords are ignored for Solaris compatibility."
  command: "ld"
  example: "ld -z keyword"
- id: 1117
  intent: "The archives should be a list of archive files.  They may be either explicit file names, or -l options. The specified archives are searched repeatedly until no new undefined references are created.  Normally, an archive is searched only once in the order that it is specified on the command line. If a symbol in that archive is needed to resolve an undefined symbol referred to by an object in an archive that appears later on the command line, the linker would not be able to resolve that reference.  By grouping the archives, they will all be searched repeatedly until all possible references are resolved. Using this option has a significant performance cost.  It is best to use it only when there are unavoidable circular references between two or more archives."
  command: "ld"
  example: "ld --start-group archives --end-group"
- id: 1118
  intent: "This option affects ELF DT_NEEDED tags for dynamic libraries mentioned on the command line after the --as-needed option. Normally the linker will add a DT_NEEDED tag for each dynamic library mentioned on the command line, regardless of whether the library is actually needed or not.  --as-needed causes a DT_NEEDED tag to only be emitted for a library that at that point in the link satisfies a non-weak undefined symbol reference from a regular object file or, if the library is not found in the DT_NEEDED lists of other needed libraries, a non-weak undefined symbol reference from another needed dynamic library.  Object files or libraries appearing on the command line after the library in question do not affect whether the library is seen as needed.  This is similar to the rules for extraction of object files from archives. --no-as-needed restores the default behaviour. Note: On Linux based systems the --as-needed option also has an affect on the behaviour of the --rpath and --rpath-link options. See the description of --rpath-link for more details."
  command: "ld"
  example: "ld --no-as-needed"
- id: 1119
  intent: "Do not link against shared libraries.  This is only meaningful on platforms for which shared libraries are supported.  The different variants of this option are for compatibility with various systems. You may use this option multiple times on the command line: it affects library searching for -l options which follow it.  This option also implies --unresolved-symbols=report-all.  This option can be used with -shared.  Doing so means that a shared library is being created but that all of the library's external references must be resolved by pulling in entries from static libraries."
  command: "ld"
  example: "ld -static"
- id: 1120
  intent: "These options control whether to demangle symbol names in error messages and other output.  When the linker is told to demangle, it tries to present symbol names in a readable fashion: it strips leading underscores if they are used by the object file format, and converts C++ mangled symbol names into user readable names. Different compilers have different mangling styles.  The optional demangling style argument can be used to choose an appropriate demangling style for your compiler.  The linker will demangle by default unless the environment variable COLLECT_NO_DEMANGLE is set. These options may be used to override the default."
  command: "ld"
  example: "ld --no-demangle"
- id: 1121
  intent: "Do not allow multiple definitions with symbols included in filename invoked by -R or --just-symbols"
  command: "ld"
  example: "ld --disable-multiple-abs-defs"
- id: 1122
  intent: "Do not display any warning or error messages.  This overrides --fatal-warnings if it has been enabled.  This option can be used when it is known that the output binary will not work, but there is still a need to create it."
  command: "ld"
  example: "ld --no-warnings"
- id: 1123
  intent: "Normally ld will give a warning if it finds an incompatible library during a library search.  This option silences the warning."
  command: "ld"
  example: "ld --no-warn-search-mismatch"
- id: 1124
  intent: "Turn off the effect of the --whole-archive option for subsequent archive files."
  command: "ld"
  example: "ld --no-whole-archive"
- id: 1125
  intent: "Only search library directories explicitly specified on the command line.  Library directories specified in linker scripts (including linker scripts specified on the command line) are ignored."
  command: "ld"
  example: "ld -nostdlib"
- id: 1126
  intent: "ld may be configured to support more than one kind of object file. If your ld is configured this way, you can use the --oformat option to specify the binary format for the output object file.  Even when ld is configured to support alternative object formats, you don't usually need to specify this, as ld should be configured to produce as a default output format the most usual format on each machine. output-format is a text string, the name of a particular format supported by the BFD libraries.  (You can list the available binary formats with objdump -i.)  The script command \"OUTPUT_FORMAT\" can also specify the output format, but this option overrides it."
  command: "ld"
  example: "ld --oformat=output-format"
- id: 1127
  intent: "When creating an ELF executable or shared object for a target where the read-only data is in its own segment separate from the executable text, it will set the address of the first byte of the read-only data segment."
  command: "ld"
  example: "ld -Trodata-segment=org"
- id: 1128
  intent: "When creating an ELF executable or shared object for x86-64 medium memory model, it will set the address of the first byte of the ldata segment."
  command: "ld"
  example: "ld -Tldata-segment=org"
- id: 1129
  intent: "Determine how to handle unresolved symbols.  There are four possible values for method: ignore-all Do not report any unresolved symbols. report-all Report all unresolved symbols.  This is the default. ignore-in-object-files Report unresolved symbols that are contained in shared libraries, but ignore them if they come from regular object files. ignore-in-shared-libs Report unresolved symbols that come from regular object files, but ignore them if they come from shared libraries.  This can be useful when creating a dynamic binary and it is known that all the shared libraries that it should be referencing are included on the linker's command line. The behaviour for shared libraries on their own can also be controlled by the --[no-]allow-shlib-undefined option. Normally the linker will generate an error message for each reported unresolved symbol but the option --warn-unresolved-symbols can change this to a warning."
  command: "ld"
  example: "ld --unresolved-symbols=method"
- id: 1130
  intent: "Warn if any global constructors are used.  This is only useful for a few object file formats.  For formats like COFF or ELF, the linker can not detect the use of global constructors."
  command: "ld"
  example: "ld --warn-constructors"
- id: 1131
  intent: "Warn if the linker adds DT_TEXTREL to a position-independent executable or shared object."
  command: "ld"
  example: "ld --warn-textrel"
- id: 1132
  intent: "Warn if an object has alternate ELF machine code."
  command: "ld"
  example: "ld --warn-alternate-em"
- id: 1133
  intent: "If the linker is going to report an unresolved symbol (see the option --unresolved-symbols) it will normally generate an error. This option makes it generate a warning instead."
  command: "ld"
  example: "ld --warn-unresolved-symbols"
- id: 1134
  intent: "For each archive mentioned on the command line after the --whole-archive option, include every object file in the archive in the link, rather than searching the archive for the required object files.  This is normally used to turn an archive file into a shared library, forcing every object to be included in the resulting shared library.  This option may be used more than once. Two notes when using this option from gcc: First, gcc doesn't know about this option, so you have to use -Wl,-whole-archive.  Second, don't forget to use -Wl,-no-whole-archive after your list of archives, because gcc will add its own list of archives to your link and you may not want this flag to affect those as well."
  command: "ld"
  example: "ld --whole-archive"
- id: 1135
  intent: "Request (--eh-frame-hdr) or suppress (--no-eh-frame-hdr) the creation of \".eh_frame_hdr\" section and ELF \"PT_GNU_EH_FRAME\" segment header."
  command: "ld"
  example: "ld --no-eh-frame-hdr"
- id: 1136
  intent: "Request creation of \".eh_frame\" unwind info for linker generated code sections like PLT.  This option is on by default if linker generated unwind info is supported.  This option also controls the generation of \".sframe\" unwind info for linker generated code sections like PLT."
  command: "ld"
  example: "ld --no-ld-generated-unwind-info"
- id: 1137
  intent: "Set the type of linker's hash table(s).  style can be either \"sysv\" for classic ELF \".hash\" section, \"gnu\" for new style GNU \".gnu.hash\" section or \"both\" for both the classic ELF \".hash\" and new style GNU \".gnu.hash\" hash tables.  The default depends upon how the linker was configured, but for most Linux based systems it will be \"both\"."
  command: "ld"
  example: "ld --hash-style=style"
- id: 1138
  intent: "Request the creation of a \".note.package\" ELF note section.  The contents of the note are in JSON format, as per the package metadata specification.  For more information see: https://systemd.io/ELF_PACKAGE_METADATA/ If the JSON argument is missing/empty then this will disable the creation of the metadata note, if one had been enabled by an earlier occurrence of the --package-metdata option.  If the linker has been built with libjansson, then the JSON string will be validated. The i386 PE linker supports the -shared option, which causes the output to be a dynamically linked library (DLL) instead of a normal executable.  You should name the output \"*.dll\" when you use this option.  In addition, the linker fully supports the standard \"*.def\" files, which may be specified on the linker command line like an object file (in fact, it should precede archives it exports symbols from, to ensure that they get linked in, just like a normal object file). In addition to the options common to all targets, the i386 PE linker support additional command-line options that are specific to the i386 PE target.  Options that take values may be separated from their values by either a space or an equals sign."
  command: "ld"
  example: "ld --package-metadata=JSON"
- id: 1139
  intent: "If given, symbols with a stdcall suffix (@nn) will be exported as- is and also with the suffix stripped.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld"
  example: "ld --add-stdcall-alias"
- id: 1140
  intent: "Create a DLL instead of a regular executable.  You may also use -shared or specify a \"LIBRARY\" in a given \".def\" file.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld"
  example: "ld --dll"
- id: 1141
  intent: "The PE variants of the COFF object format add an extension that permits the use of section names longer than eight characters, the normal limit for COFF.  By default, these names are only allowed in object files, as fully-linked executable images do not carry the COFF string table required to support the longer names.  As a GNU extension, it is possible to allow their use in executable images as well, or to (probably pointlessly!)  disallow it in object files, by using these two options.  Executable images generated with these long section names are slightly non-standard, carrying as they do a string table, and may generate confusing output when examined with non-GNU PE-aware tools, such as file viewers and dumpers.  However, GDB relies on the use of PE long section names to find Dwarf-2 debug information sections in an executable image at runtime, and so if neither option is specified on the command- line, ld will enable long section names, overriding the default and technically correct behaviour, when it finds the presence of debug information while linking an executable image and not stripping symbols.  [This option is valid for all PE targeted ports of the linker]"
  command: "ld"
  example: "ld --disable-long-section-names"
- id: 1142
  intent: "Automatically choose the image base for DLLs, optionally starting with base value, unless one is specified using the \"--image-base\" argument.  By using a hash generated from the dllname to create unique image bases for each DLL, in-memory collisions and relocations which can delay program execution are avoided.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld"
  example: "ld --enable-auto-image-base=value"
- id: 1143
  intent: "When linking dynamically to a dll without an import library, search for \"<string><basename>.dll\" in preference to \"lib<basename>.dll\". This behaviour allows easy distinction between DLLs built for the various \"subplatforms\": native, cygwin, uwin, pw, etc.  For instance, cygwin DLLs typically use \"--dll-search-prefix=cyg\". [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld"
  example: "ld --dll-search-prefix string"
- id: 1144
  intent: "Do sophisticated linking of \"_symbol\" to \"__imp__symbol\" for DATA imports from DLLs, thus making it possible to bypass the dllimport mechanism on the user side and to reference unmangled symbol names. [This option is specific to the i386 PE targeted port of the linker] The following remarks pertain to the original implementation of the feature and are obsolete nowadays for Cygwin and MinGW targets. Note: Use of the 'auto-import' extension will cause the text section of the image file to be made writable. This does not conform to the PE-COFF format specification published by Microsoft. Note - use of the 'auto-import' extension will also cause read only data which would normally be placed into the .rdata section to be placed into the .data section instead.  This is in order to work around a problem with consts that is described here: http://www.cygwin.com/ml/cygwin/2004-09/msg01101.html Using 'auto-import' generally will 'just work' -- but sometimes you may see this message: \"variable '<var>' can't be auto-imported. Please read the documentation for ld's \"--enable-auto-import\" for details.\" This message occurs when some (sub)expression accesses an address ultimately given by the sum of two constants (Win32 import tables only allow one).  Instances where this may occur include accesses to member fields of struct variables imported from a DLL, as well as using a constant index into an array variable imported from a DLL.  Any multiword variable (arrays, structs, long long, etc) may trigger this error condition.  However, regardless of the exact data type of the offending exported variable, ld will always detect it, issue the warning, and exit. There are several ways to address this difficulty, regardless of the data type of the exported variable: One way is to use --enable-runtime-pseudo-reloc switch. This leaves the task of adjusting references in your client code for runtime environment, so this method works only when runtime environment supports this feature. A second solution is to force one of the 'constants' to be a variable -- that is, unknown and un-optimizable at compile time. For arrays, there are two possibilities: a) make the indexee (the array's address) a variable, or b) make the 'constant' index a variable.  Thus: extern type extern_array[]; extern_array[1] --> { volatile type *t=extern_array; t[1] } or extern type extern_array[]; extern_array[1] --> { volatile int t=1; extern_array[t] } For structs (and most other multiword data types) the only option is to make the struct itself (or the long long, or the ...) variable: extern struct s extern_struct; extern_struct.field --> { volatile struct s *t=&extern_struct; t->field } or extern long long extern_ll; extern_ll --> { volatile long long * local_ll=&extern_ll; *local_ll } A third method of dealing with this difficulty is to abandon 'auto-import' for the offending symbol and mark it with \"__declspec(dllimport)\".  However, in practice that requires using compile-time #defines to indicate whether you are building a DLL, building client code that will link to the DLL, or merely building/linking to a static library.   In making the choice between the various methods of resolving the 'direct address with constant offset' problem, you should consider typical real-world usage: Original: --foo.h extern int arr[]; --foo.c #include \"foo.h\" void main(int argc, char **argv){ printf(\"%d\\n\",arr[1]); } Solution 1: --foo.h extern int arr[]; --foo.c #include \"foo.h\" void main(int argc, char **argv){ /* This workaround is for win32 and cygwin; do not \"optimize\" */ volatile int *parr = arr; printf(\"%d\\n\",parr[1]); } Solution 2: --foo.h /* Note: auto-export is assumed (no __declspec(dllexport)) */ #if (defined(_WIN32) || defined(__CYGWIN__)) && \\ !(defined(FOO_BUILD_DLL) || defined(FOO_STATIC)) #define FOO_IMPORT __declspec(dllimport) #else #define FOO_IMPORT #endif extern FOO_IMPORT int arr[]; --foo.c #include \"foo.h\" void main(int argc, char **argv){ printf(\"%d\\n\",arr[1]); } A fourth way to avoid this problem is to re-code your library to use a functional interface rather than a data interface for the offending variables (e.g. set_foo() and get_foo() accessor functions)."
  command: "ld"
  example: "ld --enable-auto-import"
- id: 1145
  intent: "Do not create pseudo relocations for non-zero offset DATA imports from DLLs.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld"
  example: "ld --disable-runtime-pseudo-reloc"
- id: 1146
  intent: "Specifies the subsystem under which your program will execute.  The legal values for which are \"native\", \"windows\", \"console\", \"posix\", and \"xbox\".  You may optionally set the subsystem version also. Numeric values are also accepted for which.  [This option is specific to the i386 PE targeted port of the linker] The following options set flags in the \"DllCharacteristics\" field of the PE file header: [These options are specific to PE targeted ports of the linker]"
  command: "ld"
  example: "ld --subsystem which:major.minor"
- id: 1147
  intent: "The image is Terminal Server aware.  This option is disabled by default."
  command: "ld"
  example: "ld --disable-tsaware"
- id: 1148
  intent: "ld may be configured to support more than one kind of object file. If your ld is configured this way, you can use the -b option to specify the binary format for input object files that follow this option on the command line.  Even when ld is configured to support alternative object formats, you don't usually need to specify this, as ld should be configured to expect as a default input format the most usual format on each machine.  input-format is a text string, the name of a particular format supported by the BFD libraries. (You can list the available binary formats with objdump -i.) You may want to use this option if you are linking files with an unusual binary format.  You can also use -b to switch formats explicitly (when linking object files of different formats), by including -b input-format before each group of object files in a particular format. The default format is taken from the environment variable \"GNUTARGET\". You can also define the input format from a script, using the command \"TARGET\";"
  command: "ld.bfd"
  example: "ld.bfd --format=input-format"
- id: 1149
  intent: "When creating an ELF shared object, set the internal DT_AUXILIARY field to the specified name.  This tells the dynamic linker that the symbol table of the shared object should be used as an auxiliary filter on the symbol table of the shared object name. If you later link a program against this filter object, then, when you run the program, the dynamic linker will see the DT_AUXILIARY field.  If the dynamic linker resolves any symbols from the filter object, it will first check whether there is a definition in the shared object name.  If there is one, it will be used instead of the definition in the filter object.  The shared object name need not exist.  Thus the shared object name may be used to provide an alternative implementation of certain functions, perhaps for debugging or for machine-specific performance. This option may be specified more than once.  The DT_AUXILIARY entries will be created in the order in which they appear on the command line."
  command: "ld.bfd"
  example: "ld.bfd --auxiliary=name"
- id: 1150
  intent: "When creating an ELF shared object, set the internal DT_FILTER field to the specified name.  This tells the dynamic linker that the symbol table of the shared object which is being created should be used as a filter on the symbol table of the shared object name. If you later link a program against this filter object, then, when you run the program, the dynamic linker will see the DT_FILTER field.  The dynamic linker will resolve symbols according to the symbol table of the filter object as usual, but it will actually link to the definitions found in the shared object name.  Thus the filter object can be used to select a subset of the symbols provided by the object name. Some older linkers used the -F option throughout a compilation toolchain for specifying object-file format for both input and output object files.  The GNU linker uses other mechanisms for this purpose: the -b, --format, --oformat options, the \"TARGET\" command in linker scripts, and the \"GNUTARGET\" environment variable.  The GNU linker will ignore the -F option when not creating an ELF shared object."
  command: "ld.bfd"
  example: "ld.bfd --filter=name"
- id: 1151
  intent: "When creating an ELF executable or shared object, call NAME when the executable or shared object is unloaded, by setting DT_FINI to the address of the function.  By default, the linker uses \"_fini\" as the function to call."
  command: "ld.bfd"
  example: "ld.bfd -fini=name"
- id: 1152
  intent: "Set the maximum size of objects to be optimized using the GP register to size.  This is only meaningful for object file formats such as MIPS ELF that support putting large and small objects into different sections.  This is ignored for other object file formats."
  command: "ld.bfd"
  example: "ld.bfd --gpsize=value"
- id: 1153
  intent: "When creating an ELF shared object, set the internal DT_SONAME field to the specified name.  When an executable is linked with a shared object which has a DT_SONAME field, then when the executable is run the dynamic linker will attempt to load the shared object specified by the DT_SONAME field rather than using the file name given to the linker."
  command: "ld.bfd"
  example: "ld.bfd -soname=name"
- id: 1154
  intent: "When creating an ELF executable or shared object, call NAME when the executable or shared object is loaded, by setting DT_INIT to the address of the function.  By default, the linker uses \"_init\" as the function to call."
  command: "ld.bfd"
  example: "ld.bfd -init=name"
- id: 1155
  intent: "Add the archive or object file specified by namespec to the list of files to link.  This option may be used any number of times.  If namespec is of the form :filename, ld will search the library path for a file called filename, otherwise it will search the library path for a file called libnamespec.a. On systems which support shared libraries, ld may also search for files other than libnamespec.a.  Specifically, on ELF and SunOS systems, ld will search a directory for a library called libnamespec.so before searching for one called libnamespec.a.  (By convention, a \".so\" extension indicates a shared library.)  Note that this behavior does not apply to :filename, which always specifies a file called filename. The linker will search an archive only once, at the location where it is specified on the command line.  If the archive defines a symbol which was undefined in some object which appeared before the archive on the command line, the linker will include the appropriate file(s) from the archive.  However, an undefined symbol in an object appearing later on the command line will not cause the linker to search the archive again. See the -( option for a way to force the linker to search archives multiple times. You may list the same archive multiple times on the command line. This type of archive searching is standard for Unix linkers. However, if you are using ld on AIX, note that it is different from the behaviour of the AIX linker."
  command: "ld.bfd"
  example: "ld.bfd --library=namespec"
- id: 1156
  intent: "The recognized keywords are: call-nop=prefix-addr call-nop=suffix-nop call-nop=prefix-byte call-nop=suffix-byte Specify the 1-byte \"NOP\" padding when transforming indirect call to a locally defined function, foo, via its GOT slot. call-nop=prefix-addr generates \"0x67 call foo\". call-nop=suffix-nop generates \"call foo 0x90\". call-nop=prefix-byte generates \"byte call foo\". call-nop=suffix-byte generates \"call foo byte\".  Supported for i386 and x86_64. cet-report=none cet-report=warning cet-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_IBT and GNU_PROPERTY_X86_FEATURE_1_SHSTK properties in input .note.gnu.property section.  cet-report=none, which is the default, will make the linker not report missing properties in input files.  cet-report=warning will make the linker issue a warning for missing properties in input files. cet-report=error will make the linker issue an error for missing properties in input files.  Note that ibt will turn off the missing GNU_PROPERTY_X86_FEATURE_1_IBT property report and shstk will turn off the missing GNU_PROPERTY_X86_FEATURE_1_SHSTK property report.  Supported for Linux/i386 and Linux/x86_64. combreloc nocombreloc Combine multiple dynamic relocation sections and sort to improve dynamic symbol lookup caching.  Do not do this if nocombreloc. common nocommon Generate common symbols with STT_COMMON type during a relocatable link.  Use STT_OBJECT type if nocommon. common-page-size=value Set the page size most commonly used to value.  Memory image layout will be optimized to minimize memory pages if the system is using pages of this size. defs Report unresolved symbol references from regular object files. This is done even if the linker is creating a non-symbolic shared library.  This option is the inverse of -z undefs. dynamic-undefined-weak nodynamic-undefined-weak Make undefined weak symbols dynamic when building a dynamic object, if they are referenced from a regular object file and not forced local by symbol visibility or versioning.  Do not make them dynamic if nodynamic-undefined-weak.  If neither option is given, a target may default to either option being in force, or make some other selection of undefined weak symbols dynamic.  Not all targets support these options. execstack Marks the object as requiring executable stack. global This option is only meaningful when building a shared object. It makes the symbols defined by this shared object available for symbol resolution of subsequently loaded libraries. globalaudit This option is only meaningful when building a dynamic executable.  This option marks the executable as requiring global auditing by setting the \"DF_1_GLOBAUDIT\" bit in the \"DT_FLAGS_1\" dynamic tag.  Global auditing requires that any auditing library defined via the --depaudit or -P command-line options be run for all dynamic objects loaded by the application. ibtplt Generate Intel Indirect Branch Tracking (IBT) enabled PLT entries.  Supported for Linux/i386 and Linux/x86_64. ibt Generate GNU_PROPERTY_X86_FEATURE_1_IBT in .note.gnu.property section to indicate compatibility with IBT.  This also implies ibtplt.  Supported for Linux/i386 and Linux/x86_64. indirect-extern-access noindirect-extern-access Generate GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS in .note.gnu.property section to indicate that object file requires canonical function pointers and cannot be used with copy relocation.  This option also implies noextern-protected- data and nocopyreloc.  Supported for i386 and x86-64. noindirect-extern-access removes GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS from .note.gnu.property section. initfirst This option is only meaningful when building a shared object. It marks the object so that its runtime initialization will occur before the runtime initialization of any other objects brought into the process at the same time.  Similarly the runtime finalization of the object will occur after the runtime finalization of any other objects. interpose Specify that the dynamic loader should modify its symbol search order so that symbols in this shared library interpose all other shared libraries not so marked. unique nounique When generating a shared library or other dynamically loadable ELF object mark it as one that should (by default) only ever be loaded once, and only in the main namespace (when using \"dlmopen\"). This is primarily used to mark fundamental libraries such as libc, libpthread et al which do not usually function correctly unless they are the sole instances of themselves. This behaviour can be overridden by the \"dlmopen\" caller and does not apply to certain loading mechanisms (such as audit libraries). lam-u48 Generate GNU_PROPERTY_X86_FEATURE_1_LAM_U48 in .note.gnu.property section to indicate compatibility with Intel LAM_U48.  Supported for Linux/x86_64. lam-u57 Generate GNU_PROPERTY_X86_FEATURE_1_LAM_U57 in .note.gnu.property section to indicate compatibility with Intel LAM_U57.  Supported for Linux/x86_64. lam-u48-report=none lam-u48-report=warning lam-u48-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_LAM_U48 property in input .note.gnu.property section.  lam-u48-report=none, which is the default, will make the linker not report missing properties in input files.  lam-u48-report=warning will make the linker issue a warning for missing properties in input files. lam-u48-report=error will make the linker issue an error for missing properties in input files.  Supported for Linux/x86_64. lam-u57-report=none lam-u57-report=warning lam-u57-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_LAM_U57 property in input .note.gnu.property section.  lam-u57-report=none, which is the default, will make the linker not report missing properties in input files.  lam-u57-report=warning will make the linker issue a warning for missing properties in input files. lam-u57-report=error will make the linker issue an error for missing properties in input files.  Supported for Linux/x86_64. lam-report=none lam-report=warning lam-report=error Specify how to report the missing GNU_PROPERTY_X86_FEATURE_1_LAM_U48 and GNU_PROPERTY_X86_FEATURE_1_LAM_U57 properties in input .note.gnu.property section.  lam-report=none, which is the default, will make the linker not report missing properties in input files.  lam-report=warning will make the linker issue a warning for missing properties in input files. lam-report=error will make the linker issue an error for missing properties in input files.  Supported for Linux/x86_64. lazy When generating an executable or shared library, mark it to tell the dynamic linker to defer function call resolution to the point when the function is called (lazy binding), rather than at load time.  Lazy binding is the default. loadfltr Specify that the object's filters be processed immediately at runtime. max-page-size=value Set the maximum memory page size supported to value. muldefs Allow multiple definitions. nocopyreloc Disable linker generated .dynbss variables used in place of variables defined in shared libraries.  May result in dynamic text relocations. nodefaultlib Specify that the dynamic loader search for dependencies of this object should ignore any default library search paths. nodelete Specify that the object shouldn't be unloaded at runtime. nodlopen Specify that the object is not available to \"dlopen\". nodump Specify that the object can not be dumped by \"dldump\". noexecstack Marks the object as not requiring executable stack. noextern-protected-data Don't treat protected data symbols as external when building a shared library.  This option overrides the linker backend default.  It can be used to work around incorrect relocations against protected data symbols generated by compiler.  Updates on protected data symbols by another module aren't visible to the resulting shared library.  Supported for i386 and x86-64. noreloc-overflow Disable relocation overflow check.  This can be used to disable relocation overflow check if there will be no dynamic relocation overflow at run-time.  Supported for x86_64. now When generating an executable or shared library, mark it to tell the dynamic linker to resolve all symbols when the program is started, or when the shared library is loaded by dlopen, instead of deferring function call resolution to the point when the function is first called. origin Specify that the object requires $ORIGIN handling in paths. pack-relative-relocs nopack-relative-relocs Generate compact relative relocation in position-independent executable and shared library.  It adds \"DT_RELR\", \"DT_RELRSZ\" and \"DT_RELRENT\" entries to the dynamic section.  It is ignored when building position-dependent executable and relocatable output.  nopack-relative-relocs is the default, which disables compact relative relocation.  When linked against the GNU C Library, a GLIBC_ABI_DT_RELR symbol version dependency on the shared C Library is added to the output.  Supported for i386 and x86-64. relro norelro Create an ELF \"PT_GNU_RELRO\" segment header in the object. This specifies a memory segment that should be made read-only after relocation, if supported.  Specifying common-page-size smaller than the system page size will render this protection ineffective.  Don't create an ELF \"PT_GNU_RELRO\" segment if norelro. report-relative-reloc Report dynamic relative relocations generated by linker. Supported for Linux/i386 and Linux/x86_64. separate-code noseparate-code Create separate code \"PT_LOAD\" segment header in the object. This specifies a memory segment that should contain only instructions and must be in wholly disjoint pages from any other data.  Don't create separate code \"PT_LOAD\" segment if noseparate-code is used. shstk Generate GNU_PROPERTY_X86_FEATURE_1_SHSTK in .note.gnu.property section to indicate compatibility with Intel Shadow Stack. Supported for Linux/i386 and Linux/x86_64. stack-size=value Specify a stack size for an ELF \"PT_GNU_STACK\" segment. Specifying zero will override any default non-zero sized \"PT_GNU_STACK\" segment creation. start-stop-gc nostart-stop-gc When --gc-sections is in effect, a reference from a retained section to \"__start_SECNAME\" or \"__stop_SECNAME\" causes all input sections named \"SECNAME\" to also be retained, if \"SECNAME\" is representable as a C identifier and either \"__start_SECNAME\" or \"__stop_SECNAME\" is synthesized by the linker.  -z start-stop-gc disables this effect, allowing sections to be garbage collected as if the special synthesized symbols were not defined.  -z start-stop-gc has no effect on a definition of \"__start_SECNAME\" or \"__stop_SECNAME\" in an object file or linker script.  Such a definition will prevent the linker providing a synthesized \"__start_SECNAME\" or \"__stop_SECNAME\" respectively, and therefore the special treatment by garbage collection for those references. start-stop-visibility=value Specify the ELF symbol visibility for synthesized \"__start_SECNAME\" and \"__stop_SECNAME\" symbols.  value must be exactly default, internal, hidden, or protected.  If no -z start-stop-visibility option is given, protected is used for compatibility with historical practice.  However, it's highly recommended to use -z start-stop-visibility=hidden in new programs and shared libraries so that these symbols are not exported between shared objects, which is not usually what's intended. text notext textoff Report an error if DT_TEXTREL is set, i.e., if the position- independent or shared object has dynamic relocations in read- only sections.  Don't report an error if notext or textoff. undefs Do not report unresolved symbol references from regular object files, either when creating an executable, or when creating a shared library.  This option is the inverse of -z defs. unique-symbol nounique-symbol Avoid duplicated local symbol names in the symbol string table. Append \".\"number\"\" to duplicated local symbol names if unique- symbol is used.  nounique-symbol is the default. x86-64-baseline x86-64-v2 x86-64-v3 x86-64-v4 Specify the x86-64 ISA level needed in .note.gnu.property section.  x86-64-baseline generates \"GNU_PROPERTY_X86_ISA_1_BASELINE\".  x86-64-v2 generates \"GNU_PROPERTY_X86_ISA_1_V2\".  x86-64-v3 generates \"GNU_PROPERTY_X86_ISA_1_V3\".  x86-64-v4 generates \"GNU_PROPERTY_X86_ISA_1_V4\".  Supported for Linux/i386 and Linux/x86_64. Other keywords are ignored for Solaris compatibility."
  command: "ld.bfd"
  example: "ld.bfd -z keyword"
- id: 1157
  intent: "The archives should be a list of archive files.  They may be either explicit file names, or -l options. The specified archives are searched repeatedly until no new undefined references are created.  Normally, an archive is searched only once in the order that it is specified on the command line. If a symbol in that archive is needed to resolve an undefined symbol referred to by an object in an archive that appears later on the command line, the linker would not be able to resolve that reference.  By grouping the archives, they will all be searched repeatedly until all possible references are resolved. Using this option has a significant performance cost.  It is best to use it only when there are unavoidable circular references between two or more archives."
  command: "ld.bfd"
  example: "ld.bfd --start-group archives --end-group"
- id: 1158
  intent: "This option affects ELF DT_NEEDED tags for dynamic libraries mentioned on the command line after the --as-needed option. Normally the linker will add a DT_NEEDED tag for each dynamic library mentioned on the command line, regardless of whether the library is actually needed or not.  --as-needed causes a DT_NEEDED tag to only be emitted for a library that at that point in the link satisfies a non-weak undefined symbol reference from a regular object file or, if the library is not found in the DT_NEEDED lists of other needed libraries, a non-weak undefined symbol reference from another needed dynamic library.  Object files or libraries appearing on the command line after the library in question do not affect whether the library is seen as needed.  This is similar to the rules for extraction of object files from archives. --no-as-needed restores the default behaviour. Note: On Linux based systems the --as-needed option also has an affect on the behaviour of the --rpath and --rpath-link options. See the description of --rpath-link for more details."
  command: "ld.bfd"
  example: "ld.bfd --no-as-needed"
- id: 1159
  intent: "Do not link against shared libraries.  This is only meaningful on platforms for which shared libraries are supported.  The different variants of this option are for compatibility with various systems. You may use this option multiple times on the command line: it affects library searching for -l options which follow it.  This option also implies --unresolved-symbols=report-all.  This option can be used with -shared.  Doing so means that a shared library is being created but that all of the library's external references must be resolved by pulling in entries from static libraries."
  command: "ld.bfd"
  example: "ld.bfd -static"
- id: 1160
  intent: "These options control whether to demangle symbol names in error messages and other output.  When the linker is told to demangle, it tries to present symbol names in a readable fashion: it strips leading underscores if they are used by the object file format, and converts C++ mangled symbol names into user readable names. Different compilers have different mangling styles.  The optional demangling style argument can be used to choose an appropriate demangling style for your compiler.  The linker will demangle by default unless the environment variable COLLECT_NO_DEMANGLE is set. These options may be used to override the default."
  command: "ld.bfd"
  example: "ld.bfd --no-demangle"
- id: 1161
  intent: "Do not allow multiple definitions with symbols included in filename invoked by -R or --just-symbols"
  command: "ld.bfd"
  example: "ld.bfd --disable-multiple-abs-defs"
- id: 1162
  intent: "Do not display any warning or error messages.  This overrides --fatal-warnings if it has been enabled.  This option can be used when it is known that the output binary will not work, but there is still a need to create it."
  command: "ld.bfd"
  example: "ld.bfd --no-warnings"
- id: 1163
  intent: "Normally ld will give a warning if it finds an incompatible library during a library search.  This option silences the warning."
  command: "ld.bfd"
  example: "ld.bfd --no-warn-search-mismatch"
- id: 1164
  intent: "Turn off the effect of the --whole-archive option for subsequent archive files."
  command: "ld.bfd"
  example: "ld.bfd --no-whole-archive"
- id: 1165
  intent: "Only search library directories explicitly specified on the command line.  Library directories specified in linker scripts (including linker scripts specified on the command line) are ignored."
  command: "ld.bfd"
  example: "ld.bfd -nostdlib"
- id: 1166
  intent: "ld may be configured to support more than one kind of object file. If your ld is configured this way, you can use the --oformat option to specify the binary format for the output object file.  Even when ld is configured to support alternative object formats, you don't usually need to specify this, as ld should be configured to produce as a default output format the most usual format on each machine. output-format is a text string, the name of a particular format supported by the BFD libraries.  (You can list the available binary formats with objdump -i.)  The script command \"OUTPUT_FORMAT\" can also specify the output format, but this option overrides it."
  command: "ld.bfd"
  example: "ld.bfd --oformat=output-format"
- id: 1167
  intent: "When creating an ELF executable or shared object for a target where the read-only data is in its own segment separate from the executable text, it will set the address of the first byte of the read-only data segment."
  command: "ld.bfd"
  example: "ld.bfd -Trodata-segment=org"
- id: 1168
  intent: "When creating an ELF executable or shared object for x86-64 medium memory model, it will set the address of the first byte of the ldata segment."
  command: "ld.bfd"
  example: "ld.bfd -Tldata-segment=org"
- id: 1169
  intent: "Determine how to handle unresolved symbols.  There are four possible values for method: ignore-all Do not report any unresolved symbols. report-all Report all unresolved symbols.  This is the default. ignore-in-object-files Report unresolved symbols that are contained in shared libraries, but ignore them if they come from regular object files. ignore-in-shared-libs Report unresolved symbols that come from regular object files, but ignore them if they come from shared libraries.  This can be useful when creating a dynamic binary and it is known that all the shared libraries that it should be referencing are included on the linker's command line. The behaviour for shared libraries on their own can also be controlled by the --[no-]allow-shlib-undefined option. Normally the linker will generate an error message for each reported unresolved symbol but the option --warn-unresolved-symbols can change this to a warning."
  command: "ld.bfd"
  example: "ld.bfd --unresolved-symbols=method"
- id: 1170
  intent: "Warn if any global constructors are used.  This is only useful for a few object file formats.  For formats like COFF or ELF, the linker can not detect the use of global constructors."
  command: "ld.bfd"
  example: "ld.bfd --warn-constructors"
- id: 1171
  intent: "Warn if the linker adds DT_TEXTREL to a position-independent executable or shared object."
  command: "ld.bfd"
  example: "ld.bfd --warn-textrel"
- id: 1172
  intent: "Warn if an object has alternate ELF machine code."
  command: "ld.bfd"
  example: "ld.bfd --warn-alternate-em"
- id: 1173
  intent: "If the linker is going to report an unresolved symbol (see the option --unresolved-symbols) it will normally generate an error. This option makes it generate a warning instead."
  command: "ld.bfd"
  example: "ld.bfd --warn-unresolved-symbols"
- id: 1174
  intent: "For each archive mentioned on the command line after the --whole-archive option, include every object file in the archive in the link, rather than searching the archive for the required object files.  This is normally used to turn an archive file into a shared library, forcing every object to be included in the resulting shared library.  This option may be used more than once. Two notes when using this option from gcc: First, gcc doesn't know about this option, so you have to use -Wl,-whole-archive.  Second, don't forget to use -Wl,-no-whole-archive after your list of archives, because gcc will add its own list of archives to your link and you may not want this flag to affect those as well."
  command: "ld.bfd"
  example: "ld.bfd --whole-archive"
- id: 1175
  intent: "Request (--eh-frame-hdr) or suppress (--no-eh-frame-hdr) the creation of \".eh_frame_hdr\" section and ELF \"PT_GNU_EH_FRAME\" segment header."
  command: "ld.bfd"
  example: "ld.bfd --no-eh-frame-hdr"
- id: 1176
  intent: "Request creation of \".eh_frame\" unwind info for linker generated code sections like PLT.  This option is on by default if linker generated unwind info is supported.  This option also controls the generation of \".sframe\" unwind info for linker generated code sections like PLT."
  command: "ld.bfd"
  example: "ld.bfd --no-ld-generated-unwind-info"
- id: 1177
  intent: "Set the type of linker's hash table(s).  style can be either \"sysv\" for classic ELF \".hash\" section, \"gnu\" for new style GNU \".gnu.hash\" section or \"both\" for both the classic ELF \".hash\" and new style GNU \".gnu.hash\" hash tables.  The default depends upon how the linker was configured, but for most Linux based systems it will be \"both\"."
  command: "ld.bfd"
  example: "ld.bfd --hash-style=style"
- id: 1178
  intent: "Request the creation of a \".note.package\" ELF note section.  The contents of the note are in JSON format, as per the package metadata specification.  For more information see: https://systemd.io/ELF_PACKAGE_METADATA/ If the JSON argument is missing/empty then this will disable the creation of the metadata note, if one had been enabled by an earlier occurrence of the --package-metdata option.  If the linker has been built with libjansson, then the JSON string will be validated. The i386 PE linker supports the -shared option, which causes the output to be a dynamically linked library (DLL) instead of a normal executable.  You should name the output \"*.dll\" when you use this option.  In addition, the linker fully supports the standard \"*.def\" files, which may be specified on the linker command line like an object file (in fact, it should precede archives it exports symbols from, to ensure that they get linked in, just like a normal object file). In addition to the options common to all targets, the i386 PE linker support additional command-line options that are specific to the i386 PE target.  Options that take values may be separated from their values by either a space or an equals sign."
  command: "ld.bfd"
  example: "ld.bfd --package-metadata=JSON"
- id: 1179
  intent: "If given, symbols with a stdcall suffix (@nn) will be exported as- is and also with the suffix stripped.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --add-stdcall-alias"
- id: 1180
  intent: "Create a DLL instead of a regular executable.  You may also use -shared or specify a \"LIBRARY\" in a given \".def\" file.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --dll"
- id: 1181
  intent: "The PE variants of the COFF object format add an extension that permits the use of section names longer than eight characters, the normal limit for COFF.  By default, these names are only allowed in object files, as fully-linked executable images do not carry the COFF string table required to support the longer names.  As a GNU extension, it is possible to allow their use in executable images as well, or to (probably pointlessly!)  disallow it in object files, by using these two options.  Executable images generated with these long section names are slightly non-standard, carrying as they do a string table, and may generate confusing output when examined with non-GNU PE-aware tools, such as file viewers and dumpers.  However, GDB relies on the use of PE long section names to find Dwarf-2 debug information sections in an executable image at runtime, and so if neither option is specified on the command- line, ld will enable long section names, overriding the default and technically correct behaviour, when it finds the presence of debug information while linking an executable image and not stripping symbols.  [This option is valid for all PE targeted ports of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --disable-long-section-names"
- id: 1182
  intent: "Automatically choose the image base for DLLs, optionally starting with base value, unless one is specified using the \"--image-base\" argument.  By using a hash generated from the dllname to create unique image bases for each DLL, in-memory collisions and relocations which can delay program execution are avoided.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --enable-auto-image-base=value"
- id: 1183
  intent: "When linking dynamically to a dll without an import library, search for \"<string><basename>.dll\" in preference to \"lib<basename>.dll\". This behaviour allows easy distinction between DLLs built for the various \"subplatforms\": native, cygwin, uwin, pw, etc.  For instance, cygwin DLLs typically use \"--dll-search-prefix=cyg\". [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --dll-search-prefix string"
- id: 1184
  intent: "Do sophisticated linking of \"_symbol\" to \"__imp__symbol\" for DATA imports from DLLs, thus making it possible to bypass the dllimport mechanism on the user side and to reference unmangled symbol names. [This option is specific to the i386 PE targeted port of the linker] The following remarks pertain to the original implementation of the feature and are obsolete nowadays for Cygwin and MinGW targets. Note: Use of the 'auto-import' extension will cause the text section of the image file to be made writable. This does not conform to the PE-COFF format specification published by Microsoft. Note - use of the 'auto-import' extension will also cause read only data which would normally be placed into the .rdata section to be placed into the .data section instead.  This is in order to work around a problem with consts that is described here: http://www.cygwin.com/ml/cygwin/2004-09/msg01101.html Using 'auto-import' generally will 'just work' -- but sometimes you may see this message: \"variable '<var>' can't be auto-imported. Please read the documentation for ld's \"--enable-auto-import\" for details.\" This message occurs when some (sub)expression accesses an address ultimately given by the sum of two constants (Win32 import tables only allow one).  Instances where this may occur include accesses to member fields of struct variables imported from a DLL, as well as using a constant index into an array variable imported from a DLL.  Any multiword variable (arrays, structs, long long, etc) may trigger this error condition.  However, regardless of the exact data type of the offending exported variable, ld will always detect it, issue the warning, and exit. There are several ways to address this difficulty, regardless of the data type of the exported variable: One way is to use --enable-runtime-pseudo-reloc switch. This leaves the task of adjusting references in your client code for runtime environment, so this method works only when runtime environment supports this feature. A second solution is to force one of the 'constants' to be a variable -- that is, unknown and un-optimizable at compile time. For arrays, there are two possibilities: a) make the indexee (the array's address) a variable, or b) make the 'constant' index a variable.  Thus: extern type extern_array[]; extern_array[1] --> { volatile type *t=extern_array; t[1] } or extern type extern_array[]; extern_array[1] --> { volatile int t=1; extern_array[t] } For structs (and most other multiword data types) the only option is to make the struct itself (or the long long, or the ...) variable: extern struct s extern_struct; extern_struct.field --> { volatile struct s *t=&extern_struct; t->field } or extern long long extern_ll; extern_ll --> { volatile long long * local_ll=&extern_ll; *local_ll } A third method of dealing with this difficulty is to abandon 'auto-import' for the offending symbol and mark it with \"__declspec(dllimport)\".  However, in practice that requires using compile-time #defines to indicate whether you are building a DLL, building client code that will link to the DLL, or merely building/linking to a static library.   In making the choice between the various methods of resolving the 'direct address with constant offset' problem, you should consider typical real-world usage: Original: --foo.h extern int arr[]; --foo.c #include \"foo.h\" void main(int argc, char **argv){ printf(\"%d\\n\",arr[1]); } Solution 1: --foo.h extern int arr[]; --foo.c #include \"foo.h\" void main(int argc, char **argv){ /* This workaround is for win32 and cygwin; do not \"optimize\" */ volatile int *parr = arr; printf(\"%d\\n\",parr[1]); } Solution 2: --foo.h /* Note: auto-export is assumed (no __declspec(dllexport)) */ #if (defined(_WIN32) || defined(__CYGWIN__)) && \\ !(defined(FOO_BUILD_DLL) || defined(FOO_STATIC)) #define FOO_IMPORT __declspec(dllimport) #else #define FOO_IMPORT #endif extern FOO_IMPORT int arr[]; --foo.c #include \"foo.h\" void main(int argc, char **argv){ printf(\"%d\\n\",arr[1]); } A fourth way to avoid this problem is to re-code your library to use a functional interface rather than a data interface for the offending variables (e.g. set_foo() and get_foo() accessor functions)."
  command: "ld.bfd"
  example: "ld.bfd --enable-auto-import"
- id: 1185
  intent: "Do not create pseudo relocations for non-zero offset DATA imports from DLLs.  [This option is specific to the i386 PE targeted port of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --disable-runtime-pseudo-reloc"
- id: 1186
  intent: "Specifies the subsystem under which your program will execute.  The legal values for which are \"native\", \"windows\", \"console\", \"posix\", and \"xbox\".  You may optionally set the subsystem version also. Numeric values are also accepted for which.  [This option is specific to the i386 PE targeted port of the linker] The following options set flags in the \"DllCharacteristics\" field of the PE file header: [These options are specific to PE targeted ports of the linker]"
  command: "ld.bfd"
  example: "ld.bfd --subsystem which:major.minor"
- id: 1187
  intent: "The image is Terminal Server aware.  This option is disabled by default."
  command: "ld.bfd"
  example: "ld.bfd --disable-tsaware"
