- id: 597
  intent: "Set user parameter.  PARAM is an arbitrary user parameter name. This is an interface to the API UserParam option (see the Image::ExifTool Options documentation), and provides a method to access user-defined parameters in arguments to the -if and -p options as if they were any other tag.  Appending a hash tag (\"#\") to PARAM (eg. \"-userParam MyTag#=yes\") also causes the parameter to be extracted as a normal tag in the UserParam group.  Similar to the -api option, the parameter value is set to 1 if =VAL is omitted, undef if just VAL is omitted with \"=\", or an empty string if VAL is omitted with \"^=\". exiftool -p '$test from $filename' -userparam test=Hello FILE Advanced formatting feature An advanced formatting feature allows modification of the value of any tag interpolated within a -if or -p option argument, or a -tagsFromFile redirection string.  Tag names within these strings are prefixed by a \"$\" symbol, and an arbitrary Perl expression may be applied to the tag value by placing braces around the tag name and inserting the expression after the name, separated by a semicolon (ie. \"${TAG;EXPR}\").  The expression acts on the value of the tag through the default input variable ($_), and has access to the full ExifTool API through the current ExifTool object ($self) and the tag key ($tag). It may contain any valid Perl code, including translation (\"tr///\") and substitution (\"s///\") operations, but note that braces within the expression must be balanced.  The example below prints the camera Make with spaces translated to underlines, and multiple consecutive underlines replaced by a single underline: exiftool -p '${make;tr/ /_/;s/__+/_/g}' image.jpg An \"@\" may be added after the tag name to make the expression act on individual list items for list-type tags, simplifying list processing. Set $_ to undef to remove an item from the list.  As an example, the following command returns all subjects not containing the string \"xxx\": exiftool -p '${subject@;$_=undef if /xxx/}' image.jpg A default expression of \"tr(/\\\\?*:|\"<>\\0)()d\" is assumed if the expression is empty (ie. \"${TAG;}\").  This removes the characters / \\ ? * : | < > and null from the printed value.  (These characters are illegal in Windows file names, so this feature is useful if tag values are used in file names.) Helper functions \"DateFmt\" Simplifies reformatting of individual date/time values.  This function acts on a standard EXIF-formatted date/time value in $_ and formats it according to the specified format string (see the -d option).  To avoid trying to reformat an already-formatted date/time value, a \"#\" must be added to the tag name (as in the example below) if the -d option is also used.  For example: exiftool -p '${createdate#;DateFmt(\"%Y-%m-%d_%H%M%S\")}' a.jpg \"ShiftTime\" Shifts EXIF-formatted date/time string by a specified amount.  Start with a leading minus sign to shift backwards in time.  See Image::ExifTool::Shift.pl for details about shift syntax.  For example, to shift a date/time value back by one year: exiftool -p '${createdate;ShiftTime(\"-1:0:0 0\")}' a.jpg \"NoDups\" Removes duplicate items from a list with a separator specified by the"
  command: "exiftool"
  example: "exiftool -userParam PARAM[[^]=[VAL]]"
