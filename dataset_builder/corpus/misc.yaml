mplementation detail for how the '--invert' flag works.) TAP_ONLY Set to '1' to set the --only flag TAP_TS Set to '1' to enable automatic typescript support TAP_JSX Set to '1' to enable automatic jsx support Config Files: You can create a yaml file with any of the options above. By de- fault, the file at ./.taprc will be loaded, but the --rcfile op- tion or TAP_RCFILE environment variable can modify this. Run 'tap --dump-config' for a listing of what can be set in that file. Each of the keys corresponds to one of the options above. run.js 16.3.2                   September 2024                       RUN.JS(1)"
