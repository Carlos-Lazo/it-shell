t   also  recognizes  a  SGR  action  corresponding  to  ANSI/ISO 6429/ECMA Set Graphics Rendition, with the  values  NORMAL,  BOLD, UNDERLINE,  BLINK,  and  REVERSE.   All but NORMAL may be prefixed with o   \"+\" (turn on) or o   \"-\" (turn off). An SGR0 designates an  empty  highlight  sequence  (equivalent  to {SGR:NORMAL})."
