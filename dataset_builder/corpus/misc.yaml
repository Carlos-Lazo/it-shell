  intent: "pnmtojpeg [-exif=filespec] [-quality=n] [{-grayscale|-greyscale}] [-density=nxn[dpi,dpcm]] [-optimize|-optimise] [-rgb] [-progressive] [-comment=text] [-dct={int|fast|float}] [-arithmetic] [-restart=n] [-smooth=n] [-maxmemory=n] [-verbose] [-baseline] [-qtables=filespec] [-qslots=n[,...]] [-sample=HxV[,...]] [-scans=filespec] [-tracelevel=N] filename Minimum unique abbreviation of option is acceptable. You may use dou- ble hyphens instead of single hyphen to denote options. You may use white space in place of the equals sign to separate an option name from its value."
