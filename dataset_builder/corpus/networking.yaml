  intent: "This option sets the image format used to embed bitmaps extracted from PostScript or PDF data. By default, dvisvgm embeds all bitmaps as JPEG images because it's the most compact of the two formats supported by SVG. To select the alternative lossless PNG format, --bitmap-format=png can be used. There are some more format variants dvisvgm currently supports even though jpeg and png should be sufficient in most cases. The following list gives an overview of the known format names which correspond to names of Ghostscript output devices. none       disable processing of bitmap images jpeg       color JPEG format jpeggray   grayscale JPEG format png        grayscale or 24-bit color PNG format depending on current color space pnggray    grayscale PNG format pngmono    black-and-white PNG format pngmonod   dithered black-and-white PNG format png16      4-bit color PNG format png256     8-bit color PNG format png16m     24-bit color PNG format Since the collection of supported output devices can vary among local Ghostscript installations, not all formats may be available in some environments. dvisvgm quits with a PostScript error message if the selected output format requires a locally unsupported output device. The two JPEG format specifiers accept an optional parameter to set the IJG quality level which must directly follow the format specifier separated by a colon, e.g.  --bitmap-format=jpeg:50. The quality value is an integer between 0 and 100. Higher values result in better image quality but lower compression rates and therefore larger files. The default quality level is 75 which is applied if no quality parameter is given or if it's set to 0."
  command: "dvisvgm"
  example: "dvisvgm -B, --bitmap-format=fmt"
