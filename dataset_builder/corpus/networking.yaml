- id: 1886
  intent: "Adds AUDITLIB to the \"DT_DEPAUDIT\" entry of the dynamic section. AUDITLIB is not checked for existence, nor will it use the DT_SONAME specified in the library.  If specified multiple times \"DT_DEPAUDIT\" will contain a colon separated list of audit interfaces to use.  This option is only meaningful on ELF platforms supporting the rtld-audit interface.  The -P option is provided for Solaris compatibility."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld -P AUDITLIB"
- id: 1887
  intent: "This option avoids generating an error if an input section does not fit a matching output section. The linker tries to allocate the input section to subseque nt matching output sections, and generates an error only if no output section is large enough.  This is useful when several non-contiguous memory regions are available and the input section does not require a particular one.  The order in which input sections are evaluated does not change, for instance: MEMORY { MEM1 (rwx) : ORIGIN : 0x1000, LENGTH = 0x14 MEM2 (rwx) : ORIGIN : 0x1000, LENGTH = 0x40 MEM3 (rwx) : ORIGIN : 0x2000, LENGTH = 0x40 } SECTIONS { mem1 : { *(.data.*); } > MEM1 mem2 : { *(.data.*); } > MEM2 mem3 : { *(.data.*); } > MEM2 } with input sections: .data.1: size 8 .data.2: size 0x10 .data.3: size 4 results in .data.1 affected to mem1, and .data.2 and .data.3 affected to mem2, even though .data.3 would fit in mem3. This option is incompatible with INSERT statements because it changes the way input sections are mapped to output sections."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --enable-non-contiguous-regions"
- id: 1888
  intent: "When creating a dynamically linked executable, symbols matching glob will be added to the dynamic symbol table. When creating a shared library, references to symbols matching glob will not be bound to the definitions within the shared library. This option is a no-op when creating a shared library and -Bsymbolic or --dynamic-list are not specified. This option is only meaningful on ELF platforms which support shared libraries."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --export-dynamic-symbol=glob"
- id: 1889
  intent: "format."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld -EL Link little-endian objects.  This affects the default output"
- id: 1890
  intent: "Set the text and data sections to be readable and writable.  Also, do not page-align the data segment, and disable linking against shared libraries.  If the output format supports Unix style magic numbers, mark the output as \"OMAGIC\". Note: Although a writable text section is allowed for PE-COFF targets, it does not conform to the format specification published by Microsoft."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld --omagic"
