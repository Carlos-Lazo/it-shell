  intent: "size [-A|-B|-G|--format=compatibility] [--help] [-d|-o|-x|--radix=number] [--common] [-t|--totals] [--target=bfdname] [-V|--version] [-f] [objfile...]"
  command: "x86_64-linux-gnu-size"
  example: "x86_64-linux-gnu-size"
- id: 2129
  intent: "Using one of these options, you can choose whether the output from GNU size resembles output from System V size (using -A, or --format=sysv), or Berkeley size (using -B, or --format=berkeley). The default is the one-line format similar to Berkeley's. Alternatively, you can choose the GNU format output (using -G, or --format=gnu), this is similar to Berkeley's output format, but sizes are counted differently. Here is an example of the Berkeley (default) format of output from size: $ size --format=Berkeley ranlib size text    data     bss     dec     hex filename 294880   81920   11592  388392   5ed28 ranlib 294880   81920   11888  388688   5ee50 size The Berkeley style output counts read only data in the \"text\" column, not in the \"data\" column, the \"dec\" and \"hex\" columns both display the sum of the \"text\", \"data\", and \"bss\" columns in decimal and hexadecimal respectively. The GNU format counts read only data in the \"data\" column, not the \"text\" column, and only displays the sum of the \"text\", \"data\", and \"bss\" columns once, in the \"total\" column.  The --radix option can be used to change the number base for all columns.  Here is the same data displayed with GNU conventions: $ size --format=GNU ranlib size text       data        bss      total filename 279880      96920      11592     388392 ranlib 279880      96920      11888     388688 size This is the same data, but displayed closer to System V conventions: $ size --format=SysV ranlib size ranlib  : section         size         addr .text         294880         8192 .data          81920       303104 .bss           11592       385024 Total         388392 size  : section         size         addr .text         294880         8192 .data          81920       303104 .bss           11888       385024 Total         388688"
  command: "x86_64-linux-gnu-size"
  example: "x86_64-linux-gnu-size --format=compatibility"
- id: 2130
  intent: "Show totals of all objects listed (Berkeley or GNU format mode only)."
