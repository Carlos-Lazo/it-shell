  intent: "This specifies the endianness of the PFM image.  The samples in the raster of a PFM image are 4 byte IEEE floating point numbers.  A parameter of the IEEE format, and therefore the PFM format, is endianness, i.e. whether the specified bytes are ordered from low addresses to high addresses or vice versa. big means big endian -- the natural ordering; little means little-endian, the Intel-friendly ordering. Default is whichever endianness the machine on which pamtopfm runs  uses  internally,  which results in the faster execu- tion."
