  intent: "Displays all FQDNs of the machine. This  option  enumerates  all configured  network  addresses  on all configured network inter- faces, and translates them to DNS domain names.  Addresses  that cannot be translated (i.e. because they do not have an appropri- ate reverse IP entry) are skipped. Note that different addresses may  resolve  to the same name, therefore the output may contain duplicate entries. Do not make any assumptions about  the  order of the output."
  command: "nisdomainname"
  example: "nisdomainname -A, --all-fqdns"
- id: 908
  intent: "Display  the  name of the DNS domain.  Don't use the command do- mainname to get the DNS domain name because it will show the NIS domain  name  and not the DNS domain name. Use dnsdomainname in- stead. See the warnings in section THE FQDN above, and avoid us- ing this option."
  command: "nisdomainname"
  example: "nisdomainname -d, --domain"
- id: 909
  intent: "Display  the FQDN (Fully Qualified Domain Name). A FQDN consists of a short host name and the DNS domain name. Unless you are us- ing bind or NIS for host lookups you can change the FQDN and the DNS domain name (which is part of the FQDN)  in  the  /etc/hosts file.  See  the warnings in section THE FQDN above und use host- name --all-fqdns instead wherever possible."
  command: "nisdomainname"
  example: "nisdomainname -f, --fqdn, --long"
- id: 910
  intent: "Display the network address(es) of the host name. Note that this works only if the host name can be resolved.  Avoid  using  this option; use hostname --all-ip-addresses instead."
  command: "nisdomainname"
  example: "nisdomainname -i, --ip-address"
- id: 911
  intent: "Display  all  network addresses of the host. This option enumer- ates all configured addresses on  all  network  interfaces.  The loopback  interface  and  IPv6 link-local addresses are omitted. Contrary to option -i, this option does not depend on name reso- lution.  Do not make any assumptions about the order of the out- put."
  command: "nisdomainname"
  example: "nisdomainname -I, --all-ip-addresses"
