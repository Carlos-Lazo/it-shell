- id: 1235
  intent: "Show version Notes: 1)  [DEVICE]  is given as the full path to the cdc-wdm character device, e.g.: /dev/cdc-wdm0 2) The qmi-network script requires a profile to work. Unless ex- plicitly  specified  with `--profile', the file is assumed to be available in the following path: /etc/qmi-network.conf 3) The APN to use should be configured in the  profile,  in  the following way (e.g. assuming APN is called 'internet'): APN=internet 4)  Optional  APN user/password strings may be given in the fol- lowing way: APN_USER=user APN_PASS=password 5) Optional IP_TYPE strings may be given in the following way: IP_TYPE=[4|6] 6) If you want to instruct the qmi-network  script  to  use  the qmi-proxy setup, you can do so by configuring the following line in the profile: PROXY=yes 7) To instruct the qmi-network script to use an already existing Profile ID, or to create a new one on the fly, use the following configuration in the profile: PROFILE=number # to use the profile-id number PROFILE=auto # to create a temporary profile on the fly 8) Once the qmi-network script reports a  successful  connection you  still need to run a DHCP client on the associated WWAN net- work interface."
  command: "qmi-network"
  example: "qmi-network --version"
