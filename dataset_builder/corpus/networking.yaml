  intent: "Wait for NetworkManager startup to complete, rather than waiting for network connectivity specifically. Startup is considered complete once NetworkManager has activated (or attempted to activate) every auto-activate connection which is available given the current network state. This corresponds to the moment when NetworkManager logs \"startup complete\". This mode is generally only useful at boot time. After startup has completed, nm-online -s will just return immediately, regardless of the current network state. There are various ways to affect when startup complete is reached. For details see NetworkManager-wait-online.service(8)."
