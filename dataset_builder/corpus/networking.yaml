- id: 208
  intent: "(HTTP)  Connect  through an abstract Unix domain socket, instead of using the network.  Note: netstat shows the path  of  an  ab- stract  socket  prefixed  with  '@', however the <path> argument should not have this leading character. If --abstract-unix-socket is provided several  times,  the  last set value will be used. Example: curl --abstract-unix-socket socketpath https://example.com See also --unix-socket. Added in 7.53.0."
  command: "curl"
  example: "curl --abstract-unix-socket <path>"
- id: 209
  intent: "(HTTP) This is just an alias for -d, --data. --data-ascii can be used several times in a command line Example: curl --data-ascii @file https://example.com See also --data-binary, --data-raw and --data-urlencode."
  command: "curl"
  example: "curl --data-ascii <data>"
- id: 210
  intent: "(HTTP)  This  posts data exactly as specified with no extra pro- cessing whatsoever. If you start the data with the letter @, the rest  should  be  a filename. Data is posted in a similar manner as -d, --data does, except that newlines and carriage returns are preserved and con- versions are never done. Like  -d,  --data the default content-type sent to the server is application/x-www-form-urlencoded. If you want the  data  to  be treated as arbitrary binary data by the server then set the con- tent-type to octet-stream: -H \"Content-Type:  application/octet- stream\". If  this  option  is  used several times, the ones following the first will append data as described in -d, --data. --data-binary can be used several times in a command line Example: curl --data-binary @filename https://example.com See also --data-ascii."
  command: "curl"
  example: "curl --data-binary <data>"
- id: 211
  intent: "Examples: curl --data-urlencode name=val https://example.com curl --data-urlencode =encodethis https://example.com curl --data-urlencode name@file https://example.com curl --data-urlencode @fileonly https://example.com See also -d, --data and --data-raw."
  command: "curl"
  example: "curl --data-urlencode can be used several times in a command line"
- id: 212
  intent: "(HTTP MQTT) Sends the specified data in a POST  request  to  the HTTP server, in the same way that a browser does when a user has filled in an HTML form and presses the submit button. This  will cause curl to pass the data to the server using the content-type application/x-www-form-urlencoded. Compare to -F, --form. --data-raw is almost the same but does not have a special inter- pretation  of  the  @ character. To post data purely binary, you should instead use the --data-binary option. To  URL-encode  the value of a form field you may use --data-urlencode. If  any of these options is used more than once on the same com- mand line, the data pieces specified will be merged with a sepa- rating  &-symbol.  Thus,  using  '-d name=daniel -d skill=lousy' would    generate    a    post    chunk    that    looks    like 'name=daniel&skill=lousy'. If  you  start  the data with the letter @, the rest should be a file name to read the data from, or - if you want curl  to  read the  data  from  stdin.  Posting data from a file named 'foobar' would thus be done with -d, --data @foobar. When -d,  --data  is told  to  read  from a file like that, carriage returns and new- lines will be stripped out. If you do not want the  @  character to have a special interpretation use --data-raw instead. -d, --data can be used several times in a command line Examples: curl -d \"name=curl\" https://example.com curl -d \"name=curl\" -d \"tool=cmdline\" https://example.com curl -d @filename https://example.com See  also  --data-binary,  --data-urlencode and --data-raw. This option is mutually exclusive to -F, --form and  -I,  --head  and -T, --upload-file."
  command: "curl"
  example: "curl -d, --data <data>"
- id: 213
  intent: "(DNS) Tell curl to send outgoing DNS  requests  through  <inter- face>.  This  option is a counterpart to --interface (which does not affect DNS). The supplied string must be an  interface  name (not an address). If --dns-interface is provided several times, the last set value will be used. Example: curl --dns-interface eth0 https://example.com See also --dns-ipv4-addr  and  --dns-ipv6-addr.  --dns-interface requires  that  the  underlying  libcurl was built to support c- ares. Added in 7.33.0."
  command: "curl"
  example: "curl --dns-interface <interface>"
- id: 214
  intent: "(DNS) Tell curl to bind to <ip-address> when making IPv4 DNS re- quests,  so  that  the DNS requests originate from this address. The argument should be a single IPv4 address. If --dns-ipv4-addr is provided several times, the last set value will be used. Example: curl --dns-ipv4-addr 10.1.2.3 https://example.com See  also  --dns-interface  and --dns-ipv6-addr. --dns-ipv4-addr requires that the underlying libcurl was  built  to  support  c- ares. Added in 7.33.0."
  command: "curl"
  example: "curl --dns-ipv4-addr <address>"
- id: 215
  intent: "(DNS) Tell curl to bind to <ip-address> when making IPv6 DNS re- quests, so that the DNS requests originate  from  this  address. The argument should be a single IPv6 address. If --dns-ipv6-addr is provided several times, the last set value will be used. Example: curl --dns-ipv6-addr 2a04:4e42::561 https://example.com See also --dns-interface  and  --dns-ipv4-addr.  --dns-ipv6-addr requires  that  the  underlying  libcurl was built to support c- ares. Added in 7.33.0."
  command: "curl"
  example: "curl --dns-ipv6-addr <address>"
- id: 216
  intent: "Set the list of DNS servers to be used instead of the system de- fault.   The  list of IP addresses should be separated with com- mas. Port numbers may also optionally be given as :<port-number> after each IP address. If  --dns-servers  is provided several times, the last set value will be used. Example: curl --dns-servers 192.168.0.1,192.168.0.2 https://example.com See also --dns-interface and --dns-ipv4-addr. --dns-servers  re- quires  that the underlying libcurl was built to support c-ares. Added in 7.33.0."
  command: "curl"
  example: "curl --dns-servers <addresses>"
- id: 217
  intent: "Same as -k, --insecure but used for DoH (DNS-over-HTTPS). Providing  --doh-insecure  multiple  times  has no extra effect. Disable it again with --no-doh-insecure. Example: curl --doh-insecure --doh-url https://doh.example https://example.com See also --doh-url. Added in 7.76.0."
  command: "curl"
  example: "curl --doh-insecure"
- id: 218
  intent: "(FTP) Tell curl to not use the IP address the server suggests in its  response to curl's PASV command when curl connects the data connection. Instead curl will re-use the same IP address it  al- ready uses for the control connection. Since curl 7.74.0 this option is enabled by default. This  option has no effect if PORT, EPRT or EPSV is used instead of PASV. Providing --ftp-skip-pasv-ip multiple times has no extra effect. Disable it again with --no-ftp-skip-pasv-ip. Example: curl --ftp-skip-pasv-ip ftp://example.com/ See also --ftp-pasv."
  command: "curl"
  example: "curl --ftp-skip-pasv-ip"
- id: 219
  intent: "(FTP)  Require  SSL/TLS  for  the FTP login, clear for transfer. Allows secure authentication, but non-encrypted  data  transfers for  efficiency.  Fails the transfer if the server does not sup- port SSL/TLS. Providing --ftp-ssl-control multiple times has no extra  effect. Disable it again with --no-ftp-ssl-control. Example: curl --ftp-ssl-control ftp://example.com See also --ssl."
  command: "curl"
  example: "curl --ftp-ssl-control"
- id: 220
  intent: "Perform an operation using a specified interface. You can  enter interface  name,  IP address or host name. An example could look like: curl --interface eth0:1 https://www.example.com/ On Linux it can be used to specify a VRF, but the  binary  needs to  either  have CAP_NET_RAW or to be run as root. More informa- tion  about  Linux  VRF:   https://www.kernel.org/doc/Documenta- tion/networking/vrf.txt If  --interface  is  provided  several times, the last set value will be used. Example: curl --interface eth0 https://example.com See also --dns-interface."
  command: "curl"
  example: "curl --interface <name>"
- id: 221
  intent: "When used with -s, --silent, it makes curl show an error message if it fails. This option is global and does not need to be specified for each use of -:, --next. Providing -S, --show-error multiple times has no  extra  effect. Disable it again with --no-show-error. Example: curl --show-error --silent https://example.com See also --no-progress-meter."
  command: "curl"
  example: "curl -S, --show-error"
- id: 222
  intent: "(HTTP) Connect through this Unix domain socket, instead of using the network. If  --unix-socket  is provided several times, the last set value will be used. Example: curl --unix-socket socket-path https://example.com See also --abstract-unix-socket. Added in 7.40.0."
  command: "curl"
  example: "curl --unix-socket <path>"
- id: 223
  intent: "(all)  This  option adds a piece of data, usually a name + value pair, to the end of the URL query part. The syntax is  identical to that used for --data-urlencode with one extension: If the argument starts with a '+' (plus), the rest of the string is provided as-is unencoded. The query part of a URL is the one following the  question  mark on the right end. --url-query can be used several times in a command line Examples: curl --url-query name=val https://example.com curl --url-query =encodethis http://example.net/foo curl --url-query name@file https://example.com curl --url-query @fileonly https://example.com curl --url-query \"+name=%20foo\" https://example.com See also --data-urlencode and -G, --get. Added in 7.87.0."
  command: "curl"
  example: "curl --url-query <data>"
- id: 224
  intent: "Makes curl verbose during the operation.  Useful  for  debugging and  seeing  what's  going  on \"under the hood\". A line starting with '>' means \"header data\" sent by  curl,  '<'  means  \"header data\"  received  by  curl  that is hidden in normal cases, and a line starting with '*' means additional info provided by curl. If you only want HTTP headers in the output, -i, --include might be the option you are looking for. If you think this option still does not give you enough details, consider using --trace or --trace-ascii instead. This option is global and does not need to be specified for each use of -:, --next. Use -s, --silent to make curl really quiet. Providing  -v,  --verbose  multiple  times  has no extra effect. Disable it again with --no-verbose. Example: curl --verbose https://example.com See also -i, --include. This option  is  mutually  exclusive  to --trace and --trace-ascii."
  command: "curl"
  example: "curl -v, --verbose"
- id: 225
  intent: "Specify the input format.  The following formats are supported: LDIF     LDIF (LDAP Data Interchange Format) files can be ex- ported from an LDAP server to convert security policies used by sudoers.ldap(5).  If a base DN (distinguished name) is specified, only sudoRole objects that match the base DN will be processed.  Not all sudoOptions speci- fied in a sudoRole can be translated from LDIF to sudo- ers format. sudoers  Traditional sudoers format.  This is the default input format."
  command: "cvtsudoers"
  example: "cvtsudoers -i input_format, --input-format=input_format"
