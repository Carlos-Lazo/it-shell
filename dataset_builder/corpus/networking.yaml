  intent: "send ICMP ECHO_REQUEST to network hosts"
  command: "ping"
  example: "ping"
- id: 1109
  intent: "Use IPv4 only."
  command: "ping"
  example: "ping -4"
- id: 1110
  intent: "Use IPv6 only."
  command: "ping"
  example: "ping -6"
- id: 1111
  intent: "Audible ping."
  command: "ping"
  example: "ping -a"
- id: 1112
  intent: "Adaptive ping. Interpacket interval adapts to round-trip time, so that effectively not more than one (or more, if preload is set) unanswered probe is present in the network. Minimal interval is 200msec unless super-user. On networks with low RTT this mode is essentially equivalent to flood mode."
  command: "ping"
  example: "ping -A"
- id: 1113
  intent: "Allow pinging a broadcast address."
  command: "ping"
  example: "ping -b"
- id: 1114
  intent: "Do not allow ping to change source address of probes. The address is bound to one selected when ping starts."
  command: "ping"
  example: "ping -B"
- id: 1115
  intent: "Stop after sending count ECHO_REQUEST packets. With deadline option, ping waits for count ECHO_REPLY packets, until the timeout expires."
  command: "ping"
  example: "ping -c count"
- id: 1116
  intent: "Flood ping. For every ECHO_REQUEST sent a period \".\" is printed, while for every ECHO_REPLY received a backspace is printed. This provides a rapid display of how many packets are being dropped. If interval is not given, it sets interval to zero and outputs packets as fast as they come back or one hundred times per second, whichever is more. Only the super-user may use this option with zero interval."
  command: "ping"
  example: "ping -f"
- id: 1117
  intent: "Show help."
  command: "ping"
  example: "ping -h"
- id: 1118
  intent: "interface is either an address, an interface name or a VRF name. If interface is an address, it sets source address to specified interface address. If interface is an interface name, it sets source interface to specified interface. If interface is a VRF name, each packet is routed using the corresponding routing table; in this case, the -I option can be repeated to specify a source address. NOTE: For IPv6, when doing ping to a link-local scope address, link specification (by the '%'-notation in destination, or by this option) can be used but it is no longer required."
  command: "ping"
  example: "ping -I interface"
- id: 1119
  intent: "Suppress loopback of multicast packets. This flag only applies if the ping destination is a multicast address."
  command: "ping"
  example: "ping -L"
- id: 1120
  intent: "IPv6 only. Send ICMPv6 Node Information Queries (RFC4620), instead of Echo Request. CAP_NET_RAW capability is required. help Show help for NI support. name Queries for Node Names. ipv6 Queries for IPv6 Addresses. There are several IPv6 specific flags. ipv6-global Request IPv6 global-scope addresses. ipv6-sitelocal Request IPv6 site-local addresses. ipv6-linklocal Request IPv6 link-local addresses. ipv6-all Request IPv6 addresses on other interfaces. ipv4 Queries for IPv4 Addresses. There is one IPv4 specific flag. ipv4-all Request IPv4 addresses on other interfaces. subject-ipv6=ipv6addr IPv6 subject address. subject-ipv4=ipv4addr IPv4 subject address. subject-name=nodename Subject name. If it contains more than one dot, fully-qualified domain name is assumed. subject-fqdn=nodename Subject name. Fully-qualified domain name is always assumed."
  command: "ping"
  example: "ping -N nodeinfo_option"
- id: 1121
  intent: "Numeric output only. No attempt will be made to lookup symbolic names for host addresses."
  command: "ping"
  example: "ping -n"
- id: 1122
  intent: "You may specify up to 16 \"pad\" bytes to fill out the packet you send. This is useful for diagnosing data-dependent problems in a network. For example, -p ff will cause the sent packet to be filled with all ones."
  command: "ping"
  example: "ping -p pattern"
- id: 1123
  intent: "Bypass the normal routing tables and send directly to a host on an attached interface. If the host is not on a directly-attached network, an error is returned. This option can be used to ping a local host through an interface that has no route through it provided the option -I is also used."
  command: "ping"
  example: "ping -r"
- id: 1124
  intent: "ping only. Record route. Includes the RECORD_ROUTE option in the ECHO_REQUEST packet and displays the route buffer on returned packets. Note that the IP header is only large enough for nine such routes. Many hosts ignore or discard this option."
  command: "ping"
  example: "ping -R"
- id: 1125
  intent: "Specifies the number of data bytes to be sent. The default is 56, which translates into 64 ICMP data bytes when combined with the 8 bytes of ICMP header data."
  command: "ping"
  example: "ping -s packetsize"
- id: 1126
  intent: "Set special IP timestamp options.  timestamp option may be either tsonly (only timestamps), tsandaddr (timestamps and addresses) or tsprespec host1 [host2 [host3 [host4]]] (timestamp prespecified hops)."
  command: "ping"
  example: "ping -T timestamp option"
- id: 1127
  intent: "Print full user-to-user latency (the old behaviour). Normally ping prints network round trip time, which can be different f.e. due to DNS failures."
  command: "ping"
  example: "ping -U"
- id: 1128
  intent: "Show version and exit."
  command: "ping"
  example: "ping -V"
- id: 1129
  intent: "Specify a timeout, in seconds, before ping exits regardless of how many packets have been sent or received. In this case ping does not stop after count packet are sent, it waits either for deadline expire or until count probes are answered or for some error notification from network."
  command: "ping"
  example: "ping -w deadline"
