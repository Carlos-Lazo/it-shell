  intent: "Show entries, where CRITERION is one of the following: 1. the character *, selecting all entries; 2. a field of a database entry, for instance version or format*, according to which the output will be sorted.  Information in an unstripped database (see the option --no-strip  above)  is nested:  Subfields  of a record can be addressed using the -> separator, e.  g.   file->location,  style->units_per_em,  or names->sanitized->english->prefmodifiers.   NB:  shell syntax requires that arguments containing -> be properly quoted! 3. an expression of the form field:value to limit the output  to entries whose field matches value. The value can contain * to match an arbitrary number of characters. For example, in order to output  file  names  and  corresponding versions, sorted by the font format: ./luaotfload-tool.lua --list=\"format\" --fields=\"file->base,version\" This prints: otf latinmodern-math.otf  Version 1.958 otf lmromancaps10-oblique.otf 2.004 otf lmmono8-regular.otf 2.004 otf lmmonoproplt10-bold.otf 2.004 otf lmsans10-oblique.otf  2.004 otf lmromanslant8-regular.otf 2.004 otf lmroman12-italic.otf  2.004 otf lmsansdemicond10-oblique.otf  2.004 ..."
  command: "luaotfload-tool"
  example: "luaotfload-tool --list=CRITERION"
- id: 771
  intent: "Comma-separated list of fields that should be printed.  Informa- tion in an unstripped database (see the option --no-strip above) is  nested:  Subfields of a record can be addressed using the -> separator,  e.  g.   file->location,   style->units_per_em,   or names->sanitized->english->subfamily.   The  default  is  plain- name,version*.  (Only meaningful with --list.) font and lookup caches"
