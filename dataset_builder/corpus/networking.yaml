- id: 461
  intent: "This is a space or comma delimited  string  that  gives  options used  when verifying signatures. Options can be prepended with a `no-' to give the opposite meaning. The options are: show-photos Display any photo IDs present on the key that issued  the signature.  Defaults to no. See also --photo-viewer. show-policy-urls Show  policy  URLs  in  the signature being verified. De- faults to yes. show-notations show-std-notations show-user-notations Show all, IETF standard, or user-defined signature  nota- tions  in  the signature being verified. Defaults to IETF standard. show-keyserver-urls Show any preferred keyserver URL in the  signature  being verified.  Defaults to yes. show-uid-validity Display  the  calculated  validity of the user IDs on the key that issued the signature. Defaults to yes. show-unusable-uids Show revoked and expired user IDs during signature  veri- fication.  Defaults to no. show-primary-uid-only Show  only the primary user ID during signature verifica- tion.  That is all the AKA lines as well as photo Ids are not shown with the signature verification status. pka-lookups Enable  PKA lookups to verify sender addresses. Note that PKA is based on DNS, and so enabling this option may dis- close  information  on when and what signatures are veri- fied or to whom data is encrypted. This is similar to the \"web bug\" described for the --auto-key-retrieve option. pka-trust-increase Raise  the  trust in a signature to full if the signature passes PKA validation. This option is only meaningful  if pka-lookups is set."
  command: "gpg"
  example: "gpg --verify-options parameters"
- id: 462
  intent: "This option is deprecated - please use the --keyserver in 'dirm- ngr.conf' instead. Use name as your keyserver. This is the server  that  --receive- keys,  --send-keys,  and  --search-keys will communicate with to receive keys from, send keys to, and search  for  keys  on.  The format  of  the name is a URI: `scheme:[//]keyservername[:port]' The scheme is the type of keyserver: \"hkp\"/\"hkps\" for  the  HTTP (or  compatible)  keyservers or \"ldap\"/\"ldaps\" for the LDAP key- servers.  Note that your particular installation  of  GnuPG  may have  other keyserver types available as well. Keyserver schemes are case-insensitive. Most keyservers synchronize with each other, so there is  gener- ally no need to send keys to more than one server. The keyserver hkp://keys.gnupg.net uses round robin DNS to  give  a  different keyserver each time you use it."
  command: "gpg"
  example: "gpg --keyserver name"
