- id: 1181
  intent: "This option causes ppmtompeg to append the  statistics  that  it write  to  Standard  Output  to the file stat_file as well.  The statistics use  the  following  abbreviations:  bits  per  block (bpb),  bits  per frame (bpf), seconds per frame (spf), and bits per second (bps). These statistics include how many I, P, and B frames there were, and information about compression and quality."
  command: "ppmtompeg"
  example: "ppmtompeg -stat stat_file"
- id: 1182
  intent: "tio in the reported statistics.  Prints SNR (Y U V) and peak SNR (Y U V) for each frame.  In summary, prints  averages  of  lumi- nance  only  (Y).   SNR  is defined as 10*log(variance of origi- nal/variance   of   error).    Peak   SNR    is    defined    as 20*log(255/RMSE).  Note that ppmtompeg runs a little slower when you use this option."
  command: "ppmtompeg"
  example: "ppmtompeg -snr   This option causes ppmtompeg to include the signal-to-noise  ra-"
- id: 1183
  intent: "This option causes ppmtompeg to print a histogram of the motion vectors  as  part  of statistics.  There are three histograms -- one for P frame, one for forward B frame, and one for backward B frame motion vectors. The  output is in the form of a matrix, each entry corresponding to one motion vector in the search window. The center of the ma- trix represents (0,0) motion vectors."
  command: "ppmtompeg"
  example: "ppmtompeg -mv_histogram"
