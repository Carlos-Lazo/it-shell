- id: 1027
  intent: "This  option  is meaningful only if the lookup image (and there- fore the output) is a PNM image.  color specifies the color that is  to go in the output wherever the index from the input is not present in the lookup table (not present means the index exceeds the  dimensions of the lookup image -- e.g. index is 100 but the lookup image is a 50 x 1 PPM). If you don't specify this option or  -fit,  pamlookup  uses  the value  from  the top left corner of the lookup image whenever an index exceeds the dimensions of the lookup image. Specify the color (color) as described for the argument  of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . Another way to deal with a too-small lookup image is to use  the -fit option. This option has no effect if you also specify -fit or -byplane."
  command: "pamlookup"
  example: "pamlookup -missingcolor=color"
- id: 1028
  intent: "sary to fit the indices present in the index image, per the  in- dex image's maxval.  For example, if your index image has a sin- gle plane and a maxval of 255 and your lookup image is 1 row  of 10 columns, pamlookup stretches your lookup image to 255 columns before doing the lookups.  pamlookup  does  the  stretching  (or shrinking) with the pamscale(1) program. When you use -fit, pamlookup never fails or warns you because of invalid lookup image dimensions, and  the  -missingcolor  option has no effect. -fit  has no effect when you specify -byplane.  pamlookup always has the behavior requested by -fit when it does by plane  index- ing."
  command: "pamlookup"
  example: "pamlookup -fit   This  option says to shrink or expand the lookup image as neces-"
