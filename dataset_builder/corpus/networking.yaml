- id: 1592
  intent: "Turn off caching of DNS lookups.  Normally, Wget remembers the IP addresses it looked up from DNS so it doesn't have to repeatedly contact the DNS server for the same (typically small) set of hosts it retrieves from.  This cache exists in memory only; a new Wget run will contact DNS again. However, it has been reported that in some situations it is not desirable to cache host names, even for the duration of a short- running application like Wget.  With this option Wget issues a new DNS lookup (more precisely, a new call to \"gethostbyname\" or \"getaddrinfo\") each time it makes a new connection.  Please note that this option will not affect caching that might be performed by the resolving library or by an external caching layer, such as NSCD. If you don't understand exactly what this option does, you probably won't need it."
  command: "wget"
  example: "wget --no-dns-cache"
- id: 1593
  intent: "Force connecting to IPv4 or IPv6 addresses.  With --inet4-only or -4, Wget will only connect to IPv4 hosts, ignoring AAAA records in DNS, and refusing to connect to IPv6 addresses specified in URLs. Conversely, with --inet6-only or -6, Wget will only connect to IPv6 hosts and ignore A records and IPv4 addresses. Neither options should be needed normally.  By default, an IPv6-aware Wget will use the address family specified by the host's DNS record.  If the DNS responds with both IPv4 and IPv6 addresses, Wget will try them in sequence until it finds one it can connect to.  (Also see \"--prefer-family\" option described below.) These options can be used to deliberately force the use of IPv4 or IPv6 address families on dual family systems, usually to aid debugging or to deal with broken network configuration.  Only one of --inet6-only and --inet4-only may be specified at the same time. Neither option is available in Wget compiled without IPv6 support."
  command: "wget"
  example: "wget --inet6-only"
- id: 1594
  intent: "When given a choice of several addresses, connect to the addresses with specified address family first.  The address order returned by DNS is used without change by default. This avoids spurious errors and connect attempts when accessing hosts that resolve to both IPv6 and IPv4 addresses from IPv4 networks.  For example, www.kame.net resolves to 2001:200:0:8002:203:47ff:fea5:3085 and to 203.178.141.194.  When the preferred family is \"IPv4\", the IPv4 address is used first; when the preferred family is \"IPv6\", the IPv6 address is used first; if the specified value is \"none\", the address order returned by DNS is used without change. Unlike -4 and -6, this option doesn't inhibit access to any address family, it only changes the order in which the addresses are accessed.  Also note that the reordering performed by this option is stable---it doesn't affect order of addresses of the same family.  That is, the relative order of all IPv4 addresses and of all IPv6 addresses remains intact in all cases."
  command: "wget"
  example: "wget --prefer-family=none/IPv4/IPv6"
- id: 1595
  intent: "Disable generation of host-prefixed directories.  By default, invoking Wget with -r http://fly.srk.fer.hr/ will create a structure of directories beginning with fly.srk.fer.hr/.  This option disables such behavior."
