  intent: "Applies several optimizations on the generated SVG tree to reduce the file size. The optimizations are performed by running separate optimizer modules specified by optional argument modules. It may consist of a single module name or a comma-separated list of several module names. The corresponding modules are executed one by one in the given order and thus transform the XML tree gradually. The following list describes the currently available optimizer modules. list Lists all available optimizer modules and exits. none If this argument is given, dvisvgm doesn't apply any optimization.  none can't be combined with other module names. all Performs all optimizations listed below. This is also the default if option --optimize is used without argument. The modules are executed in a predefined order that usually leads to the best results.  all can't be combined with other module names. collapse-groups Combines nested group elements (<g>...</g>) that contain only a single group each. If possible, the group attributes are moved to the outermost element of the processed subtree. This module also unwraps group elements that have no attributes at all. group-attributes Creates groups (<g>...</g>) for common attributes around adjacent elements. Each attribute is moved to a separate group so that multiple common attributes lead to nested groups. They can be combined by applying optimizer module collapse-groups afterwards. The algorithm only takes inheritable properties, such as fill or stroke-width, into account and only removes them from an element if none of the other attributes, like id, prevents this. reassign-clippaths Collects all clipPath elements that differ only by their IDs. Afterwards, the duplicates are removed so that only one remains. All clip-path attributes referencing one of the duplicates are updated accordingly. remove-clippaths Removes all redundant clipPath elements. This optimization was already present in former versions of dvisvgm and was always applied by default. This behavior is retained, i.e. dvisvgm executes this module even if option --optimize is not given. You can use argument none to prevent that. simplify-text If a text element only contains whitespace nodes and tspan elements, all common inheritable attributes of the latter are moved to the enclosing text element. All tspan elements without further attributes are unwrapped. simplify-transform Tries to shorten all transform attributes. This module combines the transformation commands of each attribute and decomposes the resulting transformation matrix into a sequence of basic transformations, i.e. translation, scaling, rotation, and skewing. If this sequence is shorter than the equivalent matrix expression, it's assigned to the attribute. Otherwise, the matrix expression is used."
  command: "dvisvgm"
  example: "dvisvgm -O, --optimize[=modules]"
