  intent: "cpio {-o|--create} [-0acvABLV] [-C BYTES] [-H FORMAT] [-M MESSAGE] [-O [[USER@]HOST:]ARCHIVE] [-F [[USER@]HOST:]ARCHIVE] [--file=[[USER@]HOST:]ARCHIVE] [--format=FORMAT] [--message=MESSAGE] [--null] [--reset-access-time] [--verbose] [--dot] [--append] [--block-size=blocks] [--dereference] [--io-size=BYTES] [--quiet] [--force-local] [--rsh-command=COMMAND] < name-list [> archive] cpio {-i|--extract} [-bcdfmnrtsuvBSV] [-C BYTES] [-E FILE] [-H FORMAT] [-M MESSAGE] [-R [USER][:.][GROUP]] [-I [[USER@]HOST:]ARCHIVE] [-F [[USER@]HOST:]ARCHIVE] [--file=[[USER@]HOST:]ARCHIVE] [--make-directo- ries] [--nonmatching] [--preserve-modification-time] [--nu- meric-uid-gid] [--rename] [--list] [--swap-bytes] [--swap] [--dot] [--unconditional] [--verbose] [--block-size=BLOCKS] [--swap-halfwords] [--io-size=BYTES] [--pattern-file=FILE] [--format=FORMAT] [--owner=[USER][:.][GROUP]] [--no-preserve-owner] [--message=MESSAGE] [--force-local] [--no-absolute-filenames] [--sparse] [--only-ver- ify-crc] [--to-stdout] [--quiet] [--rsh-command=COMMAND] [pattern...] [< archive] cpio {-p|--pass-through} [-0adlmuvLV] [-R [USER][:.][GROUP]] [--null] [--reset-access-time] [--make-directories] [--link] [--quiet] [--pre- serve-modification-time] [--unconditional] [--verbose] [--dot] [--dereference] [--owner=[USER][:.][GROUP]] [--no-preserve-owner] [--sparse] destination-directory < name-list cpio {-?|--help|--usage|--version}"
  command: "cpio"
  example: "cpio"
- id: 279
  intent: "In copy-in and copy-pass mode, set the ownership  of  all  files created  to  the specified USER and/or GROUP.  In copy-out mode, store the supplied owner information in the archive. USER and GROUP are first looked up in the system user and  group databases.  If not found, cpio checks if they consist of decimal digits only and, if so, treats them as numeric UID and GID, cor- respondingly. To avoid the lookup and ensure that arguments are treated as nu- meric values, prefix them with a plus sign, e.g.: -R +0:+0."
  command: "cpio"
  example: "cpio -R, --owner=[USER][:.][GROUP]"
- id: 280
  intent: "Use this ARCHIVE-FILE instead  of  standard  input  (in  copy-in mode)  or standard output (in copy-out mode).  Optional USER and HOST specify the user and host names in case  of  a  remote  ar- chive."
  command: "cpio"
  example: "cpio -F, --file=[[USER@]HOST:]ARCHIVE-FILE"
