- id: 544
  intent: "The default to use for the check level when signing a key. 0  means  you  make  no particular claim as to how carefully you verified the key. 1 means you believe the key is owned by the person who claims to own it but you could not, or did not verify the key at all. This is useful for a \"persona\" verification, where you sign  the  key of a pseudonymous user. 2  means  you  did  casual verification of the key. For example, this could mean  that  you  verified  the  key  fingerprint  and checked the user ID on the key against a photo ID. 3  means you did extensive verification of the key. For example, this could mean that you verified the key fingerprint  with  the owner  of the key in person, and that you checked, by means of a hard to forge document with a photo ID (such as a passport) that the name of the key owner matches the name in the user ID on the key, and finally that you verified (by exchange of  email)  that the email address on the key belongs to the key owner. Note  that  the examples given above for levels 2 and 3 are just that: examples. In the end, it is up to you to decide just  what \"casual\" and \"extensive\" mean to you. This option defaults to 0 (no particular claim)."
  command: "gpg"
  example: "gpg --default-cert-level n"
- id: 545
  intent: "Set what trust model GnuPG should follow. The models are: pgp    This is the Web of Trust combined with  trust  signatures as  used  in PGP 5.x and later. This is the default trust model when creating a new trust database. classic This is the standard Web of Trust as introduced by PGP 2. tofu TOFU stands for Trust On First Use.  In this trust model, the  first time a key is seen, it is memorized.  If later another key with a user id with the same email address is seen, both keys are marked as suspect.  In that case, the next time either is used, a warning is displayed describ- ing  the conflict, why it might have occurred (either the user generated a new key and failed to cross sign the old and  new keys, the key is forgery, or a man-in-the-middle attack is being attempted), and the user is  prompted  to manually confirm the validity of the key in question. Because a potential attacker is able to control the email address and thereby circumvent the conflict detection al- gorithm  by using an email address that is similar in ap- pearance to a trusted email address, whenever  a  message is  verified,  statistics  about  the  number of messages signed with the key are shown.  In this way, a  user  can easily  identify attacks using fake keys for regular cor- respondents. When compared with the Web of Trust, TOFU offers signifi- cantly  weaker  security guarantees.  In particular, TOFU only helps ensure consistency (that is, that the  binding between a key and email address doesn't change).  A major advantage of TOFU is that it requires little  maintenance to  use correctly.  To use the web of trust properly, you need to actively sign keys and mark users as trusted  in- troducers.   This is a time-consuming process and anecdo- tal evidence suggests that even security-conscious  users rarely  take  the  time to do this thoroughly and instead rely on an ad-hoc TOFU process. In the TOFU model, policies are associated with  bindings between  keys  and  email  addresses (which are extracted from user ids and normalized).  There are five  policies, which can be set manually using the --tofu-policy option. The default policy can be set using  the  --tofu-default- policy option. The  TOFU policies are: auto, good, unknown, bad and ask. The auto policy is used by default (unless overridden  by --tofu-default-policy)  and marks a binding as marginally trusted.  The good, unknown and bad policies mark a bind- ing  as fully trusted, as having unknown trust or as hav- ing trust never, respectively.   The  unknown  policy  is useful  for  just  using TOFU to detect conflicts, but to never assign positive trust to a binding.  The final pol- icy,  ask  prompts  the  user  to  indicate the binding's trust.  If batch mode is enabled (or input is inappropri- ate  in  the  context), then the user is not prompted and the undefined trust level is returned. tofu+pgp This trust model combines TOFU with  the  Web  of  Trust. This  is done by computing the trust level for each model and then taking the maximum trust level where  the  trust levels are ordered as follows: unknown < undefined < mar- ginal < fully < ultimate < expired < never. By setting --tofu-default-policy=unknown, this model  can be  used  to  implement the web of trust with TOFU's con- flict detection algorithm, but without its assignment  of positive  trust  values,  which  some  security-conscious users don't like. direct Key validity is set directly by the user and  not  calcu- lated  via  the Web of Trust.  This model is solely based on the key and does not distinguish user IDs.  Note  that when changing to another trust model the trust values as- signed to a key are transformed into  ownertrust  values, which also indicate how you trust the owner of the key to sign other keys. always Skip key validation and assume that used keys are  always fully  valid. You generally won't use this unless you are using some external validation scheme. This  option  also suppresses  the  \"[uncertain]\" tag printed with signature checks when there is no evidence  that  the  user  ID  is bound  to the key.  Note that this trust model still does not allow the use of expired, revoked, or disabled keys. auto   Select the trust model depending on whatever the internal trust  database says. This is the default model if such a database already exists.  Note that a tofu trust model is not considered here and must be enabled explicitly."
  command: "gpg"
  example: "gpg --trust-model {pgp|classic|tofu|tofu+pgp|direct|always|auto}"
