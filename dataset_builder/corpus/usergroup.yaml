  command: "setfacl"
  example: "setfacl -d, --default"
- id: 1434
  intent: "of files from standard input. ACL ENTRIES The  setfacl utility recognizes the following ACL entry formats (blanks inserted for clarity): [d[efault]:] [u[ser]:]uid [:perms] Permissions of a named user. Permissions of the  file  owner  if uid is empty. [d[efault]:] g[roup]:gid [:perms] Permissions of a named group. Permissions of the owning group if gid is empty. [d[efault]:] m[ask][:] [:perms] Effective rights mask [d[efault]:] o[ther][:] [:perms] Permissions of others. Whitespace between delimiter characters and non-delimiter characters is ignored. Proper ACL entries including permissions are used in modify and set op- erations. (options -m, -M, --set and --set-file).  Entries without  the perms field are used for deletion of entries (options -x and -X). For  uid  and gid you can specify either a name or a number.  Character literals may be specified with a backslash followed by the 3-digit  oc- tal  digits  corresponding  to  the ASCII code for the character (e.g., \\101 for 'A').  If the name contains a literal backslash followed by  3 digits, the backslash must be escaped (i.e., \\\\). The  perms  field is a combination of characters that indicate the read (r), write (w), execute (x) permissions.  Dash characters in the  perms field  (-) are ignored.  The character X stands for the execute permis- sion if the file is a directory or already has execute  permission  for some  user.   Alternatively, the perms field can define the permissions numerically, as a bit-wise combination of read (4), write (2), and exe- cute  (1).   Zero  perms  fields  or  perms fields that only consist of dashes indicate no permissions. AUTOMATICALLY CREATED ENTRIES Initially, files and directories contain only the three  base  ACL  en- tries  for  the owner, the group, and others. There are some rules that need to be satisfied in order for an ACL to be valid: *   The three base entries cannot be removed. There must be exactly one entry of each of these base entry types. *   Whenever an ACL contains named user entries or named group objects, it must also contain an effective rights mask. *   Whenever an ACL contains any Default ACL entries, the three Default ACL base entries (default owner, default group, and default others) must also exist. *   Whenever a Default ACL contains named user entries or  named  group objects, it must also contain a default effective rights mask. To  help  the user ensure these rules, setfacl creates entries from ex- isting entries under the following conditions: *   If an ACL contains named user or named group entries, and  no  mask entry  exists,  a mask entry containing the same permissions as the group entry is created. Unless the -n option is given, the  permis- sions  of  the mask entry are further adjusted to include the union of all permissions affected by the mask entry. (See the  -n  option description). *   If  a Default ACL entry is created, and the Default ACL contains no owner, owning group, or others entry, a copy of the ACL owner, own- ing group, or others entry is added to the Default ACL. *   If  a  Default  ACL  contains named user entries or named group en- tries, and no mask entry exists, a mask entry containing  the  same permissions  as the default Default ACL's group entry is added. Un- less the -n option is given, the permissions of the mask entry  are further  adjusted  to include the union of all permissions affected by the mask entry. (See the -n option description)."
  command: "setfacl"
  example: "setfacl -   If the file name parameter is a single dash, setfacl reads  a  list"
