  intent: "Add features from specified plug-in MODULE.  Currently, the MWG module is the only plug-in module distributed with exiftool.  This module adds read/write support for tags as recommended by the Metadata Working Group.  As a convenience, \"-use MWG\" is assumed if the \"MWG\" group is specified for any tag on the command line. See the MWG Tags documentation for more details.  Note that this option is not reversible, and remains in effect until the application terminates, even across the -execute option. Utilities"
