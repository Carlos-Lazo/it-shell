- id: 130
  intent: "Mount new tmpfs on DEST. If the previous option was --perms, it sets the mode of the tmpfs. Otherwise, the tmpfs has mode 0755. If the previous option was --size, it sets the size in bytes of the tmpfs. Otherwise, the tmpfs has the default size."
  command: "bwrap"
  example: "bwrap --tmpfs DEST"
- id: 131
