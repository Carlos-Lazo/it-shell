- id: 1635
  intent: "Read owner translation map from FILE.  Empty lines are  ignored. Comments  are  introduced  with  # sign and extend to the end of line.  Each non-empty line in FILE  defines  translation  for  a single  UID.   It  must  consist of two fields, delimited by any amount of whitespace: OLDUSR NEWUSR[:NEWUID] OLDUSR is either a valid user name or a  UID  prefixed  with  +. Unless  NEWUID  is  supplied, NEWUSR must also be either a valid user name or a +UID.  Otherwise, both NEWUSR and NEWUID need not be listed in the system user database. As  a  result, each input file owned by OLDUSR will be stored in archive with owner name NEWUSR and UID NEWUID."
  command: "tar"
  example: "tar --owner-map=FILE"
