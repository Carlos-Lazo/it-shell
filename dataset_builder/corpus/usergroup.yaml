- id: 323
  intent: "Use name as your keyserver.  This is the server that gpg  commu- nicates  with  to  receive keys, send keys, and search for keys. The  format  of  the  name  is  a  URI:   `scheme:[//]keyserver- name[:port]'  The scheme is the type of keyserver: \"hkp\" for the HTTP (or compatible) keyservers, \"ldap\" for the LDAP keyservers, or  \"mailto\"  for the Graff email keyserver. Note that your par- ticular installation of GnuPG may  have  other  keyserver  types available as well. Keyserver schemes are case-insensitive. After the keyserver name, optional keyserver configuration options may be  provided.   These are the same as the --keyserver-options of gpg, but apply only to this particular keyserver. Most keyservers synchronize with each other, so there is  gener- ally  no  need  to send keys to more than one server. Somes key- servers use round robin DNS to give a different  keyserver  each time you use it. If  exactly  two keyservers are configured and only one is a Tor hidden service (.onion), Dirmngr selects the  keyserver  to  use depending  on  whether Tor is locally running or not.  The check for a running Tor is done for each new connection. If no keyserver is explicitly configured, dirmngr will  use  the built-in default of https://keys.openpgp.org. Note  that  the  above default is a Debian-specific choice.  Up- stream   GnuPG   prefers    hkps://keyserver.ubuntu.com.     See /usr/share/doc/gpgconf/NEWS.Debian.gz for more details. Windows users with a keyserver running on their Active Directory may use the short form ldap:/// for name to access  this  direc- tory. For  accessing anonymous LDAP keyservers name is in general just a ldaps://ldap.example.com.  A BaseDN parameter should never  be specified.   If  authentication is required things are more com- plicated and two methods are available: The modern method (since version 2.2.28) is to use the very same syntax  as  used  with the option --ldapserver.  Please see over there for details; here is an example: keyserver ldap:ldap.example.com::uid=USERNAME,ou=GnuPG Users, dc=example,dc=com:PASSWORD::starttls The other method is to use a full URL for name; for example: keyserver ldaps://ldap.example.com/????bindname=uid=USERNAME %2Cou=GnuPG%20Users%2Cdc=example%2Cdc=com,password=PASSWORD Put this all on one line without any spaces and keep the '%2C' as given.  Replace USERNAME, PASSWORD, and the 'dc' parts according to the instructions received from your LDAP administrator.  Note that only simple authentication (i.e. cleartext passwords) is supported and thus using ldaps is strongly suggested (since 2.2.28 \"ldaps\" defaults to port 389 and uses STARTTLS).  On Windows authentication via AD can be requested by adding gpgNtds=1 after the fourth question mark instead of the bindname and password parameter."
  command: "dirmngr"
  example: "dirmngr --keyserver name"
- id: 324
  intent: "This option makes dirmngr add any servers it discovers when val- idating  certificates  against  CRLs  to  the  internal  list of servers to consult for certificates and CRLs. This option is useful when trying to validate a certificate that has a CRL distribution point that points to a server that is not already listed in the ldapserverlist. Dirmngr will always go  to this  server  and  try to download the CRL, but chances are high that the certificate used to sign the CRL is located on the same server.  So  if  dirmngr doesn't add that new server to list, it will often not be able to verify the signature of the CRL unless the --add-servers option is used. Note: The current version of dirmngr has this option disabled by default."
