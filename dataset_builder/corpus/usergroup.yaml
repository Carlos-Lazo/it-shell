  intent: "This asserts that the input is a pseudo-Netpbm image  that  uses an  sRGB  color space (unlike true Netpbm) and indicates how you intend for the colors to be rendered.  It causes pnmtopng to in- clude an sRGB chunk in the PNG image that specifies that intent, so see the PNG documentation for more information on  what  this really means. intent is one of: o      perceptual o      relativecolorimetric o      saturation o      absolutecolorimetric This  option  was new in Netpbm 10.71 (June 2015).  Before that, pnmtopng never generates an sRGB chunk."
