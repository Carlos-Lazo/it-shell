- id: 1759
  intent: "Specify the username user and password password on an FTP server. Without this, or the corresponding startup option, the password defaults to -wget@, normally used for anonymous FTP. Another way to specify username and password is in the URL itself. Either method reveals your password to anyone who bothers to run \"ps\".  To prevent the passwords from being seen, store them in .wgetrc or .netrc, and make sure to protect those files from other users with \"chmod\".  If the passwords are really important, do not leave them lying in those files either---edit the files and delete them after Wget has started the download."
  command: "wget"
  example: "wget --ftp-password=password"
- id: 1760
