  intent: "Set mode for writing/creating tags.  MODE is a string of one or more characters from the list below.  The default write mode is \"wcg\". w - Write existing tags c - Create new tags g - create new Groups as necessary For example, use \"-wm cg\" to only create new tags (and avoid editing existing ones). The level of the group is the SubDirectory level in the metadata structure.  For XMP or IPTC this is the full XMP/IPTC block (the family 0 group), but for EXIF this is the individual IFD (the family 1 group)."
