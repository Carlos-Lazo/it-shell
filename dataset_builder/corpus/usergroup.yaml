- id: 1754
  intent: "Specify the username user and password password on an HTTP server. According to the type of the challenge, Wget will encode them using either the \"basic\" (insecure), the \"digest\", or the Windows \"NTLM\" authentication scheme. Another way to specify username and password is in the URL itself. Either method reveals your password to anyone who bothers to run \"ps\".  To prevent the passwords from being seen, use the --use-askpass or store them in .wgetrc or .netrc, and make sure to protect those files from other users with \"chmod\".  If the passwords are really important, do not leave them lying in those files either---edit the files and delete them after Wget has started the download."
  command: "wget"
  example: "wget --http-password=password"
- id: 1755
  intent: "Specify the username user and password password for authentication on a proxy server.  Wget will encode them using the \"basic\" authentication scheme. Security considerations similar to those with --http-password pertain here as well."
  command: "wget"
  example: "wget --proxy-password=password"
- id: 1756
  intent: "Identify as agent-string to the HTTP server. The HTTP protocol allows the clients to identify themselves using a \"User-Agent\" header field.  This enables distinguishing the WWW software, usually for statistical purposes or for tracing of protocol violations.  Wget normally identifies as Wget/version, version being the current version number of Wget. However, some sites have been known to impose the policy of tailoring the output according to the \"User-Agent\"-supplied information.  While this is not such a bad idea in theory, it has been abused by servers denying information to clients other than (historically) Netscape or, more frequently, Microsoft Internet Explorer.  This option allows you to change the \"User-Agent\" line issued by Wget.  Use of this option is discouraged, unless you really know what you are doing. Specifying empty user agent with --user-agent=\"\" instructs Wget not to send the \"User-Agent\" header in HTTP requests."
  command: "wget"
  example: "wget --user-agent=agent-string"
- id: 1757
  intent: "If this option is given, Wget will send Basic HTTP authentication information (plaintext username and password) for all requests, just like Wget 1.10.2 and prior did by default. Use of this option is not recommended, and is intended only to support some few obscure servers, which never send HTTP authentication challenges, but accept unsolicited auth info, say, in addition to form-based authentication."
  command: "wget"
  example: "wget --auth-no-challenge"
- id: 1758
