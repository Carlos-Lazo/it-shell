  intent: "create  new  filter  from dictfile. It may take a lot of time to generate filter from a big dictionary. In  that  dictionary  you may  place words (one per line) that should not appear as gener- ated passwords.  For example: user names common words, etc.  You even  can  use one of the dictionaries that come with dictionary password crackers.  This check is case sensitive.  For  example, if you want to reject word 'root', you should insert in dictfile words: root, Root, RoOt, ... , ROOT.  To indicate  that  program is  working  apgbfm prints dot for every 100 words added in dic- tionary."
  command: "apgbfm"
