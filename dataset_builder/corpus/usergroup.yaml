- id: 386
  intent: "Multiple tags may be specified in a single command.  A tag name is the handle by which a piece of information is referenced.  See Image::ExifTool::TagNames for documentation on available tag names.  A tag name may include leading group names separated by colons (eg. \"-EXIF:CreateDate\", or \"-Doc1:XMP:Creator\"), and each group name may be prefixed by a digit to specify family number (eg.  \"-1IPTC:City\").  Use the -listg option to list available group names by family. A special tag name of \"All\" may be used to indicate all meta information (ie. -All).  This is particularly useful when a group name is specified to extract all information in a group (but beware that unless the -a option is also used, some tags in the group may be suppressed by same-named tags in other groups).  The wildcard characters \"?\" and \"*\" may be used in a tag name to match any single character and zero or more characters respectively. These may not be used in a group name, with the exception that a group name of \"*\" (or \"All\") may be used to extract all instances of a tag (as if -a was used).  Note that arguments containing wildcards must be quoted on the command line of most systems to prevent shell globbing. A \"#\" may be appended to the tag name to disable the print conversion on a per-tag basis (see the -n option).  This may also be used when writing or copying tags. If no tags are specified, all available information is extracted (as if \"-All\" had been specified). Note:  Descriptions, not tag names, are shown by default when extracting information.  Use the -s option to see the tag names instead."
  command: "exiftool"
  example: "exiftool -TAG Extract information for the specified tag (eg. \"-CreateDate\")."
- id: 387
  intent: "Exclude specified tag from extracted information.  Same as the -x option.  Group names and wildcards are permitted as described above for -TAG.  Once excluded from the output, a tag may not be re-included by a subsequent option.  May also be used following a -tagsFromFile option to exclude tags from being copied (when redirecting to another tag, it is the source tag that should be excluded), or to exclude groups from being deleted when deleting all information (eg. \"-all= --exif:all\" deletes all but EXIF information).  But note that this will not exclude individual tags from a group delete (unless a family 2 group is specified, see note 4 below).  Instead, individual tags may be recovered using the -tagsFromFile option (eg. \"-all= -tagsfromfile @ -artist\"). To speed processing when reading XMP, exclusions in XMP groups also bypass processing of the corresponding XMP property and any contained properties.  For example, \"--xmp-crs:all\" may speed processing significantly in cases where a large number of XMP-crs tags exist.  To use this feature to bypass processing of a specific XMP property, the property name must be used instead of the ExifTool tag name (eg. \"--xmp-crs:dabs\").  Also, \"XMP-all\" may be used to to indicate any XMP namespace (eg. \"--xmp-all:dabs\")."
  command: "exiftool"
  example: "exiftool --TAG"
- id: 388
  intent: "Write a new value for the specified tag (eg. \"-comment=wow\"), or delete the tag if no VALUE is given (eg. \"-comment=\").  \"+=\" and \"-=\" are used to add or remove existing entries from a list, or to shift date/time values (see Image::ExifTool::Shift.pl and note 6 below for more details).  \"+=\" may also be used to increment numerical values (or decrement if VALUE is negative), and \"-=\" may be used to conditionally delete or replace a tag (see \"WRITING EXAMPLES\" for examples).  \"^=\" is used to write an empty string instead of deleting the tag when no VALUE is given, but otherwise it is equivalent to \"=\", but note that the caret must be quoted on the Windows command line. TAG may contain one or more leading family 0, 1, 2 or 7 group names, prefixed by optional family numbers, and separated colons. If no group name is specified, the tag is created in the preferred group, and updated in any other location where a same-named tag already exists.  The preferred group in JPEG and TIFF-format images is the first group in the following list where TAG is valid: 1) EXIF, 2) IPTC, 3) XMP. The wildcards \"*\" and \"?\" may be used in tag names to assign the same value to multiple tags.  When specified with wildcards, \"Unsafe\" tags are not written.  A tag name of \"All\" is equivalent to \"*\" (except that it doesn't require quoting, while arguments with wildcards do on systems with shell globbing), and is often used when deleting all metadata (ie. \"-All=\") or an entire group (eg. \"-XMP-dc:All=\", see note 4 below).  Note that not all groups are deletable, and that the JPEG APP14 \"Adobe\" group is not removed by default with \"-All=\" because it may affect the appearance of the image.  However, color space information is removed, so the colors may be affected (but this may be avoided by copying back the tags defined by the ColorSpaceTags shortcut). Use the -listd option for a complete list of deletable groups, and see note 5 below regarding the \"APP\" groups.  Also, within an image some groups may be contained within others, and these groups are removed if the containing group is deleted: JPEG Image: - Deleting EXIF or IFD0 also deletes ExifIFD, GlobParamIFD, GPS, IFD1, InteropIFD, MakerNotes, PrintIM and SubIFD. - Deleting ExifIFD also deletes InteropIFD and MakerNotes. - Deleting Photoshop also deletes IPTC. TIFF Image: - Deleting EXIF only removes ExifIFD which also deletes InteropIFD and MakerNotes. MOV/MP4 video: - Deleting ItemList also deletes Keys tags Notes: 1) Many tag values may be assigned in a single command.  If two assignments affect the same tag, the latter takes precedence (except for list-type tags, for which both values are written). 2) In general, MakerNotes tags are considered \"Permanent\", and may be edited but not created or deleted individually.  This avoids many potential problems, including the inevitable compatibility problems with OEM software which may be very inflexible about the information it expects to find in the maker notes. 3) Changes to PDF files by ExifTool are reversible (by deleting the update with \"-PDF-update:all=\") because the original information is never actually deleted from the file.  So ExifTool alone may not be used to securely edit metadata in PDF files. 4) Specifying \"-GROUP:all=\" deletes the entire group as a block only if a single family 0 or 1 group is specified.  Otherwise all deletable tags in the specified group(s) are removed individually, and in this case is it possible to exclude individual tags from a mass delete.  For example, \"-time:all --Exif:Time:All\" removes all deletable Time tags except those in the EXIF.  This difference also applies if family 2 is specified when deleting all groups. For example, \"-2all:all=\" deletes tags individually, while \"-all:all=\" deletes entire blocks. 5) The \"APP\" group names (\"APP0\" through \"APP15\") are used to delete JPEG application segments which are not associated with another deletable group.  For example, specifying \"-APP14:All=\" will NOT delete the APP14 \"Adobe\" segment because this is accomplished with \"-Adobe:All\". 6) When shifting a value, the shift is applied to the original value of the tag, overriding any other values previously assigned to the tag on the same command line.  To shift a date/time value and copy it to another tag in the same operation, use the -globalTimeShift option. Special feature:  Integer values may be specified in hexadecimal with a leading \"0x\", and simple rational values may be specified as fractions."
  command: "exiftool"
  example: "exiftool -TAG[+-^]=[VALUE]"
- id: 389
  intent: "Copy tag values from SRCFILE to FILE.  Tag names on the command line after this option specify the tags to be copied, or excluded from the copy.  Wildcards are permitted in these tag names.  If no tags are specified, then all possible tags (see note 1 below) from the source file are copied to same-named tags in the preferred location of the output file (the same as specifying \"-all\").  More than one -tagsFromFile option may be used to copy tags from multiple files. By default, this option will update any existing and writable same-named tags in the output FILE, but will create new tags only in their preferred groups.  This allows some information to be automatically transferred to the appropriate group when copying between images of different formats. However, if a group name is specified for a tag then the information is written only to this group (unless redirected to another group, see below).  If \"All\" is used as a group name, then the specified tag(s) are written to the same family 1 group they had in the source file (ie. the same specific location, like ExifIFD or XMP-dc).  For example, the common operation of copying all writable tags to the same specific locations in the output FILE is achieved by adding \"-all:all\".  A different family may be specified by adding a leading family number to the group name (eg. \"-0all:all\" preserves the same general location, like EXIF or XMP). SRCFILE may be the same as FILE to move information around within a single file.  In this case, \"@\" may be used to represent the source file (ie. \"-tagsFromFile @\"), permitting this feature to be used for batch processing multiple files.  Specified tags are then copied from each file in turn as it is rewritten.  For advanced batch use, the source file name may also be specified using a FMT string in which %d, %f and %e represent the directory, file name and extension of FILE.  (eg. the current FILE would be represented by \"%d%f.%e\", with the same effect as \"@\").  See the -w option for FMT string examples. A powerful redirection feature allows a destination tag to be specified for each copied tag.  With this feature, information may be written to a tag with a different name or group.  This is done using \"'-DSTTAG<SRCTAG'\" or \"'-SRCTAG>DSTTAG'\" on the command line after -tagsFromFile, and causes the value of SRCTAG to be copied from SRCFILE and written to DSTTAG in FILE.  Has no effect unless SRCTAG exists in SRCFILE.  Note that this argument must be quoted to prevent shell redirection, and there is no \"=\" sign as when assigning new values.  Source and/or destination tags may be prefixed by a group name and/or suffixed by \"#\".  Wildcards are allowed in both the source and destination tag names.  A destination group and/or tag name of \"All\" or \"*\" writes to the same family 1 group and/or tag name as the source (but the family may be specified by adding a leading number to the group name, eg. \"0All\" writes to the same family 0 group as the source).  If no destination group is specified, the information is written to the preferred group.  Whitespace around the \">\" or \"<\" is ignored. As a convenience, \"-tagsFromFile @\" is assumed for any redirected tags which are specified without a prior -tagsFromFile option. Copied tags may also be added or deleted from a list with arguments of the form \"'-SRCTAG+<DSTTAG'\" or \"'-SRCTAG-<DSTTAG'\" (but see Note 5 below). An extension of the redirection feature allows strings involving tag names to be used on the right hand side of the \"<\" symbol with the syntax \"'-DSTTAG<STR'\", where tag names in STR are prefixed with a \"$\" symbol.  See the -p option and the \"Advanced formatting feature\" section for more details about this syntax.  Strings starting with a \"=\" sign must insert a single space after the \"<\" to avoid confusion with the \"<=\" operator which sets the tag value from the contents of a file.  A single space at the start of the string is removed if it exists, but all other whitespace in the string is preserved.  See note 8 below about using the redirection feature with list-type stags, shortcuts or when using wildcards in tag names. See \"COPYING EXAMPLES\" for examples using -tagsFromFile. Notes: 1) Some tags (generally tags which may affect the appearance of the image) are considered \"Unsafe\" to write, and are only copied if specified explicitly (ie. no wildcards).  See the tag name documentation for more details about \"Unsafe\" tags. 2) Be aware of the difference between excluding a tag from being copied (--TAG), and deleting a tag (-TAG=).  Excluding a tag prevents it from being copied to the destination image, but deleting will remove a pre-existing tag from the image. 3) The maker note information is copied as a block, so it isn't affected like other information by subsequent tag assignments on the command line, and individual makernote tags may not be excluded from a block copy.  Also, since the PreviewImage referenced from the maker notes may be rather large, it is not copied, and must be transferred separately if desired. 4) The order of operations is to copy all specified tags at the point of the -tagsFromFile option in the command line.  Any tag assignment to the right of the -tagsFromFile option is made after all tags are copied.  For example, new tag values are set in the order One, Two, Three then Four with this command: exiftool -One=1 -tagsFromFile s.jpg -Two -Four=4 -Three d.jpg This is significant in the case where an overlap exists between the copied and assigned tags because later operations may override earlier ones. 5) The normal behaviour of copied tags differs from that of assigned tags for list-type tags and conditional replacements because each copy operation on a tag overrides any previous operations.  While this avoids duplicate list items when copying groups of tags from a file containing redundant information, it also prevents values of different tags from being copied into the same list when this is the intent.  So a -addTagsFromFile option is provided which allows copying of multiple tags into the same list.  eg) exiftool -addtagsfromfile @ '-subject<make' '-subject<model' ... Similarly, -addTagsFromFile must be used when conditionally replacing a tag to prevent overriding earlier conditions. Other than these differences, the -tagsFromFile and -addTagsFromFile options are equivalent. 6) The -a option (allow duplicate tags) is always in effect when copying tags from SRCFILE, but the highest priority tag is always copied last so it takes precedence. 7) Structured tags are copied by default when copying tags.  See the -struct option for details. 8) With the redirection feature, copying a tag directly (ie. \"'-DSTTAG<SRCTAG'\") is not the same as interpolating its value inside a string (ie. \"'-DSTTAG<$SRCTAG'\") for source tags which are list-type tags, shortcut tags, tag names containing wildcards, or UserParam variables.  When copying directly, the values of each matching source tag are copied individually to the destination tag (as if they were separate assignments).  However, when interpolated inside a string, list items and the values of shortcut tags are concatenated (with a separator set by the -sep option), and wildcards are not allowed.  Also, UserParam variables are available only when interpolated in a string.  Another difference is that a minor warning is generated if a tag doesn't exist when interpolating its value in a string (with \"$\"), but isn't when copying the tag directly. Finally, the behaviour is different when a destination tag or group of \"All\" is used.  When copying directly, a destination group and/or tag name of \"All\" writes to the same family 1 group and/or tag name as the source.  But when interpolated in a string, the identity of the source tags are lost and the value is written to all possible groups/tags.  For example, the string form must be used in the following command since the intent is to set the value of all existing date/time tags from \"CreateDate\": exiftool '-time:all<$createdate' -wm w FILE"
  command: "exiftool"
  example: "exiftool -tagsFromFile SRCFILE or FMT"
- id: 390
  intent: "Organize output by tag group.  NUM specifies a group family number, and may be 0 (general location), 1 (specific location), 2 (category), 3 (document number), 4 (instance number), 5 (metadata path), 6 (EXIF/TIFF format) or 7 (tag ID).  -g0 is assumed if a family number is not specified.  May be combined with other options to add group names to the output.  Multiple families may be specified by separating them with colons.  By default the resulting group name is simplified by removing any leading \"Main:\" and collapsing adjacent identical group names, but this can be avoided by placing a colon before the first family number (eg. -g:3:1).  Use the -listg option to list group names for a specified family.  The API SavePath and SaveFormat options are automatically enabled if the respective family 5 or 6 group names are requested.  See the API GetGroup documentation for more information."
  command: "exiftool"
  example: "exiftool -g[NUM][:NUM...] (-groupHeadings)"
