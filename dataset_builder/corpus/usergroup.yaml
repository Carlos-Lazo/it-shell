- id: 1318
  intent: "Sets the distance of the light source from  the  image.   Larger values  move  the  light  source  closer, casting a more diffuse shadow, while smaller settings  move  the  light  further  away, yielding a sharper shadow.  blur_size is the number of pixels of fringe there is on the shadow, beyond where the shadow would  be if there were no blurring. The default is 11 pixels. Note  that this option controls only the fringing effect of mov- ing the light source closer to the object.  It does not make the shadow  grow or shrink as would happpen in the real world if you moved a point light source closer to and further from an object."
  command: "ppmshadow"
  example: "ppmshadow -b blur_size"
- id: 1319
