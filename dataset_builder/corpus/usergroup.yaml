- id: 133
  intent: "Drop the specified capability when running as privileged user. It accepts the special value ALL to drop all the caps. By default no caps are left in the sandboxed process. The --cap-add and --cap-drop options are processed in the order they are specified on the command line. Please be careful to the order they are specified."
  command: "bwrap"
  example: "bwrap --cap-drop CAP"
