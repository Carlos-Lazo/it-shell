  example: "gpg --preserve-permissions"
- id: 568
  intent: "Do not allow clients to mark keys as trusted, i.e. put them into the 'trustlist.txt' file.  This makes it harder for users to in- advertently accept Root-CA keys."
  command: "gpg-agent"
  example: "gpg-agent --no-allow-mark-trusted"
- id: 569
  intent: "Entirely ignore the user trust list and consider only the global trustlist  ('/etc/gnupg/trustlist.txt').   This implies the [op- tion --no-allow-mark-trusted]."
  command: "gpg-agent"
  example: "gpg-agent --no-user-trustlist"
- id: 570
  intent: "Disallow or allow clients to use the loopback pinentry features; see the option pinentry-mode for details.  Allow is the default. The --force option of the Assuan command DELETE_KEY is also con- trolled by this option: The option  is  ignored  if  a  loopback pinentry is disallowed."
  command: "gpg-agent"
  example: "gpg-agent --allow-loopback-pinentry"
- id: 571
  intent: "Tell Pinentry not to enable features which use an external cache for passphrases. Some desktop environments prefer to unlock all credentials  with one  master password and may have installed a Pinentry which em- ploys an additional external cache to implement such  a  policy. By  using this option the Pinentry is advised not to make use of such a cache and instead always ask the user for  the  requested passphrase."
  command: "gpg-agent"
  example: "gpg-agent --no-allow-external-cache"
- id: 572
  intent: "Enforce  the  passphrase constraints by not allowing the user to bypass them using the ``Take it anyway'' button."
  command: "gpg-agent"
  example: "gpg-agent --enforce-passphrase-constraints"
- id: 573
  intent: "Check  the  passphrase  against the pattern given in file.  When entering a new passphrase matching one of these pattern a  warn- ing will be displayed.  If file does not contain any slashes and does not start with \"~/\" it is searched in the system configura- tion  directory  ('/etc/gnupg').   The default is not to use any pattern file.  The second version of this option  is  only  used when  creating a new symmetric key to allow the use of different patterns for such passphrases. Security note: It is known that checking a passphrase against  a list  of  pattern  or  even against a complete dictionary is not very effective to enforce good  passphrases.   Users  will  soon figure  up  ways to bypass such a policy.  A better policy is to educate users on good security behavior and optionally to run  a passphrase  cracker  regularly on all users passphrases to catch the very simple ones."
