  intent: "Set the number of days since January 1st, 1970 when the password was last changed. The date may also be expressed in the format YYYY-MM-DD (or the format more commonly used in your area). If the LAST_DAY is set to 0 the user is forced to change his password on the next log on."
  command: "chage"
  example: "chage -d, --lastday LAST_DAY"
- id: 150
  intent: "Set the number of days of inactivity after a password has expired before the account is locked. The INACTIVE option is the number of days of inactivity. A user whose account is locked must contact the system administrator before being able to use the system again. Passing the number -1 as the INACTIVE will remove an account's inactivity."
  command: "chage"
  example: "chage -I, --inactive INACTIVE"
- id: 151
  intent: "Set the minimum number of days between password changes to MIN_DAYS. A value of zero for this field indicates that the user may change their password at any time."
