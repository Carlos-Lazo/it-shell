  intent: "Sets up a named group, which is similar to aliases in email pro- grams.  Any time the group name is a recipient (-r or  --recipi- ent),  it  will  be  expanded  to the values specified. Multiple groups with the same name are automatically merged into a single group. The  values are key IDs or fingerprints, but any key description is accepted. Note that a value with spaces in it will be treated as  two  different  values. Note also there is only one level of expansion --- you cannot make an group that  points  to  another group.  When  used from the command line, it may be necessary to quote the argument to this option  to  prevent  the  shell  from treating it as multiple arguments."
  command: "gpg"
