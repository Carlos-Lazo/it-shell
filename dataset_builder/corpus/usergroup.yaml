- id: 285
  intent: "(HTTP)  Tells curl to use HTTP Basic authentication with the re- mote host. This is the default and this option is usually point- less, unless you use it to override a previously set option that sets a different authentication method (such  as  --ntlm,  --di- gest, or --negotiate). Used together with -u, --user. Providing --basic multiple times has no extra effect. Example: curl -u name:password --basic https://example.com See also --proxy-basic."
  command: "curl"
  example: "curl --basic"
- id: 286
  intent: "(HTTP) Fail fast with no output at all on server errors. This is useful  to  enable  scripts and users to better deal with failed attempts. In normal cases when an HTTP server fails to deliver a document,  it  returns  an HTML document stating so (which often also describes why and more). This flag will prevent  curl  from outputting that and return error 22. This  method is not fail-safe and there are occasions where non- successful response codes will slip through, especially when au- thentication is involved (response codes 401 and 407). Providing  -f,  --fail multiple times has no extra effect.  Dis- able it again with --no-fail. Example: curl --fail https://example.com See also --fail-with-body. This option is mutually exclusive  to --fail-with-body."
  command: "curl"
  example: "curl -f, --fail"
- id: 287
  intent: "(FTP) When an FTP server asks for \"account data\" after user name and  password has been provided, this data is sent off using the ACCT command. If --ftp-account is provided several times, the last  set  value will be used. Example: curl --ftp-account \"mr.robot\" ftp://example.com/ See also -u, --user."
  command: "curl"
  example: "curl --ftp-account <data>"
- id: 288
  intent: "(FTP)  If  authenticating with the USER and PASS commands fails, send this  command.   When  connecting  to  Tumbleweed's  Secure Transport  server  over  FTPS  using a client certificate, using \"SITE AUTH\" will tell the server to retrieve the  username  from the certificate. If --ftp-alternative-to-user is provided several times, the last set value will be used. Example: curl --ftp-alternative-to-user \"U53r\" ftp://example.com See also --ftp-account and -u, --user."
  command: "curl"
  example: "curl --ftp-alternative-to-user <command>"
- id: 289
  intent: "(FTP SFTP) When an FTP or SFTP URL/operation uses  a  path  that does not currently exist on the server, the standard behavior of curl is to fail. Using this option, curl will instead attempt to create missing directories. Providing  --ftp-create-dirs multiple times has no extra effect. Disable it again with --no-ftp-create-dirs. Example: curl --ftp-create-dirs -T file ftp://example.com/remote/path/file See also --create-dirs."
  command: "curl"
  example: "curl --ftp-create-dirs"
- id: 290
  intent: "(HTTP) Tells curl to use HTTP version 2. For HTTPS, this means curl will attempt to negotiate  HTTP/2  in the TLS handshake. curl does this by default. For HTTP, this means curl will attempt to upgrade the request to HTTP/2 using the Upgrade: request header. When curl uses HTTP/2 over HTTPS, it does not itself  insist  on TLS 1.2 or higher even though that is required by the specifica- tion. A user can add this version requirement with --tlsv1.2. Providing --http2 multiple times has no extra effect. Example: curl --http2 https://example.com See also --http1.1 and --http3. --http2 requires that the under- lying  libcurl was built to support HTTP/2. This option is mutu- ally exclusive to --http1.1 and -0, --http1.0 and --http2-prior- knowledge and --http3. Added in 7.33.0."
  command: "curl"
  example: "curl --http2"
- id: 291
  intent: "(HTTP)  Like  -L,  --location, but will allow sending the name + password to all hosts that the site may redirect to. This may or may not introduce a security breach if the site redirects you to a site to which you will send your authentication info (which is plaintext in the case of HTTP Basic authentication). Providing --location-trusted multiple times has no extra effect. Disable it again with --no-location-trusted. Example: curl --location-trusted -u user:password https://example.com See also -u, --user."
  command: "curl"
  example: "curl --location-trusted"
- id: 292
  intent: "(SMTP) Specify a single email address, user name or mailing list name. Repeat this option several times to send to  multiple  re- cipients. When  performing an address verification (VRFY command), the re- cipient should be specified as the user name or  user  name  and domain (as per Section 3.5 of RFC5321). (Added in 7.34.0) When performing a mailing list expand (EXPN command), the recip- ient should be specified using the mailing list  name,  such  as \"Friends\" or \"London-Office\".  (Added in 7.34.0) --mail-rcpt can be used several times in a command line Example: curl --mail-rcpt user@example.net smtp://example.com See also --mail-rcpt-allowfails."
  command: "curl"
  example: "curl --mail-rcpt <address>"
- id: 293
  intent: "(HTTP) Enables Negotiate (SPNEGO) authentication. This option requires a library built with GSS-API or  SSPI  sup- port.  Use  -V,  --version  to  see  if  your curl supports GSS- API/SSPI or SPNEGO. When using this option, you must also provide a fake -u,  --user option  to  activate the authentication code properly. Sending a '-u :' is enough as the user name  and  password  from  the  -u, --user option are not actually used. If  this  option  is  used  several times, only the first one is used. Providing --negotiate multiple times has no extra effect. Example: curl --negotiate -u : https://example.com See also --basic, --ntlm, --anyauth and --proxy-negotiate."
  command: "curl"
  example: "curl --negotiate"
- id: 294
  intent: "Makes  curl  scan  the  .netrc  (_netrc  on Windows) file in the user's home directory for login name and password. This is typi- cally  used for FTP on Unix. If used with HTTP, curl will enable user authentication. See netrc(5) and ftp(1) for details on  the file  format.  Curl will not complain if that file does not have the right permissions (it should be neither  world-  nor  group- readable).  The  environment variable \"HOME\" is used to find the home directory. A quick and simple example of how to setup  a  .netrc  to  allow curl  to  FTP to the machine host.domain.com with user name 'my- self' and password 'secret' could look similar to: machine host.domain.com login myself password secret Providing -n, --netrc multiple times has no extra effect.   Dis- able it again with --no-netrc. Example: curl --netrc https://example.com See  also --netrc-file, -K, --config and -u, --user. This option is mutually exclusive to --netrc-file and --netrc-optional."
  command: "curl"
  example: "curl -n, --netrc"
- id: 295
  intent: "(HTTP) Enables NTLM much in the style --ntlm does, but hand over the authentication to the separate binary  ntlmauth  application that is executed when needed. Providing --ntlm-wb multiple times has no extra effect. Example: curl --ntlm-wb -u user:password https://example.com See also --ntlm and --proxy-ntlm."
  command: "curl"
  example: "curl --ntlm-wb"
- id: 296
  intent: "(IMAP  LDAP  POP3  SMTP HTTP) Specify the Bearer Token for OAUTH 2.0 server authentication. The Bearer Token is used in  conjunc- tion  with  the  user name which can be specified as part of the --url or -u, --user options. The Bearer Token and user name are formatted  according  to  RFC 6750. If --oauth2-bearer is provided several times, the last set value will be used. Example: curl --oauth2-bearer \"mF_9.B5f-4.1JqM\" https://example.com See also --basic, --ntlm and --digest. Added in 7.33.0."
  command: "curl"
  example: "curl --oauth2-bearer <token>"
- id: 297
  intent: "Tells  curl  to use HTTP Basic authentication when communicating with the given proxy. Use --basic for enabling HTTP Basic with a remote  host.  Basic  is  the default authentication method curl uses with proxies. Providing --proxy-basic multiple times has no extra effect. Example: curl --proxy-basic --proxy-user user:passwd -x proxy https://example.com See also -x, --proxy, --proxy-anyauth and --proxy-digest."
  command: "curl"
  example: "curl --proxy-basic"
- id: 298
  intent: "Tells  curl  to  use HTTP Negotiate (SPNEGO) authentication when communicating with the given proxy. Use --negotiate for enabling HTTP Negotiate (SPNEGO) with a remote host. Providing --proxy-negotiate multiple times has no extra effect. Example: curl --proxy-negotiate --proxy-user user:passwd -x proxy https://example.com See also --proxy-anyauth and --proxy-basic."
  command: "curl"
  example: "curl --proxy-negotiate"
- id: 299
  intent: "Tells  curl  to  use HTTP NTLM authentication when communicating with the given proxy. Use --ntlm for enabling NTLM with a remote host. Providing --proxy-ntlm multiple times has no extra effect. Example: curl --proxy-ntlm --proxy-user user:passwd -x http://proxy https://example.com See also --proxy-negotiate and --proxy-anyauth."
  command: "curl"
  example: "curl --proxy-ntlm"
- id: 300
  intent: "Specify  the user name and password to use for proxy authentica- tion. If you use a Windows SSPI-enabled curl binary and do either  Ne- gotiate  or NTLM authentication then you can tell curl to select the user name and password from your environment by specifying a single colon with this option: \"-U :\". On systems where it works, curl will hide the given option argu- ment from process listings. This is not enough to  protect  cre- dentials  from  possibly getting seen by other users on the same system as they  will  still  be  visible  for  a  moment  before cleared. Such sensitive data should be retrieved from a file in- stead or similar and never used in clear text in a command line. If -U, --proxy-user is provided  several  times,  the  last  set value will be used. Example: curl --proxy-user name:pwd -x proxy https://example.com See also --proxy-pass."
  command: "curl"
  example: "curl -U, --proxy-user <user:password>"
- id: 301
  intent: "Tells curl to use username/password authentication when connect- ing to a SOCKS5 proxy.  The username/password authentication  is enabled  by  default.   Use --socks5-gssapi to force GSS-API au- thentication to SOCKS5 proxies. Providing --socks5-basic multiple times has no extra effect. Example: curl --socks5-basic --socks5 hostname:4096 https://example.com See also --socks5. Added in 7.55.0."
  command: "curl"
  example: "curl --socks5-basic"
- id: 302
  intent: "Tells curl to use GSS-API authentication when  connecting  to  a SOCKS5  proxy.  The GSS-API authentication is enabled by default (if curl is compiled with GSS-API support).  Use  --socks5-basic to force username/password authentication to SOCKS5 proxies. Providing  --socks5-gssapi  multiple  times has no extra effect. Disable it again with --no-socks5-gssapi. Example: curl --socks5-gssapi --socks5 hostname:4096 https://example.com See also --socks5. Added in 7.55.0."
  command: "curl"
  example: "curl --socks5-gssapi"
- id: 303
  intent: "Specify the user name and password to use for server authentica- tion. Overrides -n, --netrc and --netrc-optional. If  you  simply  specify  the  user name, curl will prompt for a password. The user name and passwords are split up  on  the  first  colon, which  makes  it impossible to use a colon in the user name with this option. The password can, still. On systems where it works, curl will hide the given option argu- ment  from  process listings. This is not enough to protect cre- dentials from possibly getting seen by other users on  the  same system  as  they  will  still  be  visible  for  a moment before cleared. Such sensitive data should be retrieved from a file in- stead or similar and never used in clear text in a command line. When  using  Kerberos  V5 with a Windows based server you should include the Windows domain name in the user name, in  order  for the  server  to successfully obtain a Kerberos Ticket. If you do not, then the initial authentication handshake may fail. When using NTLM, the user name can be specified  simply  as  the user  name,  without the domain, if there is a single domain and forest in your setup for example. To specify the domain name use either Down-Level Logon  Name  or UPN (User Principal Name) formats. For example, EXAMPLE\\user and user@example.com respectively. If you use a Windows SSPI-enabled curl binary and  perform  Ker- beros  V5, Negotiate, NTLM or Digest authentication then you can tell curl to select the user name and password from  your  envi- ronment by specifying a single colon with this option: \"-u :\". If -u, --user is provided several times, the last set value will be used. Example: curl -u user:secret https://example.com See also -n, --netrc and -K, --config."
  command: "curl"
  example: "curl -u, --user <user:password>"
- id: 304
  intent: "Only convert Defaults entries of the specified types.  One or more Defaults types may be specified, separated by a comma (','). The supported types are: all      All Defaults entries. global   Global Defaults entries that are applied regardless of user, runas, host, or command. user     Per-user Defaults entries. runas    Per-runas user Defaults entries. host     Per-host Defaults entries. command  Per-command Defaults entries. See the Defaults section in sudoers(5) for more information. If the -d option is not specified, all Defaults entries will be converted."
  command: "cvtsudoers"
  example: "cvtsudoers -d deftypes, --defaults=deftypes"
- id: 305
  intent: "When the -M option is also specified, perform group queries using file instead of the system group database."
  command: "cvtsudoers"
  example: "cvtsudoers --group-file=file"
- id: 306
  intent: "Only output rules that match the specified filter.  A filter ex- pression is made up of one or more key = value pairs, separated by a comma (',').  The key may be \"cmnd\" (or \"cmd\"), \"host\", \"group\", or \"user\".  For example, user = operator or host = www. An upper-case Cmnd_Alias, Host_alias, or User_Alias may be speci- fied as the \"cmnd\", \"host\", or \"user\". A matching sudoers rule may also include users, groups, and hosts that are not part of the filter.  This can happen when a rule in- cludes multiple users, groups, or hosts.  To prune out any non- matching user, group, or host from the rules, the -p option may be used. By default, the password and group databases are not consulted when matching against the filter so the users and groups do not need to be present on the local system (see the -M option).  Only aliases that are referenced by the filtered policy rules will be displayed."
  command: "cvtsudoers"
  example: "cvtsudoers -m filter, --match=filter"
- id: 307
  intent: "When the -m option is also specified, use password and group database information when matching users and groups in the fil- ter.  Only users and groups in the filter that exist on the local system will match, and a user's groups will automatically be added to the filter.  If the -M is not specified, users and groups in the filter do not need to exist on the local system, but all groups used for matching must be explicitly listed in the filter."
  command: "cvtsudoers"
  example: "cvtsudoers -M, --match-local"
- id: 308
  intent: "When the -m option is also specified, cvtsudoers will prune out non-matching users, groups, and hosts from matching entries."
  command: "cvtsudoers"
  example: "cvtsudoers -p, --prune-matches"
