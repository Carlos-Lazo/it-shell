  command: "apg"
  example: "apg -m min_pass_len"
- id: 39
  intent: "Generate  password  with  maximum   length   max_pass_len.    If min_pass_len  >  max_pass_len  then max_pass_len = min_pass_len. Default maximum password length is 10."
  command: "apg"
  example: "apg -x max_pass_len"
- id: 40
  intent: "Use symbolsets specified  with  mode  for  password  generation. mode is a text string consisting of characters S, s, N, n, C, c, L, l. Where: S      Generator must use special symbol set for every generated password. s      Generator should use special symbol set for password gen- eration. N      Generator must use numeral symbol set for every generated password. n      Generator should use numeral symbol set for password gen- eration. C      Generator must use capital symbol set for every generated password. c      Generator should use capital symbol set for password gen- eration. L      Generator must use small letters  symbol  set  for  every generated password (always present if pronounceable pass- word generation algorithm is used). l      Generator should use small letters symbol set  for  pass- word generation. R,r    Not  supported  any  more.  Use -E char_string option in- stead. mode can not be more than 4 characters in length. Note: Usage of L, M, S, C will slow down password generation process. Examples: -M sncl -M SNCL -M Cn"
  command: "apg"
  example: "apg -M mode"
- id: 41
  intent: "Exclude  characters  in  char_string  from  password  generation process  (in  pronounceable password generation mode you can not exclude small letters). To include special symbols that  can  be recognized  by  shell (apostrophe, quotes, dollar sign, etc.) in char_string use the backslashed versions. Examples: Command apg -a 1 -M n -n 3 -m 8 -E 23456789 will generate a  set of passwords that will look like this: 10100110 01111000 11011101 Command  apg  -a 1 -M nc -n 3 -m 26 -E GHIJKLMNOPQRSTUVWXYZ will generate a set of passwords that will look like this: 16A1653CD4DE5E7BD9584A3476 C8F78E06944AFD57FB9CB882BC 8C8DF37CD792D36D056BBD5002 Password quality control options"
  command: "apg"
  example: "apg -E char_string"
- id: 42
  intent: "Use cl_seed as a random seed for password generation. I  use  it when i have to generate passwords in a shell script. Examples: -c /dev/urandom -c /tmp/seed_file Password output options"
  command: "apg"
  example: "apg -c cl_seed"
