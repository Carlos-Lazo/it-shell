  intent: "This option has two purposes.  mbox must either  be  a  complete user id with a proper mail address or just a mail address.  When creating a signature this option tells gpg the user id of a  key used  to  make a signature if the key was not directly specified by a user id.  When verifying a signature the mbox  is  used  to restrict  the  information  printed by the TOFU code to matching user ids."
