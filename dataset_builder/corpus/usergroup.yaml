  example: "systemd-ask-password"
- id: 1549
  intent: "systemd-ask-password [OPTIONS...] [MESSAGE]"
  command: "systemd-ask-password"
  example: "systemd-ask-password"
- id: 1550
  intent: "Specify an icon name alongside the password query, which may be used in all agents supporting graphical display. The icon name should follow the XDG Icon Naming Specification[2]."
  command: "systemd-ask-password"
  example: "systemd-ask-password --icon="
- id: 1551
  intent: "Specify an identifier for this password query. This identifier is freely choosable and allows recognition of queries by involved agents. It should include the subsystem doing the query and the specific object the query is done for. Example: \"--id=cryptsetup:/dev/sda5\"."
  command: "systemd-ask-password"
  example: "systemd-ask-password --id="
- id: 1552
  intent: "Configure a kernel keyring key name to use as cache for the password. If set, then the tool will try to push any collected passwords into the kernel keyring of the root user, as a key of the specified name. If combined with --accept-cached, it will also try to retrieve such cached passwords from the key in the kernel keyring instead of querying the user right away. By using this option, the kernel keyring may be used as effective cache to avoid repeatedly asking users for passwords, if there are multiple objects that may be unlocked with the same password. The cached key will have a timeout of 2.5min set, after which it will be purged from the kernel keyring. Note that it is possible to cache multiple passwords under the same keyname, in which case they will be stored as NUL-separated list of passwords. Use keyctl(1) to access the cached key via the kernel keyring directly. Example: \"--keyname=cryptsetup\""
  command: "systemd-ask-password"
  example: "systemd-ask-password --keyname="
- id: 1553
  intent: "Configure a credential to read the password from - if it exists. This may be used in conjunction with the LoadCredential= and SetCredential= settings in unit files. See systemd.exec(5) for details. If not specified, defaults to \"password\". This option has no effect if no credentials directory is passed to the program (i.e.  $CREDENTIALS_DIRECTORY is not set) or if the no credential of the specified name exists."
  command: "systemd-ask-password"
  example: "systemd-ask-password --credential="
- id: 1554
  intent: "Controls whether to echo user input. Takes a boolean or the special string \"masked\", the default being the latter. If enabled the typed characters are echoed literally, which is useful for prompting for usernames and other non-protected data. If disabled the typed characters are not echoed in any form, the user will not get feedback on their input. If set to \"masked\", an asterisk (\"*\") is echoed for each character typed. In this mode, if the user hits the tabulator key (\"\"), echo is turned off. (Alternatively, if the user hits the backspace key (\"\") while no data has been entered otherwise, echo is turned off, too)."
  command: "systemd-ask-password"
  example: "systemd-ask-password --echo=yes|no|masked"
- id: 1555
  intent: "Equivalent to --echo=yes, see above."
  command: "systemd-ask-password"
  example: "systemd-ask-password --echo, -e"
- id: 1556
  intent: "Controls whether or not to prefix the query with a lock and key emoji (), if the TTY settings permit this. The default is \"auto\", which defaults to \"yes\", unless --echo=yes is given."
  command: "systemd-ask-password"
  example: "systemd-ask-password --emoji=yes|no|auto"
- id: 1557
  intent: "Never ask for password on current TTY even if one is available. Always use agent system."
  command: "systemd-ask-password"
