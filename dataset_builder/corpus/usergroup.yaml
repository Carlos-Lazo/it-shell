  command: "tar"
  example: "tar --group=NAME[:GID]"
- id: 1631
  intent: "Read  group translation map from FILE.  Empty lines are ignored. Comments are introduced with # sign and extend  to  the  end  of line.   Each  non-empty  line  in FILE defines translation for a single group.  It must consist of two fields, delimited  by  any amount of whitespace: OLDGRP NEWGRP[:NEWGID] OLDGRP  is  either  a valid group name or a GID prefixed with +. Unless NEWGID is supplied, NEWGRP must also be  either  a  valid group  name  or  a +GID.  Otherwise, both NEWGRP and NEWGID need not be listed in the system group database. As a result, each input file with owner  group  OLDGRP  will  be stored in archive with owner group NEWGRP and GID NEWGID."
  command: "tar"
  example: "tar --group-map=FILE"
