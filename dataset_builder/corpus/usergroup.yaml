  intent: "pnmtops  can  generate two different kinds of Encapsulated Post- script programs to represent an image.  By default, it generates a  program  that  redefines  readstring  in  a custom manner and doesn't rely on any built-in Postscript filters.  But  with  the -psfilter  option,  pnmtops leaves readstring alone and uses the built-in  Postscript  filters  /ASCII85Decode,  /ASCIIHexDecode, /RunLengthDecode, and /FlateDecode. This  option was new in Netbpm 10.27 (March 2005).  Before that, pnmtops always used the custom readstring. The custom code can't do flate or ascii85 encoding, so you  must use -psfilter if you want those (see -flate, -ascii85)."
  command: "pnmtops"
