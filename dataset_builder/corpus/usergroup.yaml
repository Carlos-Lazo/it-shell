- id: 128
  intent: "Keep this file descriptor open while the sandbox is running Filesystem related options. These are all operations that modify the filesystem directly, or mounts stuff in the filesystem. These are applied in the order they are given as arguments. Any missing parent directories that are required to create a specified destination are automatically created as needed. Their permissions are normally set to 0755 (rwxr-xr-x). However, if a --perms option is in effect, and it sets the permissions for group or other to zero, then newly-created parent directories will also have their corresponding permission set to zero.  --size modifies the size of the created mount when preceding a --tmpfs action; --perms and --size can be combined."
  command: "bwrap"
  example: "bwrap --sync-fd FD"
- id: 129
