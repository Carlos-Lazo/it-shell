- id: 558
  intent: "nary OpenPGP format."
  command: "gpg"
  example: "gpg -a     Create  ASCII  armored output.  The default is to create the bi-"
- id: 559
  intent: "This is a space or comma delimited string that gives options for exporting  keys.   Options can be prepended with a `no-' to give the opposite meaning.  The options are: export-local-sigs Allow exporting key signatures marked as \"local\". This is not  generally  useful  unless a shared keyring scheme is being used.  Defaults to no. export-attributes Include attribute user IDs (photo IDs)  while  exporting. Not including attribute user IDs is useful to export keys that are going to be used by an OpenPGP program that does not accept attribute user IDs.  Defaults to yes. export-sensitive-revkeys Include designated revoker information that was marked as \"sensitive\". Defaults to no. backup export-backup Export for use as a backup.  The exported  data  includes all data which is needed to restore the key or keys later with GnuPG.  The format is basically the  OpenPGP  format but enhanced with GnuPG specific data.  All other contra- dicting options are overridden. export-clean Compact (remove all signatures from) user IDs on the  key being  exported  if the user IDs are not usable. Also, do not export any signatures that are not usable.  This  in- cludes  signatures  that were issued by keys that are not present on the keyring. This option is the same  as  run- ning  the --edit-key command \"clean\" before export except that the local copy of the key is not modified.  Defaults to no. export-minimal Export the smallest key possible. This removes all signa- tures except the most recent self-signature on each  user ID.  This  option  is  the same as running the --edit-key command \"minimize\" before export except  that  the  local copy of the key is not modified. Defaults to no. export-pka Instead of outputting the key material output PKA records suitable to put into DNS zone files.  An ORIGIN  line  is printed before each record to allow diverting the records to the corresponding zone file. export-dane Instead of outputting the  key  material  output  OpenPGP DANE  records  suitable  to  put into DNS zone files.  An ORIGIN line is printed before each record  to  allow  di- verting the records to the corresponding zone file."
  command: "gpg"
  example: "gpg --export-options parameters"
- id: 560
  intent: "By  default  the  user  ID of the signing key is embedded in the data signature.  As of now this is only done if the signing  key has been specified with local-user using a mail address, or with sender.  This information can be helpful for verifier to  locate the key; see option --auto-key-retrieve."
  command: "gpg"
  example: "gpg --disable-signer-uid"
- id: 561
  intent: "This  option is used to embed the actual signing key into a data signature.  The embedded key is stripped down to a  single  user id  and includes only the signing subkey used to create the sig- nature as well as as valid encryption subkeys.  All  other  info is removed from the key to keep it and thus the signature small. This option is the OpenPGP counterpart to the gpgsm option --in- clude-certs."
  command: "gpg"
  example: "gpg --include-key-block"
- id: 562
  intent: "Use name as the cipher algorithm for symmetric encryption with a passphrase if  --personal-cipher-preferences  and  --cipher-algo are not given.  The default is AES-128."
  command: "gpg"
  example: "gpg --s2k-cipher-algo name"
- id: 563
  intent: "Adds  name to a list of known critical signature notations.  The effect of this is that gpg will not  mark  a  signature  with  a critical  signature notation of that name as bad.  Note that gpg already knows by default about a few critical  signatures  nota- tion names."
  command: "gpg"
  example: "gpg --known-notation name"
- id: 564
  intent: "Set the pinentry mode to mode.  Allowed values for mode are: default Use the default of the agent, which is ask. ask    Force the use of the Pinentry. cancel Emulate use of Pinentry's cancel button. error  Return a Pinentry error (``No Pinentry''). loopback Redirect Pinentry queries to the caller.   Note  that  in contrast to Pinentry the user is not prompted again if he enters a bad password."
  command: "gpg"
