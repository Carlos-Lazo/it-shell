- id: 122
  intent: "Use an existing user namespace instead of creating a new one. The namespace must fulfil the permission requirements for setns(), which generally means that it must be a descendant of the currently active user namespace, owned by the same user. This is incompatible with --unshare-user, and doesn't work in the setuid version of bubblewrap."
  command: "bwrap"
  example: "bwrap --userns FD"
- id: 123
  intent: "After setting up the new namespace, switch into the specified namespace. For this to work the specified namespace must be a descendant of the user namespace used for the setup, so this is only useful in combination with --userns. This is useful because sometimes bubblewrap itself creates nested user namespaces (to work around some kernel issues) and --userns2 can be used to enter these."
  command: "bwrap"
  example: "bwrap --userns2 FD"
- id: 124
  intent: "Prevent the process in the sandbox from creating further user namespaces, so that it cannot rearrange the filesystem namespace or do other more complex namespace modification. This is currently implemented by setting the user.max_user_namespaces sysctl to 1, and then entering a nested user namespace which is unable to raise that limit in the outer namespace. This option requires --unshare-user, and doesn't work in the setuid version of bubblewrap."
  command: "bwrap"
  example: "bwrap --disable-userns"
- id: 125
  intent: "Confirm that the process in the sandbox has been prevented from creating further user namespaces, but without taking any particular action to prevent that. For example, this can be combined with --userns to check that the given user namespace has already been set up to prevent the creation of further user namespaces."
  command: "bwrap"
  example: "bwrap --assert-userns-disabled"
