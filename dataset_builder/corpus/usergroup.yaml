  command: "ppmshadow"
  example: "ppmshadow -x xoffset"
- id: 1321
  intent: "Specifies the displacement of the light source above the top of the image.  Larger settings displace the shadow downward, corre- sponding to moving the light further above the top of the image. If  you  don't  specify  -y, the vertical offset defaults to the same as the horizontal offset (above), upward. ppmshadow does not recognize the options common to all  programs  based on libnetpbm (See Common  Options  <index.html#commonoptions>  .)  However, the -version option works."
  command: "ppmshadow"
  example: "ppmshadow -y yoffset"
