  intent: "This is the aspect ratio of the pixels of the image.   Its  only effect is to record that information in the GIF for use by what- ever interprets the GIF.  Note  that  this  feature  of  GIF  is hardly  ever  used and most GIF decoders ignore this information and assume pixels are square. Pixels in a Netpbm image do not have aspect ratios; there is al- ways a one-one correspondence between GIF pixels and Netpbm pix- els. The aspect ratio is the quotient of  width  divided  by  height. GIF  allows  aspect  ratios from 0.25 (1:4) to 4 (4:1) in incre- ments of 1/64.  pamtogif implements a natural extension  of  GIF that  allows an aspect ratio up to 4 14/64.  If you specify any- thing outside this range, pamtogif fails.  pamtogif rounds frac- tion to the nearest 1/64. The default is square (1.0). This  option was new in Netpbm 10.38 (March 2007).  Before that, the pixels are always square."
