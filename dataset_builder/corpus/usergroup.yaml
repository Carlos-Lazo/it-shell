  command: "sudo"
  example: "sudo --preserve-env=list"
- id: 1504
  intent: "Run the command with the primary group set to group instead of the primary group specified by the target user's password data- base entry.  The group may be either a group name or a numeric group-ID (GID) prefixed with the '#' character (e.g., '#0' for GID 0).  When running a command as a GID, many shells require that the '#' be escaped with a backslash ('\\').  If no -u option is specified, the command will be run as the invoking user.  In either case, the primary group will be set to group.  The sudoers policy permits any of the target user's groups to be specified via the -g option as long as the -P option is not in use."
  command: "sudo"
  example: "sudo -g group, --group=group"
- id: 1505
  intent: "Similar to the -k option, except that it removes every cached credential for the user, regardless of the terminal or parent process ID.  The next time sudo is run, a password must be en- tered if the security policy requires authentication.  It is not possible to use the -K option in conjunction with a command or other option.  This option does not require a password.  Not all security policies support credential caching."
  command: "sudo"
  example: "sudo -K, --remove-timestamp"
- id: 1506
  intent: "When used without a command, invalidates the user's cached cre- dentials for the current session.  The next time sudo is run in the session, a password must be entered if the security policy requires authentication.  By default, the sudoers policy uses a separate record in the credential cache for each terminal (or parent process ID if no terminal is present).  This prevents the -k option from interfering with sudo commands run in a different terminal session.  See the timestamp_type option in sudoers(5) for more information.  This option does not require a password, and was added to allow a user to revoke sudo permissions from a .logout file. When used in conjunction with a command or an option that may re- quire a password, this option will cause sudo to ignore the user's cached credentials.  As a result, sudo will prompt for a password (if one is required by the security policy) and will not update the user's cached credentials. Not all security policies support credential caching."
  command: "sudo"
  example: "sudo -k, --reset-timestamp"
- id: 1507
  intent: "Do not update the user's cached credentials, even if the user successfully authenticates.  Unlike the -k flag, existing cached credentials are used if they are valid.  To detect when the user's cached credentials are valid (or when no authentication is required), the following can be used: sudo -Nnv Not all security policies support credential caching."
  command: "sudo"
  example: "sudo -N, --no-update"
- id: 1508
  intent: "Avoid prompting the user for input of any kind.  If a password is required for the command to run, sudo will display an error mes- sage and exit."
  command: "sudo"
  example: "sudo -n, --non-interactive"
- id: 1509
  intent: "Preserve the invoking user's group vector unaltered.  By default, the sudoers policy will initialize the group vector to the list of groups the target user is a member of.  The real and effective group-IDs, however, are still set to match the target user."
  command: "sudo"
  example: "sudo -P, --preserve-groups"
- id: 1510
  intent: "Use a custom password prompt with optional escape sequences.  The following percent ('%') escape sequences are supported by the sudoers policy: %H  expanded to the host name including the domain name (only if the machine's host name is fully qualified or the fqdn option is set in sudoers(5)) %h  expanded to the local host name without the domain name %p  expanded to the name of the user whose password is being re- quested (respects the rootpw, targetpw, and runaspw flags in sudoers(5)) %U  expanded to the login name of the user the command will be run as (defaults to root unless the -u option is also speci- fied) %u  expanded to the invoking user's login name %%  two consecutive '%' characters are collapsed into a single '%' character The custom prompt will override the default prompt specified by either the security policy or the SUDO_PROMPT environment vari- able.  On systems that use PAM, the custom prompt will also over- ride the prompt specified by a PAM module unless the passprompt_override flag is disabled in sudoers."
  command: "sudo"
  example: "sudo -p prompt, --prompt=prompt"
- id: 1511
  intent: "Used in conjunction with the -l option to list the privileges for user instead of for the invoking user.  The security policy may restrict listing other users' privileges.  When using the sudoers policy, the -U option is restricted to the root user and users with either the \"list\" priviege for the specified user or the ability to run any command as root or user on the current host."
  command: "sudo"
  example: "sudo -U user, --other-user=user"
- id: 1512
  intent: "Run the command as a user other than the default target user (usually root).  The user may be either a user name or a numeric user-ID (UID) prefixed with the '#' character (e.g., '#0' for UID 0).  When running commands as a UID, many shells require that the '#' be escaped with a backslash ('\\').  Some security policies may restrict UIDs to those listed in the password database.  The sudoers policy allows UIDs that are not in the password database as long as the targetpw option is not set.  Other security poli- cies may not support this."
  command: "sudo"
  example: "sudo -u user, --user=user"
- id: 1513
  intent: "Update the user's cached credentials, authenticating the user if necessary.  For the sudoers plugin, this extends the sudo timeout for another 15 minutes by default, but does not run a command. Not all security policies support cached credentials."
  command: "sudo"
  example: "sudo -v, --validate"
- id: 1514
  intent: "sudo, sudoedit -- execute a command as another user"
  command: "sudoedit"
  example: "sudoedit"
- id: 1515
  intent: "sudo -h | -K | -k | -V sudo -v [-ABkNnS] [-g group] [-h host] [-p prompt] [-u user] sudo -l [-ABkNnS] [-g group] [-h host] [-p prompt] [-U user] [-u user] [command [arg ...]] sudo [-ABbEHnPS] [-C num] [-D directory] [-g group] [-h host] [-p prompt] [-R directory] [-r role] [-t type] [-T timeout] [-u user] [VAR=value] [-i | -s] [command [arg ...]] sudoedit [-ABkNnS] [-C num] [-D directory] [-g group] [-h host] [-p prompt] [-R directory] [-r role] [-t type] [-T timeout] [-u user] file ..."
  command: "sudoedit"
  example: "sudoedit"
- id: 1516
  intent: "Normally, if sudo requires a password, it will read it from the user's terminal.  If the -A (askpass) option is specified, a (possibly graphical) helper program is executed to read the user's password and output the password to the standard output. If the SUDO_ASKPASS environment variable is set, it specifies the path to the helper program.  Otherwise, if sudo.conf(5) contains a line specifying the askpass program, that value will be used. For example: # Path to askpass helper program Path askpass /usr/X11R6/bin/ssh-askpass If no askpass program is available, sudo will exit with an error."
  command: "sudoedit"
  example: "sudoedit -A, --askpass"
- id: 1517
  intent: "Ring the bell as part of the password prompt when a terminal is present.  This option has no effect if an askpass program is used."
  command: "sudoedit"
  example: "sudoedit -B, --bell"
- id: 1518
  intent: "Indicates to the security policy that the user wishes to add the comma-separated list of environment variables to those preserved from the user's environment.  The security policy may return an error if the user does not have permission to preserve the envi- ronment.  This option may be specified multiple times."
  command: "sudoedit"
  example: "sudoedit --preserve-env=list"
- id: 1519
  intent: "Run the command with the primary group set to group instead of the primary group specified by the target user's password data- base entry.  The group may be either a group name or a numeric group-ID (GID) prefixed with the '#' character (e.g., '#0' for GID 0).  When running a command as a GID, many shells require that the '#' be escaped with a backslash ('\\').  If no -u option is specified, the command will be run as the invoking user.  In either case, the primary group will be set to group.  The sudoers policy permits any of the target user's groups to be specified via the -g option as long as the -P option is not in use."
  command: "sudoedit"
  example: "sudoedit -g group, --group=group"
- id: 1520
  intent: "Similar to the -k option, except that it removes every cached credential for the user, regardless of the terminal or parent process ID.  The next time sudo is run, a password must be en- tered if the security policy requires authentication.  It is not possible to use the -K option in conjunction with a command or other option.  This option does not require a password.  Not all security policies support credential caching."
  command: "sudoedit"
  example: "sudoedit -K, --remove-timestamp"
- id: 1521
  intent: "When used without a command, invalidates the user's cached cre- dentials for the current session.  The next time sudo is run in the session, a password must be entered if the security policy requires authentication.  By default, the sudoers policy uses a separate record in the credential cache for each terminal (or parent process ID if no terminal is present).  This prevents the -k option from interfering with sudo commands run in a different terminal session.  See the timestamp_type option in sudoers(5) for more information.  This option does not require a password, and was added to allow a user to revoke sudo permissions from a .logout file. When used in conjunction with a command or an option that may re- quire a password, this option will cause sudo to ignore the user's cached credentials.  As a result, sudo will prompt for a password (if one is required by the security policy) and will not update the user's cached credentials. Not all security policies support credential caching."
  command: "sudoedit"
  example: "sudoedit -k, --reset-timestamp"
- id: 1522
  intent: "Do not update the user's cached credentials, even if the user successfully authenticates.  Unlike the -k flag, existing cached credentials are used if they are valid.  To detect when the user's cached credentials are valid (or when no authentication is required), the following can be used: sudo -Nnv Not all security policies support credential caching."
  command: "sudoedit"
