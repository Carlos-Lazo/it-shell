  intent: "Enables or disables specific groups of checks, group can have one of the following values: o accessibility o html o missing o reference o syntax The  variable  access  specifies the minimum visibility level of classes and members that the -Xdoclint option  checks.   It  can have one of the following values (in order of most to least vis- ible): o public o protected o package o private The default access level is private. For more information about these groups of checks, see the -Xdo- clint  option  of  the javadoc command.  The -Xdoclint option is disabled by default in the javac command. For example, the following option  checks  classes  and  members (with  all  groups of checks) that have the access level of pro- tected and higher (which includes protected and public): -Xdoclint:all/protected The following option enables all groups of checks for all access levels, except it will not check for HTML errors for classes and members that have the access level of package and higher  (which includes package, protected and public): -Xdoclint:all,-html/package"
