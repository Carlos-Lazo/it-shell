- id: 1534
  intent: "When system shutdown or sleep state is requested, this option controls checking of inhibitor locks. It takes one of \"auto\", \"yes\" or \"no\". Defaults to \"auto\", which will behave like \"yes\" for interactive invocations (i.e. from a TTY) and \"no\" for non-interactive invocations.  \"yes\" lets the request respect inhibitor locks.  \"no\" lets the request ignore inhibitor locks. Applications can establish inhibitor locks to prevent certain important operations (such as CD burning) from being interrupted by system shutdown or sleep. Any user may take these locks and privileged users may override these locks. If any locks are taken, shutdown and sleep state requests will normally fail (unless privileged). However, if \"no\" is specified or \"auto\" is specified on a non-interactive requests, the operation will be attempted. If locks are present, the operation may require additional privileges. Option --force provides another way to override inhibitors."
  command: "systemctl"
  example: "systemctl --check-inhibitors="
- id: 1535
  intent: "Talk to the service manager of the calling user, rather than the service manager of the system."
  command: "systemctl"
  example: "systemctl --user"
- id: 1536
  intent: "Talk to the service manager of the system. This is the implied default."
  command: "systemctl"
  example: "systemctl --system"
- id: 1537
  intent: "When used with start and related commands, disables asking for passwords. Background services may require input of a password or passphrase string, for example to unlock system hard disks or cryptographic certificates. Unless this option is specified and the command is invoked from a terminal, systemctl will query the user on the terminal for the necessary secrets. Use this option to switch this behavior off. In this case, the password must be supplied by some other means (for example graphical password agents) or the service might fail. This also disables querying the user for authentication for privileged operations."
  command: "systemctl"
  example: "systemctl --no-ask-password"
- id: 1538
  intent: "Execute operation on a local container. Specify a container name to connect to, optionally prefixed by a user name to connect as and a separating \"@\" character. If the special string \".host\" is used in place of the container name, a connection to the local system is made (which is useful to connect to a specific user's user bus: \"--user --machine=lennart@.host\"). If the \"@\" syntax is not used, the connection is made as root user. If the \"@\" syntax is used either the left hand side or the right hand side may be omitted (but not both) in which case the local user name and \".host\" are implied."
  command: "systemctl"
  example: "systemctl -M, --machine="
- id: 1539
  intent: "Determine the initial start-up transaction (i.e. the list of jobs enqueued at start-up), dump it and exit -- without actually executing any of the determined jobs. This option is useful for debugging only. Note that during regular service manager start-up additional units not shown by this operation may be started, because hardware, socket, bus or other kinds of activation might add additional jobs as the transaction is executed. Use --system to request the initial transaction of the system service manager (this is also the implied default), combine with --user to request the initial transaction of the per-user service manager instead."
  command: "systemd"
  example: "systemd --test"
- id: 1540
  intent: "When used in conjunction with --test, selects whether to calculate the initial transaction for the system instance or for a per-user instance. These options have no effect when invoked without --test, as during regular (i.e. non---test) invocations the service manager will automatically detect whether it shall operate in system or per-user mode, by checking whether the PID it is run as is 1 or not. Note that it is not supported booting and maintaining a system with the service manager running in --system mode but with a PID other than 1."
  command: "systemd"
  example: "systemd --system, --user"
- id: 1541
  intent: "Set default unit to activate on startup. If not specified, defaults to default.target. See systemd.unit= above."
  command: "systemd"
  example: "systemd --unit="
