  intent: "Encrypt  the  contents of the zip archive using a password which is entered on the terminal in response to a  prompt  (this  will not  be  echoed;  if  standard error is not a tty, zip will exit with an error).  The password prompt is  repeated  to  save  the user from typing errors."
  command: "zip"
  example: "zip --encrypt"
- id: 1933
  intent: "Attempt  to  convert  the  names  and paths to conform to MSDOS, store only the MSDOS attribute (just the  user  write  attribute from  Unix), and mark the entry as made under MSDOS (even though it was not); for compatibility with PKUNZIP  under  MSDOS  which cannot handle certain names such as those with two dots."
  command: "zip"
  example: "zip --DOS-names"
- id: 1934
  intent: "Append to existing logfile.  Default is to overwrite."
  command: "zip"
  example: "zip --log-append"
- id: 1935
  intent: "Open  a logfile at the given path.  By default any existing file at that location is overwritten, but the -la option will  result in an existing file being opened and the new log information ap- pended to any existing information.  Only  warnings  and  errors are written to the log unless the -li option is also given, then all information messages are also written to the log."
  command: "zip"
  example: "zip --logfile-path logfilepath"
- id: 1936
  intent: "Use password to encrypt zipfile entries (if any).  THIS IS INSE- CURE!  Many multi-user operating systems provide  ways  for  any user  to see the current command line of any other user; even on stand-alone systems there is  always  the  threat  of  over-the- shoulder  peeking.   Storing the plaintext password as part of a command line in an automated script  is  even  worse.   Whenever possible, use the non-echoing, interactive prompt to enter pass- words.  (And where security is truly important, use  strong  en- cryption  such  as Pretty Good Privacy instead of the relatively weak standard encryption provided by zipfile utilities.)"
  command: "zip"
  example: "zip --password password"
- id: 1937
  intent: "[WIN32]   Before  zip  3.0, regular expression list matching was enabled by default on Windows platforms.  Because  of  confusion resulting  from  the  need to escape \"[\" and \"]\" in names, it is now off by default for Windows so \"[\" and \"]\"  are  just  normal characters in names.  This option enables [] matching again."
  command: "zip"
  example: "zip --regex"
- id: 1938
  intent: "Decrypt encrypted entries (copy if given wrong password)."
  command: "zipcloak"
  example: "zipcloak --decrypt"
