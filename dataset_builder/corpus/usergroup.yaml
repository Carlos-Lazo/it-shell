- id: 28
  intent: "Add an Ubuntu Launchpad Personal Package Archive. Must be in the format ppa:USER/PPA, USER/PPA, or USER. The USER parameter should be the Launchpad team or  person  that owns  the PPA.  The PPA parameter should be the name of the PPA; if not provided, it defaults to 'ppa'. The GPG public key of the PPA will also be downloaded and  added to apt's keyring. To  add  a private PPA, you must also use the --login parameter, and of course you must also be subscribed to the private PPA."
  command: "add-apt-repository"
  example: "add-apt-repository -P, --ppa"
