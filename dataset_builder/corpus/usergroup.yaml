  intent: "By default, FileCheck ignores any occurrence  in  match-filename of any check prefix if it is preceded on the same line by \"COM:\" or \"RUN:\". See the section The \"COM:\" directive  for  usage  de- tails. These   default   comment   prefixes   can   be   overridden  by --comment-prefixes if they are not appropriate for your  testing environment.  However,  doing  so  is  not recommended in LLVM's LIT-based test suites, which should be  easier  to  maintain  if they  all  follow a consistent comment style. In that case, con- sider proposing a change to the  default  comment  prefixes  in- stead."
