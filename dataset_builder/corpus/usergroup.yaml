  intent: "This  option tells pnmtopalm to put in the stream, after the im- age, a dummy image header to introduce subsequent  high  density images. This  dummy image header is a special sequence specified in Palm Bitmap specifications.  It looks to an older Palm Bitmap  inter- preter like an invalid image header, so such an interpreter will stop reading the stream there.  But a  new  Palm  Bitmap  inter- preter  recognizes it for what it is (just something to choke an old interpreter) and skips over it.  Presumably, you will add to the stream after this high density images which would confuse an older interpreter. If you specify -withdummy, you must also specify -offset,  since it doesn't make any sense otherwise. -withdummy was new in Netpbm 10.27 (March 2005)."
  command: "pnmtopalm"
  example: "pnmtopalm -withdummy"
- id: 1293
  intent: "This specifies the Palm Bitmap density.  The density is a number that is proportional to the resolution  the  image  should  have when displayed.  The proportionality factor is up to whatever is doing the displaying, but it's helpful to think of these numbers as being pixels per inch.  The allowable values are: o      72 o      108 o      144 o      216 o      288 This  option  was  new  in  Netpbm  10.27 (March 2005).  Earlier Netpbm could not generate Version 3 Palm Bitmaps, so  there  was no such thing as density."
  command: "pnmtopalm"
  example: "pnmtopalm -density=N"
