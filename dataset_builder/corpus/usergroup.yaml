- id: 1396
  intent: "Set the operating mode for reportbug.  reportbug  currently  has four  operating modes: novice (the default), standard, advanced, and expert. novice mode is designed to minimize prompting about things  that \"ordinary users\" would be unlikely to know or care about, shift- ing the triage burden onto the  maintainer.   Checking  for  new versions  is only done for the stable distribution in this mode. It is currently the default mode. standard mode includes a relatively large number of prompts  and tries  to encourage users to not file frivolous or duplicate bug reports. advanced mode is like standard mode, but may  include  shortcuts suitable  for  more  advanced  users of Debian, without being as close to the metal  (and  potential  flamage)  as  expert  mode. (Currently,  the only differences from standard mode are that it assumes familiarity with the \"new\" queue; it allows the  report- ing  of  bugs  on  \"dependency\" packages; and it does not prompt where to insert the report text in the editor.) expert mode is designed to minimize prompts that are designed to discourage  frivolous  or unnecessary bug reports, \"severity in- flation,\" and the like.  In expert mode, reportbug  assumes  the user  is thoroughly familiar with Debian policies.  In practice, this means that reporters are no longer required to justify set- ting  a  high  severity  on  a bug report, and certain automated cleanups of the message are bypassed.  Individuals  who  do  not regularly  contribute  to the Debian project are highly discour- aged from using expert mode, as it  can  lead  to  flamage  from maintainers when used improperly."
  command: "reportbug"
  example: "reportbug --mode=MODE"
- id: 1397
  intent: "Add a custom pseudo-header to your report; for example,  to  add the  mytag usertag for the user humberto@example.com to the bug, you could use -P 'User: humberto@example.com' -P 'Usertags:  my- tag'."
  command: "reportbug"
