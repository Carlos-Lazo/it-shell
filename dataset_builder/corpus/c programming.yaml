- id: 181
  intent: "read  keystroke  commands  from the specified file.  You can use the data written using the -cmd_log option.   Lynx  will  ignore other  information which the command-logging may have written to the logfile.  Each line of the command script contains either  a comment beginning with \"#\", or a keyword: exit causes   the   script  to  stop,  and  forces  Lynx  to  exit immediately. key the character value, in printable  form.   Cursor  and  other special   keys  are  given  as  names,  e.g.,  \"Down  Arrow\". Printable 7-bit ASCII codes are given as-is, and  hexadecimal values represent other 8-bit codes. set followed  by a \"name=value\" allows one to override values set in the lynx.cfg or .lynxrc files.  Lynx  tries  the  cfg-file setting first."
  command: "www-browser"
  example: "www-browser -cmd_script=FILENAME"
- id: 182
  intent: "toggle memory leak-checking.  Normally this is not compiled-into your executable, but when it  is,  it  can  be  disabled  for  a session."
  command: "www-browser"
  example: "www-browser -find_leaks"
- id: 183
  intent: "Enables or disables a limit on the amount of recursion performed whilst demangling strings.  Since the name mangling formats allow for an infinite level of recursion it is possible to create strings whose decoding will exhaust the amount of stack space available on the host machine, triggering a memory fault.  The limit tries to prevent this from happening by restricting recursion to 2048 levels of nesting. The default is for this limit to be enabled, but disabling it may be necessary in order to demangle truly complicated names.  Note however that if the recursion limit is disabled then stack exhaustion is possible and any bug reports about such an event will be rejected. The -r option is a synonym for the --no-recurse-limit option.  The -R option is a synonym for the --recurse-limit option."
  command: "x86_64-linux-gnu-c++filt"
  example: "x86_64-linux-gnu-c++filt --no-recursion-limit"
- id: 184
  intent: "This option is supported for HP/UX compatibility.  The keyword argument must be one of the strings archive, shared, or default. -aarchive is functionally equivalent to -Bstatic, and the other two keywords are functionally equivalent to -Bdynamic.  This option may be used any number of times."
  command: "x86_64-linux-gnu-ld"
  example: "x86_64-linux-gnu-ld -a keyword"
