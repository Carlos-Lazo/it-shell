  intent: "Print  diagnostic  information;  this can be helpful to diagnose problems with why find is not doing what you want.  The list  of debug  options  should be comma separated.  Compatibility of the debug options is not guaranteed between releases  of  findutils. For  a  complete  list of valid debug options, see the output of find -D help.  Valid debug options include exec   Show diagnostic information relating to -exec,  -execdir, -ok and -okdir opt    Prints  diagnostic  information relating to the optimisa- tion of the expression tree; see the -O option. rates  Prints a summary indicating how often each predicate suc- ceeded or failed. search Navigate the directory tree verbosely. stat   Print  messages  as  files are examined with the stat and lstat system calls.  The find program tries  to  minimise such calls. tree   Show  the  expression  tree in its original and optimised form. all    Enable all of the other debug options (but help). help   Explain the debugging options."
