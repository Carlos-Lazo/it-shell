- id: 118
  intent: "This option causes the output  not  to  contain  any  GIF  clear codes. In  GIF, the stream defines codes that represent strings of pix- els as it goes.  The stream contains definitions of codes  mixed in  with  the references to those codes that describe the pixels of the image.  GIF specifies a maximum number of codes that  can be  defined;  when  the stream has defined that many, the stream can either just use those for the rest of the image or include a clear code, deleting all the string codes so that the stream can start over defining new ones. By far the most common choice is the clear code.   This  usually results in a smaller stream because the set of strings of pixels that occur in an image vary over the parts of the image.  Hardly any GIF encoders produce streams that don't use the clear code. But it is conceivable that a stream could be smaller without the use of the clear code because it saves the stream having to  re- define the same string codes over and over.  It could even avoid a thrashing situation where the stream continually defines a set of  strings  that  never  get  used  again before the maximum is reached. The default is to use the clear codes. This option was new in Netpbm 10.82 (March 2018).  Before  that, the program aways uses the clear codes."
  command: "pamtogif"
  example: "pamtogif -noclear"
- id: 119
  intent: "pbmnoise  internally  generates  random 32-bit integers and uses the machine's binary encoding of those integers  as  strings  of pixels.   Because  the  integers are random, it doesn't normally matter what binaary encoding is used for them, but if  you  need consistent results between machines using the same random number generator, it matters.  For that reason (mainly for testing  the program),  this  option  lets you control that encoding, between big-endian and little-endian. mode is one of the following: big    Force big-endian output by rearranging  bytes  on  little-endian machines.  No effect on big-endian machines. little Likewise, force little-endian output. native Do not rearrange anything.  This is the default. swap   Always swap regardless of system endianness."
  command: "pbmnoise"
  example: "pbmnoise -endian=mode"
