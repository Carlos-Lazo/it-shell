  intent: "If TYPE is \"ExifTool\" or not specified, this option sets the ExifTool character encoding for output tag values when reading and input values when writing, with a default of \"UTF8\".  If no CHARSET is given, a list of available character sets is returned. Valid CHARSET values are: CHARSET     Alias(es)        Description ----------  ---------------  ---------------------------------- UTF8        cp65001, UTF-8   UTF-8 characters (default) Latin       cp1252, Latin1   Windows Latin1 (West European) Latin2      cp1250           Windows Latin2 (Central European) Cyrillic    cp1251, Russian  Windows Cyrillic Greek       cp1253           Windows Greek Turkish     cp1254           Windows Turkish Hebrew      cp1255           Windows Hebrew Arabic      cp1256           Windows Arabic Baltic      cp1257           Windows Baltic Vietnam     cp1258           Windows Vietnamese Thai        cp874            Windows Thai DOSLatinUS  cp437            DOS Latin US DOSLatin1   cp850            DOS Latin1 DOSCyrillic cp866            DOS Cyrillic MacRoman    cp10000, Roman   Macintosh Roman MacLatin2   cp10029          Macintosh Latin2 (Central Europe) MacCyrillic cp10007          Macintosh Cyrillic MacGreek    cp10006          Macintosh Greek MacTurkish  cp10081          Macintosh Turkish MacRomanian cp10010          Macintosh Romanian MacIceland  cp10079          Macintosh Icelandic MacCroatian cp10082          Macintosh Croatian TYPE may be \"FileName\" to specify the encoding of file names on the command line (ie. FILE arguments).  In Windows, this triggers use of wide-character i/o routines, thus providing support for Unicode file names.  See the \"WINDOWS UNICODE FILE NAMES\" section below for details. Other values of TYPE listed below are used to specify the internal encoding of various meta information formats. TYPE       Description                                  Default ---------  -------------------------------------------  ------- EXIF       Internal encoding of EXIF \"ASCII\" strings    (none) ID3        Internal encoding of ID3v1 information       Latin IPTC       Internal IPTC encoding to assume when        Latin IPTC:CodedCharacterSet is not defined Photoshop  Internal encoding of Photoshop IRB strings   Latin QuickTime  Internal encoding of QuickTime strings       MacRoman RIFF       Internal encoding of RIFF strings            0 See <https://exiftool.org/faq.html#Q10> for more information about coded character sets, and the Image::ExifTool Options for more details about the -charset settings."
  command: "exiftool"
  example: "exiftool -charset [[TYPE=]CHARSET]"
- id: 39
  intent: "Ignore minor errors and warnings.  This enables writing to files with minor errors and disables some validation checks which could result in minor warnings.  Generally, minor errors/warnings indicate a problem which usually won't result in loss of metadata if ignored.  However, there are exceptions, so ExifTool leaves it up to you to make the final decision.  Minor errors and warnings are indicated by \"[minor]\" at the start of the message.  Warnings which affect processing when ignored are indicated by \"[Minor]\" (with a capital \"M\").  Note that this causes missing values in -tagsFromFile, -p and -if strings to be set to an empty string rather than an undefined value."
  command: "exiftool"
  example: "exiftool -m (-ignoreMinorErrors)"
