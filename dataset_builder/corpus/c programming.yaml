  intent: "whether those sections are loaded or initialized.  Normally this is the default behaviour, but strings can be configured so that the -d is the default instead. The - option is position dependent and forces strings to perform full scans of any file that is mentioned after the - on the command line, even if the -d option has been specified."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings -   Scan the whole file, regardless of what sections it contains or"
- id: 194
  intent: "Only print strings from initialized, loaded data sections in the file.  This may reduce the amount of garbage in the output, but it also exposes the strings program to any security flaws that may be present in the BFD library used to scan and load sections.  Strings can be configured so that this option is the default behaviour.  In such cases the -a option can be used to avoid using the BFD library and instead just print all of the strings found in the file."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --data"
- id: 195
  intent: "Print the name of the file before each string."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --print-file-name"
- id: 196
  intent: "Print a summary of the program usage on the standard output and exit."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --help"
- id: 197
  intent: "Print sequences of displayable characters that are at least min-len characters long.  If not specified a default minimum length of 4 is used.  The distinction between displayable and non-displayable characters depends upon the setting of the -e and -U options. Sequences are always terminated at control characters such as new- line and carriage-return, but not the tab character."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --bytes=min-len"
