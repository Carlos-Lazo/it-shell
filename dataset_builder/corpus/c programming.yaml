  intent: "Before attempting to place the subimages, pnmmontage will calcu- late a minimum possible area for the montage; this is either the total  of  the  areas  of all the subimages, or the width of the widest subimage times the height of the tallest subimage, which- ever  is  greater.   pnmmontage  then  initiates a problem-space search to find the best packing; if it finds a solution that  is (at  least)  as  good as the minimum area times the quality as a percent, it will break out of the  search.   Thus,  -quality=100 will  find  the  best  possible solution; however, it may take a very long time to do so.  The default is -quality=200."
