  intent: "Print the offset within the file before each string.  The single character argument specifies the radix of the offset---o for octal, x for hexadecimal, or d for decimal."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --radix=radix"
- id: 200
  intent: "Select the character encoding of the strings that are to be found. Possible values for encoding are: s = single-7-bit-byte characters (default), S = single-8-bit-byte characters, b = 16-bit bigendian, l = 16-bit littleendian, B = 32-bit bigendian, L = 32-bit littleendian.  Useful for finding wide character strings. (l and b apply to, for example, Unicode UTF-16/UCS-2 encodings)."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --encoding=encoding"
