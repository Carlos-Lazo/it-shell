  intent: "Specify the name of another section from which the CTF file can inherit strings and symbols.  By default, the \".symtab\" and its linked string table are used. If either of --ctf-symbols or --ctf-strings is specified, the other must be specified as well."
  command: "x86_64-linux-gnu-readelf"
  example: "x86_64-linux-gnu-readelf --ctf-strings=section"
