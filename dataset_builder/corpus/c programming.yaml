  intent: "Set   encoding  for  interpreting  `xxx:'  strings  [default: `none'].  Allowed values are: `none', `utf8', `sjis' and `eu- cjp'. This  option allows users to specify the correct encoding for dumping/compiling the contents of \\special. Typical usages are as follows: 1) By default, the contents of \\special are dumped/compiled as  byte-to-byte  escape  sequences in `\\x..' format.  This would suffice when you don't need to read/edit the contents of \\special. 3)  For  XeTeX  and  upTeX users, `-x utf8' would be useful since these engines use  UTF-8  to  encode  strings  inside \\special commands. 2) For pTeX users with ISO-2022-JP-encoded DVI, it would be helpful to select the appropriate option  `-x  eucjp'  (for Unix)  or `-x sjis' (for Windows) to be consistent with the internal Kanji encoding used by pTeX engine."
  command: "dviasm"
  example: "dviasm -x <STR>, --xxx-encoding=<STR>"
- id: 32
  intent: "This will disable the use of pTeX extensions  when  interpreting DVI  files.   By default, the additional opcodes 130 and 135 are recognized by dvips as pTeX extensions and  interpreted  as  re- quests  to  set  3-byte characters, and 255 as request to change the typesetting direction. The only drawback is that the virtual font array will (at  least temporarily)  require 65536 or more positions instead of the de- fault 256 positions, i.e., the memory requirements of dvips will be  somewhat larger.  If you find this unacceptable or encounter another problem with the  Omega  or  pTeX  extensions,  you  can switch off the pTeX extension by using -noptex, or both by using -noomega (but please do send a bug report if you find such prob- lems - see the bug address in the AUTHORS section below)."
  command: "dvips"
  example: "dvips -noptex"
