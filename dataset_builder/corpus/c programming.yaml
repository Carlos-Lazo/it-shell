- id: 203
  intent: "By default tab and space characters are included in the strings that are displayed, but other whitespace characters, such a newlines and carriage returns, are not.  The -w option changes this so that all whitespace characters are considered to be part of a string."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --include-all-whitespace"
- id: 204
  intent: "By default, output strings are delimited by a new-line. This option allows you to supply any string to be used as the output record separator.  Useful with --include-all-whitespace where strings may contain new-lines internally. @file Read command-line options from file.  The options read are inserted in place of the original @file option.  If file does not exist, or cannot be read, then the option will be treated literally, and not removed. Options in file are separated by whitespace.  A whitespace character may be included in an option by surrounding the entire option in either single or double quotes.  Any character (including a backslash) may be included by prefixing the character to be included with a backslash.  The file may itself contain additional @file options; any such options will be processed recursively."
  command: "x86_64-linux-gnu-strings"
  example: "x86_64-linux-gnu-strings --output-separator"
- id: 205
  intent: "Some X servers incorrectly  implement  PolyText  with  multiple strings  per  request.   This option suppresses the use of this feature in xditview."
  command: "xditview"
  example: "xditview -noPolyText"
- id: 206
  intent: "(.debugLevel) If nonzero, prints additional information on stan- dard  output.  The argument can be either a bitmask specified as a decimal number, or comma-separated list of strings. For the bitmask representation, multiple values can be specified by  adding  the numbers that represent the individual bits; e.g. to debug all file searching and opening commands,  use  4032  (= 2048 + 1024 + 512 + 256 + 128 + 64). Use -1 to turn on debugging of everything (this will produce huge output). For the string representation, use the  strings  listed  in  the following  table,  with  a comma to separate the values; e.g. to debug all file searching and opening  commands,  use  search,ex- pand,paths,hash,stat,open.   (The  option `kpathsea' is provided as a shorthand for these.)  Note that such a list may need to be quoted  to  prevent the shell from interpreting commas or spaces in the list. The individual numbers and strings have the following meanings: 1       bitmap      Bitmap creation 2       dvi         DVI translation 4       pk          PK fonts 8       batch       Batch mode: Exit after reading the DVI file 16      event       Event handling 32      ps          PostScript interpreter calls 64      stat        Kpathsea stat(2) calls 128     hash        Kpathsea hash table lookups 256     open        Kpathsea file opening 512     paths       Kpathsea path definitions 1024    expand      Kpathsea path expansion 2048    search      Kpathsea searching 4032    kpathsea    All Kpathsea options 4096    htex        Hypertex specials 8192    src         Source specials 16384   client      Client/server mode (see -unique and -sourceposition options) 32768   ft          FreeType library messages (Type 1 fonts) 65536   ft_verbose  Verbose FreeType library messages (currently unused) 131072  gui         GUI elements 262144  find        Searching for strings in the DVI file 524288  files       File history and opening DVI files Some of the Kpathsea debugging options are actually provided  by Kpathsea;  see  the Debugging section in the Kpathsea manual for more information on these."
  command: "xdvi"
  example: "xdvi -debug bitmask|string[,string ...]"
- id: 207
  intent: "(.omega)  This will disable the use of Omega extensions when in- terpreting DVI files.  By default, the  additional  opcodes  129 and  134  are  recognized by xdvi as Omega extensions and inter- preted as requests to set 2-byte characters. The  only  drawback is  that the virtual font array will require 65536 positions in- stead of the default 256 positions, i.e. the memory requirements of  xdvi  will be slightly larger. If you find this unacceptable or encounter another problem with the Omega extensions, you  can switch  this extension off by using -noomega (but please do send a bug report if you find such problems - see the bug address  in the AUTHORS section below). (Note:  -noomega  corresponds  to omega: off; +noomega to omega: on.)"
  command: "xdvi"
  example: "xdvi -noomega"
- id: 208
  intent: "(.warnSpecials)  Causes  xdvi  to  print warnings about \\special strings that it cannot process to  stderr.  These  warnings  are suppressed by default."
  command: "xdvi"
  example: "xdvi -warnspecials"
- id: 209
  intent: "This option allows you to specify a particular visual or visual class.   The  default  is to pick the \"best\" one.  A particular class can be  specified:  \"StaticGray\",  \"GrayScale\",  \"Static- Color\",   \"PseudoColor\",  \"DirectColor\",  or  \"TrueColor\".   Or \"Match\" can be specified, meaning use the  same  class  as  the source  image.   Alternatively, an exact visual id (specific to the server) can be specified, either as  a  hexadecimal  number (prefixed  with  \"0x\")  or  as a decimal number.  Finally, \"de- fault\" can be specified, meaning to use the same class  as  the colormap of the root window.  Case is not significant in any of these strings."
  command: "xwud"
  example: "xwud -vis vis-type-or-id"
