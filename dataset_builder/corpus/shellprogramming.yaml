  intent: "Force or refuse (no-force and refuse mean the same thing) to do some things (since dpkg 1.19.5).  things is a comma separated list of things specified below.  --force-help displays a message describing them.  Things marked with (*) are forced by default. Warning: These options are mostly intended to be used by experts only.  Using them without fully understanding their effects may break your whole system. all: Turns on (or off) all force options. statoverride-add: Overwrite an existing stat override when adding it (since dpkg 1.19.5). statoverride-remove: Ignore a missing stat override when removing it (since dpkg 1.19.5). security-mac(*): Use platform-specific Mandatory Access Controls (MAC) based security when installing files into the filesystem (since dpkg 1.19.5).  On Linux systems the implementation uses SELinux. not-root: Try to (de)install things even when not root (since dpkg 1.21.8)."
