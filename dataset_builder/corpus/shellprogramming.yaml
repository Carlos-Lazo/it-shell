  intent: "infocmp trims away less essential parts to make it  fit.   If  you  are converting to one of the (rare) termcap implementations which accept an unlimited size of termcap, you may want to add the -T option.  More of- ten  however, you must help the termcap implementation, and trim excess whitespace (use the -0 option for that). All padding information for strings  will  be  collected  together  and placed at the beginning of the string where termcap expects it.  Manda- tory padding (padding information with a trailing \"/\") will become  op- tional. All  termcap  variables  no longer supported by terminfo, but which are derivable from other terminfo variables, will be output.  Not all  ter- minfo  capabilities will be translated; only those variables which were part of termcap will normally be output.  Specifying the -r option will take  off  this  restriction, allowing all capabilities to be output in termcap form.  Normally you would use both the -C and -r options.   The actual  format  used incorporates some improvements for escaped charac- ters from terminfo format.  For a stricter BSD-compatible  translation, use the -K option rather than -C. Note that because padding is collected to the beginning of the capabil- ity, not all capabilities are output.  Mandatory padding  is  not  sup- ported.   Because termcap strings are not as flexible, it is not always possible to convert a terminfo string  capability  into  an  equivalent termcap  format.  A subsequent conversion of the termcap file back into terminfo format will not necessarily reproduce  the  original  terminfo source. Some  common  terminfo  parameter sequences, their termcap equivalents, and some terminal types which commonly have such sequences, are: terminfo                    termcap   Representative Terminals --------------------------------------------------------------- %p1%c                       %.        adm %p1%d                       %d        hp, ANSI standard, vt100 %p1%'x'%+%c                 %+x       concept %i                          %iq       ANSI standard, vt100 %p1%?%'x'%>%t%p1%'y'%+%;    %>xy      concept %p2 is printed before %p1   %r        hp Use= Option [-u] The -u option produces a terminfo source description of the first  ter- minal  termname  which is relative to the sum of the descriptions given by the entries for the other terminals termnames.  It does this by ana- lyzing  the  differences  between  the  first  termname  and  the other termnames and producing a description with use= fields  for  the  other terminals.  In this manner, it is possible to retrofit generic terminfo entries into a terminal's description.  Or, if  two  similar  terminals exist, but were coded at different times or by different people so that each description is a full description, using infocmp  will  show  what can be done to change one description to be relative to the other. A capability will be printed with an at-sign (@) if it no longer exists in the first termname, but one of the other termname entries contains a value for it.  A capability's value will be printed if the value in the first termname is not found in any of the other termname entries, or if the  first of the other termname entries that has this capability gives a different value for the capability than that in the first termname. The order of the other termname entries is significant.  Since the ter- minfo compiler tic does a left-to-right scan of the capabilities, spec- ifying two use= entries that contain differing entries for the same ca- pabilities  will  produce different results depending on the order that the entries are given in.  infocmp will flag any  such  inconsistencies between the other termname entries as they are found. Alternatively, specifying a capability after a use= entry that contains that capability will cause the second specification to be ignored.  Us- ing  infocmp  to  recreate  a description can be a useful check to make sure that everything was specified correctly in the original source de- scription. Another  error  that  does not cause incorrect compiled files, but will slow down the compilation time, is specifying extra  use=  fields  that are superfluous.  infocmp will flag any other termname use= fields that were not needed. Changing Databases [-A directory] [-B directory] Like other ncurses utilities, infocmp looks for the  terminal  descrip- tions  in  several  places.  You can use the TERMINFO and TERMINFO_DIRS environment variables to  override  the  compiled-in  default  list  of places to search (see ncurses(3NCURSES) for details). You  can  also use the options -A and -B to override the list of places to search when comparing terminal descriptions: o   The -A option sets the location for the first termname o   The -B option sets the location for the other termnames. Using these options, it is possible to compare descriptions for a  ter- minal  with  the same name located in two different databases.  For in- stance, you can use this feature for  comparing  descriptions  for  the same terminal created by different people. Other Options"
  command: "infocmp"
  example: "infocmp -C  and  -r.   Normally a termcap description is limited to 1023 bytes."
