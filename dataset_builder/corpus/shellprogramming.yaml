  intent: "These options control how DWARF debug sections are compressed. --compress-debug-sections=none is equivalent to --nocompress-debug-sections.  --compress-debug-sections=zlib and --compress-debug-sections=zlib-gabi are equivalent to --compress-debug-sections.  --compress-debug-sections=zlib-gnu compresses DWARF debug sections using the obsoleted zlib-gnu format.  The debug sections are renamed to begin with .zdebug. --compress-debug-sections=zstd compresses DWARF debug sections using zstd.  Note - if compression would actually make a section larger, then it is not compressed nor renamed."
