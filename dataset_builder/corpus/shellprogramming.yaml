- id: 606
  intent: "Use ExifTool-specific RDF/XML formatting for console output. Implies the -a option, so duplicate tags are extracted.  The formatting options -b, -D, -H, -l, -s, -sep, -struct and -t may be used in combination with -X to affect the output, but note that the tag ID (-D, -H and -t), binary data (-b) and structured output (-struct) options are not effective for the short output (-s). Another restriction of -s is that only one tag with a given group and name may appear in the output.  Note that the tag ID options (-D, -H and -t) will produce non-standard RDF/XML unless the -l option is also used. By default, -X outputs flattened tags, so -struct should be added if required to preserve XMP structures.  List-type tags with multiple values are formatted as an RDF Bag, but they are combined into a single string when -s or -sep is used.  Using -L changes the XML encoding from \"UTF-8\" to \"windows-1252\".  Other -charset settings change the encoding only if there is a corresponding standard XML character set.  The -b option causes binary data values to be written, encoded in base64 if necessary.  The -t option adds tag table information to the output (see -t for details). Note:  This output is NOT the same as XMP because it uses dynamically-generated property names corresponding to the ExifTool tag names with ExifTool family 1 group names as namespaces, and not the standard XMP properties and namespaces.  To write XMP instead, use the -o option with an XMP extension for the output file. Processing control"
  command: "exiftool"
  example: "exiftool -X (-xmlFormat)"
- id: 607
  intent: "These utility options automate the maintenance of the \"_original\" files created by exiftool.  They have no effect on files without an \"_original\" copy.  The -restore_original option restores the specified files from their original copies by renaming the \"_original\" files to replace the edited versions.  For example, the following command restores the originals of all JPG images in directory \"DIR\": exiftool -restore_original -ext jpg DIR The -delete_original option deletes the \"_original\" copies of all files specified on the command line.  Without a trailing \"!\" this option prompts for confirmation before continuing.  For example, the following command deletes \"a.jpg_original\" if it exists, after asking \"Are you sure?\": exiftool -delete_original a.jpg These options may not be used with other options to read or write tag values in the same command, but may be combined with options such -ext, -if, -r, -q and -v. Advanced options Among other things, the advanced options allow complex processing to be performed from a single command without the need for additional scripting.  This may be particularly useful for implementations such as Windows drag-and-drop applications.  These options may also be used to improve performance in multi-pass processing by reducing the overhead required to load exiftool for each invocation."
  command: "exiftool"
  example: "exiftool -delete_original[!]"
- id: 608
  intent: "For example, the following command may be used to remove duplicate Keywords: exiftool -sep '##' '-keywords<${keywords;NoDups}' a.jpg The -sep option is necessary to split the string back into individual list items when writing to a list-type tag. An optional flag argument may be set to 1 to cause \"NoDups\" to set $_ to undef if no duplicates existed, thus preventing the file from being rewritten unnecessarily: exiftool -sep '##' '-keywords<${keywords;NoDups(1)}' a.jpg Note that function names are case sensitive."
  command: "exiftool"
  example: "exiftool -sep option.  This function is most useful when copying list-type tags."
