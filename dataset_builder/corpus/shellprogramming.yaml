  intent: "Whenever  the  test  program  produces output on its standard output stream, it should match the contents  of  filename  (the  \"reference output\").  If  you  do not use this option, bugpoint will attempt to generate a reference output by compiling the program with the \"safe\" backend and running it."
  command: "bugpoint-14"
  example: "bugpoint-14 -output filename"
- id: 178
  intent: "Whenever the test program is compiled, bugpoint should generate code for it using the specified code generator.  These options allow  you to  choose the interpreter, the JIT compiler, the static native code compiler, or a custom command (see -exec-command) respectively."
  command: "bugpoint-14"
  example: "bugpoint-14 -run-{int,jit,llc,custom}"
- id: 179
  intent: "When debugging a code generator, bugpoint should use  the  specified code  generator  as  the \"safe\" code generator. This is a known-good code generator used to generate the \"reference output\" if it has not been  provided,  and to compile portions of the program that as they are excluded from the testcase.  These options allow you  to  choose the   static  native  code  compiler,  or  a  custom  command,  (see"
  command: "bugpoint-14"
  example: "bugpoint-14 -safe-{llc,custom}"
- id: 180
  intent: "This  option defines the command to use with the -compile-custom op- tion to compile the bitcode testcase. The command should exit with a failure  exit code if the file is \"interesting\" and should exit with a success exit code (i.e. 0) otherwise (this is the same  as  if  it crashed on \"interesting\" inputs). This  can  be useful for testing compiler output without running any link or execute stages. To generate a reduced unit test, you may add CHECK  directives to the testcase and pass the name of an executable compile-command script in this form: #!/bin/sh llc \"$@\" not FileCheck [bugpoint input file].ll < bugpoint-test-program.s This script will \"fail\" as long as FileCheck passes. So  the  result will be the minimum bitcode that passes FileCheck."
  command: "bugpoint-14"
  example: "bugpoint-14 -compile-command command"
- id: 181
  intent: "The default behavior of bugpoint is to print \"<crash>\" when it finds a reduced test that crashes compilation. This flag prints the output of the crashing program to stderr. This is useful to make sure it is the  same  error  being  tracked down and not a different error that happens to crash the compiler as well. Defaults to false."
  command: "bugpoint-14"
  example: "bugpoint-14 -verbose-errors={true,false}"
