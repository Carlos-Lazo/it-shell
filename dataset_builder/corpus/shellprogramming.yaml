- id: 1823
  intent: "This  option  says to adjust the weights in your convolution ma- trix so they all add up to one.  You usually want them to add up to one so that the convolved result tends to have the same over- all brightness as the input.  With -normalize, pnmconvol  scales all the weights by the same factor to make the sum one.  It does this for each plane. This can be quite convenient because you can just throw  numbers into the matrix that have roughly the right relationship to each other and let pnmconvol do the work of  normalizing  them.   And you  can  adjust a matrix by raising or lowering certain weights without having to modify all the other weights to maintain  nor- malcy.  And you can use friendly integers. Example: $ pnmconvol myimage.ppm -normalize -matrix=1,1,1;1,1,1;1,1,1 This is of course a basic 3x3 average, but without you having to specify 1/9 (.1111111) for each weight. This option was new in Netpbm 10.50 (March  2010).   But  before Netpbm  10.79 (June 2017), it has no effect when you specify the convolution matrix via pseudo-PNM file."
  command: "pnmconvol"
  example: "pnmconvol -normalize"
- id: 1824
  intent: "pnmcrop [-white |-black |-sides |-bg-color=color |-bg-corner={ topleft|topright|bottomleft|bottomright} ] [-left] [-right] [-top] [-bottom] [-margin=pixels] [-closeness=closeness_percent] [-borderfile=filename] [-blank-image={abort|pass|minimize|maxcrop}] {[-reportfull]|[-reportsize]} [-verbose] [pnmfile] Minimum unique abbreviation of option is acceptable. You may use dou- ble hyphens instead of single hyphen to denote options. You may use white space in place of the equals sign to separate an option name from its value."
  command: "pnmcrop"
  example: "pnmcrop"
- id: 1825
  intent: "ners  of  the input image.  pnmcrop removes borders which are of the background color. If at least three of the four corners are the same  color,  pnm- crop  takes that as the background color.  If not, pnmcrop looks for two corners of the same color in the following order, taking the  first found as the background color: top, left, right, bot- tom.  If all four corners are different colors, pnmcrop  assumes an average of the four colors as the background color. The -sides option slows pnmcrop down, as it reads the entire im- age to determine the background color in addition to the  up  to three times that it would read it without -sides. You  may  specify  at  most  one of -black, -white, -sides, -bg- color, and -bg-corner."
  command: "pnmcrop"
  example: "pnmcrop -sides Determine the background color from the colors of the four  cor-"
- id: 1826
  intent: "This determines how pnmcrop handles an image which is entirely background  (blank),  a  case where cropping doesn't make much sense. abort program fails, with explanatory message (default) pass Output image is the same as the input image. -margin has no effect. minimize output is a single row, column,  or  pixel  (of  the  background color). If  you  crop  both  vertically  and horizontally (the de- fault), it is a single pixel.  If you crop only vertically, a single  row, of the original  width.   If  you crop only horizontally, it is a single column, of the original height. This is a somewhat incongruous result; the  mathematically  con- sistent result  of cropping the background from an image that is entirely background would be an image with no pixels at all.  But such a thing does  not  exist in the Netpbm formats (and you probably wouldn't want it anyway, because whoever processes this output may not tolerate that). The background can be more than one color when you specify -closeness,  so it matters which row, column, or pixel re- mains. If you crop on the top and not bottom, it is the last  row that remains. If  you  crop on both the top and bottom, it is the middle row that remains.  The other cases follow similarly. If you specify a margin (-margin), the output image consists entirely of the margins; there is no single row, column, or pixel between the margins.  So with -margin, the incongruity mentioned above does not exist.  But before Netpbm 10.92 (September 2020), -margin was ignored with -blank-image=minimize. maxcrop This odd function selects a hypothetical cropping which  is  not even possible, and therefore is valid only with -reportfull or -reportsize.   The cropping that this selects is a crop of the entire image on every side on which you request  cropping. So if you request cropping only on the left, of a 600 pixel wide im- age, this selects a cropping of 600 pixels from the  left  and  none from the other three  sides.   Note  that were this cropping actually ap- plied, this would produce an image with no pixels,  which  is  not  a  valid Netpbm image.  But it gets stranger still if you request cropping on both the right and the left.  In that case, the cropping selected is  a  cropping of 600 pixels from  both  the  right and left sides, which would leave a negative-width image. This is actually useful if you are trying to find a single set of cropping  parameters  to  crop  a stream of images.  To do this, you could do a pass with -reportsize and -blank-image=maxcrop to compute the maximum crop for each edge, and then use those numbers in -cropxxx options on a pamcut pass to do the crop. In  this scenario, any all-background (blank) images would have no effect on the cropping parameters you compute.  If you  do  this, you must give special  consideration  to a stream with nothing but blank images. -margin is always ignored when the image is all background. This option was new in Netpbm 10.86 (March 2019)."
  command: "pnmcrop"
  example: "pnmcrop -blank-image={abort|pass|minimize|maxcrop}"
- id: 1827
  intent: "With this option, pnmcrop does not actually crop anything.   In- stead, it just prints to Standard Output parameters of the crop- ping it would have done.  The output is a single line per image, like in this example: 0 +7 -20 -10 200 300 rgb-255:10/0/255 0.0 The line is composed of the following blank-delimited tokens: o      how many pixels would be cropped or padded on the left.  This is a signed decimal number, where + means pad and - means crop. If there would be no change, this is unsigned zero. o      same, but for the right side. o      same, but for the top. o      same, but for the bottom. o      the resulting image width in pixels, in decimal. o      the resulting image height in pixels, in decimal. o      The color pnmcrop took to be the background color, like 'rgb-255:10/0/255' (This is a format recognized by the pnm_parsecolor() <libnetpbm_image.html#colorname> library routine).  The maxval in the color  specification  is the maxval of the image. o      The closeness value (see -closeness option) pnmcrop used, in floating point decimal. You cannot use -borderfile together with this option. This option was new in Netpbm 10.86 (March 2019)."
  command: "pnmcrop"
  example: "pnmcrop -reportfull"
