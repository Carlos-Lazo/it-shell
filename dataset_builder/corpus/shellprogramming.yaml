  intent: "Restrict  output  to  a given subset.  This option is for use with archaic versions of terminfo like those on SVr1, Ultrix, or  HP-UX that  do not support the full set of SVR4/XSI Curses terminfo; and variants such as AIX that have their own  extensions  incompatible with SVr4/XSI. o   Available  terminfo  subsets  are  \"SVr1\", \"Ultrix\", \"HP\", and \"AIX\"; see terminfo(5) for details. o   You can also choose the subset \"BSD\" which selects only  capa- bilities  with  termcap equivalents recognized by 4.4BSD.  The -C option sets the \"BSD\" subset as a side-effect. o   If you select any other value for -R, it is  the  same  as  no subset,  i.e., all capabilities are used.  The -I option like- wise selects no subset as a side-effect."
