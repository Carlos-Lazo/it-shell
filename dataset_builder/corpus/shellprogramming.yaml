  intent: "Visualize jumps that stay inside a function by drawing ASCII art between the start and target addresses.  The optional =color argument adds color to the output using simple terminal colors. Alternatively the =extended-color argument will add color using 8bit colors, but these might not work on all terminals. If it is necessary to disable the visualize-jumps option after it has previously been enabled then use visualize-jumps=off."
  command: "objdump"
  example: "objdump --visualize-jumps[=color|=extended-color|=off]"
- id: 1573
  intent: "Enables or disables the use of colored syntax highlighting in disassembly output.  The default behaviour is determined via a configure time option.  Note, not all architectures support colored syntax highlighting, and depending upon the terminal used, colored output may not actually be legible. The on argument adds colors using simple terminal colors. The terminal argument does the same, but only if the output device is a terminal. The extended-color argument is similar to the on argument, but it uses 8-bit colors.  These may not work on all terminals. The off argument disables colored disassembly."
  command: "objdump"
  example: "objdump --disassembler-color=extened|extended-color|extened-colour"
