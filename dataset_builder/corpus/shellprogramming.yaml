- id: 1900
  intent: "This mandatory option specifies the colors that are to be masked (where the image is one of these colors, the output mask will be black). Examples: o      -color=red o      -color=red,pink,salmon o      -color=rgb:80/80/ff o      -color=bk:red,bk:orange,bk:yellow color_list is a list of colors separated by commas.  Each  color is  either  an exact color name as described for the argument of the          pnm_parsecolor()          library           routine <libnetpbm_image.html#colorname>  or one of the Berlin-Kay color names <libppm.html#berlinkay> .  In the latter case, all  colors that are better described by that Berlin-Kay color name than any other are in the mask set. The algorithm ppmcolormask uses to determine to which  colors  a Berlin-Kay  color  name  applies is based on a Sugeno-type fuzzy inference system developed by  Kenan  Kalajdzic  in  2006.   The fuzzy  model  consists  of partially linear membership functions defined in the HSV color space.   Although  more  complex  algo- rithms  for fuzzy color matching exist, this algorithm is inten- tionally simplified to achieve a satisfactory speed using  rela- tively compact code. This  option  was new in Netpbm 10.34 (June 2006).  Before that, you must use the color argument and cannot specify a  Berlin-Kay color."
  command: "ppmcolormask"
  example: "ppmcolormask -color=color_list"
