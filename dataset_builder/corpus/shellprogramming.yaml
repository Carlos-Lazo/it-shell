- id: 2471
  intent: "For the purpose of RESTful scripting, Wget allows sending of other HTTP Methods without the need to explicitly set them using --header=Header-Line.  Wget will use whatever string is passed to it after --method as the HTTP Method to the server."
  command: "wget"
