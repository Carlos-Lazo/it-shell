- id: 1708
  intent: "This determines the compression mode that pbmtoescp2 uses in its output.   Valid  values  for compressionmode are 0 and 1.  -com- press=0 results in a printer control  stream  with  uncompressed raster  graphic  data.  -compress=1 results in a printer control stream with RLE compressed raster graphic data  (RLE  means  Run Length Encoding).  The default is -compress=1."
  command: "pbmtoescp2"
  example: "pbmtoescp2 -compress=compressionmode"
