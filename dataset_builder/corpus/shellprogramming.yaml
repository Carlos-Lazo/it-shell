- id: 655
  intent: "Read only the specified intervals. read_intervals must be a sequence of interval specifications separated by \",\".  ffprobe will seek to the interval starting point, and will continue reading from that. Each interval is specified by two optional parts, separated by \"%\". The first part specifies the interval start position. It is interpreted as an absolute position, or as a relative offset from the current position if it is preceded by the \"+\" character. If this first part is not specified, no seeking will be performed when reading this interval. The second part specifies the interval end position. It is interpreted as an absolute position, or as a relative offset from the current position if it is preceded by the \"+\" character. If the offset specification starts with \"#\", it is interpreted as the number of packets to read (not including the flushing packets) from the interval start. If no second part is specified, the program will read until the end of the input. Note that seeking is not accurate, thus the actual interval start point may be different from the specified position. Also, when an interval duration is specified, the absolute end time will be computed by adding the duration to the interval start point found by seeking the file, rather than to the specified start value. The formal syntax is given by: <INTERVAL>  ::= [<START>|+<START_OFFSET>][%[<END>|+<END_OFFSET>]] <INTERVALS> ::= <INTERVAL>[,<INTERVALS>] A few examples follow. o   Seek to time 10, read packets until 20 seconds after the found seek point, then seek to position \"01:30\" (1 minute and thirty seconds) and read packets until position \"01:45\". 10%+20,01:30%01:45 o   Read only 42 packets after seeking to position \"01:23\": 01:23%+#42 o   Read only the first 20 seconds from the start: %+20 o   Read from the start until position \"02:30\": %02:30"
  command: "ffprobe"
  example: "ffprobe -read_intervals read_intervals"
