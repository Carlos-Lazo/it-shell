- id: 425
  intent: "This  is  an alternative way to specify LDAP servers for CRL and X.509 certificate retrieval.  If this option is used the servers configured  in  'dirmngr_ldapservers.conf' (or the file given by --ldapserverlist-file)   are   cleared.    Note   that    'dirm- ngr_ldapservers.conf' is not read again by a reload signal. How- ever, --ldapserver options are read again. spec is either a proper LDAP URL or a colon  delimited  list  of the form hostname:port:username:password:base_dn:flags: with  an  optional  prefix of ldap: (but without the two slashes which would turn this into a proper LDAP URL).  flags is a  list of one or more comma delimited keywords: plain  The  default: Do not use a TLS secured connection at all; the default port is 389. starttls Use STARTTLS to secure the connection; the  default  port is 389. ldaptls Tunnel LDAP through a TLS connection; the default port is 636. ntds   On Windows authenticate the LDAP connection using the Ac- tive Directory with the current user. areconly On  Windows  use only the A or AAAA record when resolving the LDAP server name. Note that in an URL style specification the scheme ldaps://  refers  to STARTTLS and _not_ to LDAP-over-TLS."
  command: "dirmngr"
  example: "dirmngr --ldapserver spec"
