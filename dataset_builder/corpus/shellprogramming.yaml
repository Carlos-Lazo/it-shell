  intent: "Sets  the  correction  mode  for digital audio extraction. 0: No checking, data is copied directly from  the  drive.  1:  Perform overlapped  reading  to  avoid  jitter. 2: Like 1 but with addi- tional checks of the read audio data. 3: Like 2 but  with  addi- tional scratch detection and repair. The extraction speed reduces from 0 to 3. Default is the full paranoia mode (3)."
  command: "cdrdao"
  example: "cdrdao --paranoia-mode mode"
