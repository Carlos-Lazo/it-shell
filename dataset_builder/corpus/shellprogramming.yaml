  command: "pamperspective"
  example: "pamperspective --lly=num"
- id: 1637
  intent: "This specifies the horizontal coordinate of the lower right vertex of the quadrilateral.  The meaning of 'lower right' is relative to the output image.  The interpretation of num depends on the values for --input_system and --input_unit."
  command: "pamperspective"
  example: "pamperspective --lrx=num"
- id: 1638
  intent: "This specifies the vertical coordinate of the lower right vertex of  the  quadrilateral.  The meaning of 'lower right' is rela- tive to the output image.  The interpretation of num depends on the values for --input_system and --input_unit."
  command: "pamperspective"
  example: "pamperspective --lry=num"
- id: 1639
  intent: "The input image consists of pixels, which are, from the point of view of a scanline renderer,  solid  squares.   These  options specify how the coordinates are interpreted: system=lattice, unit=image (0,0) refers to the upper left corner of the upper left pixel and  (1,1)  refers  to  the  lower right corner of the lower right pixel. system=lattice, unit=pixel (0,0) refers to the upper left corner of the upper left pixel and (width,height) refers to the lower right corner of the lower right pixel.  Here width and height are the width and height of the input image. system=pixel, unit=image (0,0) refers to the center of the upper left pixel and (1,1) refers to the center of the lower right pixel. system=pixel, unit=pixel (0,0) refers to the center of the upper left pixel and (width-1,height-1) refers to the center of the lower right pixel.  Here width and height are the width and height of the input image. The defaults are --input_system=lattice and --input_unit=pixel.  Point-and-click front ends should use --input_system=pixel. Frame Options By default pamperspective  outputs  exactly  the  above  parallelogram, sheared  to a rectangle.  With the following options, it is possible to make pamperspective output a larger or smaller portion, which  we  call the  \"visible  part.\" We refer to the default rectangle as the \"frame.\" The visible part is always a rectangle the axes of which  are  parallel to those of the frame. The  frame  options are additive.  All the parts of the image specified by either margin options, --include_frame, or --include (or  their  de- faults) are in the visible part.  The visible part is the smallest pos- sible rectangle that contains the parts specified those three ways. The visible part must have nonzero size.  That  means  if  you  specify"
  command: "pamperspective"
  example: "pamperspective --input_unit=unit"
- id: 1640
  intent: "The visible part is made large enough such that every point (x1,y1), (x2,y2), of the input image is visible.  The meaning of x and y is determined by --input_system and --input_unit.  You can specify any number of semicolon-delimited points, including zero. If you're supplying these options via a Unix command shell, be sure to use proper quoting, because semicolon (;) is usually a shell control character. The frame options were new in Netpbm 10.25 (October 2004). Output Size Options"
  command: "pamperspective"
  example: "pamperspective --include=[x1,y1;x2,y2; ...]"
- id: 1641
  intent: "If you do not specify --width, pamperspective determines the width of the output image such that moving num output  pixels  horizontally does not change the corresponding pixel coordinates of the input image by more than 1. pamperspective determines the height of the output image analogously.  The default value is 1."
  command: "pamperspective"
  example: "pamperspective --detail=num"
- id: 1642
  intent: "Designate color as the target color for the  image.   pamrecolor will  make  each  pixel as close as possible to color subject to the constraint that the luminance must stay the same as  in  the original  image.   Specify  color  as  in  the  argument  of the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname>          (e.g., \"hotpink\"    or \"#ff69b4\"). If you specify neither --targetcolor nor --colorfile, pamrecolor will  randomly select a target color for each pixel of the input image. You may not specify both -targetcolor and -colorfile."
  command: "pamrecolor"
  example: "pamrecolor --targetcolor=color"
- id: 1643
  intent: "pamrubber {-tri | -quad} [-linear] [-frame] [-randomseed=N] cp1x cp1y [cp2x cp2y [cp3x cp3y [cp4x cp4y]]] cp1x cp1y [cp2x cp2y [cp3x cp3y [cp4x cp4y]]] [filename] Minimum unique abbreviation of options is acceptable. You may use dou- ble hyphens instead of single hyphen to denote options."
