- id: 1627
  intent: "This is the color with which the program fills all  pixels  that lie  outside  of  the target quadrilateral. Specify the color as described for the argument    of    the    pnm_parsecolor()    library    routine <http://libnetpbm_image.html#colorname> . The  default is black, and for images with a transparency plane, transparent. Cooordinates should normally be specified in clockwise order. The  syn- tax  is fairly flexible: all characters other than the plus sign, minus sign, and digits are treated as separators. Although  coordinates  need to be integers, they may lie outside the image's boundary. If  you  specify  -mapfile  along  with -from and/or -to, -from and -to override the quadrilaterals specified by map_file."
  command: "pamhomography"
  example: "pamhomography -fill=color"
- id: 1628
  intent: "ors  that  anchor  the transformation function.  See DESCRIPTION <#description> . You must specify at least two of these pairs."
  command: "pamlevels"
  example: "pamlevels -to3   These options define the mappings of input colors to output col-"
- id: 1629
  intent: "This option tells pamlevels to work  with  the  intensity-linear variation on PPM where the samples are proportional to light in- tensity, rather than brightness (gamma-adjusted) as in true PPM. The  input must be of this form and the pamlevels makes the out- put of this form. Note  that  the  numbers   in   a   color   specification   like rgbi:0.9/0.83/0.80  are  brightness  levels (gamma-adjusted) re- gardless of the input and output format. You cannot use this with -fitbrightness because that function is not implemented."
  command: "pamlevels"
  example: "pamlevels -linear"
- id: 1630
  intent: "turn a PAM image into an oil painting"
