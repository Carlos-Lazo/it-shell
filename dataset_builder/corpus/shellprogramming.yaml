  intent: "Pass all arguments specified after -args to the test  program  when- ever  it  runs.   Note  that if any of the program args start with a \"-\", you should use: bugpoint [bugpoint args] --args -- [program args] The \"--\" right after the -args option tells bugpoint to consider any options starting with \"-\" to be part of the -args option, not as op- tions to bugpoint itself."
  command: "bugpoint-14"
  example: "bugpoint-14 -args program args"
