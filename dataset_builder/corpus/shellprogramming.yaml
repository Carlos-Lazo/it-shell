- id: 405
  intent: "This option specifies a file from which to read DNSSEC trust an- chors.  The  default  is  /etc/bind/bind.keys, which is included with BIND 9 and contains one or more trust anchors for the  root zone (\".\"). Keys that do not match the root zone name are ignored. An alter- nate key name can be specified using the +root option. Note: When reading the trust anchor file, delv treats  trust-an- chors,  initial-key,  and static-key identically. That is, for a managed key, it is the initial key that  is  trusted;  RFC  5011 <https://datatracker.ietf.org/doc/html/rfc5011.html> key manage- ment is not supported. delv does not  consult  the  managed-keys database  maintained  by  named <#std-iscman-named>, which means that if either of the keys in /etc/bind/bind.keys is revoked and rolled  over,  /etc/bind/bind.keys must be updated to use DNSSEC validation in delv."
  command: "delv"
  example: "delv -a anchor-file"
- id: 406
  intent: "This  option  sets  the systemwide debug level to level. The al- lowed range is from 0 to 99. The default is  0  (no  debugging). Debugging  traces  from  delv  become  more verbose as the debug level increases. See the +mtrace, +rtrace, and  +vtrace  options below for additional debugging details."
  command: "delv"
  example: "delv -d level"
