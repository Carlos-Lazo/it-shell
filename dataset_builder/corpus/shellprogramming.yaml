  intent: "This option was formerly used to switch between ELF and ECOFF output on targets like IRIX 5 that supported both.  MIPS ECOFF support was removed in GAS 2.24, so the option now serves little purpose.  It is retained for backwards compatibility. The available configuration names are: mipself, mipslelf and mipsbelf.  Choosing mipself now has no effect, since the output is always ELF.  mipslelf and mipsbelf select little- and big-endian output respectively, but -EL and -EB are now the preferred options instead."
  command: "as"
  example: "as --emulation=name"
