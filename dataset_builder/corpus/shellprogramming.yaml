  intent: "Instead of computing a palette from the colors in the image, use a standard, built-in 16 color palette.  If the image contains  a color that is not in the standard palette, ppmtopcx fails. The standard palette is not only a set of colors, but a specific mapping of palette indexes to colors.  E.g. red is 4. You can use pnmremap with a suitable PPM image of  the  standard palette  to  adapt your image to use exactly those colors in the palette so that ppmtopcx -stdpalette will work on it. The file pcxstd.ppm, part of Netpbm, contains the standard  pal- ette. Although  the  PCX  header tells exactly what palette is used in the file, some older PCX interpreters do not use  that  informa- tion.   They  instead assume the standard palette.  If you don't use the -stdpalette option, ppmtopcx, ppmtopcx may create an im- age  that  uses a different palette (a rearrangement of the same colors) and then one of these older interpreters would interpret the colors in the image wrong. You cannot specify this option along with -palette. This option was new in Netpbm 10.22 (April 2004)."
