- id: 1705
  intent: "This option specifies the resolution in dots per inch of the ultimate output device.  You must specify this because the Bounding Box statement defines the bounding box in absolute distances, not in pixels.  pbmtoepsi assumes in calculating the bounding box that each PBM pixel  will  be- come one dot on the output device, and applies your dpi specification  to  calculate  the  size and location on the page of the bounding box. If you specify NxN, the first number is the horizontal resolution and the second number is the vertical resolution.  If you specify just a single number N, that is the resolution in both directions. The default is 72 dots per inch in both directions. This option was new In Netpbm 10.3 (June 2002).  Before that, pbmtoepsi  always  assumed  72 dots per inch in both direc- tions."
  command: "pbmtoepsi"
  example: "pbmtoepsi -dpi=N[xN]"
- id: 1706
  intent: "This determines which Epson printer protocol  the  output  uses. escp9  is  the  older  ESC/P  9-pin protocol.  escp is the newer ESC/P protocol.  For the even newer ESC/P2 protocol, you have to use pbmtoescp2 instead. This option was new in Netpbm 10.23 (July 2004)."
  command: "pbmtoepson"
  example: "pbmtoepson -protocol={escp9|escp}"
- id: 1707
  intent: "These options determine whether the output  uses  \"adjacent  dot printing\" or not, whatever that is. If  you  don't  specify  this,  pbmtoepson  selects adjacent dot printing unless that is incompatible with your other options. This option was new in Netpbm 10.23 (July 2004)."
  command: "pbmtoepson"
