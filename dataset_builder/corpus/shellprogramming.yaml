  intent: "Sets the rule used by --record-count and --record-count-unit.  This option automatically implements --record-count. The rule may be: \"all\" or \"a\" (count all records), \"non-ignored\" or \"n\" (count all non-ignored records), \"f/\"regex\"/\" (only count records where the format matches the regular expression regex), \"c/\"regex\"/\" (only count records where the counter name matches the regular expression regex), or \"f/\"regex1\"/c/\"regex2\"/\"op (only count records where the format matches the regular expression regex1 and/or the counter name matches the regular expression regex2). The op part is optional. If present it may be one of: \"and\" (format AND counter must match), \"or\" (format OR counter must match). If op is omitted, AND is assumed."
  command: "bib2gls"
  example: "bib2gls --record-count-rule rule or -r rule"
