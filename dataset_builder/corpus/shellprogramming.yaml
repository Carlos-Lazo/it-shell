  intent: "If the Palm Bitmap has a transparent color set, palmtopnm writes the value for that color to Standard Output in the form #RRGGBB, where RR, GG, and BB are two-digit hexadecimal numbers  indicat- ing a value in the range 0 through 255.  If no transparent color is set in the Bitmap, palmtopnm writes nothing.  palmtopnm  does not generate any output image when you specify -transparent."
  command: "palmtopnm"
