- id: 637
  intent: "[input_file_id.stream_specifier.channel_id|-1][?][:output_file_id.stream_specifier] Map an audio channel from a given input to an output. If output_file_id.stream_specifier is not set, the audio channel will be mapped on all the audio streams. Using \"-1\" instead of input_file_id.stream_specifier.channel_id will map a muted channel. A trailing \"?\" will allow the map_channel to be optional: if the map_channel matches no channel the map_channel will be ignored instead of failing. For example, assuming INPUT is a stereo audio file, you can switch the two audio channels with the following command: ffmpeg -i INPUT -map_channel 0.0.1 -map_channel 0.0.0 OUTPUT If you want to mute the first channel and keep the second: ffmpeg -i INPUT -map_channel -1 -map_channel 0.0.1 OUTPUT The order of the \"-map_channel\" option specifies the order of the channels in the output stream. The output channel layout is guessed from the number of channels mapped (mono if one \"-map_channel\", stereo if two, etc.). Using \"-ac\" in combination of \"-map_channel\" makes the channel gain levels to be updated if input and output channel layouts don't match (for instance two \"-map_channel\" options and \"-ac 6\"). You can also extract each channel of an input to specific outputs; the following command extracts two channels of the INPUT audio stream (file 0, stream 0) to the respective OUTPUT_CH0 and OUTPUT_CH1 outputs: ffmpeg -i INPUT -map_channel 0.0.0 OUTPUT_CH0 -map_channel 0.0.1 OUTPUT_CH1 The following example splits the channels of a stereo input into two separate streams, which are put into the same output file: ffmpeg -i stereo.wav -map 0:0 -map 0:0 -map_channel 0.0.0:0.0 -map_channel 0.0.1:0.1 -y out.ogg Note that currently each output stream can only contain channels from a single input stream; you can't for example use \"-map_channel\" to pick multiple input audio channels contained in different streams (from the same or different files) and merge them into a single output stream. It is therefore not currently possible, for example, to turn two separate mono streams into a single stereo stream. However splitting a stereo stream into two single channel mono streams is possible. If you need this feature, a possible workaround is to use the amerge filter. For example, if you need to merge a media (here input.mkv) with 2 mono audio streams into one single stereo channel audio stream (and keep the video stream), you can use the following command: ffmpeg -i input.mkv -filter_complex \"[0:1] [0:2] amerge\" -c:a pcm_s16le -c:v copy output.mkv To map the first two audio channels from the first input, and using the trailing \"?\", ignore the audio channel mapping if the first input is mono instead of stereo: ffmpeg -i INPUT -map_channel 0.0.0 -map_channel 0.0.1? OUTPUT"
  command: "ffmpeg"
  example: "ffmpeg -map_channel"
