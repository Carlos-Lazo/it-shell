  intent: "ctwill [options] webfile[.w] [{changefile[.ch]|-} [outfile[.tex]]] ctwill-refsort < indexfile.ref > indexfile.sref ctwill-twinx outfile.tex [outfile.tex ...] > index.tex"
  command: "ctwill"
  example: "ctwill"
- id: 352
  intent: "ctwill [options] webfile[.w] [{changefile[.ch]|-} [outfile[.tex]]] ctwill-refsort < indexfile.ref > indexfile.sref ctwill-twinx outfile.tex [outfile.tex ...] > index.tex"
  command: "ctwill-refsort"
  example: "ctwill-refsort"
- id: 353
  intent: "ctwill [options] webfile[.w] [{changefile[.ch]|-} [outfile[.tex]]] ctwill-refsort < indexfile.ref > indexfile.sref ctwill-twinx outfile.tex [outfile.tex ...] > index.tex"
  command: "ctwill-twinx"
  example: "ctwill-twinx"
- id: 354
  intent: "curl [options / URLs]"
  command: "curl"
  example: "curl"
- id: 355
  intent: "(SCP SFTP) Enables built-in SSH compression.  This is a request, not an order; the server may or may not do it. Providing --compressed-ssh multiple times has no  extra  effect. Disable it again with --no-compressed-ssh. Example: curl --compressed-ssh sftp://example.com/ See also --compressed. Added in 7.56.0."
  command: "curl"
  example: "curl --compressed-ssh"
- id: 356
  intent: "(HTTP) Return an error on server errors where the HTTP  response code  is  400  or  greater). In normal cases when an HTTP server fails to deliver a document, it returns an HTML document stating so  (which  often  also  describes why and more). This flag will still allow curl to output and save that content but also to re- turn error 22. This  is  an  alternative  option to -f, --fail which makes curl fail for the same circumstances but without saving the content. Providing --fail-with-body multiple times has no  extra  effect. Disable it again with --no-fail-with-body. Example: curl --fail-with-body https://example.com See  also  -f,  --fail. This option is mutually exclusive to -f, --fail. Added in 7.76.0."
  command: "curl"
  example: "curl --fail-with-body"
- id: 357
  intent: "(TLS)  Tells  curl  to use false start during the TLS handshake. False start is a mode where a TLS client will start sending  ap- plication  data  before verifying the server's Finished message, thus saving a round trip when performing a full handshake. This is currently only implemented in the NSS and Secure  Trans- port (on iOS 7.0 or later, or OS X 10.9 or later) backends. Providing  --false-start  multiple  times  has  no extra effect. Disable it again with --no-false-start. Example: curl --false-start https://example.com See also --tcp-fastopen. Added in 7.42.0."
  command: "curl"
  example: "curl --false-start"
- id: 358
  intent: "(HTTP) Tells curl to be fine with HTTP version 0.9 response. HTTP/0.9  is  a completely headerless response and therefore you can also connect with this to non-HTTP servers and still  get  a response since curl will simply transparently downgrade - if al- lowed. Since curl 7.66.0, HTTP/0.9 is disabled by default. Providing --http0.9 multiple times has no extra effect.  Disable it again with --no-http0.9. Example: curl --http0.9 https://example.com See also --http1.1, --http2 and --http3. Added in 7.64.0."
  command: "curl"
  example: "curl --http0.9"
- id: 359
  intent: "(HTTP)  Tells  curl to use HTTP version 1.0 instead of using its internally preferred HTTP version. Providing -0, --http1.0 multiple times has no extra effect. Example: curl --http1.0 https://example.com See also --http0.9 and --http1.1. This option is mutually exclu- sive  to  --http1.1  and --http2 and --http2-prior-knowledge and --http3."
  command: "curl"
  example: "curl -0, --http1.0"
- id: 360
  intent: "(HTTP) Tells curl to use HTTP version 1.1. Providing --http1.1 multiple times has no extra effect. Example: curl --http1.1 https://example.com See also -0, --http1.0 and --http0.9. This  option  is  mutually exclusive  to -0, --http1.0 and --http2 and --http2-prior-knowl- edge and --http3. Added in 7.33.0."
  command: "curl"
  example: "curl --http1.1"
- id: 361
  intent: "(HTTP) Tells curl to  issue  its  non-TLS  HTTP  requests  using HTTP/2  without  HTTP/1.1  Upgrade.  It requires prior knowledge that the server supports HTTP/2 straight  away.  HTTPS  requests will  still  do HTTP/2 the standard way with negotiated protocol version in the TLS handshake. Providing --http2-prior-knowledge multiple times  has  no  extra effect.  Disable it again with --no-http2-prior-knowledge. Example: curl --http2-prior-knowledge https://example.com See  also  --http2 and --http3. --http2-prior-knowledge requires that the underlying libcurl was built to  support  HTTP/2.  This option  is mutually exclusive to --http1.1 and -0, --http1.0 and --http2 and --http3. Added in 7.49.0."
  command: "curl"
  example: "curl --http2-prior-knowledge"
- id: 362
  intent: "(HTTP)  **WARNING**:  this option is experimental. Do not use in production. Tells curl to try HTTP/3 to the host in the URL, but fallback to earlier  HTTP  versions  if  the HTTP/3 connection establishment fails. HTTP/3 is only available for HTTPS and not for HTTP URLs. This option allows a user to avoid using the Alt-Svc  method  of upgrading  to HTTP/3 when you know that the target speaks HTTP/3 on the given host and port. When asked to use HTTP/3, curl will issue a separate attempt  to use  older  HTTP  versions with a slight delay, so if the HTTP/3 transfer fails or is very slow, curl will still try  to  proceed with an older HTTP version. Use --http3-only for similar functionality without a fallback. Providing --http3 multiple times has no extra effect. Example: curl --http3 https://example.com See also --http1.1 and --http2. --http3 requires that the under- lying libcurl was built to support HTTP/3. This option is  mutu- ally  exclusive  to  --http1.1 and -0, --http1.0 and --http2 and --http2-prior-knowledge and --http3-only. Added in 7.66.0."
  command: "curl"
  example: "curl --http3"
- id: 363
  intent: "(IMAP  LDAP  POP3  SMTP) Specify the login options to use during server authentication. You can use login options to specify protocol  specific  options that  may  be  used during authentication. At present only IMAP, POP3 and SMTP support login options. For more information  about login  options  please  see  RFC  2384,  RFC 5092 and IETF draft draft-earhart-url-smtp-00.txt If --login-options is provided several times, the last set value will be used. Example: curl --login-options 'AUTH=*' imap://example.com See also -u, --user. Added in 7.34.0."
  command: "curl"
  example: "curl --login-options <options>"
- id: 364
  intent: "Disables the buffering of the output stream. In normal work sit- uations,  curl  will  use a standard buffered output stream that will have the effect that it will output the data in chunks, not necessarily  exactly  when  the data arrives.  Using this option will disable that buffering. Providing -N, --no-buffer multiple times has  no  extra  effect. Disable it again with --buffer. Example: curl --no-buffer https://example.com See also -#, --progress-bar."
  command: "curl"
  example: "curl -N, --no-buffer"
- id: 365
  intent: "Make curl display transfer progress as a simple progress bar in- stead of the standard, more informational, meter. This progress bar draws a single line of '#'  characters  across the screen and shows a percentage if the transfer size is known. For transfers without a known size, there  will  be  space  ship (-=o=-)  that  moves back and forth but only while data is being transferred, with a set of flying hash sign symbols on top. This option is global and does not need to be specified for each use of -:, --next. Providing -#, --progress-bar multiple times has no extra effect. Disable it again with --no-progress-bar. Example: curl -# -O https://example.com See also --styled-output."
  command: "curl"
  example: "curl -#, --progress-bar"
- id: 366
  intent: "Retry on any error. This option is used together with --retry. This option is the \"sledgehammer\" of retrying. Do not  use  this option by default (eg in curlrc), there may be unintended conse- quences such as sending or receiving duplicate data. Do not  use with  redirected  input or output. You'd be much better off han- dling your unique problems in shell script. Please read the  ex- ample below. WARNING:  For server compatibility curl attempts to retry failed flaky transfers as close as possible to how they  were  started, but  this  is  not possible with redirected input or output. For example, before retrying it removes output data  from  a  failed partial  transfer  that  was  written to an output file. However this is not true of data redirected to a | pipe or > file, which are  not  reset.  We strongly suggest you do not parse or record output via redirect in combination with this option,  since  you may receive duplicate data. By default curl will not error on an HTTP response code that in- dicates an HTTP error, if the transfer was successful. For exam- ple,  if  a  server replies 404 Not Found and the reply is fully received then that is not an error. When --retry  is  used  then curl  will retry on some HTTP response codes that indicate tran- sient HTTP errors, but that does not include most  4xx  response codes  such  as  404. If you want to retry on all response codes that indicate HTTP errors (4xx and 5xx) then  combine  with  -f, --fail. Providing --retry-all-errors multiple times has no extra effect. Disable it again with --no-retry-all-errors. Example: curl --retry 5 --retry-all-errors https://example.com See also --retry. Added in 7.71.0."
  command: "curl"
  example: "curl --retry-all-errors"
- id: 367
  intent: "(FTP  IMAP  POP3  SMTP LDAP) Require SSL/TLS for the connection. Terminates the connection if the transfer cannot be upgraded  to use SSL/TLS. This option is handled in LDAP since version 7.81.0. It is fully supported by the OpenLDAP backend and rejected  by  the  generic ldap backend if explicit TLS is required. This  option  is unnecessary if you use a URL scheme that in it- self implies immediate and implicit use of TLS, like  for  FTPS, IMAPS,  POP3S,  SMTPS and LDAPS. Such transfers will always fail if the TLS handshake does not work. This option was formerly known as --ftp-ssl-reqd. Providing --ssl-reqd multiple times has no extra  effect.   Dis- able it again with --no-ssl-reqd. Example: curl --ssl-reqd ftp://example.com See also --ssl and -k, --insecure."
  command: "curl"
  example: "curl --ssl-reqd"
- id: 368
  intent: "(SSL) This option previously asked curl to use SSLv2, but start- ing  in curl 7.77.0 this instruction is ignored. SSLv2 is widely considered insecure (see RFC 6176). Providing -2, --sslv2 multiple times has no extra effect. Example: curl --sslv2 https://example.com See also --http1.1 and --http2. -2, --sslv2  requires  that  the underlying  libcurl was built to support TLS. This option is mu- tually exclusive to -3, --sslv3 and -1,  --tlsv1  and  --tlsv1.1 and --tlsv1.2."
  command: "curl"
  example: "curl -2, --sslv2"
- id: 369
  intent: "(SSL) This option previously asked curl to use SSLv3, but start- ing in curl 7.77.0 this instruction is ignored. SSLv3 is  widely considered insecure (see RFC 7568). Providing -3, --sslv3 multiple times has no extra effect. Example: curl --sslv3 https://example.com See  also  --http1.1  and --http2. -3, --sslv3 requires that the underlying libcurl was built to support TLS. This option is  mu- tually  exclusive  to  -2, --sslv2 and -1, --tlsv1 and --tlsv1.1 and --tlsv1.2."
  command: "curl"
  example: "curl -3, --sslv3"
- id: 370
  intent: "Enables  the automatic use of bold font styles when writing HTTP headers to the terminal. Use --no-styled-output to  switch  them off. Styled output requires a terminal that supports bold fonts. This feature is not present on curl for Windows due to lack  of  this capability. This option is global and does not need to be specified for each use of -:, --next. Providing --styled-output multiple times has  no  extra  effect. Disable it again with --no-styled-output. Example: curl --styled-output -I https://example.com See also -I, --head and -v, --verbose. Added in 7.61.0."
  command: "curl"
  example: "curl --styled-output"
- id: 371
  intent: "Enable use of TCP Fast Open (RFC7413). Providing --tcp-fastopen multiple times  has  no  extra  effect. Disable it again with --no-tcp-fastopen. Example: curl --tcp-fastopen https://example.com See also --false-start. Added in 7.49.0."
  command: "curl"
  example: "curl --tcp-fastopen"
- id: 372
  intent: "(TFTP) Tells curl not to send TFTP options requests. This  option  improves  interop with some legacy servers that do not acknowledge or properly implement TFTP  options.  When  this option is used --tftp-blksize is ignored. Providing  --tftp-no-options multiple times has no extra effect. Disable it again with --no-tftp-no-options. Example: curl --tftp-no-options tftp://192.168.0.1/ See also --tftp-blksize. Added in 7.48.0."
  command: "curl"
  example: "curl --tftp-no-options"
- id: 373
  intent: "(SSL) VERSION defines maximum supported TLS version. The minimum acceptable version  is  set  by  tlsv1.0,  tlsv1.1,  tlsv1.2  or tlsv1.3. If  the  connection  is done without TLS, this option has no ef- fect. This includes QUIC-using (HTTP/3) transfers. default Use up to recommended TLS version. 1.0    Use up to TLSv1.0. 1.1    Use up to TLSv1.1. 1.2    Use up to TLSv1.2. 1.3    Use up to TLSv1.3. If --tls-max is provided several times, the  last  set  value  will  be used. Examples: curl --tls-max 1.2 https://example.com curl --tls-max 1.3 --tlsv1.2 https://example.com See  also  --tlsv1.0, --tlsv1.1, --tlsv1.2 and --tlsv1.3. --tls-max re- quires that the underlying libcurl was built to support TLS.  Added  in 7.54.0."
  command: "curl"
  example: "curl --tls-max <VERSION>"
- id: 374
  intent: "(TLS)  Forces curl to use TLS version 1.0 or later when connect- ing to a remote TLS server. In old versions of curl this  option  was  documented  to  allow _only_ TLS 1.0.  That behavior was inconsistent depending on the TLS library. Use --tls-max if you want to set a maximum TLS ver- sion. Providing --tlsv1.0 multiple times has no extra effect. Example: curl --tlsv1.0 https://example.com See also --tlsv1.3. Added in 7.34.0."
  command: "curl"
  example: "curl --tlsv1.0"
- id: 375
  intent: "(TLS)  Forces curl to use TLS version 1.1 or later when connect- ing to a remote TLS server. In old versions of curl this  option  was  documented  to  allow _only_ TLS 1.1.  That behavior was inconsistent depending on the TLS library. Use --tls-max if you want to set a maximum TLS ver- sion. Providing --tlsv1.1 multiple times has no extra effect. Example: curl --tlsv1.1 https://example.com See also --tlsv1.3 and --tls-max. Added in 7.34.0."
  command: "curl"
  example: "curl --tlsv1.1"
- id: 376
  intent: "(TLS)  Forces curl to use TLS version 1.2 or later when connect- ing to a remote TLS server. In old versions of curl this  option  was  documented  to  allow _only_ TLS 1.2.  That behavior was inconsistent depending on the TLS library. Use --tls-max if you want to set a maximum TLS ver- sion. Providing --tlsv1.2 multiple times has no extra effect. Example: curl --tlsv1.2 https://example.com See also --tlsv1.3 and --tls-max. Added in 7.34.0."
  command: "curl"
  example: "curl --tlsv1.2"
- id: 377
  intent: "(TLS)  Forces curl to use TLS version 1.3 or later when connect- ing to a remote TLS server. If the connection is done without TLS, this option  has  no  ef- fect. This includes QUIC-using (HTTP/3) transfers. Note that TLS 1.3 is not supported by all TLS backends. Providing --tlsv1.3 multiple times has no extra effect. Example: curl --tlsv1.3 https://example.com See also --tlsv1.2 and --tls-max. Added in 7.52.0."
  command: "curl"
  example: "curl --tlsv1.3"
- id: 378
  intent: "(SSL)  Tells curl to use at least TLS version 1.x when negotiat- ing with a remote TLS server. That  means  TLS  version  1.0  or higher Providing -1, --tlsv1 multiple times has no extra effect. Example: curl --tlsv1 https://example.com See  also  --http1.1  and --http2. -1, --tlsv1 requires that the underlying libcurl was built to support TLS. This option is  mu- tually exclusive to --tlsv1.1 and --tlsv1.2 and --tlsv1.3."
  command: "curl"
  example: "curl -1, --tlsv1"
- id: 379
  intent: "When generating LDIF output, increment each sudoOrder attribute by the specified number.  Defaults to an increment of 1."
  command: "cvtsudoers"
  example: "cvtsudoers -I increment, --increment=increment"
- id: 380
  intent: "When generating LDIF output, use the number specified by start_point in the sudoOrder attribute of the first sudoRole ob- ject.  Subsequent sudoRole object use a sudoOrder value generated by adding an increment, see the -I option for details.  Defaults to a starting point of 1.  A starting point of 0 will disable the generation of sudoOrder attributes in the resulting LDIF file."
  command: "cvtsudoers"
  example: "cvtsudoers -O start_point, --order-start=start_point"
- id: 381
  intent: "When generating LDIF output, construct the initial sudoOrder value by concatenating order_start and increment, padding the increment with zeros until it consists of padding digits.  For example, if order_start is 1027, padding is 3, and increment is 1, the value of sudoOrder for the first entry will be 1027000, followed by 1027001, 1027002, etc.  If the number of sudoRole en- tries is larger than the padding would allow, cvtsudoers will exit with an error.  By default, no padding is performed."
  command: "cvtsudoers"
  example: "cvtsudoers -P padding, --padding=padding"
