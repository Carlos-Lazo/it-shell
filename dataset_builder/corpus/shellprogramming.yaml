  intent: "giftopnm  creates a PBM file containing the transparency  infor- mation  from  the  input  image.  This transparency image is the same dimensions as the input image, and each pixel of the trans- parency image tells whether the corresponding pixel of the input image is transparent.   Black  means  transparent;  white  means opaque.  If you don't specify --alphaout, giftopnm does not gen- erate a transparency file, and if the input image has  a  trans- parency channel, giftopnm simply discards it. If  you specify - as the filename, giftopnm writes the transpar- ency output to Standard Output and discards the image. See pamcomp(1) for one way to use the transparency output file."
  command: "giftopnm"
  example: "giftopnm --alphaout=alpha-filename"
- id: 729
  intent: "This option identifies which image from the GIF stream you want. You  can  select either one image or all the images.  Select all the images with all.  Select one image  by  specifying  its  se- quence number in the stream: 1, 2, 3, etc. The default is just Image 1. A GIF stream normally contains only one image, so you don't need this option.  But some streams, including  animated  GIFs,  have multiple images. When  you select multiple GIF images, the output is a PNM stream with multiple images. If you specify a single image, giftopnm must read and  partially validate  the  images  before that in the stream.  It may or may not do the same for the images after it; see -quitearly. The all value was added in Netpbm 10.16  (June  2003).   Earlier giftopnm can extract only one image."
  command: "giftopnm"
  example: "giftopnm -image={N,all}"
