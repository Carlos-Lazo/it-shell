  example: "pamdice -height=height"
- id: 1619
  intent: "These specify the scale factor.  -xscale specifies the  horizon- tal  scale  factor;  -yscale specifies the vertical scale factor and -scale specifies both. If you specify -xscale but  not  -yscale,  pamenlarge  does  not scale  vertically  (i.e.  the  vertical scale factor is 1).  The converse applies if you specify -yscale and not -xscale. You cannot specify -scale and also -xscale or yscale. You must specify at least one of these options, unless  you  use the  deprecaated method of specifying the scale factor via argu- ment. These options were all new in Netpbm 10.86 (March 2019).  Before that, use the scale argument."
  command: "pamenlarge"
  example: "pamenlarge -yscale=integer"
- id: 1620
  intent: "Create  a  truncated  output image from all the valid input rows that could be read."
  command: "pamfix"
  example: "pamfix -truncate"
- id: 1621
  intent: "This option makes the transfer function that of multiplying by realnum.  realnum must be nonnegative.  If the result is greater than one, it is clipped to one. Where the input is a PGM or PPM image, this has the effect of dimming or brightening it.  For a different kind of bright- ening, see pambrighten(1) and ppmflash(1) Also, see ppmdim(1), which does the same thing  as  pamfunc -multiplier on a PPM image with a multi- plier between zero and one, except it uses integer arithmetic, so it may be faster. And ppmfade(1) can generate a whole sequence  of images of brightness declining to black or in- creasing to white, if that's what you want."
  command: "pamfunc"
  example: "pamfunc -multiplier=realnum"
- id: 1622
  intent: "This option makes the transfer function that of taking the mini- mum of the argument and wholenum/maxval.  I.e the maximum value in the output will be wholenum/maxval. If wholenum/maxval is greater than one, the function is idempotent -- the output is identical to the input."
  command: "pamfunc"
  example: "pamfunc -max=wholenum"
- id: 1623
  intent: "This  specifies  the  format in which to output the colors.  The output    is    always    a    Netpbm    color     specification <libppm.html#colorname> ; this format tells which of the various specifications for the same color the program uses. This argument is of the form  formatId[:param],  where  formatId specifies  the  format and param is a positive integer parameter that, depending on formatId, indicates either precision or  nor- malization. The following values are possible for formatId: int    Samples  are decimal integers normalized to the maxval specified by param.  Example: rgb-255:255/128/64 This format  is  the  de- fault, with a maxval of 255. norm   Samples  are  floating  point numbers normalized to unity.  E.g. rgbi:1.0/0.5/.25 param specifies precision as the number of dig- its in the fractional part. x11    Samples   are   hexadecimal  numbers  with  param  digits,  e.g. rgb:01/ff/8000"
  command: "pamgetcolor"
  example: "pamgetcolor -format"
- id: 1624
  intent: "This specifies the Netpbm file to analyze. If  you  don't  specify this option, pamgetcolor reads the image from Standard Input."
  command: "pamgetcolor"
  example: "pamgetcolor -infile"
- id: 1625
  intent: "pamgradient [-maxval=maxval] color-tl color-tr color-bl color-br width height Minimum unique abbreviation of option is acceptable. You may use dou- ble hyphens instead of single hyphen to denote options. You may use white space in place of the equals sign to separate an option name from its value."
  command: "pamgradient"
  example: "pamgradient"
- id: 1626
  intent: "maxval of the generated image.  (See PAM(1) and PNM(1)  specifi- cations)."
