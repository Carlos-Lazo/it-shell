  intent: "Extract the contents of the EXIF header from the input image and write it to the file filespec.  filespec=-  means  write  it  to Standard  Output.   When  you  write the EXIF header to Standard Output, jpegtopnm does not output the converted image (which  is what normally would go to Standard Output) at all. jpegtopnm  writes the contents of the EXIF header byte-for-byte, starting with the two byte length field (which  length  includes those two bytes). You can use this file as input to pnmtojpeg to insert an identi- cal EXIF header into a new JFIF image. If there is no EXIF header, jpegtopnm writes two bytes of binary zero and nothing else. An  EXIF  header takes the form of a JFIF APP1 marker.  Only the first such marker within the JFIF header counts. This option was added in Netpbm 9.19 (September 2001)."
  command: "jpegtopnm"
  example: "jpegtopnm -exif=filespec"
