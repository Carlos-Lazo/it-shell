  intent: "Specify  which output pager to use.  By default, man uses pager, falling back to cat if pager is not found or is not  executable. This  option overrides the $MANPAGER environment variable, which in turn overrides the $PAGER environment variable.   It  is  not used in conjunction with -f or -k. The  value  may be a simple command name or a command with argu- ments, and may use shell quoting (backslashes, single quotes, or double  quotes).   It may not use pipes to connect multiple com- mands; if you need that, use a wrapper script,  which  may  take the file to display either as an argument or on standard input."
  command: "man"
  example: "man -P pager, --pager=pager"
- id: 1398
  intent: "When  viewing a pure ascii(7) manual page on a 7 bit terminal or terminal emulator, some characters  may  not  display  correctly when  using  the  latin1(7)  device  description with GNU nroff. This option allows pure ascii manual pages to  be  displayed  in ascii  with the latin1 device.  It will not translate any latin1 text.  The following table  shows  the  translations  performed: some  parts  of it may only be displayed properly when using GNU nroff's latin1(7) device. Description        Octal   latin1   ascii ------------------------------------------ continuation hy-    255      -        - phen bullet (middle      267      o        o dot) acute accent        264      '        ' multiplication      327      x        x sign If  the  latin1  column displays correctly, your terminal may be set up for latin1 characters and this option is  not  necessary. If  the  latin1 and ascii columns are identical, you are reading this page using this option or man did not format this page  us- ing  the  latin1  device  description.   If the latin1 column is missing or corrupt, you may need to view manual pages with  this option. This  option is ignored when using options -t, -H, -T, or -Z and may be useless for nroff other than GNU's."
  command: "man"
  example: "man -7, --ascii"
