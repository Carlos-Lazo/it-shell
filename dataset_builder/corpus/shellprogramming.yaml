- id: 1612
  intent: "This specifies the input file, which defaults to Standard Input. You may specify - to select Standard Input explicitly. This is a little unconventional for Netpbm programs, which  usu- ally have the input file specification as an argument.  For pam- channel, the arguments are channel numbers."
  command: "pamchannel"
  example: "pamchannel -infile infile"
- id: 1613
  intent: "This option names a file that contains  the  transparency  mask. If you don't specify this option, there is no transparency mask, which is equivalent to having a transparency mask specify  total opaqueness everywhere. You  can specify - as the value of this option and the transpar- ency mask will come from Standard Input.  If you do this,  don't specify Standard Input as the source of any other input image."
  command: "pamcomp"
  example: "pamcomp -alpha=alpha-pgmfile"
- id: 1614
  intent: "This option controls what pamcomp does where both the underlying and overlay image are non-opaque. By  default,  the  output image has the same transparency as the underlying image and the transparency of  the  underlying  image has no effect on the composition of color. But  with this option, pamcomp composes the image according to a plastic transparency metaphor: the underlying and overlay images are  plastic slides.  The output image is the slide you get when you stack up those two slides.  So the transparency of the  out- put  is  a combination of the transparency of the inputs and the transparency of the underlying image affects the underlying  im- age's contribution to the output image's color. Unlike  the  metaphorical  slide,  a  PAM pixel has a color even where it is completely transparent, so pamcomp departs from  the metaphor  in  that  case and makes the output color identical to the underlying image. This option was new in Netpbm 10.56  (September  2011).   Before that,  the  output  is always opaque and the pamcomp ignores the transparency of the underlying image."
  command: "pamcomp"
  example: "pamcomp -mixtransparency"
- id: 1615
  intent: "image, pamcut fails unless you also specify -pad.  In that case, it  pads the output with black up to the edges you specify.  You can use this option if you need to have an image of certain  di- mensions and have an image of arbitrary dimensions. pnmpad  also  adds  borders  to  an image, but you specify their width directly. pamcomp does a more general form  of  this  padding.   Create  a background image of the frame dimensions and overlay the subject image on it.  You can use options to have the subject  image  in the center of the frame or against any edge and make the padding any color (the padding color is the color of the background  im- age)."
  command: "pamcut"
  example: "pamcut -pad   If  the  rectangle  you specify is not entirely within the input"
