- id: 823
  intent: "GnuPG can automatically locate and retrieve keys as needed using this option.  This happens when encrypting to an  email  address (in  the  \"user@example.com\" form), and there are no \"user@exam- ple.com\" keys on the local keyring.  This option takes any  num- ber  of the mechanisms listed below, in the order they are to be tried.  Instead of listing the mechanisms as comma delimited ar- guments,  the option may also be given several times to add more mechanism.  The option  --no-auto-key-locate  or  the  mechanism \"clear\" resets the list.  The default is \"local,wkd\". cert   Locate a key using DNS CERT, as specified in RFC-4398. pka    Locate a key using DNS PKA. dane   Locate a key using DANE, as specified in draft-ietf-dane- openpgpkey-05.txt. wkd    Locate a key using the Web Key Directory protocol. ldap   Using DNS Service Discovery, check the domain in question for  any  LDAP keyservers to use.  If this fails, attempt to locate the key  using  the  PGP  Universal  method  of checking 'ldap://keys.(thedomain)'. ntds   Locate the key using the Active Directory (Windows only). This method also allows to search  by  fingerprint  using the command --locate-external-key.  Note that this mecha- nism is actually a shortcut for the mechanism 'keyserver' but using \"ldap:///\" as the keyserver. keyserver Locate  a key using a keyserver.  This method also allows to search by fingerprint using the  command  --locate-ex- ternal-key if any of the configured keyservers is an LDAP server. keyserver-URL In addition, a keyserver URL as used in the dirmngr  con- figuration may be used here to query that particular key- server.  This method also allows to search by fingerprint using the command --locate-external-key if the URL speci- fies an LDAP server. local  Locate the key using the local keyrings.  This  mechanism allows the user to select the order a local key lookup is done.  Thus using '--auto-key-locate local' is  identical to --no-auto-key-locate. nodefault This  flag  disables  the standard local key lookup, done before any of the mechanisms defined by  the  --auto-key- locate  are tried.  The position of this mechanism in the list does not matter.  It is not  required  if  local  is also used. clear  Clear all defined mechanisms.  This is useful to override mechanisms given in a config file.  Note that a nodefault in mechanisms will also be cleared unless it is given af- ter the clear."
  command: "gpg"
  example: "gpg --no-auto-key-locate"
- id: 824
  intent: "Do not cache the verification status of key signatures.  Caching gives a much better performance in key listings. However, if you suspect that your public keyring is not safe against write modi- fications, you can use this option to disable  the  caching.  It probably  does  not make sense to disable it because all kind of damage can be done if someone else has write access to your pub- lic keyring."
