  example: "pnmgamma -cieramp"
- id: 1829
  intent: "This  specifies the gamma value to use in the transfer function. All of the transfer functions involve an exponent, and the gamma value is that exponent. The standards specify a particular gamma value.  If you use any- thing else, you are varying from the standard. The default is the standard value.  For the  simple  exponential transfer function (which is not a standard), the default is 2.2. In  the  -bt709tosrgb and -srgbtobt709 conversions there are two exponents.  -gamma affects the \"to\" function; the  \"from\"  func- tion always uses the standard gamma value. If  you  specify one of the component-specific options (-rgamma, etc.), that overrides the -gamma value. With the -bt709ramp (aka -cieramp), -srgbramp,  or  the  default exponential  transfer  function, you can't actually use this op- tion,  but  you  specify  the  same   thing   with   parameters. <#parameters> This option was new in Netpbm 10.32 (February 2006)."
  command: "pnmgamma"
  example: "pnmgamma -gamma=float"
- id: 1830
  intent: "Do not include black pixels in the equalization.  The black pix- els  in the output are exactly the black pixels in the input and the number of black pixels does not  affect  the  color  of  any other pixels. Sometimes,  black isn't as much a color as a background or anno- tation for the real colors, so you want to  treat  it  specially this  way.   Think  of  a  picture of stars, which is nearly all black, but with lots of stars of different brightness.  You want to change the brightnesses of the stars to maximize contrast be- tween them, but if you considered the blackness to  be  signifi- cant, all the stars would end up close to full white. This option was new in Netpbm 10.70 (March 2015)."
  command: "pnmhisteq"
  example: "pnmhisteq -noblack"
- id: 1831
  intent: "Prints the histogram and luminosity map on Standard Error."
  command: "pnmhisteq"
  example: "pnmhisteq -verbose"
- id: 1832
  intent: "specify none of these, pnmhistmap include all three. These options are meaningless if the input is PGM. These options were new in Netpbm 10.26 (January  2005).   Before that, pnmhistmap always included all three color components."
  command: "pnmhistmap"
  example: "pnmhistmap -blue  Include  the  indicated  color  component in the output.  If you"
- id: 1833
  intent: "pnmmercator [-inverse] [-nomix] [-[v]verbose] [filename] Minimum unique abbreviation of option is acceptable. You may use dou- ble hyphens instead of single hyphen to denote options."
  command: "pnmmercator"
  example: "pnmmercator"
- id: 1834
  intent: "With this option a conversion from Mercator to  degrees  is  ap- plied.The  output  image  will have half the height of the input map."
  command: "pnmmercator"
  example: "pnmmercator -inverse"
- id: 1835
  intent: "pnmmontage [-header=headerfile] [-quality=n] [-prefix=prefix] [-0|-1|-2|...|-9] [-data=filename] pnmfile..."
  command: "pnmmontage"
  example: "pnmmontage"
- id: 1836
  intent: "To  specify that the single least brightness in the image should stretch to black in the output, specify  -bsingle.   To  specify that  the single greatest brightness in the image should stretch to white in the output, specify -wsingle.  -bsingle and -wsingle were new in Netpbm 10.69 (December 2014)."
  command: "pnmnorm"
  example: "pnmnorm -bsingle"
- id: 1837
  intent: "When you specify -midvalue=N, pnmnorm uses a quadratic  function to  map  old  brightnesses  to new ones, making sure that an old brightness of N becomes 50% bright in the output.  You can over- ride  that  50% default with -middle.  The value of -middle is a floating point number in the range 0 through 1 with 0 being full darkness  and  1 full brightness.  If your -midvalue and -middle indicate an ambiguous or  impossible  quadratic  function  (e.g. -midvalue  is the same as -bvalue, so an infinite number of qua- dratic functions fit), pnmnorm just ignores your  -midvalue  and maps linearly. -midvalue and -middle were new in Netpbm 10.57 (December 2011). If  you specify -keephues, pnmnorm would likely leave this pixel alone, since its overall brightness is medium. -keephues can cause clipping, because a certain color may be be- low a target intensity while one of its components is saturated. Where that's the case, pnmnorm uses  the  maximum  representable intensity for the saturated component and the pixel ends up with less overall intensity, and a different hue, than it is supposed to have. This option is meaningless on grayscale images. When  you don't specify -keephues, the -luminosity, -colorvalue, and -saturation options affect the transfer function  (which  is the same for all three RGB components), but are meaningless when it comes to applying the transfer function (since it is  applied to each individual RGB component). Before Netpbm 9.25 (March 2002), there was no -keephues option."
  command: "pnmnorm"
  example: "pnmnorm -middle=N"
- id: 1838
  intent: "Specify amount of left and right padding in pixels. -left and -right directly specify the amount of padding added to the left and right sides, respectively, of the image. Alternatively,  you can specify -width and just one of -left and -right and pnmpad calculates the required padding on  the  other side  to make the output width pixels wide.  If the -width value is less than the width of the input  image  plus  the  specified padding, pnmpad ignores -width. If  you specify all three of -width, -left, and -right, you must ensure that the -left and -right padding are sufficient to  make the image at least as wide as -width specifies.  Otherwise, pnm- pad fails. When you specify -width without -left or -right, and  -width  is larger  than the input image, pnmpad chooses left and right pad- ding amounts in a certain ratio.  That ratio defaults  to  half, but  you  can  set it to anything (from 0 to 1) with the -halign option.  If the input image is  already  at  least  as  wide  as -width specifies, pnmpad adds no padding. Common values for -halign are: 0.0    left aligned 0.5    center aligned (default) 1.0    right aligned -mwidth=pixels says to pad to a multiple of pixels pixels.  E.g. if pixels is 10, the output image width will be a multiple of 10 pixels.   pnmpad  adds to whatever padding the other options say to do to get to this multiple.  It divides that padding  between the  left and right sides of the image to maintain the ratio the other options produce.   E.g.  if  you  say  -left=10  -right=10 -mwidth=50  with  a 100-pixel image, you end up with a 150-pixel image with the extra padding split evenly between left and right for  a  total  of 25 pixels of padding on the left and 25 on the right.  If the other options indicate no  padding,  pnmpad  adds padding  in the ratio specified by -halign and if -halign is not specified, equally on both sides. Before Netpbm 10.97  (December  2021),  pnmpad  does  not  allow -halign  with  -mwidth  and  adds padding only on the right when -mwidth is specified and the other options indicate no padding. Before Netpbm 10.72 (September 2015), there is no -mwidth. Before Netpbm 10.23 (July 2004), pnmpad did not allow the  -left or -right option together with -width."
  command: "pnmpad"
  example: "pnmpad -mwidth=pixels"
- id: 1839
  intent: "These  options  determine the vertical padding.  They are analo- gous to the horizontal padding options above."
  command: "pnmpad"
  example: "pnmpad -mheight=pixels"
- id: 1840
  intent: "This causes pnmpad to write to Standard Output  a  description of the padding  it would have done instead of producing an output im- age.  See below <#reportonly>  for a description of this output and ways to use it. This option was new in Netpbm 10.89 (December 2019)."
  command: "pnmpad"
  example: "pnmpad -reportonly"
- id: 1841
  intent: "paste a rectangle into a PNM image"
  command: "pnmpaste"
  example: "pnmpaste"
- id: 1842
  intent: "-nor, -nand, -nxor These  option specify the operation to use when doing the paste. The default is -replace, which means to do  the  obvious  paste: replace  pixels of the \"into\" image with those of the \"from\" im- age. -and, -nand, -or, -nor, -xor, and nxor are allowed only if  both input images are PBM images.  They say to combine the \"from\" and \"into\" images by performing boolean operations:  Each  pixel  of the  output  image is the result of the boolean operation on the corresponding pixels of the two input  images,  where  white  is TRUE and black is FALSE. Note  that  this is different from what you would get by doing a bit arithmetic on the bits in the PBM images,  because  in  PBM, white  is represented by a 0 bit, and 0 in bit arithmetic corre- sponds to FALSE in boolean arithmetic. -nand, -nor, and -nxor were new in Netpbm 10.85 (December 2018)."
  command: "pnmpaste"
  example: "pnmpaste -replace, -or, -and, -xor,"
- id: 1843
  intent: "This  option  causes  pnmpsnr to run in comparison mode - rather than print the PSNRs, it just tells you whether the PSNRs exceed n  (a  floating  point number), i.e. whether the compared images are the same within a given margin of error.  If  all  the  com- puted  PSNRs  (luminance for a PBM or PGM; luminance and chromi- nance or red, green, and blue for PPM)  exceed  n,  the  program prints  'match'  to  Standard Output.  Otherwise, it prints 'no- match'. If you also specify any of -target1, -target2, or -target3,  and the images are color, pnmpsnr ignores -target. This  is  mainly useful for use in a program.  If you're running pnmpsnr manually, you could just run pnmpsnr without -target and compare the PSNRs to your targets yourself. This option was new in Netpbm 10.82 (March 2018)."
  command: "pnmpsnr"
  example: "pnmpsnr -target=n"
- id: 1844
  intent: "Like  -target,  these options cause pnmpsnr to run in comparison mode.  But they provide  separate  targets  for  the  individual color component PSNRs.  -target1, target-2, and -target3 are for either the Y, Cb, and Cr components, respectively, or  the  red, green, and blue components, respectively, depending upon whether you specified -rgb. If you don't specify the corresponding  -targetn  option  for  a component,  pnmpsnr ignores the PSNR of that component in decid- ing whether the images match. If the image is a PBM or PGM, these options have no effect,  ex- cept  that  it  stilll  selects comparison mode, so if you don't also specify -target, and the image is PBM or PGM,  the  program fails. Note that the options are defined so that you could code a pnmp- snr command in a program that works on both color  and  monotone images,  specifying individual PSNR targets for use on the color images and the single target for use on the monotone images. These options were new in Netpbm 10.82 (March 2018)."
  command: "pnmpsnr"
  example: "pnmpsnr -target{1,2,3}=n"
- id: 1845
  intent: "Options Passed to pnmremap These options control which color from the palette the program uses to replace a pixel of a certain color from the input.  They are  options to pnmremap(1)."
  command: "pnmquant"
  example: "pnmquant -spreadluminosity"
- id: 1846
  intent: "dithering.  Without Floyd-Steinberg, pnmremap selects the output color of a pixel based on the color of  only  the  corresponding input  pixel.   With Floyd-Steinberg, pnmremap considers regions of pixels such that the average color of a region is the same in the  output  as in the input.  The dithering effect appears as a dot pattern up close, but from a distance,  the  dots  blend  so that you see more colors than are present in the color map. As  an example, if your color map contains only black and white, and the input image has 4 adjacent pixels of gray, pnmremap with Floyd-Steinberg  would  generate  output  pixels  black,  white, black, white, which from a distance  looks  gray.   But  without Floyd-Steinberg,  pnmremap  would generate 4 white pixels, white being the single-pixel approximation of gray. Floyd-Steinberg gives vastly better results on images where  un- modified quantization has banding or other artifacts, especially when going to a small number of colors such  as  the  above  IBM set.  However, it does take substantially more CPU time. -fs is a synonym for -floyd.  -nofs is a synonym for -nofloyd. The default is -nofloyd. Before  Netpbm  10.46 (March 2009), dithering doesn't work quite as you expect if the color map has a lower maxval than  the  in- put.   pnmremap  reduces the color resolution to the color map's maxval before doing any dithering, so  the  dithering  does  not have  the  effect  of making the image, at a distance, appear to have the original maxval.  In current Netpbm, it does."
  command: "pnmremap"
  example: "pnmremap -nofs  These options determine whether  pnmremap  does  Floyd-Steinberg"
- id: 1847
  intent: "This  tells  pnmremap  to map any input color that is not in the palette to the first color in the  palette  (the  color  of  the pixel in the top left corner of the palette image) See DESCRIPTION <#description> . If  you  specify  -firstisdefault, the maxval of your input must match the maxval of your palette image."
  command: "pnmremap"
  example: "pnmremap -firstisdefault"
- id: 1848
  intent: "This specifies the default color for pnmremap to map to a  color in  the input image that isn't in the palette.  color may or may not be in the palette image; it is part of the  palette  regard- less. colorspec   is   as   described   for   the   argument   of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . If  you  specify  -missingcolor,  the  maxval of your input must match the maxval of your palette image."
  command: "pnmremap"
  example: "pnmremap -missingcolor=colorspec"
- id: 1849
  intent: "This determines the color of the background on which the rotated image sits. Specify the color (color) as described for the argument  of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . By default, if you don't specify this option, pnmrotate  selects what  appears  to  it to be the background color of the original image.  It determines this color rather simplistically, by  tak- ing  an  average of the colors of the two top corners of the im- age. This option was new in Netpbm 10.15.  Before that, pnmrotate al- ways behaved as is the default now."
  command: "pnmrotate"
  example: "pnmrotate -background=color"
- id: 1850
  intent: "This  option  forces  pnmrotate to simply move pixels around in- stead of synthesizing output pixels from multiple input  pixels. The latter could cause the output to contain colors that are not in the input, which may not  be  desirable.   It  also  probably makes  the output contain a large number of colors.  If you need a small number of colors, but it doesn't matter if they are  the exact ones from the input, consider using pnmquant on the output instead of using -noantialias. Note that to ensure the output does not contain colors that  are not  in  the input, you also must consider the background color. See the -background option."
  command: "pnmrotate"
  example: "pnmrotate -noantialias"
- id: 1851
  intent: "This determines the color of the background on which the sheared image sits. Specify the color (color) as described for the argument  of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . By default, if you don't specify this option,  pnmshear  selects what  appears  to  it to be the background color of the original image.  It determines this color rather simplistically, by  tak- ing  an  average of the colors of the two top corners of the im- age. This option was new in Netpbm  10.37  (December  2006).   Before that, pnmshear always behaved as is the default now."
  command: "pnmshear"
  example: "pnmshear -background=color"
- id: 1852
  intent: "This option forces pnmshear to simply move pixels around instead of synthesizing output pixels from multiple input  pixels.   The latter  could cause the output to contain colors that are not in the input, which may not be desirable.  It also  probably  makes the  output  contain  a  large  number of colors.  If you need a small number of colors, but it doesn't matter if  they  are  the exact ones from the input, consider using pnmquant on the output instead of using -noantialias. Note that to ensure the output does not contain colors that  are not  in  the input, you also must consider the background color. See the -background option."
  command: "pnmshear"
  example: "pnmshear -noantialias"
- id: 1853
  intent: "Name of output file.  If you don't specify this option, the out- put image goes to Standard Output."
  command: "pnmstitch"
  example: "pnmstitch -output=output_filespec"
- id: 1854
  intent: "Print pnmtofiasco version number, then exit."
  command: "pnmtofiasco"
  example: "pnmtofiasco -v, --version"
- id: 1855
  intent: "Print brief help, then exit."
  command: "pnmtofiasco"
  example: "pnmtofiasco -h, --info"
- id: 1856
  intent: "Use additional predictive coding.  If this optimization  is  en- abled  then  the image is compressed in two steps.  In the first step, a coarse approximation of  the  image  is  computed  using large  unichrome  blocks.   Finally, the delta image is computed and the prediction error is approximated using the standard  FI- ASCO algorithm."
  command: "pnmtofiasco"
  example: "pnmtofiasco -P, --prediction"
- id: 1857
  intent: "Select  the  lowest resolution layer that will be written to the BIE.  It is possible to store the various resolution layers of a JBIG  image in progressive mode into different BIEs.  Options -l and -h allow you to select the  resolution-layer  interval  that will appear in the created BIE.  The lowest resolution layer has number 0 and this is also the default value.  By default, pnmto- jbig writes all layers."
  command: "pnmtojbig"
  example: "pnmtojbig -l number"
- id: 1858
  intent: "in annex C of the standard.   By  default  the  template  change takes  place  directly in the next line which is most effective. However a few conformance test examples in the standard  require the  adaptive template change to be delayed until the first line of the next stripe.  This option selects this special  behavior, which is normally not required except in order to pass some con- formance test suite."
  command: "pnmtojbig"
  example: "pnmtojbig -c     The  adaptive template pixel movement is determined as suggested"
- id: 1859
  intent: "Smooth the input image to eliminate dithering noise.  n, ranging from  1 to 100, indicates the strength of smoothing.  0 (the de- fault) means no smoothing."
  command: "pnmtojpeg"
  example: "pnmtojpeg -smooth=n"
- id: 1860
  intent: "Marks one particular color as fully transparent. colorspec   is   as   described   for   the   argument   of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . Transparency works only on Palm OS 3.5 and higher."
  command: "pnmtopalm"
  example: "pnmtopalm -transparent=colorspec"
- id: 1861
  intent: "Specifies that the output Palm bitmap will use the Palm scanline compression scheme.  Scanline compression works only in Palm  OS 2.0 and higher."
  command: "pnmtopalm"
  example: "pnmtopalm -scanline_compression"
- id: 1862
  intent: "Specifies that the output Palm bitmap will use the Palm RLE com- pression scheme.  RLE compression works only with  Palm  OS  3.5 and higher."
  command: "pnmtopalm"
  example: "pnmtopalm -rle_compression"
- id: 1863
  intent: "Specifies that the output Palm bitmap will use the Palm packbits compression scheme.  Packbits compression works only  with  Palm OS 4.0 and higher. This option was new in Netpbm 10.27 (March 2005)."
  command: "pnmtopalm"
  example: "pnmtopalm -packbits_compression"
- id: 1864
  intent: "This option and -yoffs determine the location on the page of the upper left corner of each image.  Note that the image  may  have built  in  borders  too,  which would make the main image within more left and down that what you specify here. -xoffs and -yoffs specify the distance from the left of the page and  from  the  top of the page, respectively, in inches, of the upper left corner of the image.  The default for each is zero. These options are meaningless if you specify -center."
  command: "pnmtopclxl"
  example: "pnmtopclxl -xoffs=N"
- id: 1865
  intent: "This option selects the media (e.g. paper size) that the printer control stream specifies.  paperformat is one of  the  following self-explanatory keywords: o      letter o      legal o      a3 o      a4 o      a5 o      a6 o      jb4 o      jb5 o      jb6 o      exec o      ledger o      b5envelope o      c5envelope o      com10envelope o      monarchenvelope o      dlenvelope o      jpostcard o      jdoublepostcard The default is letter."
  command: "pnmtopclxl"
  example: "pnmtopclxl -format=paperformat"
- id: 1866
  intent: "This  option causes pnmtopclxl to include in the output stream a command to set the RENDERMODE environment variable to GRAYSCALE, which typically causes the printer to print in grayscale regard- less of the colors in the input, and may cause it  to  run  much faster even if the image is grayscale anyway. This option was new in Netpbm 10.29 (August 2005)."
  command: "pnmtopclxl"
  example: "pnmtopclxl -rendergray"
- id: 1867
  intent: "ments  as the option argument, whereas -size takes a single program ar- gument which is composed of multiple words.  E.g.  The old  shell  com- mand pnmtopng -phys 800 800 0 input.pnm > output.png is equivalent to the new shell command pnmtopng -size \"800 800 0\" input.pnm > output.png If  you're writing a program that needs to work with both new and old , have it first try with the new syntax, and if it fails  with  \"unrecog- nized option,\" fall back to the old syntax. Current Options In  addition  to  the options common to all programs based on libnetpbm (most notably -quiet, see Common Options <index.html#commonoptions> ), pnmtopng  recognizes  the following command line options:"
  command: "pnmtopng"
  example: "pnmtopng -phys/-size as an example, is that -phys takes multiple  program  argu-"
- id: 1868
  intent: "pnmtopng marks the specified color as transparent in the PNG im- age. Specify  the  color (color) as described for the argument of the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname>  .   E.g.  red or rgb:ff/00/0d. If the color you specify is not present in the  image,  pnmtopng selects  instead  the  color in the image that is closest to the one you specify.  Closeness is measured as a Cartesian  distance between  colors  in  RGB space.  If multiple colors are equidis- tant, pnmtopng chooses one of them arbitrarily. However, if you prefix your color specification with \"=\", e.g. -transparent =red only the exact color you specify will be transparent.  If  that color  does  not appear in the image, there will be no transpar- ency.  pnmtopng issues an information message when this  is  the case."
  command: "pnmtopng"
  example: "pnmtopng -transparent=color"
- id: 1869
  intent: "This option specifies a palette to use in the  PNG.   It  forces pnmtopng  to create the paletted (colormapped) variety of PNG -- if that isn't possible, pnmtopng  fails.   If  the  palette  you specify  doesn't  contain  exactly the colors in the image, pnm- topng fails.   Since  pnmtopng  will  automatically  generate  a paletted PNG, with a correct palette, when appropriate, the only reason you would specify the -palette option is if you  care  in what  order  the  colors appear in the palette.  The PNG palette has colors in the same order as the palette you specify. You specify the palette by naming a PPM file that has one  pixel for each color in the palette. Alternatively,  consider  the  case  that have a palette and you want to make sure your PNG contains only colors  from  the  pal- ette,  approximating  if necessary.  You don't care what indexes the PNG uses internally for the colors (i.e. the  order  of  the PNG  palette).  In this case, you don't need -palette.  Pass the Netpbm input  image  and  your  palette  PPM  through  pnmremap. Though  you  might  think  it would, using -palette in this case wouldn't even save pnmtopng any work."
  command: "pnmtopng"
  example: "pnmtopng -palette=palettefile"
- id: 1870
  intent: "Causes pnmtopng to create a gAMA chunk.  This information  helps describe  how  the  color values in the PNG must be interpreted. Without the gAMA chunk, whatever interprets  the  PNG  must  get this information separately (or just assume something standard). If your input is a true PPM or PGM  image,  you  should  specify -gamma=.52.   But sometimes people generate images which are os- tensibly PPM except the image uses a  different  gamma  transfer function  than the one specified for PPM.  A common case of this is when the image is created by  simple  hardware  that  doesn't have  digital computational ability.  Also, some simple programs that generate images from scratch do it with a gamma transfer in which the gamma value is 1.0."
  command: "pnmtopng"
  example: "pnmtopng -gamma=value"
- id: 1871
  intent: "This option causes pnmtopng to display version information about itself  and the libraries it uses, in addition to all its normal function.  Do not confuse this with  the  Netpbm  common  option -version,  which  causes the program to display version informa- tion about the Netpbm library and do nothing else. You can't really use this option in a program that invokes  pnm- topng  and  needs to know which version it is.  Its function has changed too much over the history of pnmtopng.   The  option  is good only for human eyes."
  command: "pnmtopng"
  example: "pnmtopng -libversion"
- id: 1872
  intent: "Tells how wide and high you want  the  image  on  the  page,  in inches.   The  aspect ratio of the image is preserved, so if you specify both of these, the image on the page will be the largest image that will fit within the box of those dimensions. If  these  dimensions  are  greater  than the page size, you get Postscript output that runs off the page. You  cannot  use  imagewidth  or  imageheight  with  -scale   or -equalpixels."
  command: "pnmtops"
  example: "pnmtops -imagewidth, -imageheight"
- id: 1873
  intent: "This  option  causes the output image to have the same number of pixels as the input image.  So if the output device is  600  dpi and  your image is 3000 pixels wide, the output image would be 5 inches wide. You cannot use -equalpixels with -imagewidth,  -imageheight,  or -scale."
  command: "pnmtops"
  example: "pnmtops -equalpixels"
- id: 1874
  intent: "number  of inches of output image that you want 72 pixels of the input to generate. But pnmtops  rounds the number to something that is an  integral number  of  output  device pixels.  E.g. if the output device is 300 dpi and you specify -scale=1.0, then 75 (not 72)  pixels  of input becomes one inch of output (4 output pixels for each input pixel).  Note that the -dpi option tells pnmtops how many pixels per inch the output device generates. If  the  size so specified does not fit on the page (as measured either by the -width and -height options  or  the  default  page size of 8.5 inches by 11 inches), pnmtops ignores the -scale op- tion, issues a warning, and scales the image to fit on the page."
  command: "pnmtops"
  example: "pnmtops -scale tells how big you want the image on the page.  The value is  the"
- id: 1875
  intent: "These options specify the dimensions, in inches, of the page on which  the output is to be printed.  This can affect the size of the output image. The page size has no effect, however, when you specify the  -im- agewidth, -imageheight, or -equalpixels options. These  options  may  also affect positioning of the image on the page and even the paper selected (or cut) by the printer/plotter when the output is printed.  See the -nosetpage option. The default is 8.5 inches by 11 inches."
  command: "pnmtops"
  example: "pnmtops -width, -height"
- id: 1876
  intent: "These  options control whether the image gets turned 90 degrees. Normally, if an image fits the page better when turned (e.g. the image  is  wider than it is tall, but the page is taller than it is wide), it gets turned automatically to better fit  the  page. If  you  specify  the  -turn option, pnmtops  turns the image no matter what its shape; If you specify -noturn, pnmtops does  not turn it no matter what its shape."
  command: "pnmtops"
  example: "pnmtops -noturn"
- id: 1877
  intent: "By default, pnmtops centers the image on the output page. You can cause pnmtops to instead put the image against the lower left corner of the page with the -nocenter option.  This is useful for programs which can include PostScript files, but can't cope with  pictures  which  are not positioned in the lower left corner. If  you  want to position an image on the page arbitrarily, use pamcomp to create an image of the full page with the  image in question  at  the  proper  place  and  the rest of the page white, and use pnmtops to convert  the  composed  result  to  Encapsulated Postscript. For backward compatibility, pnmtops accepts the option -center, but it has no effect."
  command: "pnmtops"
  example: "pnmtops -nocenter"
- id: 1878
  intent: "This causes pnmtops to include a \"setpagedevice\" directive in the output.  This causes the output to violate specifications of EPSF encapsulated Postscript, but if you're not using it in an encapsulated  way,  may  be  what  you need.  The directive tells the printer/plotter what size paper to use (or cut).   The  di- mensions it specifies on this directive are those selected by the -width and -height options or defaulted. From January through May 2002, the default was to include \"setpagedevice\" and this option did not exist.  Before January 2002, there was no way to include \"setpagedevice\" and neither the -setpage nor -nosetpage option existed."
  command: "pnmtops"
  example: "pnmtops -setpage"
- id: 1879
  intent: "This tells pnmtops not to include a \"setpagedevice\" directive  in  the output.  This is the default, so the op- tion has no effect. See the -setpage option for the history of this option."
  command: "pnmtops"
  example: "pnmtops -nosetpage"
