- id: 1089
  intent: "Adds AUDITLIB to the \"DT_AUDIT\" entry of the dynamic section. AUDITLIB is not checked for existence, nor will it use the DT_SONAME specified in the library.  If specified multiple times \"DT_AUDIT\" will contain a colon separated list of audit interfaces to use. If the linker finds an object with an audit entry while searching for shared libraries, it will add a corresponding \"DT_DEPAUDIT\" entry in the output file.  This option is only meaningful on ELF platforms supporting the rtld-audit interface."
  command: "ld"
  example: "ld --audit AUDITLIB"
- id: 1090
  intent: "For compatibility with linkers produced by MRI, ld accepts script files written in an alternate, restricted command language, described in the MRI Compatible Script Files section of GNU ld documentation.  Introduce MRI script files with the option -c; use the -T option to run linker scripts written in the general-purpose ld scripting language.  If MRI-cmdfile does not exist, ld looks for it in the directories specified by any -L options."
  command: "ld"
  example: "ld --mri-script=MRI-commandfile"
- id: 1091
  intent: "This option avoids generating an error if an input section does not fit a matching output section. The linker tries to allocate the input section to subseque nt matching output sections, and generates an error only if no output section is large enough.  This is useful when several non-contiguous memory regions are available and the input section does not require a particular one.  The order in which input sections are evaluated does not change, for instance: MEMORY { MEM1 (rwx) : ORIGIN : 0x1000, LENGTH = 0x14 MEM2 (rwx) : ORIGIN : 0x1000, LENGTH = 0x40 MEM3 (rwx) : ORIGIN : 0x2000, LENGTH = 0x40 } SECTIONS { mem1 : { *(.data.*); } > MEM1 mem2 : { *(.data.*); } > MEM2 mem3 : { *(.data.*); } > MEM2 } with input sections: .data.1: size 8 .data.2: size 0x10 .data.3: size 4 results in .data.1 affected to mem1, and .data.2 and .data.3 affected to mem2, even though .data.3 would fit in mem3. This option is incompatible with INSERT statements because it changes the way input sections are mapped to output sections."
  command: "ld"
  example: "ld --enable-non-contiguous-regions"
- id: 1092
  intent: "Use entry as the explicit symbol for beginning execution of your program, rather than the default entry point.  If there is no symbol named entry, the linker will try to parse entry as a number, and use that as the entry address (the number will be interpreted in base 10; you may use a leading 0x for base 16, or a leading 0 for base 8)."
  command: "ld"
  example: "ld --entry=entry"
- id: 1093
  intent: "Add path searchdir to the list of paths that ld will search for archive libraries and ld control scripts.  You may use this option any number of times.  The directories are searched in the order in which they are specified on the command line.  Directories specified on the command line are searched before the default directories.  All -L options apply to all -l options, regardless of the order in which the options appear.  -L options do not affect how ld searches for a linker script unless -T option is specified. If searchdir begins with \"=\" or $SYSROOT, then this prefix will be replaced by the sysroot prefix, controlled by the --sysroot option, or specified when the linker is configured. The default set of paths searched (without being specified with -L) depends on which emulation mode ld is using, and in some cases also on how it was configured. The paths can also be specified in a link script with the \"SEARCH_DIR\" command.  Directories specified this way are searched at the point in which the linker script appears in the command line."
  command: "ld"
  example: "ld --library-path=searchdir"
- id: 1094
  intent: "Turn off page alignment of sections, and disable linking against shared libraries.  If the output format supports Unix style magic numbers, mark the output as \"NMAGIC\"."
  command: "ld"
  example: "ld --nmagic"
- id: 1095
  intent: "Use output as the name for the program produced by ld; if this option is not specified, the name a.out is used by default.  The script command \"OUTPUT\" can also specify the output file name."
  command: "ld"
  example: "ld --output=output"
- id: 1096
  intent: "Use scriptfile as the default linker script. This option is similar to the --script option except that processing of the script is delayed until after the rest of the command line has been processed.  This allows options placed after the --default-script option on the command line to affect the behaviour of the linker script, which can be important when the linker command line cannot be directly controlled by the user.  (eg because the command line is being constructed by another tool, such as gcc)."
  command: "ld"
  example: "ld --default-script=scriptfile"
- id: 1097
  intent: "Control how orphan sections are handled.  An orphan section is one not specifically mentioned in a linker script. MODE can have any of the following values: \"place\" Orphan sections are placed into a suitable output section following the strategy described in Orphan Sections.  The option --unique also affects how sections are placed. \"discard\" All orphan sections are discarded, by placing them in the /DISCARD/ section. \"warn\" The linker will place the orphan section as for \"place\" and also issue a warning. \"error\" The linker will exit with an error if any orphan section is found. The default if --orphan-handling is not given is \"place\"."
  command: "ld"
  example: "ld --orphan-handling=MODE"
- id: 1098
  intent: "Creates a separate output section for every input section matching SECTION, or if the optional wildcard SECTION argument is missing, for every orphan input section.  An orphan section is one not specifically mentioned in a linker script.  You may use this option multiple times on the command line;  It prevents the normal merging of input sections with the same name, overriding output section assignments in a linker script."
  command: "ld"
  example: "ld --unique[=SECTION]"
- id: 1099
  intent: "When creating a shared library, bind references to global symbols to the definition within the shared library, if any.  Normally, it is possible for a program linked against a shared library to override the definition within the shared library.  This option is only meaningful on ELF platforms which support shared libraries."
  command: "ld"
  example: "ld -Bsymbolic"
- id: 1100
  intent: "When creating a shared library, bind references to global function symbols to the definition within the shared library, if any.  This option is only meaningful on ELF platforms which support shared libraries."
  command: "ld"
  example: "ld -Bsymbolic-functions"
- id: 1101
  intent: "Create a global symbol in the output file, containing the absolute address given by expression.  You may use this option as many times as necessary to define multiple symbols in the command line.  A limited form of arithmetic is supported for the expression in this context: you may give a hexadecimal constant or the name of an existing symbol, or use \"+\" and \"-\" to add or subtract hexadecimal constants or symbols.  If you need more elaborate expressions, consider using the linker command language from a script.  Note: there should be no white space between symbol, the equals sign (\"=\"), and expression. The linker processes --defsym arguments and -T arguments in order, placing --defsym before -T will define the symbol before the linker script from -T is processed, while placing --defsym after -T will define the symbol after the linker script has been processed.  This difference has consequences for expressions within the linker script that use the --defsym symbols, which order is correct will depend on what you are trying to achieve."
  command: "ld"
  example: "ld --defsym=symbol=expression"
- id: 1102
  intent: "Print the name of the default output format (perhaps influenced by other command-line options).  This is the string that would appear in an \"OUTPUT_FORMAT\" linker script command."
  command: "ld"
  example: "ld --print-output-format"
- id: 1103
  intent: "Print a summary of the command-line options on the standard output and exit."
  command: "ld"
  example: "ld --help"
- id: 1104
  intent: "Print a summary of all target-specific options on the standard output and exit."
  command: "ld"
  example: "ld --target-help"
- id: 1105
  intent: "For some targets, the output of ld is different in some ways from the output of some existing linker.  This switch requests ld to use the traditional format instead. For example, on SunOS, ld combines duplicate entries in the symbol string table.  This can reduce the size of an output file with full debugging information by over 30 percent.  Unfortunately, the SunOS \"dbx\" program can not read the resulting program (\"gdb\" has no trouble).  The --traditional-format switch tells ld to not combine duplicate entries."
  command: "ld"
  example: "ld --traditional-format"
- id: 1106
  intent: "Warn if the address of an output section is changed because of alignment.  Typically, the alignment will be set by an input section.  The address will only be changed if it not explicitly specified; that is, if the \"SECTIONS\" command does not specify a start address for the section."
  command: "ld"
  example: "ld --warn-section-align"
- id: 1107
  intent: "On ELF platforms, these options control how DWARF debug sections are compressed using zlib. --compress-debug-sections=none doesn't compress DWARF debug sections.  --compress-debug-sections=zlib-gnu compresses DWARF debug sections and renames them to begin with .zdebug instead of .debug.  --compress-debug-sections=zlib-gabi also compresses DWARF debug sections, but rather than renaming them it sets the SHF_COMPRESSED flag in the sections' headers. The --compress-debug-sections=zlib option is an alias for --compress-debug-sections=zlib-gabi. --compress-debug-sections=zstd compresses DWARF debug sections using zstd. Note that this option overrides any compression in input debug sections, so if a binary is linked with --compress-debug-sections=none for example, then any compressed debug sections in input files will be uncompressed before they are copied into the output binary. The default compression behaviour varies depending upon the target involved and the configure options used to build the toolchain. The default can be determined by examining the output from the linker's --help option."
  command: "ld"
  example: "ld --compress-debug-sections=zstd"
- id: 1108
  intent: "For most targets default symbol-prefix is an underscore and is defined in target's description. By this option it is possible to disable/enable the default underscore symbol-prefix."
  command: "ld"
  example: "ld --no-leading-underscore"
