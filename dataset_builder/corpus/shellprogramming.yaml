- id: 1648
  intent: "Swap the left- and right-eye images. pamsistoaglyph assumes that its input represents   a   wall-eyed   stereogram  and  generates  the anaglyphic image accordingly. If the generated image appears to  recede into the  page  where  it  should  pop  out of the page (and vice versa), this typically implies that the input image represents a cross-eyed stereogram. Use --invert to correct the image depth."
  command: "pamsistoaglyph"
  example: "pamsistoaglyph --invert"
- id: 1649
  intent: "This  option  causes pamslice to format the output as input for a xmgr so you can plot it.  The only difference  this  option makes is  that it adds header information to the beginning of the output."
  command: "pamslice"
  example: "pamslice -xmgr"
- id: 1650
  intent: "stack planes of multiple PAM images into one PAM image"
  command: "pamstack"
  example: "pamstack"
- id: 1651
  intent: "Invert  the  gray  levels in the depth map (input image) so that the 3-D image pops out of the page where it would otherwise sink into  the page and vice versa. Some people are unable to diverge their eyes and can only cross them. The  -crosseyed  option  en- ables  such  people  to  see the 3-D image as intended.  You can also specify the -crosseyed option if  you  prefer  using  depth maps  in  which  darker colors are closer to the eye and lighter colors are farther from the eye. Before Netpbm 10.53 (December 2010), pamstereogram  used  higher (lighter)   numbers   for  things  closer  to  the  eye  without -crosseyed and vice versa."
  command: "pamstereogram"
  example: "pamstereogram -crosseyed"
- id: 1652
  intent: "Make the generated image horizontally tileable.  This  works  by blending a left-to-right rendering (the equivalent of -xbegin=0) with  a  right-to-left  rendering  (the  equivalent   of   -xbe- gin=width-1). This option was new in Netpbm 10.91 (June 2020)."
  command: "pamstereogram"
  example: "pamstereogram -tileable"
- id: 1653
  intent: "This is the horizontal scale factor.  If you don't specify this, but do specify a vertical scale  factor,  the  horizontal  scale factor is 1. This option was new in Netpbm 9.21 (December 2001)."
  command: "pamstretch"
  example: "pamstretch -xscale=X"
- id: 1654
  intent: "This  is  the vertical scale factor.  If you don't specify this, but do specify a horizontal scale  factor,  the  vertical  scale factor is 1. This option was new in Netpbm 9.21 (December 2001)."
  command: "pamstretch"
  example: "pamstretch -yscale=Y"
- id: 1655
  intent: "This option causes each sample to be normalized to a fraction (in the range 0..1) so the result is independent of the im- age's maxval.  E.g. if you request the mean of an image which has maxval 200 and all the samples have value 50,  pamsumm  will  give you 50 as an answer.  But pamsumm -normalize will give you .25. If  instead  you want a result that is independent of maxval but still in integers, you can use pamdepth to convert the  input  to some standard  maxval  and  not use -normalize.  For example, if you want the mean brightness of a PPM image, on a scale of 0 to  99, do pamdepth 99 myimage.ppm | pamsumm -mean This option was new in Netpbm 10.22 (April 2004)"
  command: "pamsumm"
  example: "pamsumm -normalize"
- id: 1656
  intent: "pamthreshold [-simple] [-local=widthxheight] [-dual=widthxheight] [-threshold=threshold] [-contrast=threshold] [inputpamfile] Minimum unique abbreviations of options are acceptable. You may use double hyphens instead of a single hyphen to denote options. You may use white space in place of the equals sign to separate an option name from its value."
  command: "pamthreshold"
  example: "pamthreshold"
- id: 1657
  intent: "This  sets  the threshold to determine if a neighborhood has low contrast or not for dual thresholding.  The value is a  floating point number in the range [0, 1]. If  you  don't specify this option, pamthreshold uses a contrast threshold of 0.05.  Without -dual this option is meaningless."
  command: "pamthreshold"
  example: "pamthreshold -contrast=threshold"
- id: 1658
  intent: "Set the angle increment of the first iteration, in degrees. The default is 1.0."
  command: "pamtilt"
  example: "pamtilt -astep=n"
- id: 1659
  intent: "pamtodjvurle [-transparent color] [netpbmfile [rlefile]] Minimum unique abbreviation of options in acceptable."
  command: "pamtodjvurle"
  example: "pamtodjvurle"
- id: 1660
  intent: "This option indicates which color in the image should be consid- ered transparent. Specify  the  color (color) as described for the argument of the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . Default is \"white\"."
  command: "pamtodjvurle"
  example: "pamtodjvurle -transparent colorname"
- id: 1661
  intent: "pamtogif marks the specified color as transparent in the GIF im- age. If  you  don't  specify -transparent, pamtogif does not mark any color transparent (except as indicated by the  transparency  in- formation in the input file). Specify  the  color (color) as described for the argument of the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> . If  the  color you specify is not present in the image, pamtogif selects instead the color in the image that is  closest  to  the one  you specify.  Closeness is measured as a Cartesian distance between colors in RGB space.  If multiple  colors  are  equidis- tant, pamtogif chooses one of them arbitrarily. However,  if  you prefix your color specification with \"=\", e.g. -transparent==red, only the exact  color  you  specify  will  be transparent.   If that color does not appear in the image, there will be no transparency.  pamtogif issues an information message when this is the case. When  you specify -transparent, pamtogif ignores explicit trans- parency information (the \"alpha channel\") in the input image."
  command: "pamtogif"
  example: "pamtogif -transparent=color"
- id: 1662
  intent: "This specifies the foreground color for transparent  pixels.   A viewer  may  use the foreground color for a transparent pixel if it chooses not to have another color \"show through.\".   The  de- fault is black. This  applies only to pixels that are transparent in the GIF be- cause they are transparent in the Netpbm input.  If a GIF  pixel is  transparent  because  of  the -transparent option, the fore- ground color is the color indicated by that option. Note that in GIF, all transparent pixels  have  the  same  fore- ground  color.  (There is only one entry in the GIF colormap for transparent pixels). Specify the color (color) as described for the argument  of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> ."
  command: "pamtogif"
  example: "pamtogif -alphacolor=color"
- id: 1663
  intent: "Other Options"
  command: "pamtojpeg2k"
  example: "pamtojpeg2k -resetprob"
- id: 1664
  intent: "This option makes  pamtopdbimg  create  the  image  in  16-level grayscale (4 bits per pixel) format.  If you don't specify this, pamtopdbimg uses 4-level (2 bits per pixel) format. This option has no effect when the  input  is  black  and  white (maxval  1).  In that case, pamtopdbimg generates the monochrome (1 bit per pixel) format regardless."
  command: "pamtopdbimg"
  example: "pamtopdbimg -4depth"
- id: 1665
  intent: "This specifies the scale factor of the PFM image. Scale factor is a component of the PFM format. Default is 1.0."
  command: "pamtopfm"
  example: "pamtopfm -scale=float"
- id: 1666
  intent: "pamtopng marks the specified color as transparent in the PNG im- age -- Every pixel of this color  is  fully  transparent.   This causes pamtopng to include a tRNS chunk in the image identifying that color. Specify the color (color) as described for the argument  of  the pnm_parsecolor()                 library                 routine <libnetpbm_image.html#colorname> .  E.g. red or rgb:ff/00/0d."
  command: "pamtopng"
  example: "pamtopng -transparent=color"
- id: 1667
  intent: "This  causes  pamtopng to create a gAMA chunk.  This information helps describe how the color values in the PNG  must  be  inter- preted.   Without  the  gAMA  chunk, whatever interprets the PNG must get this information separately (or just  assume  something standard).  If your input is a true PPM or PGM image, you should specify -gamma=.45.  But sometimes people generate images  which are  ostensibly  PPM  except  the  image  uses a different gamma transfer function than the one specified for PPM.  A common case of  this  is  when  the image is created by simple hardware that doesn't have digital computational ability.  Also,  some  simple programs  that  generate  images from scratch do it with a gamma transfer in which the gamma value is 1.0."
  command: "pamtopng"
  example: "pamtopng -gamma=value"
- id: 1668
  intent: "output smaller. Each color in the color map is 3 bytes,  8  bits  each  of  red, green,  and  blue,  unless  the  input  is  black  and  white or grayscale, in which case each color in  the  palette  is  repre- sented by one byte. Input must contain no more than 256 distinct colors and must not contain transparency information. (The transparency limitation is not a limitation of the  format, but  of pamtotga.  Implementing a color map that contains trans- parency information is harder to implement)."
  command: "pamtotga"
  example: "pamtotga -cmap  Make  output  Targa  file  use a color map (palette) to make the"
- id: 1669
  intent: "TIFF image if the input is PPM, even if  it  contains  only  shades  of gray.   Without  this option, pamtotiff produces a grayscale TIFF image if the input is PPM and contains only shades of gray, and at  most  256 shades.   Otherwise,  it produces a color TIFF output.  For PBM and PGM input, pamtotiff always produces grayscale TIFF output and this  option has no effect. The  -color option can prevent pamtotiff from making two passes through the input file, thus improving speed and memory  usage.   See  Multiple Passes <#multipass> ."
  command: "pamtotiff"
  example: "pamtotiff -color  tells  pamtotiff  to  produce a color, as opposed to grayscale,"
- id: 1670
  intent: "put if it is producing a color TIFF image.  Without this option, pamto- tiff produces a colormapped (paletted) TIFF image unless there are more than 256 colors (and in the latter case, issues a warning). The -truecolor option can prevent  pamtotiff  from  making  two  passes through  the  input  file,  thus improving speed and memory usage.  See Multiple Passes <#multipass> . The -color and -truecolor options did not exist before Netpbm 9.21 (De- cember 2001). If  pamtotiff  produces  a grayscale TIFF image, this option has no ef- fect. The -minisblack and -miniswhite options force the output image to  have a  \"minimum  is black\" or \"minimum is white\" photometric, respectively. If you don't specify either, pamtotiff uses  minimum  is  black  except when using Group 3 or Group 4 compression, in which case pamtotiff fol- lows CCITT fax standards and uses \"minimum is white.\" This usually  re- sults in better compression and is generally preferred for bilevel cod- ing.  These photometrics are for grayscale images, so these options are invalid  if the image is color (but only if it is truly color; they are valid with, for example, a PPM  image  that  contains  only  shades  of gray). Before  Netpbm 9.11 (February 200)1, pamtotiff always produced \"minimum is black,\" because of a bug.  In either case, pamtotiff sets the photo- metric  interpretation tag in the TIFF output according to which photo- metric is actually used. Before Netpbm 10.78 (March 2017), pamtotiff respected  -miniswhite  and"
  command: "pamtotiff"
  example: "pamtotiff -truecolor  tells pamtotiff to produce the 24-bit RGB form of TIFF out-"
- id: 1671
  intent: "Output See The Output File <#output> ."
  command: "pamtotiff"
  example: "pamtotiff -tag was new in Netpbm 10.31 (December 2005)."
- id: 1672
