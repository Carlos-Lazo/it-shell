  intent: "This  option indicates to the commands read-toc and read-cd that the source CD was written in TAO mode. It will be  assumed  that the  pre-gap length between all tracks (except between two audio tracks) is the standard 150  blocks  plus  the  number  of  link blocks  (usually 2). The number of link blocks can be controlled with option --tao-source-adjust. Use this option only if read-toc or read-cd give error  messages in  the transition areas between two tracks. If you use this op- tion with pressed CDs or CDs written in DAO mode  you  will  get wrong results."
  command: "cdrdao"
  example: "cdrdao --tao-source"
- id: 229
  intent: "Only used for command read-toc.  This option suppresses the pre- gap length and index mark extraction which speeds up  the  read- toc  process.  Standard 2 second pre-gaps (but no silence!) will be placed into the toc-file. The resulting CD  will  sound  like the source CD. Only the CD player's display will behave slightly different in the transition area between two tracks. This option might help, too, if read-toc fails with  your  drive otherwise."
  command: "cdrdao"
  example: "cdrdao --fast-toc"
