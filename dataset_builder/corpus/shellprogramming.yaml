- id: 554
  intent: "This option selects the pages to be processed. Parameter ranges consists of a comma-separated list of single page numbers and/or page ranges. A page range is a pair of numbers separated by a hyphen, e.g. 5-12. Thus, a page sequence might look like this: 2-4,6,9-12,15. It doesn't matter if a page is given more than once or if page ranges overlap. dvisvgm always extracts the page numbers in ascending order and converts them only once. In order to stay compatible with previous versions, the default page sequence is 1. dvisvgm therefore converts only the first page and not the whole document if option --page is omitted. Usually, page ranges consist of two numbers denoting the first and last page to be converted. If the conversion should start at page 1, or if it should continue up to the last DVI page, the first or second range number can be omitted, respectively. Example: --page=-10 converts all pages up to page 10, --page=10- converts all pages starting with page 10. Please consider that the page values don't refer to the page numbers printed on the corresponding page. Instead, the physical page count is expected, where the first page always gets number 1. At the end of the range sequence an optional filter specifier can be added. Currently, the two filters :even and :odd are supported which restrict the preceding values to even or odd numbers. For example, --page=1-11,20:even is equivalent to --page=2,4,6,8,10,20."
  command: "dvisvgm"
  example: "dvisvgm -p, --page=ranges"
- id: 555
  intent: "Rotates the page content clockwise by angle degrees around the page center. This option is equivalent to -TRangle."
  command: "dvisvgm"
  example: "dvisvgm -r, --rotate=angle"
