  command: "pamon"
  example: "pamon --raw  Play/record raw audio data. This is the default if this  program"
- id: 1632
  intent: "Control how color intensity changes as a function of the distance from a paint source. The default value for number is -2.0, which means that intensity drops (because of the mi- nus sign) with the square (because of the 2.0) of the distance from  each paint source.  -2.0  generally works well in practice, but other values can be specified for various special  effects.  With  very  small numbers of paint sources, -1.0 may produce subtler gradients, but these get muddier as the number of paint sources  increases.  Positive  numbers (e.g., 1.0 and 2.0)  make the paint sources stand out in the output image by pushing the gradients away from them."
  command: "pampaintspill"
  example: "pampaintspill --power=number"
- id: 1633
