- id: 1609
  intent: "Divides a value in the left input image  by  the  value  in  the right  input  image.   But  like  -multiply, it tends to produce nonobvious results.  Note that pamarith clipping behavior  makes this  of little use when the left argument (dividend) is greater than the right argument (divisor) -- the result in that case  is always  the maxval.  If the divisor is 0, the result is the max- val. -divide was new in Netpbm 10.30 (October 2005)."
  command: "pamarith"
  example: "pamarith -divide"
- id: 1610
  intent: "This changes the meaning of -equal.  It is not  valid  with  any other function.  See the description of -equal."
