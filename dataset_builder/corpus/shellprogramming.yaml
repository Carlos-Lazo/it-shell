- id: 1042
  intent: "If  the  JFIF input is invalid, try to salvage whatever informa- tion is there and produce a valid PNM image as output. Without this option, some  invalid  input  causes  jpegtopnm  to fail,  and  what  output it produces is undefined.  With -repair such invalid input causes jpegtopnm to succeed instead. But note that there are some forms of invalid input that  always cause  jpegtopnm to fail and others that always cause it to sal- vage image information and succeed. One particular case where -repair makes a difference is the com- mon  case  that  the  file is truncated somewhere after the JFIF header.  Without -repair, that always  causes  a  failure;  with -repair it always causes success.  Because the image information is laid out generally top to bottom in the JFIF stream, the  im- age  jpegtopnm  produces  in this case has the proper image con- tents at the top, but the bottom is padded with gray. This option was new in  Netpbm  10.38.0  (March  2007).   Before that, jpegtopnm always fails in the cases in question."
  command: "jpegtopnm"
  example: "jpegtopnm -repair"
