- id: 2686
  intent: "Enables or disables the use of colored syntax highlighting in disassembly output.  The default behaviour is determined via a configure time option.  Note, not all architectures support colored syntax highlighting, and depending upon the terminal used, colored output may not actually be legible. The on argument adds colors using simple terminal colors. The terminal argument does the same, but only if the output device is a terminal. The extended-color argument is similar to the on argument, but it uses 8-bit colors.  These may not work on all terminals. The off argument disables colored disassembly."
  command: "x86_64-linux-gnu-objdump"
  example: "x86_64-linux-gnu-objdump --disassembler-color=extened|extended-color|extened-colour"
