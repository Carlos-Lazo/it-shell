- id: 413
  intent: "Load the engine identified by id and use all the methods it implements (algorithms, key storage, etc.), unless specified otherwise in the command-specific documentation or it is configured to do so, as described in \"Engine Configuration\" in config(5). The engine will be used for key ids specified with -key and similar options when an option like -keyform engine is given. A special case is the \"loader_attic\" engine, which is meant just for internal OpenSSL testing purposes and supports loading keys, parameters, certificates, and CRLs from files.  When this engine is used, files with such credentials are read via this engine.  Using the \"file:\" schema is optional; a plain file (path) name will do. Options specifying keys, like -key and similar, can use the generic OpenSSL engine key loading URI scheme \"org.openssl.engine:\" to retrieve private keys and public keys.  The URI syntax is as follows, in simplified form: org.openssl.engine:{engineid}:{keyid} Where \"{engineid}\" is the identity/name of the engine, and \"{keyid}\" is a key identifier that's acceptable by that engine.  For example, when using an engine that interfaces against a PKCS#11 implementation, the generic key URI would be something like this (this happens to be an example for the PKCS#11 engine that's part of OpenSC): -key org.openssl.engine:pkcs11:label_some-private-key As a third possibility, for engines and providers that have implemented their own OSSL_STORE_LOADER(3), \"org.openssl.engine:\" should not be necessary.  For a PKCS#11 implementation that has implemented such a loader, the PKCS#11 URI as defined in RFC 7512 should be possible to use directly: -key pkcs11:object=some-private-key;pin-value=1234 Provider Options"
  command: "openssl"
  example: "openssl -engine id"
