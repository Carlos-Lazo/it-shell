category: "cryptography"
documents:
- id: 1
  intent: "FileCheck match-filename [-check-prefix=XXX] [-strict-whitespace]"
  command: "FileCheck-14"
  example: "FileCheck-14"
- id: 2
  intent: "FileCheck searches the contents of match-filename  for  patterns to   match.   By  default,  these  patterns  are  prefixed  with \"CHECK:\".  If you'd like to use a different prefix (e.g. because the  same  input file is checking multiple different tool or op- tions), the --check-prefix argument allows you to specify (with- out  the  trailing  \":\") one or more prefixes to match. Multiple prefixes are useful for tests which might change  for  different run options, but most lines remain the same. FileCheck  does  not permit duplicate prefixes, even if one is a check prefix and one is a comment prefix (see --comment-prefixes below)."
  command: "FileCheck-14"
  example: "FileCheck-14 --check-prefix prefix"
- id: 3
  intent: "An  alias  of --check-prefix that allows multiple prefixes to be specified as a comma separated list."
  command: "FileCheck-14"
  example: "FileCheck-14 --check-prefixes prefix1,prefix2,..."
- id: 4
  intent: "This  option controls the behavior when using more than one pre- fix as specified by --check-prefix or --check-prefixes, and some of these prefixes are missing in the test file. If true, this is allowed, if false, FileCheck will report an error,  listing  the missing prefixes. It  is currently, temporarily, true by default, and will be sub- sequently switched to false."
  command: "FileCheck-14"
  example: "FileCheck-14 --allow-unused-prefixes"
- id: 5
  intent: "By default, FileCheck allows matches of anywhere on a line. This option  will  require  all  positive  matches to cover an entire line.  Leading  and  trailing  whitespace  is  ignored,   unless --strict-whitespace  is  also specified. (Note: negative matches from CHECK-NOT are not affected by this option!) Passing this option is equivalent to inserting {{^ *}} or  {{^}} before, and {{ *$}} or {{$}} after every positive check pattern."
  command: "FileCheck-14"
  example: "FileCheck-14 --match-full-lines"
- id: 6
  intent: "Adds implicit negative checks for the specified patterns between positive  checks. The option allows writing stricter tests with- out stuffing them with CHECK-NOTs. For example, \"--implicit-check-not warning:\" can be useful  when testing diagnostic messages from tools that don't have an option similar to clang -verify. With this option FileCheck will verify that  input  does not contain warnings not covered by any CHECK: patterns."
  command: "FileCheck-14"
  example: "FileCheck-14 --implicit-check-not check-pattern"
- id: 7
  intent: "Enables scope for regex variables. Variables with names that start with $ are considered global and remain set throughout the file. All  other  variables  get  undefined  after  each   encountered CHECK-LABEL."
  command: "FileCheck-14"
  example: "FileCheck-14 --enable-var-scope"
- id: 8
  intent: "Sets a filecheck numeric variable NUMVAR of matching format  FMT to  the  result  of  evaluating <NUMERIC EXPRESSION> that can be used in CHECK: lines.  See section FileCheck  Numeric  Variables and Expressions for details on supported numeric expressions."
  command: "FileCheck-14"
  example: "FileCheck-14 -D#<FMT>,<NUMVAR>=<NUMERIC EXPRESSION>"
- id: 9
  intent: "sues, such as discarded overlapping CHECK-DAG: matches, implicit EOF  pattern  matches,  and CHECK-NOT: patterns that do not have matches.  Implies -v.  However, if -dump-input=fail or -dump-in- put=always,  just  add that information as input annotations in- stead."
  command: "FileCheck-14"
  example: "FileCheck-14 -vv    Print  information  helpful in diagnosing internal FileCheck is-"
- id: 10
  intent: "Enable overlapping among  matches  in  a  group  of  consecutive CHECK-DAG:  directives.   This  option is deprecated and is only provided for convenience as old tests are migrated  to  the  new non-overlapping CHECK-DAG: implementation."
  command: "FileCheck-14"
  example: "FileCheck-14 --allow-deprecated-dag-overlap"
