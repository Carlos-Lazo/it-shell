  intent: "Don't  look  at  the key ID as stored in the message but try all secret keys in turn to find the right decryption key.  This  op- tion  forces the behaviour as used by anonymous recipients (cre- ated by using --throw-keyids or  --hidden-recipient)  and  might come  handy  in case where an encrypted message contains a bogus key ID."
  command: "gpg"
  example: "gpg --try-all-secrets"
- id: 210
  intent: "During decryption skip all anonymous  recipients.   This  option helps  in the case that people use the hidden recipients feature to hide their own encrypt-to key from others.  If one  has  many secret  keys this may lead to a major annoyance because all keys are tried in turn to decrypt something which was not really  in- tended  for  it.  The drawback of this option is that it is cur- rently not possible to decrypt a  message  which  includes  real anonymous recipients. Input and Output"
  command: "gpg"
  example: "gpg --no-skip-hidden-recipients"
- id: 211
  intent: "This option sets a limit on the number of  bytes  that  will  be generated when processing a file. Since OpenPGP supports various levels of compression, it is possible that the  plaintext  of  a given  message  may  be  significantly  larger than the original OpenPGP message. While GnuPG works properly with such  messages, there  is often a desire to set a maximum file size that will be generated before processing is forced to stop by the OS  limits. Defaults to 0, which means \"no limit\"."
  command: "gpg"
  example: "gpg --max-output n"
- id: 212
  intent: "Include the keygrip in the key listings.  In --with-colons  mode this is implicitly enable for secret keys."
  command: "gpg"
  example: "gpg --with-keygrip"
