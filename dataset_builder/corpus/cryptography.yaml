  example: "gpg --rfc4880"
- id: 218
  intent: "Reset  all  packet, cipher and digest options to strict RFC-2440 behavior.  Note that by using this option encryption packets are created  in  a legacy mode without MDC protection.  This is dan- gerous and should thus only be used for experiments.   See  also option --ignore-mdc-error."
  command: "gpg"
  example: "gpg --rfc2440"
- id: 219
  intent: "To check that data has been encrypted according to the rules  of the  current  compliance  mode, a gpg user needs to evaluate the status lines.  This is allows  frontends  to  handle  compliance check in a more flexible way.  However, for scripted use the re- quired evaluation of the status-line requires quite some effort; this  option  can  be  used  instead  to  make sure that the gpg process exits with a failure if the  compliance  rules  are  not fulfilled.   Note  that this option has currently an effect only in \"de-vs\" mode. Doing things one usually doesn't want to do"
  command: "gpg"
  example: "gpg --require-compliance"
- id: 220
  intent: "Set the `for your eyes only' flag in the  message.  This  causes GnuPG  to  refuse to save the file unless the --output option is given, and PGP to use a \"secure viewer\" with a claimed  Tempest- resistant  font  to  display  the message. This option overrides --set-filename.  --no-for-your-eyes-only disables this option."
  command: "gpg"
  example: "gpg --no-for-your-eyes-only"
- id: 221
  intent: "Use  name  as  the message digest algorithm. Running the program with the command --version yields  a  list  of  supported  algo- rithms. In general, you do not want to use this option as it al- lows you to violate  the  OpenPGP  standard.  --personal-digest- preferences is the safe way to accomplish the same thing."
  command: "gpg"
  example: "gpg --digest-algo name"
- id: 222
  intent: "Use  name  as  the  message digest algorithm used when signing a key. Running the program with the  command  --version  yields  a list of supported algorithms. Be aware that if you choose an al- gorithm that GnuPG supports but other OpenPGP implementations do not,  then some users will not be able to use the key signatures you make, or quite possibly your entire key."
  command: "gpg"
  example: "gpg --cert-digest-algo name"
- id: 223
  intent: "Do not put the recipient key IDs into encrypted  messages.  This helps  to  hide  the  receivers  of the message and is a limited countermeasure against traffic analysis. ([Using a little social engineering  anyone who is able to decrypt the message can check whether one of the other recipients is the  one  he  suspects.]) On  the  receiving side, it may slow down the decryption process because all available secret keys must  be  tried.   --no-throw- keyids disables this option. This option is essentially the same as using --hidden-recipient for all recipients."
  command: "gpg"
  example: "gpg --no-throw-keyids"
- id: 224
  intent: "Disable the passphrase cache used for symmetrical  en-  and  de- cryption.   This  cache  is  based  on the message specific salt value (cf. --s2k-mode)."
  command: "gpg"
  example: "gpg --no-symkey-cache"
- id: 225
  intent: "This  option  changes  a MDC integrity protection failure into a warning.  It is required to decrypt old messages which  did  not use  an  MDC.   It  may also be useful if a message is partially garbled, but it is necessary to get as much data as possible out of  that garbled message.  Be aware that a missing or failed MDC can be an indication of an attack.  Use with great caution;  see also option --rfc2440."
  command: "gpg"
  example: "gpg --ignore-mdc-error"
- id: 226
  intent: "Signatures  made  with known-weak digest algorithms are normally rejected with an ``invalid digest algorithm'' message.  This op- tion  allows  the verification of signatures made with such weak algorithms.  MD5 is the only digest algorithm considered weak by default.   See  also  --weak-digest to reject other digest algo- rithms."
  command: "gpg"
  example: "gpg --allow-weak-digest-algos"
- id: 227
  intent: "Treat the specified digest algorithm as weak.   Signatures  made over  weak digests algorithms are normally rejected. This option can be supplied multiple times if multiple algorithms should  be considered  weak.  See also --allow-weak-digest-algos to disable rejection of weak digests.  MD5 is always considered  weak,  and does not need to be listed explicitly."
  command: "gpg"
  example: "gpg --weak-digest name"
- id: 228
  intent: "To  avoid  a  minor risk of collision attacks on third-party key signatures made using SHA-1, those key signatures are considered invalid.  This options allows to override this restriction."
  command: "gpg"
  example: "gpg --allow-weak-key-signatures"
- id: 229
  intent: "The  signature verification only allows the use of keys suitable in the current compliance mode.  If the compliance mode has been forced  by  a global option, there might be no way to check cer- tain signature.  This option allows to override this and  prints an  extra  warning  in  such  a case.  This option is ignored in --batch mode so that no accidental unattended  verification  may happen."
  command: "gpg"
  example: "gpg --override-compliance-check"
- id: 230
  intent: "Display the session key used for one  message.  See  --override- session-key for the counterpart of this option. We think that Key Escrow is a Bad Thing; however the user should have the freedom to decide whether to go to prison or to  reveal the  content  of  one  specific message without compromising all messages ever encrypted for one secret key. You can also use this option if you receive an encrypted message which is abusive or offensive, to prove to the administrators of the messaging system that the ciphertext transmitted corresponds to  an  inappropriate  plaintext so they can take action against the offending user."
  command: "gpg"
  example: "gpg --show-session-key"
- id: 231
  intent: "Don't use the public key but the session key  string  respective the  session  key  taken  from the first line read from file de- scriptor fd.  The format of this string is the same as  the  one printed  by --show-session-key. This option is normally not used but comes handy in case someone forces you to reveal the content of an encrypted message; using this option you can do this with- out handing out the secret key.  Note that using --override-ses- sion-key  may  reveal the session key to all local users via the global process table.  Often it is useful to combine this option with --no-keyring."
  command: "gpg"
  example: "gpg --override-session-key-fd fd"
