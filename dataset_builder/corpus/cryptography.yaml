- id: 134
  intent: "Sets the output format for the --verify command (since dpkg 1.17.2). The only currently supported output format is rpm, which consists of a line for every path that failed any check.  These lines have the following format: missing   [c] pathname [(error-message)] ??5?????? [c] pathname The first 9 characters are used to report the checks result, either a literal missing when the file is not present or its metadata cannot be fetched, or one of the following special characters that report the result for each check: '?' Implies the check could not be done (lack of support, file permissions, etc). '.' Implies the check passed. 'A-Za-z0-9' Implies a specific check failed.  The following positions and alphanumeric characters are currently supported: 1 '?' These checks are currently not supported, will always be '?'. 2 'M' The file mode check failed (since dpkg 1.21.0).  Because pathname metadata is currently not tracked, this check can only be partially emulated via a very simple heuristic for pathnames that have a known digest, which implies they should be regular files, where the check will fail if the pathname is not a regular file on the filesystem.  This check will currently never succeed as it does not have enough information available. 3 '5' The digest check failed, which means the file contents have changed. 4-9 '?' These checks are currently not supported, will always be '?'. The line is followed by a space and an attribute character.  The following attribute character is supported: 'c' The pathname is a conffile. Finally followed by another space and the pathname. In case the entry was of the missing type, and the file was not actually present on the filesystem, then the line is followed by a space and the error message enclosed within parenthesis."
  command: "dpkg"
  example: "dpkg --verify-format format-name"
