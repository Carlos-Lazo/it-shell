- id: 214
  intent: "Set  the list of personal digest preferences to string.  Use gpg --version to get a list of available algorithms, and use none to set  no preference at all.  This allows the user to safely over- ride the algorithm chosen by the recipient key  preferences,  as GPG  will only select an algorithm that is usable by all recipi- ents.  The most highly ranked digest algorithm in this  list  is also  used when signing without encryption (e.g. --clear-sign or --sign)."
  command: "gpg"
  example: "gpg --personal-digest-preferences string"
