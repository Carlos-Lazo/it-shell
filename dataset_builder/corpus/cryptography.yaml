- id: 237
  intent: "By default the CRL checks are enabled and the DirMngr is used to check for revoked certificates.  The disable option is most use- ful  with  an off-line network connection to suppress this check and also to avoid that new certificates introduce a web  bug  by including  a  certificate  specific  CRL DP.  The disable option also disables an issuer certificate lookup via the  authorityIn- foAccess  property  of the certificate; the --enable-issuer-key- retrieve can be used to make use of that property anyway."
  command: "gpgsm"
  example: "gpgsm --disable-crl-checks"
- id: 238
  intent: "By default the CRL for trusted  root  certificates  are  checked like for any other certificates.  This allows a CA to revoke its own certificates voluntary without the need of putting all  ever issued  certificates into a CRL.  The disable option may be used to switch this extra check off.  Due to the caching done by  the Dirmngr,  there  will  not  be  any noticeable performance gain. Note, that this also disables possible OCSP checks  for  trusted root  certificates.  A more specific way of disabling this check is by adding the ``relax'' keyword to the root CA  line  of  the 'trustlist.txt'"
  command: "gpgsm"
  example: "gpgsm --disable-trusted-cert-crl-check"
- id: 239
  intent: "Run a CRL check even for certificates which do not have any  CRL distribution  point.   This requires that a suitable LDAP server has been configured in Dirmngr and that the CRL can be found us- ing  the  issuer.   This  option reverts to what GnuPG did up to version 2.2.20.  This option is in general not useful."
  command: "gpgsm"
  example: "gpgsm --enable-issuer-based-crl-check"
- id: 240
  intent: "If a required certificate is missing while validating the  chain of  certificates,  try to load that certificate from an external location.  This usually means that Dirmngr is employed to search for  the  certificate.   Note that this option makes a \"web bug\" like behavior possible.  LDAP server  operators  can  see  which keys  you request, so by sending you a message signed by a brand new key (which you naturally will not have on  your  local  key- box),  the  operator  can tell both your IP address and the time when you verified the signature."
  command: "gpgsm"
  example: "gpgsm --auto-issuer-key-retrieve"
- id: 241
  intent: "When doing a key listing, do a full validation  check  for  each key  and print the result.  This is usually a slow operation be- cause it requires a CRL lookup and other operations. When used along with --import, a validation of  the  certificate to  import  is  done  and only imported if it succeeds the test. Note that this does not affect an already available  certificate in  the  DB.  This option is therefore useful to simply verify a certificate."
  command: "gpgsm"
  example: "gpgsm --with-validation"
- id: 242
  intent: "For standard key listings, also print the MD5 fingerprint of the certificate."
  command: "gpgsm"
  example: "gpgsm --with-md5-fingerprint"
- id: 243
  intent: "Use name as the message digest algorithm.   Usually  this  algo- rithm  is deduced from the respective signing certificate.  This option forces the use of the given algorithm and may lead to se- vere interoperability problems. Doing things one usually do not want to do"
  command: "gpgsm"
  example: "gpgsm --digest-algo name"
- id: 244
  intent: "Sometimes  signatures are broken in that they announce a differ- ent digest algorithm than actually used.  gpgsm uses a  one-pass data  processing  model  and thus needs to rely on the announced digest algorithms to properly hash the data.   As  a  workaround this  option may be used to tell gpgsm to also hash the data us- ing the algorithm name; this slows processing down a little  bit but  allows  verification  of  such broken signatures.  If gpgsm prints an error like ``digest algo 8 has not been enabled''  you may want to try this option, with 'SHA256' for name."
  command: "gpgsm"
  example: "gpgsm --extra-digest-algo name"
- id: 245
  intent: "To check that data has been encrypted according to the rules  of the  current compliance mode, a gpgsm user needs to evaluate the status lines.  This is allows  frontends  to  handle  compliance check in a more flexible way.  However, for scripted use the re- quired evaluation of the status-line requires quite some effort; this  option  can  be  used  instead to make sure that the gpgsm process exits with a failure if the  compliance  rules  are  not fulfilled.   Note  that this option has currently an effect only in \"de-vs\" mode."
  command: "gpgsm"
  example: "gpgsm --require-compliance"
- id: 246
  intent: "Include ephemeral flagged keys in the output  of  key  listings. Note  that they are included anyway if the key specification for a listing is given as fingerprint or keygrip."
  command: "gpgsm"
  example: "gpgsm --with-ephemeral-keys"
