  intent: "Specify the type of the integrity check.  The  check  is  calcu- lated  from  the  uncompressed  data and stored in the .xz file. This option has an effect only when  compressing  into  the  .xz format;  the .lzma format doesn't support integrity checks.  The integrity check (if any) is verified when the .xz file is decom- pressed. Supported check types: none   Don't  calculate an integrity check at all.  This is usu- ally a bad idea.  This can be useful  when  integrity  of the data is verified by other means anyway. crc32  Calculate  CRC32  using  the  polynomial  from IEEE-802.3 (Ethernet). crc64  Calculate CRC64 using the polynomial from ECMA-182.  This is the default, since it is slightly better than CRC32 at detecting damaged files and the speed difference is  neg- ligible. sha256 Calculate  SHA-256.   This  is somewhat slower than CRC32 and CRC64. Integrity of the .xz headers is always verified with CRC32.   It is not possible to change or disable it."
  command: "lzcat"
  example: "lzcat -C check, --check=check"
