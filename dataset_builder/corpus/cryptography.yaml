  intent: "ratio  is a floating point number that specifies the compression ratio.  pamtojpeg2k will adjust quality as necessary  to  ensure that  you  get  this compression ratio.  E.g. 4 means the output will be about one fourth the size in bytes of the input file. The ratio concerns just the raster part of the image,  with  the denominator  being what the raster would take if it were encoded the most naive way possible (e.g. 3 bytes per  pixel  in  8-bit- per-sample  RGB).   It  does,  however, include metadata that is part of the compressed raster.  Because of that, it may  not  be possible  to  give  you  your requested compression ratio at any quality.  If it isn't, pamtojpeg2k fails with a  message  saying so. If you don't specify this option, pamtojpeg2k gives you the best compression it can without losing any quality.  Because  of  the metadata  issue  described above, this may mean, for a small im- age, the image actually expands. Note that though the Jasper library takes a compression  factor, this option specifies a compression ratio.  The compression fac- tor is the multiplicative inverse of (1 divided by) the compres- sion ratio. Before  Netpbm 10.61 (December 2012), the default was a compres- sion ratio of 1, and if pamtojpeg2k could not  make  the  output that  small,  it  just  made  it as small as it could, with zero quality.  You know this is happening when you  see  the  warning message, \"empty layer generated.\""
  command: "pamtojpeg2k"
  example: "pamtojpeg2k -compression=ratio"
