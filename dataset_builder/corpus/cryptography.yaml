- id: 93
  intent: "(HTTP) Tells curl to figure out authentication method by itself, and  use  the most secure one the remote site claims to support. This is done by first doing a request and checking the response- headers,  thus  possibly  inducing  an extra network round-trip. This is  used  instead  of  setting  a  specific  authentication method,  which  you  can  do with --basic, --digest, --ntlm, and --negotiate. Using --anyauth is not recommended if you do uploads from stdin, since  it  may require data to be sent twice and then the client must be able to rewind. If the need should arise when  uploading from stdin, the upload operation will fail. Used together with -u, --user. Providing --anyauth multiple times has no extra effect. Example: curl --anyauth --user me:pwd https://example.com See also --proxy-anyauth, --basic and --digest."
  command: "curl"
  example: "curl --anyauth"
- id: 94
  intent: "(HTTP)  Enables HTTP Digest authentication. This is an authenti- cation scheme that prevents the password from  being  sent  over the  wire in clear text. Use this in combination with the normal -u, --user option to set user name and password. Providing --digest multiple times has no extra effect.   Disable it again with --no-digest. Example: curl -u name:password --digest https://example.com See  also  -u, --user, --proxy-digest and --anyauth. This option is mutually exclusive to --basic and --ntlm and --negotiate."
  command: "curl"
  example: "curl --digest"
- id: 95
  intent: "method was designed by Microsoft and is used by IIS web servers. It  is a proprietary protocol, reverse-engineered by clever peo- ple and implemented in curl based on their efforts. This kind of behavior  should  not be endorsed, you should encourage everyone who uses NTLM to switch to a public and  documented  authentica- tion method instead, such as Digest. If  you  want to enable NTLM for your proxy authentication, then use --proxy-ntlm. If this option is used several times,  only  the  first  one  is used. Providing --ntlm multiple times has no extra effect. Example: curl --ntlm -u user:password https://example.com See  also  --proxy-ntlm.  --ntlm  requires  that  the underlying libcurl was built to support TLS. This option is mutually exclu- sive to --basic and --negotiate and --digest and --anyauth."
  command: "curl"
  example: "curl --ntlm (HTTP)  Enables  NTLM  authentication.  The  NTLM authentication"
- id: 96
  intent: "(TLS)  Tells  curl  to  use  the  specified  public key file (or hashes) to verify the peer. This can be a path to a  file  which contains a single public key in PEM or DER format, or any number of base64 encoded sha256 hashes preceded by 'sha256//' and sepa- rated by ';'. When  negotiating  a  TLS  or SSL connection, the server sends a certificate indicating its identity. A public key  is  extracted from  this certificate and if it does not exactly match the pub- lic key provided to this option, curl will abort the  connection before sending or receiving any data. PEM/DER support: 7.39.0: OpenSSL, GnuTLS and GSKit 7.43.0: NSS and wolfSSL 7.47.0: mbedtls sha256 support: 7.44.0: OpenSSL, GnuTLS, NSS and wolfSSL 7.47.0: mbedtls Other SSL backends not supported. If  --pinnedpubkey is provided several times, the last set value will be used. Examples: curl --pinnedpubkey keyfile https://example.com curl --pinnedpubkey 'sha256//ce118b51897f4452dc' https://example.com See also --hostpubsha256. Added in 7.39.0."
  command: "curl"
  example: "curl --pinnedpubkey <hashes>"
- id: 97
  intent: "Tells  curl to pick a suitable authentication method when commu- nicating with the given HTTP proxy. This might  cause  an  extra request/response round-trip. Providing --proxy-anyauth multiple times has no extra effect. Example: curl --proxy-anyauth --proxy-user user:passwd -x proxy https://example.com See also -x, --proxy, --proxy-basic and --proxy-digest."
  command: "curl"
  example: "curl --proxy-anyauth"
- id: 98
  intent: "Tells curl to use HTTP Digest authentication when  communicating with the given proxy. Use --digest for enabling HTTP Digest with a remote host. Providing --proxy-digest multiple times has no extra effect. Example: curl --proxy-digest --proxy-user user:passwd -x proxy https://example.com See also -x, --proxy, --proxy-anyauth and --proxy-basic."
  command: "curl"
  example: "curl --proxy-digest"
- id: 99
  intent: "(Schannel)  This option tells curl to ignore certificate revoca- tion checks when they failed due to missing/offline distribution points for the revocation check lists. Providing  --ssl-revoke-best-effort  multiple times has no extra effect.  Disable it again with --no-ssl-revoke-best-effort. Example: curl --ssl-revoke-best-effort https://example.com See also --crlfile and -k, --insecure. Added in 7.70.0."
  command: "curl"
  example: "curl --ssl-revoke-best-effort"
