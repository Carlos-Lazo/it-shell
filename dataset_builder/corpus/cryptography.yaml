  intent: "When invoked with this option, Wget will behave as a Web spider, which means that it will not download the pages, just check that they are there.  For example, you can use Wget to check your bookmarks: wget --spider --force-html -i bookmarks.html This feature needs much more work for Wget to get close to the functionality of real web spiders."
  command: "wget"
  example: "wget --spider"
- id: 589
  intent: "Don't check the server certificate against the available certificate authorities.  Also don't require the URL host name to match the common name presented by the certificate. As of Wget 1.10, the default is to verify the server's certificate against the recognized certificate authorities, breaking the SSL handshake and aborting the download if the verification fails. Although this provides more secure downloads, it does break interoperability with some sites that worked with previous Wget versions, particularly those using self-signed, expired, or otherwise invalid certificates.  This option forces an \"insecure\" mode of operation that turns the certificate verification errors into warnings and allows you to proceed. If you encounter \"certificate verification\" errors or ones saying that \"common name doesn't match requested host name\", you can use this option to bypass the verification and proceed with the download.  Only use this option if you are otherwise convinced of the site's authenticity, or if you really don't care about the validity of its certificate.  It is almost always a bad idea not to check the certificates when transmitting confidential or important data.  For self-signed/internal certificates, you should download the certificate and verify against that instead of forcing this insecure mode.  If you are really sure of not desiring any certificate verification, you can specify --check-certificate=quiet to tell wget to not print any warning about invalid certificates, albeit in most cases this is the wrong thing to do."
  command: "wget"
  example: "wget --no-check-certificate"
