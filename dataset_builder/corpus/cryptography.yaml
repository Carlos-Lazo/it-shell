  intent: "Use  name as the default key to sign with. If this option is not used, the default key is the  first  key  found  in  the  secret keyring.   Note  that  -u or --local-user overrides this option. This option may be given multiple times.  In this case, the last key for which a secret key is available is used.  If there is no secret key available for any of the specified values, GnuPG will not  emit an error message but continue as if this option wasn't given."
  command: "gpg"
  example: "gpg --default-key name"
- id: 203
  intent: "Assume that the specified key (which should be given as  finger- print)  is  as  trustworthy as one of your own secret keys. This option is useful if you don't want to keep your secret keys  (or one  of  them) online but still want to be able to check the va- lidity of a given recipient's or signator's key.  If  the  given key is not locally available but an LDAP keyserver is configured the missing key is imported from that server."
  command: "gpg"
  example: "gpg --trusted-key long key ID or fingerprint"
- id: 204
  intent: "This is an offline mechanism to get a missing key for  signature verification  and for later encryption to this key.  If this op- tion is enabled and a signature includes an embedded  key,  that key  is used to verify the signature and on verification success that key is imported. The default is --no-auto-key-import. On the sender  (signing)  site  the  option  --include-key-block needs  to  be  used to put the public part of the signing key as \"Key Block subpacket\" into the signature."
  command: "gpg"
  example: "gpg --no-auto-key-import"
- id: 205
  intent: "These options enable or disable the automatic retrieving of keys from a keyserver when verifying signatures made by keys that are not on the local  keyring.   The  default  is  --no-auto-key-re- trieve. The order of methods tried to lookup the key is: 1. If the option --auto-key-import is set and the signatures in- cludes an embedded key, that key is used to verify the signature and on verification success that key is imported. 2.  If  a  preferred keyserver is specified in the signature and the option honor-keyserver-url is active (which is not  the  de- fault),  that  keyserver is tried.  Note that the creator of the signature uses the option  --sig-keyserver-url  to  specify  the preferred keyserver for data signatures. 3.  If  the  signature  has  the  Signer's  UID  set (e.g. using --sender while creating the signature) a Web Key Directory (WKD) lookup  is  done.   This is the default configuration but can be disabled by removing WKD from the auto-key-locate list or by us- ing the option --disable-signer-uid. 4.  If  the  option  honor-pka-record  is active, the legacy PKA method is used. 5. If any keyserver is configured and the Issuer Fingerprint  is part  of the signature (since GnuPG 2.1.16), the configured key- servers are tried. Note that this option makes a \"web bug\" like behavior  possible. Keyserver  or Web Key Directory operators can see which keys you request, so by sending you a message signed by a brand  new  key (which  you  naturally will not have on your local keyring), the operator can tell both your IP address and  the  time  when  you verified the signature."
  command: "gpg"
  example: "gpg --no-auto-key-retrieve"
- id: 206
  intent: "If  GnuPG  feels that its information about the Web of Trust has to be updated, it automatically runs the --check-trustdb command internally.   This  may  be a time consuming process. --no-auto- check-trustdb disables this option."
  command: "gpg"
  example: "gpg --no-auto-check-trustdb"
