  <text x="930" y="258" font-size="16" font-weight="700">Similitud coseno</text>
  <rect x="940" y="280" width="26" height="260" rx="6" fill="#173f73"/>
  <rect x="940" y="345" width="26" height="65" fill="#5da1c3"/>
  <rect x="940" y="410" width="26" height="65" fill="#91c2d4"/>
  <rect x="940" y="475" width="26" height="65" rx="6" fill="#f2f6f8"/>
  <g font-size="14" class="muted">
    <text x="980" y="291">1.0 · muy alta</text>
    <text x="980" y="421">0.5</text>
    <text x="980" y="545">0.0 · baja</text>
  </g>
  <text x="930" y="600" font-size="14" class="muted">Ejemplo: “listar” y</text>
  <text x="930" y="622" font-size="14" class="muted">“encontrar archivos”</text>
  <text x="930" y="644" font-size="14" class="muted">tienen similitud 0.72.</text>

  <line x1="52" y1="850" x2="1268" y2="850" stroke="#dbe3ed"/>
  <text x="52" y="884" font-size="14" class="muted">Cada celda compara dos consultas; la diagonal es 1.00 porque compara cada consulta consigo misma.</text>
  <text x="52" y="910" font-size="14" class="muted">Valores calculados como producto interno de embeddings normalizados; redondeados a dos decimales.</text>
