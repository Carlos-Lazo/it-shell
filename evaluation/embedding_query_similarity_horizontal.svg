<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 1320 960" role="img" aria-labelledby="title description">
  <title id="title">Similitud entre consultas sobre archivos</title>
  <desc id="description">Mapa de calor horizontal de similitud coseno entre seis consultas reales sobre archivos, codificadas con all-mpnet-base-v2.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #14243a; }
    .muted { fill: #52647a; }
    .axis { font-size: 15px; font-weight: 700; }
    .cell { font-size: 17px; font-weight: 750; stroke: none; }
    .light { fill: #ffffff; stroke: none; }
  </style>
  <rect width="1320" height="960" fill="#ffffff"/>
  <text x="52" y="60" font-size="30" font-weight="750">Consultas sobre archivos: similitud semántica</text>
  <text x="52" y="94" font-size="16" class="muted">Embeddings de all-mpnet-base-v2 · coseno · consultas seleccionadas para visualización</text>
  <text x="586" y="145" text-anchor="middle" class="axis">Comparar con →</text>
  <text x="56" y="507" text-anchor="middle" class="axis" transform="rotate(-90 56 507)">Consulta</text>

  <g text-anchor="middle" class="axis">
    <text x="356" y="190"><tspan x="356">Listar</tspan><tspan x="356" dy="19">archivos</tspan></text>
    <text x="448" y="190"><tspan x="448">Encontrar</tspan><tspan x="448" dy="19">archivos</tspan></text>
    <text x="540" y="190"><tspan x="540">Buscar texto</tspan><tspan x="540" dy="19">en archivo</tspan></text>
    <text x="632" y="190"><tspan x="632">Leer</tspan><tspan x="632" dy="19">archivo</tspan></text>
    <text x="724" y="190"><tspan x="724">Ver primeras</tspan><tspan x="724" dy="19">líneas</tspan></text>
    <text x="816" y="190"><tspan x="816">Seguir</tspan><tspan x="816" dy="19">un log</tspan></text>
  </g>
  <g text-anchor="end" class="axis">
    <text x="292" y="286">Listar archivos</text>
    <text x="292" y="378">Encontrar archivos</text>
    <text x="292" y="470">Buscar texto</text>
    <text x="292" y="562">Leer archivo</text>
    <text x="292" y="654">Ver primeras líneas</text>
    <text x="292" y="746">Seguir un log</text>
  </g>

