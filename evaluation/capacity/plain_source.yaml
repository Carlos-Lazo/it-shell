schema_version: 1
metadata:
  status: draft
  query_generation_provenance: not_recorded
  query_review_status: reviewed
  partition_policy: Hold out related capability families together; keep test queries reserved from prompt and retrieval tuning.
categories:
- category: filesystem
  capacities:
  - capability_id: filesystem.mkdir_create_missing_parents
    source_aliases:
    - filesystem:1871
    expected_function: Crear los directorios solicitados y los directorios padre que todavía no existan.
    required_inputs:
    - ruta del directorio
    acceptance_criteria:
    - Si la ruta solicitada contiene directorios padre inexistentes, estos se crean junto con el directorio final.
    - Al finalizar correctamente, el directorio solicitado existe y los directorios padre que ya existían conservan su contenido.
    - Si la ruta no puede crearse, el fallo se informa y no se presenta la operación como exitosa.
    must_not_assume:
    - una ruta concreta que la persona no haya dado
    clarification_required_when:
    - no se puede determinar qué ruta crear
    partition: development
    queries:
    - text: crear una estructura de carpetas aunque todavía no existan las carpetas superiores
      language: es
      status: reviewed
    - text: make the parent folders when creating a nested directory
      language: en
      status: reviewed
  - capability_id: grep.read_patterns_from_file
    source_aliases:
    - filesystem:1085
    expected_function: Leer patrones, uno por línea, desde un archivo y buscar coincidencias con ellos.
    required_inputs:
    - archivo que contiene los patrones
    - archivo o entrada donde buscar
    acceptance_criteria:
    - Encuentra líneas que coinciden con cualquiera de los patrones.
    - Puede combinar patrones del archivo con patrones indicados explícitamente.
    - Un archivo de patrones vacío no produce coincidencias.
    must_not_assume: []
    clarification_required_when: []
    partition: test
    queries:
    - text: buscar en un archivo las líneas que coincidan con los patrones guardados en otro archivo
      language: es
      status: reviewed
    - text: find matching lines in a log using a list of patterns from a file
      language: en
      status: reviewed
    - text: search with several expressions listed one per line in a pattern file
      language: en
      status: reviewed
    functional_area: text_search
  - capability_id: filesystem.egrep_extended_pattern_matching
    source_aliases:
    - filesystem:735
    expected_function: Buscar coincidencias de patrones extendidos en archivos de texto.
    required_inputs:
    - patrón extendido
    - archivo o entrada donde buscar
    acceptance_criteria:
    - La búsqueda interpreta el patrón con la sintaxis de expresiones regulares extendidas, no como texto literal.
    - Se muestran las líneas de la entrada que coinciden con el patrón y no se incluyen líneas que no coinciden.
    - Si no hay coincidencias, el resultado indica que no se encontraron líneas sin presentar un error de ejecución.
    must_not_assume:
    - que el patrón es simple o literal
    clarification_required_when:
    - no se puede determinar el patrón a buscar
    partition: test
    queries:
    - text: buscar líneas que coincidan con un patrón extendido en un archivo
      language: es
      status: reviewed
    - text: find lines in a file that match an extended regular expression
      language: en
      status: reviewed
    - text: search for complex patterns in text files using egrep
      language: en
      status: reviewed
  - capability_id: filesystem.tree_directory_structure
    source_aliases:
    - filesystem:2947
    expected_function: Mostrar la estructura de directorios y archivos en forma de árbol.
    required_inputs:
    - ruta del directorio
    acceptance_criteria:
    - La salida representa los archivos y subdirectorios bajo la ruta indicada con su relación jerárquica.
    - La profundidad y los filtros de la salida respetan las opciones solicitadas; no se omiten niveles por un límite inventado.
    - La consulta no modifica el contenido del directorio.
    must_not_assume:
    - que el directorio tiene un número limitado de niveles
    clarification_required_when:
    - no se puede determinar la ruta del directorio
    partition: test
    queries:
    - text: ver la estructura de carpetas y archivos en forma de árbol
      language: es
      status: reviewed
    - text: display the directory hierarchy in a tree format
      language: en
      status: reviewed
    - text: list files and directories in a nested structure
      language: en
      status: reviewed
  - capability_id: filesystem.touch_create_or_update
    source_aliases:
    - filesystem:2934
    expected_function: Crear un archivo vacío o actualizar la fecha de modificación de un archivo existente.
    required_inputs:
    - ruta del archivo
    acceptance_criteria:
    - Si el archivo no existe y se solicita crearlo, se crea vacío en la ruta indicada.
    - Si el archivo ya existe y se solicita actualizar su fecha, cambia la marca temporal solicitada y se conserva su contenido.
    - Si la ruta no es válida o no se puede escribir, el fallo se informa sin afirmar que el archivo fue creado o actualizado.
    must_not_assume:
    - que el archivo ya existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo
    partition: development
    queries:
    - text: crear un archivo vacío o actualizar su fecha de modificación
      language: es
      status: reviewed
    - text: create a new file or update the timestamp of an existing file
      language: en
      status: reviewed
    - text: touch a file to create it or change its modification time
      language: en
      status: reviewed
  - capability_id: filesystem.rm_remove_files_or_directories
    source_aliases:
    - filesystem:2575
    expected_function: Eliminar archivos o directorios especificados.
    required_inputs:
    - ruta del archivo o directorio
    acceptance_criteria:
    - Tras una eliminación exitosa, el objetivo especificado deja de existir en la ruta indicada.
    - La operación se limita a los objetivos solicitados y no añade recursividad ni amplía la ruta objetivo sin indicación explícita.
    - Si el objetivo no existe o no puede eliminarse, se informa el fallo y no se afirma que fue eliminado.
    must_not_assume:
    - que el archivo o directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio
    partition: development
    queries:
    - text: eliminar un archivo o carpeta
      language: es
      status: reviewed
    - text: remove a file or directory from the filesystem
      language: en
      status: reviewed
    - text: delete specified files or directories
      language: en
      status: reviewed
  - capability_id: filesystem.ls_list_directory_contents
    source_aliases:
    - filesystem:1673
    expected_function: Listar el contenido de un directorio.
    required_inputs:
    - ruta del directorio
    acceptance_criteria:
    - La salida lista las entradas visibles del directorio indicado según las opciones solicitadas.
    - Los nombres mostrados corresponden a ese directorio y no se presentan como modificados por la consulta.
    - Si la ruta no existe o no es accesible, el fallo se informa en lugar de devolver una lista inventada.
    must_not_assume:
    - que el directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del directorio
    partition: development
    queries:
    - text: ver los archivos y carpetas dentro de un directorio
      language: es
      status: reviewed
    - text: list the contents of a folder
      language: en
      status: reviewed
    - text: display files and directories in a specified path
      language: en
      status: reviewed
  - capability_id: filesystem.ln_create_hard_or_symbolic_link
    source_aliases:
    - filesystem:1584
    expected_function: Crear un enlace duro o simbólico a un archivo o directorio.
    required_inputs:
    - ruta del archivo o directorio de origen
    - ruta del enlace
    acceptance_criteria:
    - El enlace se crea en la ruta de destino indicada y apunta al origen solicitado.
    - Se usa el tipo de enlace solicitado (simbólico o duro); no se sustituye uno por otro silenciosamente.
    - Si origen, destino o tipo de enlace no son válidos o no están disponibles, se informa el fallo y no se afirma que el enlace existe.
    must_not_assume:
    - que el archivo o directorio de origen existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio de origen
    partition: development
    queries:
    - text: crear un enlace simbólico a un archivo
      language: es
      status: reviewed
    - text: create a hard or symbolic link to a file or directory
      language: en
      status: reviewed
    - text: link a file or directory to another location
      language: en
      status: reviewed
  - capability_id: filesystem.cp_copy_files_or_directories
    source_aliases:
    - filesystem:370
    expected_function: Copiar archivos o directorios de una ubicación a otra.
    required_inputs:
    - ruta del archivo o directorio de origen
    - ruta del destino
    acceptance_criteria:
    - El destino contiene una copia del archivo o directorio de origen indicado, preservando el contenido de los elementos copiados.
    - El alcance de la copia corresponde al origen y destino solicitados; no se añaden rutas ni se elige un destino distinto.
    - Si el origen no existe o la copia falla, se informa el fallo y no se presenta la copia como completada.
    must_not_assume:
    - que el archivo o directorio de origen existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio de origen
    partition: development
    queries:
    - text: copiar un archivo o carpeta a otra ubicación
      language: es
      status: reviewed
    - text: copy files or directories from one place to another
      language: en
      status: reviewed
    - text: duplicate a file or directory to a specified destination
      language: en
      status: reviewed
  - capability_id: filesystem.head_display_first_lines_of_file
    source_aliases:
    - filesystem:1225
    expected_function: Mostrar las primeras líneas de un archivo de texto.
    required_inputs:
    - ruta del archivo
    - número de líneas a mostrar
    acceptance_criteria:
    - La salida contiene el comienzo del archivo indicado y respeta la cantidad de líneas solicitada.
    - Si no se especifica una cantidad, se aplica el comportamiento predeterminado de la herramienta y no se inventa una cantidad.
    - El archivo de origen no se modifica.
    must_not_assume:
    - que el archivo existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo
    partition: test
    queries:
    - text: ver las primeras líneas de un archivo
      language: es
      status: reviewed
    - text: display the beginning of a text file
      language: en
      status: reviewed
    - text: show the first few lines of a file
      language: en
      status: reviewed
  - capability_id: filesystem.sort_sort_lines_in_file
    source_aliases:
    - filesystem:2691
    expected_function: Ordenar las líneas de un archivo de texto alfabéticamente o numéricamente.
    required_inputs:
    - ruta del archivo
    - opciones de ordenamiento
    acceptance_criteria:
    - La salida contiene las líneas de entrada en el orden solicitado, alfabético por defecto o numérico cuando se pide.
    - Las líneas se conservan; no se agregan ni eliminan registros como efecto del ordenamiento.
    - El archivo de origen no se modifica salvo que la persona solicite explícitamente una escritura sobre él.
    must_not_assume:
    - que el archivo existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo
    partition: development
    queries:
    - text: ordenar las líneas de un archivo alfabéticamente
      language: es
      status: reviewed
    - text: sort the lines in a text file
      language: en
      status: reviewed
    - text: arrange the contents of a file in a specific order
      language: en
      status: reviewed
  - capability_id: filesystem.tail_display_last_lines_of_file
    source_aliases:
    - filesystem:2830
    expected_function: Mostrar las últimas líneas de un archivo de texto.
    required_inputs:
    - ruta del archivo
    - número de líneas a mostrar
    acceptance_criteria:
    - La salida contiene el final del archivo indicado y respeta la cantidad de líneas solicitada.
    - Si no se especifica una cantidad, se aplica el comportamiento predeterminado de la herramienta y no se inventa una cantidad.
    - El archivo de origen no se modifica.
    must_not_assume:
    - que el archivo existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo
    partition: test
    queries:
    - text: ver las últimas líneas de un archivo
      language: es
      status: reviewed
    - text: display the end of a text file
      language: en
      status: reviewed
    - text: show the last few lines of a file
      language: en
      status: reviewed
  - capability_id: filesystem.find_search_for_files_or_directories
    source_aliases:
    - filesystem:877
    expected_function: Buscar archivos o directorios que coincidan con ciertos criterios.
    required_inputs:
    - ruta de inicio
    - criterios de búsqueda
    acceptance_criteria:
    - La búsqueda empieza en la ruta indicada y devuelve únicamente entradas que cumplen los criterios solicitados.
    - Cada resultado identifica la ruta encontrada y no se incluyen coincidencias fuera del árbol de búsqueda.
    - Si falta la ruta de inicio o un criterio indispensable, se solicita aclaración en vez de inventarlos.
    must_not_assume:
    - que el directorio de inicio existe
    clarification_required_when:
    - no se puede determinar la ruta de inicio
    partition: development
    queries:
    - text: buscar archivos o carpetas que cumplan ciertos criterios
      language: es
      status: reviewed
    - text: find files or directories based on specific conditions
      language: en
      status: reviewed
    - text: search for files or folders matching given parameters
      language: en
      status: reviewed
  - capability_id: filesystem.du_estimate_file_space_usage
    source_aliases:
    - filesystem:666
    expected_function: Estimar el uso de espacio en disco de archivos o directorios.
    required_inputs:
    - ruta del archivo o directorio
    acceptance_criteria:
    - Para una ruta existente, la propuesta usa la ruta indicada y consulta su uso de espacio en disco con du.
    - Al ejecutarse sobre un archivo o directorio de prueba, du termina correctamente y muestra una medida de uso asociada a esa ruta.
    - La medida reportada es no negativa; no se exige un valor exacto porque el uso depende del sistema de archivos.
    - Si la ruta no existe o no es accesible, el resultado no se presenta como una medición exitosa.
    must_not_assume:
    - que el archivo o directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio
    partition: development
    queries:
    - text: ver cuánto espacio en disco ocupa un archivo o carpeta
      language: es
      status: reviewed
    - text: estimate the disk space used by a file or directory
      language: en
      status: reviewed
    - text: check the size of files or directories on disk
      language: en
      status: reviewed
  - capability_id: filesystem.stat_display_file_or_filesystem_status
    source_aliases:
    - filesystem:2763
    expected_function: Mostrar el estado de un archivo o del sistema de archivos.
    required_inputs:
    - ruta del archivo o directorio
    acceptance_criteria:
    - La salida informa atributos o estado del archivo o sistema de archivos correspondiente a la ruta indicada.
    - La consulta no modifica el archivo ni el sistema de archivos.
    - Si la ruta no existe o no se puede consultar, el fallo se informa sin inventar metadatos.
    must_not_assume:
    - que el archivo o directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio
    partition: development
    queries:
    - text: ver información detallada sobre un archivo o carpeta
      language: es
      status: reviewed
    - text: display the status of a file or filesystem
      language: en
      status: reviewed
    - text: show metadata and attributes of a file or directory
      language: en
      status: reviewed
  - capability_id: filesystem.chmod_change_file_permissions
    source_aliases:
    - filesystem:284
    expected_function: Cambiar los permisos de un archivo o directorio.
    required_inputs:
    - ruta del archivo o directorio
    - nuevos permisos
    acceptance_criteria:
    - El modo aplicado coincide con los permisos solicitados y afecta solo a la ruta indicada.
    - No se amplía la operación recursivamente ni se inventa un modo de permisos.
    - Si faltan los permisos deseados o la operación falla, se solicita aclaración o se informa el fallo, respectivamente.
    must_not_assume:
    - que el archivo o directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio
    partition: development
    queries:
    - text: cambiar los permisos de un archivo o carpeta
      language: es
      status: reviewed
    - text: modify the access permissions of a file or directory
      language: en
      status: reviewed
    - text: set new permissions for a file or folder
      language: en
      status: reviewed
  - capability_id: filesystem.chown_change_file_owner
    source_aliases:
    - filesystem:291
    expected_function: Cambiar el propietario y/o grupo de un archivo o directorio.
    required_inputs:
    - ruta del archivo o directorio
    - nuevo propietario
    - nuevo grupo
    acceptance_criteria:
    - El propietario y/o grupo resultante coincide con los valores especificados por la persona.
    - La operación se limita a la ruta indicada y no se vuelve recursiva salvo solicitud explícita.
    - No se inventan propietario ni grupo; los valores omitidos no se cambian sin una instrucción que lo justifique.
    must_not_assume:
    - que el archivo o directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio
    partition: development
    queries:
    - text: cambiar el propietario de un archivo o carpeta
      language: es
      status: reviewed
    - text: change the owner and group of a file or directory
      language: en
      status: reviewed
    - text: assign a new owner or group to a file or folder
      language: en
      status: reviewed
  - capability_id: filesystem.chattr_change_file_attributes
    source_aliases:
    - filesystem:268
    expected_function: Cambiar los atributos extendidos de un archivo o directorio.
    required_inputs:
    - ruta del archivo o directorio
    - nuevos atributos
    acceptance_criteria:
    - Los atributos del archivo o directorio indicado cambian según la operación solicitada.
    - No se modifican atributos no solicitados ni se amplía el alcance a otros archivos.
    - Si el sistema de archivos o los permisos no permiten el cambio, se informa el fallo sin afirmar que se aplicó.
    must_not_assume:
    - que el archivo o directorio existe
    clarification_required_when:
    - no se puede determinar la ruta del archivo o directorio
    partition: development
    queries:
    - text: cambiar los atributos extendidos de un archivo o carpeta
      language: es
      status: reviewed
    - text: modify the extended attributes of a file or directory
      language: en
      status: reviewed
    - text: set new attributes for a file or folder
      language: en
      status: reviewed
  - capability_id: filesystem.logger_log_messages
    source_aliases:
    - filesystem:1634
    expected_function: Registrar mensajes en el sistema de registro (syslog).
    required_inputs:
    - mensaje a registrar
    - nivel de severidad
    acceptance_criteria:
    - El mensaje especificado se envía al sistema de registro con el nivel de severidad solicitado.
    - El resultado distingue entre el envío del mensaje y la disponibilidad o persistencia del servicio de registro.
    - Si la severidad es indispensable y no está indicada, se solicita aclaración en lugar de inventarla.
    must_not_assume:
    - que el sistema de registro está disponible
    clarification_required_when:
    - no se puede determinar el nivel de severidad
    partition: development
    queries:
    - text: registrar un mensaje en el syslog
      language: es
      status: reviewed
    - text: log a message to the system logger
      language: en
      status: reviewed
    - text: send a log entry with a specific severity level
      language: en
      status: reviewed
  - capability_id: filesystem.ntfsls_list_ntfs_directory_contents
    source_aliases:
    - filesystem:2059
    expected_function: Listar el contenido de un directorio en un sistema de archivos NTFS.
    required_inputs:
    - ruta del directorio NTFS
    acceptance_criteria:
    - La salida lista las entradas del directorio NTFS indicado sin modificar el sistema de archivos.
    - Los resultados corresponden a la ruta solicitada y no a otro volumen o directorio.
    - Si la ruta no pertenece a un volumen NTFS accesible o no se puede leer, se informa el fallo.
    must_not_assume:
    - que el directorio NTFS existe
    clarification_required_when:
    - no se puede determinar la ruta del directorio NTFS
    partition: development
    queries:
    - text: ver los archivos y carpetas dentro de un directorio NTFS
      language: es
      status: reviewed
    - text: list the contents of an NTFS folder
      language: en
      status: reviewed
    - text: display files and directories in an NTFS filesystem
      language: en
      status: reviewed
  - capability_id: filesystem.import_capture_screen_image
    source_aliases:
    - filesystem:1256
    expected_function: Capturar una ventana visible del servidor X, toda la pantalla o una región rectangular y guardarla como imagen.
    required_inputs:
    - objetivo de captura (ventana, pantalla completa o región)
    - ruta del archivo de imagen de salida
    acceptance_criteria:
    - "La captura corresponde al objetivo indicado: ventana, pantalla completa o región rectangular."
    - La imagen se guarda en la ruta de salida solicitada y en el formato solicitado, si se especificó.
    - Si no hay una sesión X o el objetivo o destino no es válido, se informa el fallo y no se afirma que se creó la imagen.
    must_not_assume:
    - que hay una sesión X disponible
    clarification_required_when:
    - no se puede determinar qué capturar o dónde guardar la imagen
    partition: test
    queries:
    - text: capturar una ventana o una región de la pantalla y guardarla como imagen
      language: es
      status: reviewed
    - text: capture a visible X window and save it as an image
      language: en
      status: reviewed
    - text: take a screenshot of the full screen or a selected region
      language: en
      status: reviewed
- category: networking
  capacities:
  - capability_id: networking.ping
    source_aliases:
    - networking:1108
    expected_function: Enviar paquetes ICMP a un host para verificar su disponibilidad y medir el tiempo
      de respuesta.
    required_inputs:
    - dirección IP o nombre de host
    acceptance_criteria:
    - La solicitud envía ICMP Echo Request al host indicado y reporta las respuestas recibidas y sus tiempos cuando existan.
    - La falta de respuesta se reporta como resultado de conectividad, no como prueba concluyente de que el host esté apagado.
    - El destino usado coincide con la dirección IP o el nombre proporcionado.
    must_not_assume:
    - que el host siempre estará disponible
    clarification_required_when:
    - no se puede determinar la dirección del host
    partition: development
    queries:
    - text: verificar si un host está activo en la red
      language: es
      status: reviewed
    - text: ping a server to check connectivity
      language: en
      status: reviewed
    - text: send ICMP packets to a host to measure response time
      language: en
      status: reviewed
  - capability_id: networking.traceroute
    source_aliases:
    - networking:1473
    expected_function: Rastrear la ruta que toman los paquetes hasta un host destino, mostrando cada salto
      intermedio.
    required_inputs:
    - dirección IP o nombre de host
    acceptance_criteria:
    - La salida muestra los saltos observados hacia el destino indicado, en el orden en que se recorren.
    - Los saltos sin respuesta se representan como no respondidos, sin inventar direcciones o tiempos.
    - La operación termina o informa sus límites sin afirmar que alcanzó el destino cuando no lo hizo.
    must_not_assume:
    - que todos los saltos responderán
    clarification_required_when:
    - no se puede determinar la ruta completa
    partition: development
    queries:
    - text: ver la ruta que siguen los paquetes hasta un servidor
      language: es
      status: reviewed
    - text: trace the path to a destination host
      language: en
      status: reviewed
    - text: show each hop between the source and destination
      language: en
      status: reviewed
  - capability_id: networking.nslookup
    source_aliases:
    - networking:952
    expected_function: Consultar servidores DNS para obtener información sobre nombres de dominio y direcciones
      IP.
    required_inputs:
    - nombre de dominio o dirección IP
    acceptance_criteria:
    - La consulta DNS se realiza para el nombre o dirección indicados y muestra las respuestas obtenidas.
    - Si la consulta falla o no hay registros, se informa ese resultado sin inventar una dirección o registro.
    - No se presenta la ausencia de respuesta como evidencia de que el dominio no existe.
    must_not_assume:
    - que el servidor DNS siempre responderá
    clarification_required_when:
    - no se puede resolver el nombre de dominio
    partition: test
    queries:
    - text: obtener la dirección IP de un dominio
      language: es
      status: reviewed
