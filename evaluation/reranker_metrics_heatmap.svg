<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Comparación de métricas de retrieval y rerankers</title>
  <desc id="description">Heatmap histórico de Hit@1, Hit@3, Hit@5, Hit@10, MRR y nDCG para el baseline FAISS MPNet y los rerankers MiniLM, DistilRoBERTa y BGE, en orden experimental. Estos modelos no tienen hashes que acrediten el snapshot actual. La latencia total se muestra en barras separadas.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #14243a; }
    .muted { fill: #53657b; }
    .column { font-size: 19px; font-weight: 700; }
    .row { font-size: 20px; font-weight: 700; }
    .cell { font-size: 20px; font-weight: 750; fill: #14243a !important; stroke: none !important; }
    .light { fill: #ffffff !important; stroke: none !important; }
    .latency-label { font-size: 17px; font-weight: 650; }
  </style>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="70" y="78" font-size="38" font-weight="750">Comparación de métricas de retrieval</text>
  <text x="70" y="118" font-size="19" class="muted">Resultados históricos: rerankers sin snapshot actual verificado</text>

  <text x="555" y="203" text-anchor="middle" class="column">Hit@1</text>
  <text x="685" y="203" text-anchor="middle" class="column">Hit@3</text>
  <text x="815" y="203" text-anchor="middle" class="column">Hit@5</text>
  <text x="945" y="203" text-anchor="middle" class="column">Hit@10</text>
  <text x="1075" y="203" text-anchor="middle" class="column">MRR</text>
  <text x="1205" y="203" text-anchor="middle" class="column">nDCG@1</text>
  <text x="1335" y="203" text-anchor="middle" class="column">nDCG@3</text>
  <text x="1465" y="203" text-anchor="middle" class="column">nDCG@5</text>
  <text x="1595" y="203" text-anchor="middle" class="column">nDCG@10</text>
  <text x="1778" y="203" text-anchor="middle" class="column">Latencia</text>

  <g text-anchor="end">
